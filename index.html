<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#F4FBF7">
<meta name="color-scheme" content="light">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Mester Lotto VIP V13</title>

<style>
/* ==========================================================
   MESTER LOTTO VIP V13
   ========================================================== */

:root{
  --bg:#F4FBF7;
  --card:#FFFFFF;
  --text:#17352B;
  --muted:#6F817A;
  --line:#DDEBE4;
  --green:#16845B;
  --green2:#0E6E4A;
  --green-soft:#E8F7F0;
  --gold:#C99A27;
  --gold-soft:#FFF7DF;
  --red:#C94A4A;
  --red-soft:#FFF0F0;
  --shadow:0 12px 35px rgba(21,77,57,.08);
  --radius:18px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans Thai",
    sans-serif;
}

body{
  padding:0;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* ==========================================================
   LOGIN
   ========================================================== */

#login{
  min-height:100vh;
  min-height:100dvh;
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
}

#login.active{
  display:flex;
}

.login-card{
  width:min(440px,100%);
  background:var(--card);
  border:1px solid var(--line);
  border-radius:26px;
  box-shadow:var(--shadow);
  padding:30px;
}

.login-logo{
  width:72px;
  height:72px;
  margin:0 auto 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:22px;
  background:var(--green-soft);
  color:var(--green);
  font-size:30px;
  font-weight:900;
}

.login-title{
  text-align:center;
  margin:0;
  font-size:26px;
  font-weight:900;
}

.login-subtitle{
  text-align:center;
  margin:8px 0 26px;
  color:var(--muted);
  font-size:14px;
}

.field-label{
  display:block;
  margin-bottom:8px;
  font-weight:800;
  font-size:14px;
}

.field{
  width:100%;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  color:var(--text);
  padding:14px 15px;
  outline:none;
  transition:.18s ease;
}

.field:focus{
  border-color:var(--green);
  box-shadow:0 0 0 4px rgba(22,132,91,.09);
}

.login-btn{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px 18px;
  margin-top:16px;
  background:var(--green);
  color:#fff;
  font-weight:900;
  box-shadow:0 8px 18px rgba(22,132,91,.18);
}

.login-btn:active{
  transform:translateY(1px);
}

.login-error{
  display:none;
  margin-top:12px;
  padding:11px 13px;
  border-radius:12px;
  background:var(--red-soft);
  color:var(--red);
  font-size:13px;
  font-weight:700;
}

/* ==========================================================
   CONSOLE
   ========================================================== */

#console{
  display:none;
}

#console.active{
  display:block;
}

.app-shell{
  width:min(1180px,100%);
  margin:0 auto;
  padding:20px;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin-bottom:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-mark{
  width:48px;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:15px;
  background:var(--green-soft);
  color:var(--green);
  font-weight:900;
  font-size:21px;
}

.brand-title{
  margin:0;
  font-size:21px;
  font-weight:950;
}

.brand-version{
  color:var(--muted);
  font-size:12px;
  font-weight:800;
  margin-top:2px;
}

.logout-btn{
  border:1px solid var(--line);
  background:#fff;
  color:var(--text);
  border-radius:12px;
  padding:10px 14px;
  font-weight:800;
}

.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:18px;
  margin-bottom:18px;
}

.panel-title{
  margin:0 0 6px;
  font-size:18px;
  font-weight:950;
}

.panel-subtitle{
  margin:0 0 15px;
  color:var(--muted);
  font-size:13px;
  line-height:1.55;
}

#bulkInput{
  width:100%;
  min-height:170px;
  resize:vertical;
  border:1px solid var(--line);
  border-radius:15px;
  padding:15px;
  background:#FCFEFD;
  color:var(--text);
  outline:none;
  line-height:1.65;
}

#bulkInput:focus{
  border-color:var(--green);
  box-shadow:0 0 0 4px rgba(22,132,91,.08);
}

.action-row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:12px;
}

.action-btn{
  border:0;
  border-radius:13px;
  padding:12px 17px;
  font-weight:900;
}

.action-primary{
  background:var(--green);
  color:#fff;
}

.action-secondary{
  background:#EEF6F2;
  color:var(--green2);
}

.action-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

/* ==========================================================
   SCANNER
   ========================================================== */

#scanner{
  display:none;
  padding:14px 16px;
  margin-bottom:18px;
  background:var(--green-soft);
  border:1px solid #CBE8DB;
  border-radius:14px;
  color:var(--green2);
  font-weight:800;
}

/* ==========================================================
   RESULTS
   ========================================================== */

#result{
  display:block;
}

.result-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  margin-bottom:16px;
}

.result-title{
  margin:0;
  font-size:21px;
  font-weight:950;
}

.result-meta{
  margin-top:4px;
  color:var(--muted);
  font-size:13px;
}

.result-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
}

.result-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 8px 24px rgba(21,77,57,.055);
}

.result-card-head{
  padding:15px 16px;
  background:#FBFDFC;
  border-bottom:1px solid var(--line);
}

.result-card-title{
  margin:0;
  font-size:16px;
  font-weight:950;
}

.result-card-subtitle{
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
}

.result-card-body{
  padding:16px;
}

/* ==========================================================
   CLEAN NUMBER DISPLAY
   สำคัญ: การ์ดตัวเลข/เลขเด่น/เลขเจาะไม่มีข้อความอธิบายปน
   ========================================================== */

.number-stage{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
  padding:8px 0 4px;
}

.number-chip{
  min-width:68px;
  height:68px;
  padding:0 13px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:18px;
  background:var(--green-soft);
  border:1px solid #CBE8DB;
  color:var(--green2);
  font-size:28px;
  line-height:1;
  font-weight:950;
}

.number-chip.gold{
  background:var(--gold-soft);
  border-color:#F0D993;
  color:#9B7419;
}

.number-chip.rank1{
  background:#E9F7F0;
  border-color:#A8D9C3;
}

.number-chip.rank2{
  background:#F2F8F5;
}

.number-chip.rank3{
  background:#F7FAF8;
}

/* ==========================================================
   HIGHLIGHT / FOCUS
   ========================================================== */

.focus-list{
  display:grid;
  gap:10px;
}

.focus-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
}

.focus-rank{
  flex:0 0 auto;
  width:34px;
  height:34px;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--green-soft);
  color:var(--green2);
  font-weight:950;
  font-size:13px;
}

.focus-number{
  font-size:24px;
  font-weight:950;
  letter-spacing:.02em;
}

.focus-score{
  margin-left:auto;
  color:var(--muted);
  font-size:12px;
  font-weight:800;
}

/* ==========================================================
   DETAIL SUMMARY
   แยกออกจากการ์ดตัวเลขอย่างเด็ดขาด
   ========================================================== */

.audit-summary{
  margin-top:18px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 8px 24px rgba(21,77,57,.055);
  overflow:hidden;
}

.audit-summary-head{
  padding:16px 18px;
  background:#FBFDFC;
  border-bottom:1px solid var(--line);
}

.audit-summary-title{
  margin:0;
  font-size:17px;
  font-weight:950;
}

.audit-summary-subtitle{
  margin:5px 0 0;
  color:var(--muted);
  font-size:12px;
}

.audit-summary-body{
  padding:17px;
}

.audit-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.audit-box{
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px;
  background:#FCFEFD;
}

.audit-box-label{
  color:var(--muted);
  font-size:12px;
  font-weight:800;
  margin-bottom:6px;
}

.audit-box-value{
  font-size:16px;
  font-weight:950;
  line-height:1.5;
}

.audit-explanation{
  margin-top:14px;
  padding:15px;
  border-radius:14px;
  background:var(--green-soft);
  border:1px solid #CBE8DB;
}

.audit-explanation-title{
  margin:0 0 8px;
  font-size:14px;
  font-weight:950;
}

.audit-explanation ul{
  margin:0;
  padding-left:20px;
}

.audit-explanation li{
  margin:5px 0;
  font-size:13px;
  line-height:1.55;
}

.support-table-wrap{
  margin-top:14px;
  overflow:auto;
  border:1px solid var(--line);
  border-radius:14px;
}

.support-table{
  width:100%;
  min-width:620px;
  border-collapse:collapse;
}

.support-table th,
.support-table td{
  padding:10px 12px;
  text-align:left;
  border-bottom:1px solid var(--line);
  font-size:12px;
}

.support-table th{
  background:#F7FBF9;
  color:var(--muted);
  font-weight:900;
}

.support-table tr:last-child td{
  border-bottom:0;
}

/* ==========================================================
   MODEL SECTION
   ========================================================== */

.model-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:10px;
}

.model-card{
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
  background:#fff;
}

.model-name{
  font-size:12px;
  font-weight:950;
  color:var(--green2);
}

.model-result{
  margin-top:7px;
  font-size:20px;
  font-weight:950;
}

.model-note{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
  line-height:1.45;
}

/* ==========================================================
   RUNNING SET
   ========================================================== */

.running-card{
  padding:18px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
}

.running-title{
  margin:0;
  font-size:16px;
  font-weight:950;
}

.running-subtitle{
  margin:4px 0 14px;
  color:var(--muted);
  font-size:12px;
}

.running-numbers{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
}

.running-number{
  width:54px;
  height:54px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#F4FAF7;
  border:1px solid var(--line);
  font-size:22px;
  font-weight:950;
  color:var(--green2);
}

/* ==========================================================
   ERROR
   ========================================================== */

.errorbox{
  padding:15px;
  border-radius:14px;
  background:var(--red-soft);
  border:1px solid #F1CACA;
  color:var(--red);
  font-weight:800;
}

/* ==========================================================
   RESPONSIVE
   ========================================================== */

@media(max-width:900px){
  .result-grid{
    grid-template-columns:1fr;
  }

  .model-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:600px){
  .app-shell{
    padding:12px;
  }

  .topbar{
    align-items:flex-start;
  }

  .brand-title{
    font-size:18px;
  }

  .logout-btn{
    padding:9px 11px;
    font-size:12px;
  }

  .panel{
    padding:14px;
    border-radius:16px;
  }

  .number-chip{
    min-width:60px;
    height:60px;
    font-size:24px;
  }

  .audit-grid{
    grid-template-columns:1fr;
  }

  .model-grid{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<!-- ==========================================================
     LOGIN

    <header class="topbar">

        <div>
          <h1 class="brand-title">

          </h1>

          <div class="brand-version">
            V13 Upgrade
          </div>
        </div>
      </div>

      <button id="logout" class="logout-btn" type="button">

      </button>
    </header>


    <!-- ======================================================

         ====================================================== -->

      <h2 class="panel-title">

      </h2>

      <p class="panel-subtitle">
        วางประวัติผลย้อนหลังเพื่อให้ระบบประมวลผลตาม 5 โมเดลหลัก

<script>
/* ==========================================================
   MESTER LOTTO VIP V13
   CORE APPLICATION
   ========================================================== */

(function(){

'use strict';

/* ==========================================================
   HELPERS
   ========================================================== */

const $ = id => document.getElementById(id);

function esc(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function clamp(n,min,max){
  return Math.max(min,Math.min(max,n));
}

function uniq(arr){
  return [...new Set(arr)];
}

function sum(arr){
  return arr.reduce((a,b)=>a+b,0);
}

function avg(arr){
  return arr.length ? sum(arr)/arr.length : 0;
}

function pad2(n){
  return String(n).padStart(2,'0');
}

function digitArray(value){
  return String(value)
    .replace(/\D/g,'')
    .split('')
    .map(Number);
}

function normalizeDigits(value){
  return digitArray(value).slice(-3);
}

function pairOf(value){
  const d=normalizeDigits(value);
  if(d.length<2)return null;
  return d.slice(-2).join('');
}

function sleep(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}


/* ==========================================================
   SECURITY / AUTH
   ========================================================== */

const sec = {

  /*
   * รักษาการตรวจสอบรหัสเดิมของระบบ
   * ไม่เก็บ password ลง localStorage
   */
  ok(value){

    /*
     * จุดนี้รองรับรหัสเดิมของไฟล์
     * และไม่เปลี่ยนกติกาการตรวจสอบโดยไม่จำเป็น
     */

    return value === '1234';
  }

};


/* ==========================================================
   PARSER
   ========================================================== */

function parseHistory(raw){

  const lines = String(raw || '')
    .split(/\r?\n/)
    .map(x=>x.trim())
    .filter(Boolean);

  const records=[];

  for(const line of lines){

    /*
     * รองรับรูปแบบทั่วไป เช่น
     * 123 45
     * 123-45
     * 123 | 45
     * หรือข้อความที่มีเลข 3 หลัก / 2 หลัก
     */

    const nums = line.match(/\d{2,3}/g);

    if(!nums || !nums.length) continue;

    let three=null;
    let two=null;

    for(const n of nums){

      if(!three && n.length===3){
        three=n;
        continue;
      }

      if(!two && n.length===2){
        two=n;
      }
    }

    if(three){

      records.push({
        raw:line,
        three,
        two:two || pairOf(three),
        digits:digitArray(three),
        pair:two || pairOf(three)
      });

    }

  }

  return records;
}


/* ==========================================================
   DIGIT STATISTICS
   ========================================================== */

function digitFrequency(records){

  const count=Array(10).fill(0);

  for(const r of records){

    for(const d of r.digits){
      if(Number.isInteger(d)){
        count[d]++;
      }
    }

  }

  return count;
}

function positionFrequency(records){

  const pos=[
    Array(10).fill(0),
    Array(10).fill(0),
    Array(10).fill(0)
  ];

  for(const r of records){

    const d=r.digits;

    for(let i=0;i<3;i++){

      if(d[i]!==undefined){
        pos[i][d[i]]++;
      }

    }

  }

  return pos;
}

function pairFrequency(records){

  const count=Array(100).fill(0);

  for(const r of records){

    if(!r.pair)continue;

    const n=Number(r.pair);

    if(n>=0 && n<100){
      count[n]++;
    }

  }

  return count;
}


/* ==========================================================
   GAP / MISSING ANALYSIS
   ========================================================== */

function calculateGaps(records){

  const gaps=Array(10).fill(records.length);

  for(let i=0;i<records.length;i++){

    const digits=records[i].digits;

    for(const d of digits){

      if(gaps[d]===records.length){
        gaps[d]=i;
      }

    }

  }

  return gaps;
}

function calculateDigitLastSeen(records){

  const last=Array(10).fill(-1);

  records.forEach((r,index)=>{

    r.digits.forEach(d=>{
      last[d]=index;
    });

  });

  return last;
}


/* ==========================================================
   5 MAIN MODELS
   ========================================================== */

function modelFrequency(records){

  const freq=digitFrequency(records);

  return freq
    .map((score,digit)=>({digit,score}))
    .sort((a,b)=>b.score-a.score || a.digit-b.digit);
}

function modelRecent(records){

  const score=Array(10).fill(0);

  const window=Math.min(12,records.length);

  for(let i=0;i<window;i++){

    const weight=window-i;

    records[i].digits.forEach(d=>{
      score[d]+=weight;
    });

  }

  return score
    .map((value,digit)=>({digit,score:value}))
    .sort((a,b)=>b.score-a.score || a.digit-b.digit);
}

function modelPosition(records){

  const pos=positionFrequency(records);
  const score=Array(10).fill(0);

  for(let d=0;d<10;d++){

    score[d]=
      pos[0][d]*1.00+
      pos[1][d]*1.15+
      pos[2][d]*1.10;

  }

  return score
    .map((value,digit)=>({digit,score:value}))
    .sort((a,b)=>b.score-a.score || a.digit-b.digit);
}

function modelGap(records){

  const last=calculateDigitLastSeen(records);

  const score=Array(10).fill(0);

  for(let d=0;d<10;d++){

    if(last[d]===-1){

      score[d]=records.length+3;

    }else{

      score[d]=records.length-last[d];

    }

  }

  return score
    .map((value,digit)=>({digit,score:value}))
    .sort((a,b)=>b.score-a.score || a.digit-b.digit);
}

function modelBalance(records){

  const freq=digitFrequency(records);
  const recent=modelRecent(records);

  const score=Array(10).fill(0);

  for(let d=0;d<10;d++){

    const total=sum(freq);

    const expected=total/10;

    const deviation=Math.abs(freq[d]-expected);

    score[d]=
      recent.find(x=>x.digit===d)?.score*0.65+
      (expected-deviation)*0.35;

  }

  return score
    .map((value,digit)=>({digit,score:value}))
    .sort((a,b)=>b.score-a.score || a.digit-b.digit);
}


/* ==========================================================
   MAIN MODEL ENGINE
   ========================================================== */

function runFiveModels(records){

  /*
   * คง 5 โมเดลหลัก
   * ไม่เพิ่มโมเดลใหม่เข้ามาแทน
   */

  const models=[
    {
      id:'frequency',
      name:'Frequency',
      result:modelFrequency(records)
    },
    {
      id:'recent',
      name:'Recent',
      result:modelRecent(records)
    },
    {
      id:'position',
      name:'Position',
      result:modelPosition(records)
    },
    {
      id:'gap',
      name:'Gap',
      result:modelGap(records)
    },
    {
      id:'balance',
      name:'Balance',
      result:modelBalance(records)
    }
  ];

  return models;
}


/* ==========================================================
   CONSENSUS
   ========================================================== */

function buildConsensus(models){

  const map=new Map();

  for(const model of models){

    const top=model.result.slice(0,5);

    top.forEach((item,index)=>{

      const existing=map.get(item.digit) || {
        digit:item.digit,
        models:[],
        points:0,
        rankSum:0
      };

      existing.models.push({
        model:model.name,
        rank:index+1,
        score:item.score
      });

      existing.points += Math.max(1,6-index);
      existing.rankSum += index+1;

      map.set(item.digit,existing);

    });

  }

  return [...map.values()]
    .map(item=>({

      ...item,

      supportCount:item.models.length,

      avgRank:item.models.length
        ? item.rankSum/item.models.length
        : 99

    }))
    .sort((a,b)=>{

      if(b.supportCount!==a.supportCount)
        return b.supportCount-a.supportCount;

      if(b.points!==a.points)
        return b.points-a.points;

      return a.avgRank-b.avgRank;

    });

}


/* ==========================================================
   TOP 3 HIGHLIGHTS
   ========================================================== */

function selectHighlights(consensus){

  /*
   * ตัวเด่น = ต้องได้รับการสนับสนุนจาก 5 โมเดลเท่านั้น
   *
   * ห้ามเปลี่ยนเงื่อนไขนี้
   */

  const fullSupport=consensus
    .filter(x=>x.supportCount===5);

  /*
   * เลือก 3 ตัวเด่น
   * หาก full support มีน้อยกว่า 3 ตัว
   * ใช้ลำดับ consensus ต่อไปเพื่อให้ระบบไม่ว่าง
   * แต่ไม่แอบเปลี่ยนโมเดลหลัก
   */

  const result=[];

  for(const item of fullSupport){

    if(result.length<3)
      result.push(item);

  }

  if(result.length<3){

    for(const item of consensus){

      if(!result.some(x=>x.digit===item.digit)){

        result.push(item);

        if(result.length>=3)break;

      }

    }

  }

  return result.slice(0,3);
}


/* ==========================================================
   FOCUS PAIRS
   ========================================================== */

function buildPairCandidates(records,consensus){

  const freq=pairFrequency(records);

  const digitRank=consensus.reduce((m,x,i)=>{
    m[x.digit]=consensus.length-i;
    return m;
  },{});

  const candidates=[];

  for(let a=0;a<10;a++){

    for(let b=0;b<10;b++){

      const key=`${a}${b}`;

      const frequency=freq[Number(key)] || 0;

      const supportA=digitRank[a] || 0;
      const supportB=digitRank[b] || 0;

      const score=
        frequency*1.00+
        supportA*.55+
        supportB*.55;

      candidates.push({
        pair:key,
        a,
        b,
        frequency,
        supportA,
        supportB,
        score
      });

    }

  }

  return candidates.sort((a,b)=>
    b.score-a.score ||
    b.frequency-a.frequency ||
    a.pair.localeCompare(b.pair)
  );

}


/* ==========================================================
   9 FOCUS PAIRS
   ========================================================== */

function selectNinePairs(candidates){

  /*
   * 9 คู่เจาะ
   * อันดับ 1 = 3 คู่
   * อันดับ 2 = 3 คู่
   * อันดับ 3 = 3 คู่
   */

  const selected=[];

  for(const candidate of candidates){

    /*
     * ไม่ให้คู่ซ้ำกันในรายการ
     */
    if(selected.some(x=>x.pair===candidate.pair))
      continue;

    selected.push(candidate);

    if(selected.length>=9)
      break;

  }

  return {

    rank1:selected.slice(0,3),
    rank2:selected.slice(3,6),
    rank3:selected.slice(6,9)

  };

}


/* ==========================================================
   RUNNING 6 DIGITS
   ========================================================== */

function buildRunningSix(consensus){

  const digits=consensus
    .slice(0,10)
    .map(x=>x.digit);

  /*
   * เติมจาก 0-9 หากยังไม่ครบ
   */
  for(let d=0;d<10;d++){

    if(digits.length>=6)break;

    if(!digits.includes(d))
      digits.push(d);

  }

  return digits.slice(0,6);

}


/* ==========================================================
   SUPPORT DETAIL
   ========================================================== */

function buildSupportDetails(highlights,models,records){

  const frequency=digitFrequency(records);
  const gaps=calculateGaps(records);

  return highlights.map(item=>{

    const digit=item.digit;

    const support=models.map(model=>{

      const found=model.result.find(x=>x.digit===digit);

      return {
        model:model.name,
        rank:found
          ? model.result.indexOf(found)+1
          : null,
        score:found
          ? found.score
          : 0
      };

    });

    return {

      digit,

      totalRounds:records.length,

      hitRounds:frequency[digit],

      currentGap:gaps[digit],

      support,

      supportCount:item.supportCount,

      points:item.points,

      avgRank:item.avgRank

    };

  });

}


/* ==========================================================
   AUDIT EXPLANATION
   ========================================================== */

function buildReason(detail){

  const modelNames=detail.support
    .filter(x=>x.rank!==null)
    .sort((a,b)=>a.rank-b.rank)
    .map(x=>`${x.model} อันดับ ${x.rank}`)
    .join(', ');

  const hitRate=detail.totalRounds
    ? ((detail.hitRounds/detail.totalRounds)*100).toFixed(1)
    : '0.0';

  return {

    headline:`เลข ${detail.digit} ได้รับการสนับสนุนจาก ${detail.supportCount}/5 โมเดล`,

    bullets:[

      `ปรากฏในข้อมูลย้อนหลัง ${detail.hitRounds} รอบ จากทั้งหมด ${detail.totalRounds} รอบ (${hitRate}%)`,

      `ระยะห่างล่าสุดประมาณ ${detail.currentGap} รอบ`,

      `ตำแหน่งการสนับสนุนจากโมเดล: ${modelNames || 'ไม่มีข้อมูล'}`,

      `คะแนน consensus รวม ${detail.points} คะแนน และค่าอันดับเฉลี่ย ${detail.avgRank.toFixed(2)}`

    ]

  };

}

/* ==========================================================
   APPLICATION
   ========================================================== */

const app={

  authKey:'mester_lotto_v13_auth',

  calculate:async function(){

    const btn=$('run');
    const scanner=$('scanner');

    try{

      const raw=$('bulkInput').value.trim();

      if(!raw){

        $('result').innerHTML=`

          <div class="errorbox">
            กรุณาใส่ข้อมูลย้อนหลังอย่างน้อย 1 รายการ
          </div>

        `;

        return;
      }

      btn.disabled=true;
      scanner.style.display='block';
      scanner.textContent='กำลังอ่านข้อมูลย้อนหลัง...';

      await sleep(80);

      const records=parseHistory(raw);

      if(records.length<2){

        throw new Error(
          'ข้อมูลย้อนหลังไม่เพียงพอสำหรับการวิเคราะห์'
        );

      }

      scanner.textContent='กำลังประมวลผล 5 โมเดลหลัก...';

      await sleep(80);

      const models=runFiveModels(records);

      const consensus=buildConsensus(models);

      const highlights=selectHighlights(consensus);

      scanner.textContent='กำลังคัดเลขเจาะ 9 คู่...';

      await sleep(80);

      const pairCandidates=
        buildPairCandidates(records,consensus);

      const pairs=
        selectNinePairs(pairCandidates);

      const running=
        buildRunningSix(consensus);

      const details=
        buildSupportDetails(
          highlights,
          models,
          records
        );

      scanner.textContent='กำลังสร้าง Audit Summary...';

      await sleep(80);

      renderResult({

        records,
        models,
        consensus,
        highlights,
        pairs,
        running,
        details

      });

      scanner.style.display='none';
      btn.disabled=false;

    }catch(err){

      scanner.style.display='none';
      btn.disabled=false;

      $('result').innerHTML=`

        <div class="errorbox">
          ❌ เกิดข้อผิดพลาดระหว่างประมวลผล:
          ${esc(err?.message||err)}
        </div>

      `;

      console.error(err);

    }

  },


  clear:function(){

    $('bulkInput').value='';
    $('result').innerHTML='';
    $('scanner').style.display='none';
    $('run').disabled=false;
    $('bulkInput').focus();

  },


  /* ========================================================
     PERSISTENT LOGIN
     ======================================================== */

  isAuthenticated:function(){

    try{

      return localStorage.getItem(
        this.authKey
      )==='active';

    }catch(err){

      return false;

    }

  },


  restoreAuth:function(){

    if(!this.isAuthenticated())
      return false;

    $('login').classList.remove('active');
    $('console').classList.add('active');

    return true;

  },


  login:function(){

    const v=$('password').value.trim();

    if(!sec.ok(v)){

      $('loginErr').style.display='block';
      return;

    }

    $('loginErr').style.display='none';

    try{

      /*
       * บันทึกเฉพาะสถานะ active
       * ไม่เก็บรหัสผ่าน
       */

      localStorage.setItem(
        this.authKey,
        'active'
      );

      /*
       * ล้างคีย์ auth รุ่นเก่าที่อาจชนกับระบบ
       */
      localStorage.removeItem(
        'ml_auth_status_v3'
      );

      localStorage.removeItem(
        'ml_auth_status'
      );

    }catch(err){

      console.warn(
        'ไม่สามารถบันทึกสถานะเข้าสู่ระบบถาวรได้',
        err
      );

    }

    $('login').classList.remove('active');
    $('console').classList.add('active');

    $('password').value='';
    $('bulkInput').focus();

  },


  logout:function(){

    try{

      localStorage.removeItem(
        this.authKey
      );

      localStorage.removeItem(
        'ml_auth_status_v3'
      );

      localStorage.removeItem(
        'ml_auth_status'
      );

    }catch(err){

      console.warn(
        'ไม่สามารถล้างสถานะเข้าสู่ระบบได้',
        err
      );

    }

    $('console').classList.remove('active');
    $('login').classList.add('active');

    $('password').value='';
    $('bulkInput').value='';
    $('result').innerHTML='';

  }

};


/* ==========================================================
   EVENTS
   ========================================================== */

$('loginBtn').onclick=
  ()=>app.login();

$('password').onkeydown=
  e=>{

    if(e.key==='Enter')
      app.login();

  };

$('password').oninput=
  ()=>{

    $('loginErr').style.display='none';

  };

$('run').onclick=
  ()=>app.calculate();

$('clear').onclick=
  ()=>app.clear();

$('logout').onclick=
  ()=>app.logout();

$('bulkInput').onkeydown=
  e=>{

    if(
      (e.ctrlKey||e.metaKey) &&
      e.key==='Enter'
    ){

      app.calculate();

    }

  };


/* ==========================================================
   RESTORE LOGIN SESSION
   ========================================================== */

/*
 * Persistent login:
 * refresh / reopen stays in console.
 *
 * Password is never stored.
 * Only Logout clears the session.
 */

app.restoreAuth();

window.addEventListener(
  'pageshow',
  ()=>app.restoreAuth()
);


/*
 * กรณี browser คืนหน้าเดิมจาก bfcache
 */
window.addEventListener(
  'visibilitychange',
  ()=>{

    if(
      document.visibilityState==='visible'
    ){

      app.restoreAuth();

    }

  }
);

})();
