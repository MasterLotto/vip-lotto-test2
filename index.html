<script>
(()=>{
const c=document.getElementById('snow');
const x=c.getContext('2d');
let w=c.width=innerWidth;
let h=c.height=innerHeight;
addEventListener('resize',()=>{
w=c.width=innerWidth;
h=c.height=innerHeight;
});
const particles=Array.from({length:42},()=>({
x:Math.random()*w,
y:Math.random()*h,
r:.7+Math.random()*1.8,
s:.15+Math.random()*.45,
a:.18+Math.random()*.35,
p:Math.random()*6.28,
tone:Math.random()>.72?'rose':'gold'
}));
(function draw(){
x.clearRect(0,0,w,h);
particles.forEach(q=>{
q.p+=.01;
q.y+=q.s;
q.x+=Math.sin(q.p)*.25;
if(q.y>h+5){q.y=-5;q.x=Math.random()*w}
x.beginPath();
x.arc(q.x,q.y,q.r,0,Math.PI*2);
x.fillStyle=q.tone==='rose'?`rgba(185,130,121,${q.a*.55})`:`rgba(195,154,67,${q.a})`;
x.fill();
});
requestAnimationFrame(draw);
})();
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
const sec={
tokens:[
'4d617374657241646d696e32303236',
'54396b4c326d5037',
'5a71345738785431'
],
dec(h){
let s='';
for(let i=0;i<h.length;i+=2)s+=String.fromCharCode(parseInt(h.slice(i,i+2),16));
return s;
},
ok(v){
return this.tokens.some(t=>v===this.dec(t));
}
};
const app={
cache:[],
lastCopyText:'',
toastTimer:null,
norm(x){return(x%10+10)%10},
clamp(v,lo=0,hi=1){return Math.max(lo,Math.min(hi,Number(v)||0))},
normalizeScores(map){
const vals=Object.values(map);
const max=Math.max(...vals,0);
if(max<=0)return Object.fromEntries(Object.keys(map).map(k=>[k,0]));
return Object.fromEntries(Object.entries(map).map(([k,v])=>[k,this.clamp(v/max)]));
},
sourceBreadthScore(v){
return this.clamp(1-Math.exp(-Math.max(0,v)/1.6));
},
flag(n){
n=String(n).toLowerCase();
if(/ลาว|lao/.test(n))return'🇱🇦';
if(/ฮานอย|เวียดนาม|vietnam|viet/.test(n))return'🇻🇳';
if(/พม่า|เมียนมา|myanmar|2d|internet|modern/.test(n))return'🇲🇲';
if(/จีน|china|shanghai/.test(n))return'🇨🇳';
if(/ฮั่งเส็ง|hang seng|hong kong|ฮ่องกง/.test(n))return'🇭🇰';
if(/นิเคอิ|นิคเคอิ|นิกเคอิ|nikkei|ญี่ปุ่น|japan/.test(n))return'🇯🇵';
if(/เกาหลี|korea|kospi/.test(n))return'🇰🇷';
if(/สิงคโปร์|singapore/.test(n))return'🇸🇬';
if(/อินเดีย|india|sensex/.test(n))return'🇮🇳';
if(/รัสเซีย|russia|moscow/.test(n))return'🇷🇺';
if(/เยอรมัน|germany|dax/.test(n))return'🇩🇪';
if(/อังกฤษ|uk|ftse|london/.test(n))return'🇬🇧';
if(/อียิปต์|egypt/.test(n))return'🇪🇬';
if(/ไต้หวัน|taiwan|tse/.test(n))return'🇹🇼';
if(/สหรัฐ|usa|america|dow|nasdaq|s&p/.test(n))return'🇺🇸';
if(/ฝรั่งเศส|france|cac/.test(n))return'🇫🇷';
if(/ออสเตรเลีย|australia|asx/.test(n))return'🇦🇺';
if(/แคนาดา|canada/.test(n))return'🇨🇦';
if(/หุ้นไทย|ไทย|thai|set|หุ้น/.test(n))return'🇹🇭';
return'🌐';
},
parse(text){
const z=String(text||'').replace(/\r/g,'').trim();
if(!z)return{records:[],errors:['ยังไม่มีข้อมูลสำหรับประมวลผล']};
const lines=z.split('\n').map(v=>v.trim());
const records=[];
const errors=[];
let i=0;
while(i<lines.length){
if(!lines[i]){i++;continue}
const m=lines[i].match(/^(.+?)\s*\|\s*(.+?)$/);
if(!m){
errors.push(`บรรทัดที่ ${i+1}: ไม่พบรูปแบบ "ชื่อหวย | วันที่"`);
i++;
continue;
}
const name=m[1].trim();
const date=m[2].trim();
if(!this.parseDateValue(date)){
errors.push(`${name} | ${date}: รูปแบบวันที่ไม่ถูกต้อง เช่น 25 ส.ค. 69`);
i+=1;
continue;
}
const n3raw=lines[i+1]||'';
const n2raw=lines[i+2]||'';
const n3=/^[\d\s]+$/.test(n3raw)?n3raw.replace(/\s+/g,''):n3raw;
const n2=/^[\d\s]+$/.test(n2raw)?n2raw.replace(/\s+/g,''):n2raw;
if(!/^\d{3}$/.test(n3)){
errors.push(`${name} | ${date}: เลข 3 ตัวบนต้องเป็น 3 หลัก`);
i+=1;
continue;
}
if(!/^\d{2}$/.test(n2)){
errors.push(`${name} | ${date}: เลข 2 ตัวล่างต้องเป็น 2 หลัก`);
i+=2;
continue;
}
records.push({name,date,n3,n2});
i+=3;
}
return{records,errors};
},
parseDateValue(date){
const s=String(date||'').trim();
if(!s)return false;
if(/^\d{1,2}\s+\S+\s+\d{2,4}$/.test(s))return true;
if(/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(s))return true;
if(/^\d{1,2}-\d{1,2}-\d{2,4}$/.test(s))return true;
return false;
},
dateKey(date){
const s=String(date||'').trim();
const m=s.match(/^(\d{1,2})\s+(\S+)\s+(\d{2,4})$/);
if(m){
const months={'ม.ค.':1,'ก.พ.':2,'มี.ค.':3,'เม.ย.':4,'พ.ค.':5,'มิ.ย.':6,'ก.ค.':7,'ส.ค.':8,'ก.ย.':9,'ต.ค.':10,'พ.ย.':11,'ธ.ค.':12,
'มกราคม':1,'กุมภาพันธ์':2,'มีนาคม':3,'เมษายน':4,'พฤษภาคม':5,'มิถุนายน':6,'กรกฎาคม':7,'สิงหาคม':8,'กันยายน':9,'ตุลาคม':10,'พฤศจิกายน':11,'ธันวาคม':12};
const month=months[m[2]]||0;
let year=Number(m[3]);
if(year<100)year+=2500;
return[year,String(month).padStart(2,'0'),String(Number(m[1])).padStart(2,'0')].join('-');
}
const m2=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/);
if(m2){
let year=Number(m2[3]);
if(year<100)year+=2500;
return[year,String(Number(m2[2])).padStart(2,'0'),String(Number(m2[1])).padStart(2,'0')].join('-');
}
return s;
},
sortChronological(records){
return records.map((r,index)=>({...r,__index:index})).sort((a,b)=>{
const ka=this.dateKey(a.date);
const kb=this.dateKey(b.date);
if(ka<kb)return-1;
if(ka>kb)return 1;
return a.__index-b.__index;
}).map(r=>{const z={...r};delete z.__index;return z});
},
isExcludedLottery(name){
const s=String(name||'').trim().toLowerCase();
return /visa/.test(s)&&/ht/.test(s)&&/(พิเศษ|special)/.test(s);
},
groupByLottery(records){
const groupsMap={};
records.forEach((r,index)=>{
const key=r.name.trim();
if(!groupsMap[key])groupsMap[key]={name:key,records:[],duplicateCount:0,conflictCount:0,__order:index};
groupsMap[key].records.push(r);
});
const groups=Object.values(groupsMap);
groups.forEach(g=>{
const sorted=this.sortChronological(g.records);
const byDate=new Map();
const clean=[];
sorted.forEach(r=>{
const key=this.dateKey(r.date);
if(!byDate.has(key)){
byDate.set(key,r);
clean.push(r);
return;
}
const previous=byDate.get(key);
if(previous.n3===r.n3&&previous.n2===r.n2){
g.duplicateCount++;
return;
}
g.conflictCount++;
const idx=clean.indexOf(previous);
if(idx>=0)clean[idx]=r;
byDate.set(key,r);
});
g.records=this.sortChronological(clean);
});
return groups.filter(g=>!this.isExcludedLottery(g.name)).sort((a,b)=>a.__order-b.__order).map(g=>{
delete g.__order;
return g;
});
},
formulas(H,T,U,R1,R2,sumT,sumB,total){
const raw=[
H+T,H+U,T+U,H+R1,H+R2,T+R1,T+R2,U+R1,U+R2,R1+R2,

10-H,10-T,10-U,10-R1,10-R2,
H+T+R1,H+U+R2,T+U+R1,T+U+R2,H+R1+R2,T+R1+R2,
sumT-R1,sumT-R2,sumT+sumB,sumT-sumB,
H+T-R2,T+U-R1,H+U-R1,
20-(T+R1),20-(U+R2),
H+T+U-R1,H+T+U-R2,10+T-R2,10+U-R1,sumT+10-R2,
H+R2-T,T+R2-H,U+R1-H,
sumB+H-T,sumB+H-U,H+sumB-T,H+sumB-U,T+sumB-H,T+sumB-U,U+sumB-H,U+sumB-T,
30-(H+T+R1),30-(H+U+R2),30-(T+U+R1),30-(H+R1+R2),
H+T+R1-R2,H+U+R2-R1,T+U+R1-H,
sumT+R1-R2,sumT+R2-R1,
H+T+sumB,H+U+sumB,T+U+sumB,
H+R1+sumT,H+R2+sumT,T+R1+sumT,T+R2+sumT,U+R1+sumT,U+R2+sumT,R1+R2+sumT,
10+H+T,10+H+U,10+T+U,10+R1+R2,10+H+R1,10+H+R2,10+T+R1,10+T+R2,10+U+R1,10+U+R2,
H-T+R2,H-U+R1,T-U+R2,R1-R2+H,R1-R2+T,R1-R2+U,
20-H-T,20-H-U,20-T-U,20-R1-R2,20-H-R1,20-H-R2,20-T-R1,20-T-R2,20-U-R1,20-U-R2,
total,2*total,total+H,total+R1
];
const signals=raw.map((value,index)=>({id:index+1,value:this.norm(value),raw:value}));
return{signals};
},
buildModels(H,T,U,R1,R2,sumT){
const unit=v=>{
const q=Math.abs(v)%10;
return[q,(q+1)%10];
};
const model01Base=this.norm(T+R1);
const model02Base=this.norm(10-R2);
return[
{id:1,name:'AI โมเดล 01',formulaId:1,set:unit(model01Base)},
{id:2,name:'AI โมเดล 02',formulaId:5,set:unit(model02Base)}
];
},
buildPairs(models,anchor){
models.forEach(m=>{
let range=[];
let collision=false;
for(let o=-2;o<=2;o++){
if(m.set.includes(this.norm(anchor+o))){collision=true;break}
}
for(let o=collision?-3:-2;o<=(collision?3:2);o++)range.push(this.norm(anchor+o));
m.pairsMap={};
m.set.forEach(src=>{
let pairs=range.filter(p=>p!==src&&!m.set.includes(p)).map(p=>`${src}${p}`);
let next=(src+1)%10;
while(pairs.length<5){
if(next!==src&&!m.set.includes(next)&&!pairs.includes(`${src}${next}`))pairs.push(`${src}${next}`);
next=(next+1)%10;
}
m.pairsMap[src]=[...new Set(pairs)].filter(p=>p[0]!==p[1]).slice(0,5);
});
});
},
actualDigits(record){
return new Set((String(record.n3)+String(record.n2)).split('').map(Number));
},
buildHistory(records){
const modelPerf=Object.fromEntries(Array.from({length:2},(_,i)=>[i+1,{long:.5,recent:.5,stability:.5,samples:0,hits:0,recentHits:0,recentWeight:0,recentSamples:0}]));
const formulaPerf=Object.fromEntries(Array.from({length:100},(_,i)=>[i+1,{long:.5,recent:.5,samples:0,hits:0,recentHits:0,recentWeight:0,recentSamples:0}]));
const digitPerf=Object.fromEntries(Array.from({length:10},(_,d)=>[d,{long:.5,recent:.5,stability:.5,samples:0,hits:0,recentHits:0,recentWeight:0,recentSamples:0,streak:0,maxStreak:0}]));
const ordered=this.sortChronological((records||[]).slice(-10));
const transitions=[];
const usable=Math.max(0,ordered.length-1);
const recentWindow=Math.min(6,usable);
if(!usable)return{modelPerf,formulaPerf,digitPerf,transitions,usable:0,recentWindow:0};
for(let i=1;i<ordered.length;i++){
const source=ordered[i-1];
const target=ordered[i];
const d3=source.n3.split('').map(Number);
const d2=source.n2.split('').map(Number);
const H=d3[0],T=d3[1],U=d3[2],R1=d2[0],R2=d2[1],sumT=H+T+U;
const F=this.formulas(H,T,U,R1,R2,sumT,R1+R2,sumT+R1+R2);
const models=this.buildModels(H,T,U,R1,R2,sumT);
const actual=this.actualDigits(target);
const recent=i>ordered.length-1-recentWindow;
const recencyWeight=Math.pow(.82,ordered.length-1-i);
models.forEach(m=>{
const unique=[...new Set(m.set)];
const hit=unique.filter(d=>actual.has(d)).length/Math.max(1,unique.length);
const mp=modelPerf[m.id];
mp.hits+=hit;
mp.samples++;
if(recent){
mp.recentHits+=hit*recencyWeight;
mp.recentWeight+=recencyWeight;
mp.recentSamples++;
}
});
F.signals.forEach(sig=>{
const fp=formulaPerf[sig.id];
const hit=actual.has(sig.value)?1:0;
fp.hits+=hit;
fp.samples++;
if(recent){
fp.recentHits+=hit*recencyWeight;
fp.recentWeight+=recencyWeight;
fp.recentSamples++;
}
});
const candidateDigits=new Set(models.flatMap(m=>m.set));
candidateDigits.forEach(d=>{
const dp=digitPerf[d];
const hit=actual.has(d)?1:0;
dp.hits+=hit;
dp.samples++;
if(recent){
dp.recentHits+=hit*recencyWeight;
dp.recentWeight+=recencyWeight;
dp.recentSamples++;
}
});
transitions.push({index:i,sourceDate:source.date,targetDate:target.date,models,formulaSignals:F.signals,actual:[...actual]});
}
Object.values(modelPerf).forEach(mp=>{
mp.long=mp.samples?mp.hits/mp.samples:.5;
mp.recent=mp.recentWeight?mp.recentHits/mp.recentWeight:mp.long;
mp.stability=1-Math.min(1,Math.abs(mp.long-mp.recent)*2);
});
Object.values(formulaPerf).forEach(fp=>{
fp.long=fp.samples?fp.hits/fp.samples:.5;
fp.recent=fp.recentWeight?fp.recentHits/fp.recentWeight:fp.long;
});
for(let d=0;d<=9;d++){
const dp=digitPerf[d];
if(!dp.samples)continue;
dp.long=dp.hits/dp.samples;
dp.recent=dp.recentWeight?dp.recentHits/dp.recentWeight:dp.long;
dp.stability=1-Math.min(1,Math.abs(dp.long-dp.recent)*2);
let streak=0;
for(let j=transitions.length-1;j>=0;j--){
const tr=transitions[j];
if(!tr.models.some(m=>m.set.includes(d)))continue;
if(tr.actual.includes(d)){
streak++;
dp.maxStreak=Math.max(dp.maxStreak,streak);
}else break;
}
dp.streak=streak;
}
return{modelPerf,formulaPerf,digitPerf,transitions,usable,recentWindow};
},
posterior(rate,samples,prior=.5,priorN=6){
const n=Math.max(0,Number(samples)||0);
return(rate*n+prior*priorN)/(n+priorN);
},
modelWeight(m,history){
const hp=history&&history.modelPerf&&history.modelPerf[m.id];
if(!hp)return 1;
const long=this.posterior(hp.long,hp.samples,.5,6);
const recent=this.posterior(hp.recent,hp.recentSamples||Math.min(hp.samples,6),.5,4);
const blended=.50*long+.30*recent+.20*(hp.stability??.5);
return .80+.40*this.clamp(blended);
},
formulaWeight(id,history){
const fp=history&&history.formulaPerf&&history.formulaPerf[id];
if(!fp)return 1;
const long=this.posterior(fp.long,fp.samples,.5,8);
const recent=this.posterior(fp.recent,fp.recentSamples||Math.min(fp.samples,6),.5,4);
const blended=.55*long+.35*recent+.10;
return .85+.30*this.clamp(blended);
},
scoreDigits(models,F,H,T,U,R1,R2,sumT,sumB,total,history){
const score=Object.fromEntries(Array.from({length:10},(_,d)=>[d,{
digit:d,
modelScore:0,
formula100Score:0,
radarScore:0,
backendScore:0,
winSetScore:0,
selectorBonus:0,
selectorScore:0,
historicalScore:.5,
recentFormScore:.5,
stabilityScore:.5,
hotStreakBonus:1,
confidence:0,
redundancyPenalty:1,
modelConsensusCount:0,
supportSignals:0,
conflictSignals:0,
reliabilityScore:.5,
evidenceScore:.5,
uncertainty:1,
selectionPenalty:1,
selectionScore:0,
totalScore:0,
qualityGate:1,
modelId:null,
modelSupportScore:0,
modelPriority:1,
selectedModel:false
}]));
const allowed=new Set();
const modelWeights={};
let totalModelWeight=0;
models.forEach(m=>{
const mw=this.modelWeight(m,history);
modelWeights[m.id]=mw;
m.historyWeight=mw;
totalModelWeight+=mw;
m.set.forEach(d=>allowed.add(d));
});
for(let d=0;d<=9;d++){
const supporters=models.filter(m=>m.set.includes(d));
score[d].modelConsensusCount=supporters.length;
score[d].modelScore=totalModelWeight?supporters.reduce((sum,m)=>sum+modelWeights[m.id],0)/totalModelWeight:0;
score[d].modelSupportScore=score[d].modelScore;
score[d].modelId=supporters[0]?.id??null;
}
const weightedFormulaCounts=Object.fromEntries(Array.from({length:10},(_,d)=>[d,0]));
F.signals.forEach(sig=>{
weightedFormulaCounts[sig.value]+=this.formulaWeight(sig.id,history);
});
const maxF=Math.max(...Object.values(weightedFormulaCounts),1);
for(let d=0;d<=9;d++)score[d].formula100Score=this.clamp(weightedFormulaCounts[d]/maxF);
const x=(R1+R2)%10;
const y=sumT%10;
const z=total%10;
const r1=[this.norm(x-1),x,this.norm(x+1)];
const r2=[this.norm(y-1),y,this.norm(y+1)];
const r3=[this.norm(z-1),z,this.norm(z+1)];
for(let d=0;d<=9;d++){
let h=0;
if(r1.includes(d))h++;
if(r2.includes(d))h++;
if(r3.includes(d))h++;
score[d].radarScore=h/3;
}
const back=[(2*H+R1)%10,(T+R2)%10,sumT%10,Math.abs(T-U)%10,total%10];
for(let d=0;d<=9;d++){
score[d].backendScore=back.includes(d)?1:0;
score[d].winSetScore=(d===z||d===this.norm(z+5))?1:0;
const dp=history&&history.digitPerf&&history.digitPerf[d];
if(dp&&dp.samples){
const longPost=this.posterior(dp.long,dp.samples,.5,6);
const recentPost=this.posterior(dp.recent,dp.recentSamples||Math.min(dp.samples,6),.5,4);
score[d].historicalScore=longPost;
score[d].recentFormScore=recentPost;
score[d].stabilityScore=dp.stability??.5;
score[d].evidenceScore=this.clamp(.55*longPost+.35*recentPost+.10*(dp.stability??.5));
score[d].uncertainty=1/Math.sqrt(dp.samples+1);
const streak=Math.max(0,dp.streak||0);
score[d].hotStreakBonus=1+Math.min(.04,Math.max(0,streak-1)*.01);
}
}
for(let d=0;d<=9;d++){
const v=score[d];
const consensus=v.modelScore;
const supportValues=[v.formula100Score,v.radarScore,v.backendScore,v.winSetScore];
v.supportSignals=supportValues.filter(x=>x>=.60).length;
v.conflictSignals=supportValues.filter(x=>x<=.25).length;
const sortedSupport=[...supportValues].sort((a,b)=>b-a);
const supportStrength=this.clamp(.40*sortedSupport[0]+.24*sortedSupport[1]+.14*sortedSupport[2]+.08*sortedSupport[3]);
const supportBreadth=this.sourceBreadthScore(v.supportSignals);
const hist=v.evidenceScore;
v.reliabilityScore=this.clamp(.45*consensus+.25*hist+.15*supportBreadth+.15*supportStrength);
v.totalScore=this.clamp(
.45*consensus+
.15*v.formula100Score+
.05*v.radarScore+
.05*v.backendScore+
.05*v.winSetScore+
.10*v.historicalScore+
.10*v.recentFormScore+
.03*v.stabilityScore+
.02*supportBreadth
);
if(history&&history.usable>0){
const histAdj=.92+.16*this.clamp(v.evidenceScore);
v.totalScore*=histAdj;
}
v.totalScore*=Math.min(1.03,v.hotStreakBonus);
if(allowed.has(v.digit))v.totalScore*=1.25;
const poolStrength=v.modelConsensusCount/Math.max(1,models.length);
const supportBreadthRatio=v.supportSignals/4;
v.selectorBonus=allowed.has(v.digit)?(
.050*poolStrength+
.030*supportBreadthRatio+
.040*Math.max(0,v.reliabilityScore-.5)+
.025*Math.max(0,v.evidenceScore-.5)
):0;
const deadCandidate=
allowed.has(v.digit)&&
v.modelConsensusCount<=1&&
v.reliabilityScore<.35&&
v.evidenceScore<.40&&
v.supportSignals===0;
const deadPenalty=deadCandidate?.80:1;
const lowEvidenceSingle=
allowed.has(v.digit)&&
v.modelConsensusCount===1&&
v.evidenceScore<.42&&
v.supportSignals===0;
const lowEvidencePenalty=lowEvidenceSingle?.88:1;
const conflictPenalty=1-Math.min(.10,Math.max(0,v.conflictSignals-1)*.025);
v.selectionPenalty=deadPenalty*lowEvidencePenalty*conflictPenalty;
v.totalScore*=v.selectionPenalty;
v.totalScore+=Math.min(.08,v.selectorBonus);
v.selectorScore=v.totalScore;
v.selectionScore=v.selectorScore;
}
return{score,allowed};
},
tournament(models,score){
const compareDigits=(a,b)=>{
if(!a)return b;
if(!b)return a;
if(Math.abs(a.selectorScore-b.selectorScore)>0.0005)return a.selectorScore>b.selectorScore?a:b;
if(Math.abs(a.recentFormScore-b.recentFormScore)>0.0005)return a.recentFormScore>b.recentFormScore?a:b;
if(Math.abs(a.evidenceScore-b.evidenceScore)>0.0005)return a.evidenceScore>b.evidenceScore?a:b;
if(a.backendScore!==b.backendScore)return a.backendScore>b.backendScore?a:b;
return a.digit<=b.digit?a:b;
};
const modelRounds=models.map(model=>{
const first=score[model.set[0]];
const second=score[model.set[1]];
const winner=compareDigits(first,second);
return{
modelId:model.id,
modelName:model.name,
candidates:[first,second],
winner,
margin:Math.abs(first.selectorScore-second.selectorScore)
};
});
const winner01=modelRounds.find(x=>x.modelId===1)?.winner||null;
const winner02=modelRounds.find(x=>x.modelId===2)?.winner||null;
const finalWinner=compareDigits(winner01,winner02);
const finalLoser=finalWinner===winner01?winner02:winner01;
const finalMargin=finalWinner&&finalLoser?Math.abs(finalWinner.selectorScore-finalLoser.selectorScore):0;
const winningModelId=finalWinner?.modelId??null;
if(finalWinner){
const finalMarginScore=this.clamp(finalMargin/.10);
const supportBreadth=this.sourceBreadthScore(finalWinner.supportSignals);
const baseConfidence=
.40*this.clamp(finalWinner.selectorScore)+
.20*finalMarginScore+
.22*this.clamp(finalWinner.evidenceScore)+
.18*supportBreadth;
finalWinner.confidence=this.clamp(.35+.65*baseConfidence);
finalWinner.finalMargin=finalMargin;
finalWinner.finalOpponent=finalLoser?.digit??null;
finalWinner.finalWinner=true;
}
return{modelRounds,winner01,winner02,finalWinner,finalLoser,finalMargin,winningModelId};
},
collectPairCandidates(digit,models,score){
const candidates=[];
models.filter(m=>m.set.includes(digit)).forEach(m=>{
const sourceStrength=Math.max(0,Math.min(1,
.70*((m.historyWeight||1)/1.30)+
.30*(score[digit]?.reliabilityScore??.5)
));
const digitStrength=score[digit]?score[digit].selectorScore:0;
const modelConsensus=score[digit]?score[digit].modelScore:0;
(m.pairsMap[digit]||[]).forEach(pair=>{
const key=this.pairKey(pair);
const pairScore=.55*sourceStrength+.30*digitStrength+.15*modelConsensus;
candidates.push({pair:String(pair),key,pairScore,modelId:m.id});
});
});
return candidates;
},
bestPairsForDigit(digit,models,score){
const candidates=this.collectPairCandidates(digit,models,score);
const bestByKey={};
candidates.forEach(c=>{
if(!bestByKey[c.key]||c.pairScore>bestByKey[c.key].pairScore)bestByKey[c.key]=c;
});
return Object.values(bestByKey).sort((a,b)=>b.pairScore-a.pairScore||Number(a.key)-Number(b.key)).slice(0,5).map(v=>v.pair);
},
pairKey(pair){
const p=String(pair);
if(!/^\d{2}$/.test(p))return p;
return[p[0],p[1]].sort().join('');
},
buildConsensus(pairSets){
const all=[];
pairSets.forEach((set,rowIndex)=>{
set.slice(0,6).forEach(pair=>all.push({pair:String(pair),rowIndex}));
});
const counts={};
all.forEach(item=>{
const key=this.pairKey(item.pair);
if(!counts[key])counts[key]={key,score:0,rows:new Set(),pairs:new Set()};
counts[key].score++;
counts[key].rows.add(item.rowIndex);
counts[key].pairs.add(item.pair);
});
const ranked=Object.values(counts).sort((a,b)=>b.score-a.score||b.rows.size-a.rows.size||Number(a.key)-Number(b.key));
const colorMap={};
ranked.slice(0,6).forEach((item,index)=>{
let color;
if(index<2)color='gold';
else if(index<4)color='silver';
else color='rose';
colorMap[item.key]={color,rank:index+1,score:item.score};
});
return{counts,ranked,colorMap};
},
sortPairs(pairs){
return pairs.map(String).sort((a,b)=>Number(a)-Number(b));
},
pairClass(pair,colorMap){
const info=colorMap[this.pairKey(pair)];
if(!info)return'pair';
if(info.color==='gold')return'pair pair-gold';
if(info.color==='silver')return'pair pair-silver';
return'pair pair-rose';
},
formatPct(v){
return`${Math.round(Math.max(0,Math.min(1,v))*1000)/10}%`;
},
formatDate(date){
const s=String(date||'').trim();
if(/\d+\s+\S+\s+\d+/.test(s)){
const p=s.split(/\s+/);
if(p.length>=3)return[p[0],p[1],p.slice(2).join(' ')].join(' · ');
}
return s;
},
run(n3,n2,history=null){
const d3=n3.split('').map(Number);
const d2=n2.split('').map(Number);
const[H,T,U]=d3;
const[R1,R2]=d2;
const sumT=H+T+U;
const sumB=R1+R2;
const total=sumT+sumB;
const F=this.formulas(H,T,U,R1,R2,sumT,sumB,total);
const models=this.buildModels(H,T,U,R1,R2,sumT);
const anchor=this.norm(7-H);
this.buildPairs(models,anchor);
const scored=this.scoreDigits(models,F,H,T,U,R1,R2,sumT,sumB,total,history);
const tournament=this.tournament(models,scored.score);
const finalWinner=tournament.finalWinner;
const top1Digits=finalWinner?[finalWinner.digit]:[];
let pairSet=finalWinner?this.bestPairsForDigit(finalWinner.digit,models,scored.score):[];
if(finalWinner&&tournament.finalLoser&&Number.isInteger(finalWinner.digit)&&Number.isInteger(tournament.finalLoser.digit)){
const extraPair=`${finalWinner.digit}${tournament.finalLoser.digit}`;
if(/^\d{2}$/.test(extraPair)&&!pairSet.includes(extraPair))pairSet=[...pairSet,extraPair];
}
const consensus=this.buildConsensus([pairSet]);
return{
top1Digit:finalWinner?finalWinner.digit:null,
top2Digits:top1Digits,
pairSets:[pairSet],
modelScores:scored.score,
modelCount:2,
models,
tournament,
selectedModelId:tournament.winningModelId,
selectedModel:models.find(m=>m.id===tournament.winningModelId)||null,
confidence:finalWinner?finalWinner.confidence:0,
finalMargin:tournament.finalMargin,
consensus
};
},
async captureCard(cardId,name){
const el=document.getElementById(cardId);
if(!el)return;
const controls=[...el.querySelectorAll('[data-no-capture]')];
try{
if(typeof html2canvas==='undefined')throw new Error('ไม่พบระบบแคปภาพ กรุณาเปิดอินเทอร์เน็ตแล้วลองใหม่');
controls.forEach(x=>x.style.visibility='hidden');
const canvas=await html2canvas(el,{backgroundColor:'#ffffff',scale:Math.min(3,Math.max(2,window.devicePixelRatio||2)),useCORS:true,logging:false});
const link=document.createElement('a');
const safe=String(name||'lottery').replace(/[^ก-๙A-Za-z0-9_-]+/g,'_').slice(0,60);
link.download=`${safe||'lottery'}_card.png`;
link.href=canvas.toDataURL('image/png');
link.click();
this.show('✓ แคปการ์ดแล้ว');
}catch(err){
console.error(err);
this.show('❌ แคปภาพไม่สำเร็จ');
}finally{
controls.forEach(x=>x.style.visibility='');
}
},
copy(text){
navigator.clipboard?.writeText(text).then(()=>this.show()).catch(()=>{
const t=document.createElement('textarea');
t.value=text;
document.body.appendChild(t);
t.select();
document.execCommand('copy');
t.remove();
this.show();
});
},
show(message){
const t=$('toast');
if(message)t.textContent=message;
t.classList.add('show');
clearTimeout(this.toastTimer);
this.toastTimer=setTimeout(()=>t.classList.remove('show'),1500);
},
async calculate(){
const parsed=this.parse($('bulkInput').value);
if(!parsed.records.length){
$('result').innerHTML='<div class="errorbox">❌ ไม่พบข้อมูลที่ถูกต้อง กรุณาตรวจรูปแบบอีกครั้ง</div>';
return;
}
const scanner=$('scanner');
const btn=$('run');
btn.disabled=true;
scanner.style.display='block';
const scan=msg=>$('scanText').textContent=msg;
const yieldUI=()=>new Promise(resolve=>requestAnimationFrame(resolve));
try{
scan('อ่านข้อมูล 3 ตัวบน + 2 ตัวล่าง...');
await yieldUI();
this.cache=[];
const groups=this.groupByLottery(parsed.records);
const cards=[];
const outputData=[];
const copyBlocks=[];
let groupIndex=0;
for(const group of groups){
groupIndex++;
const records=group.records;
if(!records.length)continue;
const latest=records[records.length-1];
const history=this.buildHistory(records.slice(-10));
scan(`ประมวลผล ${group.name} • ${groupIndex}/${groups.length}`);
await yieldUI();
const a=this.run(latest.n3,latest.n2,history);
this.cache.push({group:group.name,result:a,history});
const allowed=new Set();
a.models.forEach(m=>m.set.forEach(d=>allowed.add(d)));
const valid=a.top1Digit!==null&&allowed.has(a.top1Digit);
if(!valid){
parsed.errors.push(`${group.name} | ${latest.date}: ไม่สามารถคัดเลข TOP 1 จาก Candidate Pool ของ 2 Main Models ได้`);
continue;
}
const digit=a.top1Digit;
const sourcePairs=a.pairSets[0]||[];
const sorted=this.sortPairs(sourcePairs);
const pairHTML=sorted.map(pair=>{
const info=a.consensus.colorMap[this.pairKey(pair)];
const title=info?`อันดับ Consensus ${info.rank} • พบ ${info.score} ครั้ง`:'เลขเจาะจาก 2 Main Models';
return`<span class="${this.pairClass(pair,a.consensus.colorMap)}" title="${esc(title)}">${esc(pair)}</span>`;
}).join('');
const row=`
<div class="row">
<span class="digit digit-gold" aria-label="เลขเด่น">${esc(digit)}</span>
<span class="sep">:</span>
<div class="pairs">${pairHTML}</div>
</div>`;
const footer=`
<div class="brand-footer">
<span class="brand-star">✦</span>
<span>บ้านเงินกอง</span>
<span class="brand-star">✦</span>
</div>`;
const nextDate=this.nextDateLabel([latest]);
const cardId=`lottery-card-${groupIndex}`;
cards.push(`
<article class="lottery" id="${cardId}" data-lottery-card="true">
<div class="lottery-head">
<div>
<div class="lottery-name">
<span class="flag">${this.flag(group.name)}</span>
<span>${esc(group.name)}</span>
</div>
<div class="date">${esc(nextDate)}</div>
</div>
<div class="vip-label"></div>
<div class="card-actions" data-no-capture="true">
<button class="card-capture" data-capture-card="${cardId}" data-capture-name="${esc(group.name)}">📷 แคปการ์ด</button>
</div>
</div>
<div class="rows">${row}</div>
${footer}
</article>
`);
copyBlocks.push([`${this.flag(group.name)} ${group.name} | ${nextDate}`,`${digit} : ${sorted.join('-')}`].join('\n'));
outputData.push({group,latest,a,nextDate});
}

await yieldUI();
scan('FINALIZING...');
await yieldUI();
scanner.style.display='none';
btn.disabled=false;

this.lastCopyText=all;

<div class="summary">

</div>
${parsed.errors.length?`<div class="errorbox">${parsed.errors.map(esc).join('<br>')}</div>`:''}
${cards.join('')}
<button class="copyall" id="copyBottom">📋 คัดลอกหวยทั้งหมด</button>
`;

},
nextDateLabel(records){
if(!records.length)return'';
const latest=records[records.length-1];
const s=String(latest.date||'').trim();
const m=s.match(/^(\d{1,2})\s+(\S+)\s+(\d{2,4})$/);
if(m){
const day=Number(m[1]);
let year=Number(m[3]);
if(year<100)year+=2500;
const months=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const monthIndex=months.indexOf(m[2]);
if(monthIndex>=0){
let d=new Date(year-543,monthIndex,day);
d.setDate(d.getDate()+1);
return[String(d.getDate()),months[d.getMonth()],String(d.getFullYear()+543)].join(' ');
}
}
return'งวดถัดไป';
}
};

$('console').classList.add('active');
$('loginErr').style.display='none';
}else{
$('loginErr').style.display='block';
}
}

});
if(localStorage.getItem('ml_auth_status_v5')==='active'){
$('login').classList.remove('active');
$('console').classList.add('active');
}
