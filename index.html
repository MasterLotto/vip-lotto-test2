<script>
(()=>{
const c=document.getElementById('snow');
const x=c.getContext('2d');

let w=c.width=innerWidth;
let h=c.height=innerHeight;

addEventListener('resize',()=>{
w=c.width=innerWidth;
h=c.height=innerHeight;
});

const particles=Array.from(
{length:42},
()=>({
x:Math.random()*w,
y:Math.random()*h,
r:.7+Math.random()*1.8,
s:.15+Math.random()*.45,
a:.18+Math.random()*.35,
p:Math.random()*6.28,
tone:Math.random()>.72?'rose':'gold'
})
);

(function draw(){
x.clearRect(0,0,w,h);

particles.forEach(q=>{
q.p+=.01;
q.y+=q.s;
q.x+=Math.sin(q.p)*.25;

if(q.y>h+5){
q.y=-5;
q.x=Math.random()*w;
}

x.beginPath();

x.arc(
q.x,
q.y,
q.r,
0,
Math.PI*2
);

x.fillStyle=
q.tone==='rose'
?`rgba(185,130,121,${q.a*.55})`
:`rgba(195,154,67,${q.a})`;

x.fill();
});

requestAnimationFrame(draw);
})();

dec(h){

for(let i=0;i<h.length;i+=2){
s+=String.fromCharCode(
parseInt(h.slice(i,i+2),16)

return s;
},

ok(v){

t=>v===this.dec(t)

cache:[],

clamp(v,lo=0,hi=1){

Math.min(

},

normalizeScores(map){
const vals=Object.values(map);

const max=Math.max(
...vals,
0
);

if(max<=0){
return Object.fromEntries(
Object.keys(map)
.map(k=>[k,0])
);
}

return Object.fromEntries(
Object.entries(map)
.map(
([k,v])=>[

this.clamp(v/max)

parse(text){

const z=String(text||'')
.replace(/\r/g,'')
.trim();

};

const errors=[];

let i=0;

i++;

const m=lines[i]
.match(

);

if(!m){

errors.push(

sortChronological(records){

return records
.map((r,index)=>({
...r,
__index:index
}))
.sort((a,b)=>{

const ka=this.dateKey(a.date);
const kb=this.dateKey(b.date);

if(ka<kb)
return-1;

if(ka>kb)
return 1;

return a.__index-b.__index;
})
.map(r=>{

const z={...r};

delete z.__index;

return z;
});
},

groupByLottery(records){

const groupsMap={};

records.forEach((r,index)=>{

const key=r.name.trim();

if(!groupsMap[key]){

groupsMap[key]={
name:key,
records:[],
duplicateCount:0,
conflictCount:0,
__order:index
};
}

groupsMap[key].records.push(r);
});

const groups=Object.values(groupsMap);

groups.forEach(g=>{

const sorted=this.sortChronological(g.records);
const byDate=new Map();
const clean=[];

sorted.forEach(r=>{

const key=this.dateKey(r.date);

if(!byDate.has(key)){

byDate.set(
key,
r
);

clean.push(r);

return;
}

const previous=byDate.get(key);

if(
previous.n3===r.n3 &&
previous.n2===r.n2
){

g.duplicateCount++;

return;
}

g.conflictCount++;

const idx=clean.indexOf(previous);

if(idx>=0)
clean[idx]=r;

byDate.set(key,r);
});

g.records=this.sortChronological(clean);
});

return groups
.sort((a,b)=>a.__order-b.__order)
.map(g=>{
delete g.__order;
return g;
});
},

/*
==========================================================
PROTECTED PAIR / เลขเจาะ ENGINE
==========================================================
*/
buildPairs(
models,
anchor
){

models.forEach(m=>{

let range=[];
let collision=false;

for(let o=-2;o<=2;o++){

if(
m.set.includes(
this.norm(anchor+o)
)
){

collision=true;
break;
}
}

for(
let o=collision?-3:-2;
o<=(collision?3:2);
o++
){

range.push(
this.norm(anchor+o)
);
}

m.pairsMap={};

m.set.forEach(src=>{

let pairs=range
.filter(
p=>
p!==src &&
!m.set.includes(p)
)
.map(
p=>`${src}${p}`
);

let next=(src+1)%10;

while(pairs.length<5){

if(
next!==src &&
!m.set.includes(next) &&
!pairs.includes(
`${src}${next}`
)
){

pairs.push(
`${src}${next}`
);
}

next=(next+1)%10;
}

m.pairsMap[src]=[
...new Set(pairs)
]
.filter(
p=>p[0]!==p[1]
)
.slice(0,5);

});

});

},

/*
==========================================================
STATELESS DIGIT / DECISION SCORE ENGINE
==========================================================
Current-input only. No historical statistics.
==========================================================
*/
scoreDigits(
models,
F,
H,T,U,R1,R2,
sumT,sumB,total
){

const score=Object.fromEntries(
Array.from({length:10},(_,d)=>[d,{

digit:d,

modelScore:0,

formula100Score:0,

radarScore:0,

backendScore:0,

winSetScore:0,

selectorBonus:0,

selectorScore:0,

historicalScore:0,

recentFormScore:0,

stabilityScore:0,

hotStreakBonus:1,

confidence:0,

redundancyPenalty:1,

modelConsensusCount:0,

supportSignals:0,

conflictSignals:0,

reliabilityScore:0,

evidenceScore:0,

uncertainty:0,

selectionPenalty:1,

selectionScore:0,

totalScore:0,

qualityGate:1

}])
);

/*
Primary model evidence: consensus is the strongest signal.
*/
for(let d=0;d<=9;d++){

const count=
models.filter(
m=>m.set.includes(d)
).length;

score[d].modelConsensusCount=count;

score[d].modelScore=
this.consensusTier(
count,
models.length
);

}

/*
Current-input formula support only.
No historical formula weights.
*/
const formulaCounts=F.counts||{};

const maxFormula=
Math.max(
...Object.values(formulaCounts),
0
);

for(let d=0;d<=9;d++){

score[d].formula100Score=
maxFormula>0
?this.clamp(
(Number(formulaCounts[d])||0)/maxFormula
)
:0;

}

/*
Auxiliary current-input support.
*/
const x=(R1+R2)%10;
const y=sumT%10;
const z=total%10;

const r1=[
this.norm(x-1),
x,
this.norm(x+1)
];

const r2=[
this.norm(y-1),
y,
this.norm(y+1)
];

const r3=[
this.norm(z-1),
z,
this.norm(z+1)
];

for(let d=0;d<=9;d++){

let h=0;

if(r1.includes(d))
h++;

if(r2.includes(d))
h++;

if(r3.includes(d))
h++;

score[d].radarScore=h/3;

}

const back=[

(2*H+R1)%10,

(T+R2)%10,

sumT%10,

Math.abs(T-U)%10,

total%10

];

for(let d=0;d<=9;d++){

score[d].backendScore=
back.includes(d)
?1
:0;

score[d].winSetScore=
(
d===z ||
d===this.norm(z+5)
)
?1
:0;

}

/*
Current-input evidence model.

Historical fields are intentionally neutralized because this version
has no historical statistics by design.
*/
for(let d=0;d<=9;d++){

const v=score[d];

const consensus=
this.consensusTier(
v.modelConsensusCount,
models.length
);

const supportValues=[

v.formula100Score,
v.radarScore,
v.backendScore,
v.winSetScore

];

v.supportSignals=
supportValues.filter(
x=>x>=.60
).length;

v.conflictSignals=
supportValues.filter(
x=>x<=.25
).length;

const supportBreadth=
this.sourceBreadthScore(
v.supportSignals
);

const supportStrength=(

.45*v.formula100Score+

.25*v.radarScore+

.20*v.backendScore+

.10*v.winSetScore

);

v.reliabilityScore=
this.clamp(

.65*consensus+

.35*supportBreadth

);

v.evidenceScore=
this.clamp(

.70*supportStrength+

.30*consensus

);

v.historicalScore=.5;

v.recentFormScore=.5;

v.stabilityScore=.5;

v.uncertainty=0;

v.hotStreakBonus=1;

/*
Strong primary-model agreement is deliberately protected from being
replaced by a support-only candidate.
*/
const primaryGate=

v.modelConsensusCount===3
?1.00

:

v.modelConsensusCount===2
?.88

:

v.modelConsensusCount===1
?.62

:.20;

const conflictPenalty=

1-
Math.min(
.18,
Math.max(
0,
v.conflictSignals-1
)*.06
);

const weakSupportPenalty=

v.modelConsensusCount===1 &&
v.supportSignals===0

?.82
:1;

v.selectionPenalty=
conflictPenalty*
weakSupportPenalty;

/*
Base decision score for the stateless selector.

Primary model consensus remains dominant;
backend layers verify it.
*/
v.totalScore=

.55*consensus+

.20*v.formula100Score+

.10*v.radarScore+

.08*v.backendScore+

.07*v.winSetScore;

v.selectorBonus=

.045*consensus+

.030*supportBreadth+

.025*
Math.max(
0,
v.evidenceScore-.5
);

v.totalScore*=primaryGate;

v.totalScore+=
Math.min(
.06,
v.selectorBonus
);

v.totalScore*=
v.selectionPenalty;

/*
Candidate privilege:
only digits produced by protected models rank.
*/
if(v.modelConsensusCount>0){

v.totalScore*=1.05;

}

v.selectorScore=
v.totalScore;

v.selectionScore=
v.selectorScore;

}

let ranked=
Object.values(score)

.filter(
v=>
models.some(
m=>m.set.includes(v.digit)
)
)

.sort(
(a,b)=>

b.selectorScore-
a.selectorScore||

b.modelConsensusCount-
a.modelConsensusCount||

b.formula100Score-
a.formula100Score||

b.supportSignals-
a.supportSignals||

b.backendScore-
a.backendScore||

a.digit-
b.digit
);

/*
Near-tie resolver:
prefer stronger model agreement first, then broader current-input support.

It never introduces a digit outside the 3 models.
*/
if(ranked.length>2){

const first=ranked[0];

const second=ranked[1];

const third=ranked[2];

const gap12=
first.selectorScore-
second.selectorScore;

const gap23=
second.selectorScore-
third.selectorScore;

const near12=
gap12<=.025;

const near23=
gap23<=.025;

if(near12||near23){

ranked=
ranked
.map(v=>({

v,

final:

v.selectorScore+

.040*
this.consensusTier(
v.modelConsensusCount,
models.length
)+

.020*
this.sourceBreadthScore(
v.supportSignals
)+

.015*
v.backendScore+

.010*
v.radarScore-

.012*
(
v.conflictSignals/4
)

}))

.sort(
(a,b)=>

b.final-
a.final||

b.v.modelConsensusCount-
a.v.modelConsensusCount||

b.v.formula100Score-
a.v.formula100Score||

a.v.digit-
b.v.digit
)

.map(
x=>x.v
);

}

}

/*
Confidence is a decision-quality indicator from current-input
agreement only.
*/
ranked.forEach((v,i)=>{

const next=
ranked[i+1];

const margin=
next
?
Math.max(
0,
v.selectorScore-
next.selectorScore
)
:
v.selectorScore;

const consensus=
this.consensusTier(
v.modelConsensusCount,
models.length
);

const breadth=
this.sourceBreadthScore(
v.supportSignals
);

const marginScore=
Math.min(
1,
margin/.10
);

v.qualityGate=
this.clamp(

.55*
(
.85+
.15*consensus
)

+

.45*
(
.85+
.15*breadth
)

);

v.confidence=
this.clamp(

.28+

.34*consensus+

.18*breadth+

.12*
Math.min(
1,
marginScore
)+

.08*v.backendScore-

.10*
(
v.conflictSignals/4
)

);

});

return{

score,

allowed:
new Set(
models.flatMap(
m=>m.set
)
),

top:
ranked.slice(0,2),

ranked

};

},

/*
==========================================================
PROTECTED PAIR SELECTION
==========================================================
*/
collectPairCandidates(
digit,
models,
score
){

const candidates=[];

models
.filter(

)
.forEach(m=>{

1,

.70*
(
(m.historyWeight||1)/
1.30
)+

.30*
(
score[digit]?.reliabilityScore??.5
)

)
);

const digitStrength=
score[digit]
?
score[digit].selectorScore
:
0;

const modelConsensus=
score[digit]
?
score[digit].modelScore
:
0;

(
m.pairsMap[digit]||[]
)
.forEach(pair=>{

const key=
this.pairKey(pair);

const pairScore=

.55*sourceStrength+

.30*digitStrength+

.15*modelConsensus;

candidates.push({

key,

pairScore,

modelId:m.id

});

});

});

return candidates;
},

bestPairsForDigit(

.sort(

)

]

.join('');

buildConsensus(pairSets){

.forEach(pair=>{

this.pairKey(

);

counts[key]={

rows:new Set(),

pairs:new Set()

};

counts[key].score++;

counts[key].rows.add(
item.rowIndex
);

counts[key].pairs.add(
item.pair
);

});

const ranked=
Object.values(
counts
)
.sort(
(a,b)=>
b.score-
a.score||

b.rows.size-
a.rows.size||

Number(a.key)-
Number(b.key)
);

const colorMap={};

ranked
.slice(0,6)
.forEach(

color='gold';

else if(index<4)
color='silver';

else
color='rose';

colorMap[item.key]={

color,

rank:index+1,

};

});

return{

counts,

ranked,

colorMap

};

/*
==========================================================
MAIN ENGINE
==========================================================
*/
run(
n3,
n2
){

const d3=
n3.split('').map(Number);

const d2=
n2.split('').map(Number);

const[
H,T,U
]=d3;

const[
R1,R2
]=d2;

const sumT=
H+T+U;

const sumB=
R1+R2;

const total=
sumT+
sumB;

const F=
this.formulas(
H,T,U,
R1,R2,
sumT,
sumB,
total
);

const models=
this.buildModels(
H,T,U,
R1,R2,
sumT
);

const anchor=
this.norm(
7-H
);

this.buildPairs(
models,
anchor
);

const scored=
this.scoreDigits(
models,

H,T,U,

sumT,
sumB,
total
);

const top=
scored.top;

const pairSets=
top.map(
t=>
this.bestPairsForDigit(
t.digit,
models,
scored.score
)
);

const consensus=
this.buildConsensus(
pairSets
);

return{

top2Digits:
top.map(
v=>v.digit
),

pairSets:
pairSets.map(
v=>v.slice(0,5)
),

modelScores:
scored.score,

models,

consensus

};

},

6. Decision Layer จัดอันดับ Top 2
7. Protected pair / เลขเจาะ ทำงานต่อจาก Top 2
8. แสดงผลโดยไม่เปิดเผยสูตร
==========================================================
*/
async calculate(){

const parsed=
this.parse(
$('bulkInput').value
);

if(!parsed.records.length){

$('result').innerHTML=
'<div class="errorbox">❌ ไม่พบข้อมูลที่ถูกต้อง กรุณาตรวจรูปแบบอีกครั้ง</div>';

return;

}

const scanner=
$('scanner');

const btn=
$('run');

btn.disabled=true;

scanner.style.display='block';

const scan=
msg=>
$('scanText').textContent=msg;

const yieldUI=
()=>new Promise(
resolve=>
requestAnimationFrame(
resolve
)
);

try{

scan(
'อ่านข้อมูล 3 ตัวบน + 2 ตัวล่าง...'
);

await yieldUI();

this.cache=[];

const groups=
this.groupByLottery(
parsed.records
);

const cards=[];
const outputData=[];
const copyBlocks=[];

let groupIndex=0;

for(
const group of groups
){

groupIndex++;

const records=
group.records;

if(!records.length)
continue;

/*
Stateless mode:

Each supplied record is treated as the current input only.

If more than one record is pasted for the same lottery,
only the latest chronological record is processed.
No historical statistics are retained or used.
*/
const latest=
records[
records.length-1
];

scan(
`ประมวลผล ${group.name} • ${groupIndex}/${groups.length}`
);

await yieldUI();

const a=
this.run(
latest.n3,
latest.n2
);

this.cache.push({

group:
group.name,

result:a

});

/*
======================================================
CANDIDATE POOL GUARD
======================================================
Top 2 must come from the 3 protected main models.
======================================================
*/
const allowed=
new Set();

a.models.forEach(
m=>
m.set.forEach(
d=>allowed.add(d)
)
);

const valid=
a.top2Digits.length===2&&
a.top2Digits.every(
d=>allowed.has(d)
)&&
new Set(
a.top2Digits
).size===2;

if(!valid){

parsed.errors.push(
`${group.name} | ${latest.date}: ไม่สามารถคัดเลข 2 ตัวจาก Candidate Pool ของ 3 Main Models ได้`
);

continue;

}

/*
======================================================
DISPLAY
======================================================
Only Model 01 / 02 / 03 exist internally as main models.
No formula names are exposed to the user.
======================================================
*/

const rows=
a.top2Digits
.map(
(d,k)=>{

const sourcePairs=
(a.pairSets[k]||[])
.slice(0,5);

const sorted=
this.sortPairs(
sourcePairs
);

const pairHTML=
sorted
.map(pair=>{

const info=
a.consensus.colorMap[
this.pairKey(pair)
];

const title=
info
?
`อันดับ Consensus ${info.rank} • พบ ${info.score} ครั้ง`
:
'เลขเจาะจาก 3 Main Models';

return`
<span
class="${this.pairClass(
pair,
a.consensus.colorMap
)}"
title="${esc(title)}"
>
${esc(pair)}
</span>
`;

})
.join('');

const digitClass=
k===0
?
'digit digit-gold'
:
'digit digit-silver';

return`
<div class="row">
<span
class="${digitClass}"
aria-label="เลขเด่นอันดับ ${k+1}"
>
${esc(d)}
</span>

<span class="sep">
:
</span>

<div class="pairs">
${pairHTML}
</div>

</div>
`;

})
.join('');

const footer=`
<div class="brand-footer">
<span class="brand-star">
✦
</span>

<span>
บ้านเงินกอง
</span>

<span class="brand-star">
✦
</span>
</div>
`;

const nextDate=
this.nextDateLabel(
[latest]
);

const cardId=
`lottery-card-${groupIndex}`;

cards.push(`

<article
class="lottery"
id="${cardId}"
data-lottery-card="true"
>

<div class="lottery-head">

<div>

<div class="lottery-name">

<span class="flag">
${this.flag(group.name)}
</span>

<span>
${esc(group.name)}
</span>

</div>

<div class="date">
${esc(nextDate)}
</div>

</div>

<div class="vip-label"></div>

</div>

<div class="rows">
${rows}
</div>

<div
class="card-actions"
data-no-capture="true"
>

<button
class="card-capture"
data-capture-card="${cardId}"
data-capture-name="${esc(group.name)}"
>
📷 แคปการ์ด
</button>

</div>

${footer}

</article>

`);

copyBlocks.push([

`${this.flag(group.name)} ${group.name} | ${nextDate}`,

...a.top2Digits.map(
(d,k)=>
`${d} : ${
this.sortPairs(
(a.pairSets[k]||[])
.slice(0,5)
).join('-')}`
)

].join('\n'));

outputData.push({

group,

latest,

a,

nextDate

});

}

scan(
'ตรวจสอบความสอดคล้องของผลลัพธ์...'
);

await yieldUI();

scan(
'FINALIZING...'
);

await yieldUI();

scanner.style.display='none';

btn.disabled=false;

const all=
copyBlocks.join(
'\n\n'
);

this.lastCopyText=
all;

$('result').innerHTML=`

<div class="summary">

<span>
ประมวลผลสำเร็จ
<strong>
${outputData.length}
</strong>
ประเภท
</span>

<button
class="copy"
id="copyTop"
>
📋 COPY ALL
</button>

</div>

${
parsed.errors.length
?
`
<div class="errorbox">
${parsed.errors
.map(esc)
.join('<br>')}
</div>
`
:
''
}

${cards.join('')}

<button
class="copyall"
id="copyBottom"
>
📋 คัดลอกหวยทั้งหมด
</button>

`;

$('copyTop').onclick=
()=>this.copy(all);

$('copyBottom').onclick=
()=>this.copy(all);

$('copyInput').disabled=
!all;

$('copyInput').onclick=
()=>this.copy(
this.lastCopyText
);

$('result')
.querySelectorAll(
'[data-capture-card]'
)
.forEach(btn=>{

btn.onclick=
()=>this.captureCard(
btn.dataset.captureCard,
btn.dataset.captureName
);

});

$('result').scrollIntoView({

behavior:'smooth',

block:'start'

});

}catch(err){

scanner.style.display='none';

btn.disabled=false;

$('result').innerHTML=
`
<div class="errorbox">

❌ เกิดข้อผิดพลาดระหว่างประมวลผล:

${esc(err?.message||err)}

</div>
`;

}

},

nextDateLabel(records){

if(!records.length)
return'';

const latest=
records[
records.length-1
];

const s=
String(
latest.date||''
)
.trim();

const m=
s.match(
/^(\d{1,2})\s+(\S+)\s+(\d{2,4})$/
);

if(m){

const day=
Number(m[1]);

let year=
Number(m[3]);

if(year<100)
year+=2500;

const months=[
'ม.ค.',
'ก.พ.',
'มี.ค.',
'เม.ย.',
'พ.ค.',
'มิ.ย.',
'ก.ค.',
'ส.ค.',
'ก.ย.',
'ต.ค.',
'พ.ย.',
'ธ.ค.'
];

const monthIndex=
months.indexOf(m[2]);

if(monthIndex>=0){

let d=
new Date(
year-543,
monthIndex,
day
);

d.setDate(
d.getDate()+1
);

return[
String(d.getDate()),
months[d.getMonth()],
String(d.getFullYear()+543)
].join(' ');

}

}

return'งวดถัดไป';

}

};

function login(){

const value=
$('password').value;

if(
sec.ok(value)
){

$('login').classList.remove(
'active'
);

$('console').classList.add(
'active'
);

$('loginErr').style.display=
'none';

}else{

$('loginErr').style.display=
'block';

}

}

$('loginBtn').onclick=
login;

$('password').addEventListener(
'keydown',
e=>{

if(e.key==='Enter')
login();

});

$('run').onclick=
()=>app.calculate();

$('clearInput').onclick=
()=>{

$('bulkInput').value='';

$('result').innerHTML='';

$('scanner').style.display='none';

$('run').disabled=false;

$('copyInput').disabled=true;

app.lastCopyText='';

app.cache=[];

$('bulkInput').focus();

app.show(
'✓ ล้างข้อมูลแล้ว'
);

};

})();
</script>

</body>
   </html>
