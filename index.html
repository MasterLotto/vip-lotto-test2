<script>
(function() {
  const STORAGE_KEY = 'lottery_audit_master_records_v313';
  const canvas = document.getElementById('snow'); const ctx = canvas.getContext('2d');
  let width = canvas.width = innerWidth, height = canvas.height = innerHeight;
  window.addEventListener('resize', () => { width = canvas.width = innerWidth; height = canvas.height = innerHeight; });
  const particles = Array.from({length:28}, () => ({ x:Math.random()*width, y:Math.random()*height, r:.8+Math.random()*1.4, s:.15+Math.random()*.35, a:.12+Math.random()*.25 }));
  (function drawSnow(){ ctx.clearRect(0,0,width,height); particles.forEach(p => { p.y += p.s; if(p.y > height+5){ p.y = -5; p.x = Math.random()*width; } ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle = `rgba(196,152,40,${p.a})`; ctx.fill(); }); requestAnimationFrame(drawSnow); })();

  function $(id){ return document.getElementById(id); } function esc(val){ return String(val || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); } function norm(v){ return (v % 10 + 10) % 10; }
  
  // Smart Card Display Formatter
  function formatDisplayTitle(rawName){
    let name = String(rawName || '').trim();
    name = name.replace(/^สถิติหุ้น\s*/,'').replace(/^สถิติ\s*/,'').replace(/\s*ย้อนหลัง$/,'');

      return name.replace(/([ก-๙a-zA-Z]+)(VIP|พิเศษ|สามัคคี|พัฒนา|ประตูชัย)/g, '$1 $2 ').replace(/\s+/g, ' ').trim();
    }

    const timeStr = timeMatch ? ` ${timeMatch[0]}` : '';
    let mainName = name.replace(/(เช้า|บ่าย|เย็น|ค่ำ|ดึก)/, '').replace(/^หุ้น/, '').trim();
    return `${mainName} ปกติ${timeStr}`.replace(/\s+/g, ' ').trim();
  }

  function getLotteryFlag(name){ const n = String(name || '').toLowerCase(); if(n.includes('นิคเคอิ')||n.includes('ญี่ปุ่น')) return '🇯🇵'; if(n.includes('จีน')) return '🇨🇳'; if(n.includes('ฮั่งเส็ง')||n.includes('ฮ่องกง')) return '🇭🇰'; if(n.includes('ดาวโจนส์')||n.includes('อเมริกา')||n.includes('usa')||n.includes('ดาว')) return '🇺🇸'; if(n.includes('ไต้หวัน')) return '🇹🇼'; if(n.includes('เกาหลี')) return '🇰🇷'; if(n.includes('สิงคโปร์')) return '🇸🇬'; if(n.includes('รัสเซีย')) return '🇷🇺'; if(n.includes('เยอรมัน')) return '🇩🇪'; if(n.includes('อังกฤษ')) return '🇬🇧'; if(n.includes('อินเดีย')) return '🇮🇳'; if(n.includes('อียิปต์')) return '🇪🇬'; if(n.includes('ลาว')) return '🇱🇦'; if(n.includes('ฮานอย')||n.includes('เวียดนาม')) return '🇻🇳'; if(n.includes('ไทย')||n.includes('รัฐบาล')||n.includes('ออมสิน')||n.includes('ธกส')) return '🇹🇭'; if(n.includes('มาเลย์')) return '🇲🇾'; return '🌐'; }
  function parseThaiDate(dateStr){ const months={'ม.ค.':1,'ก.พ.':2,'มี.ค.':3,'เม.ย.':4,'พ.ค.':5,'มิ.ย.':6,'ก.ค.':7,'ส.ค.':8,'ก.ย.':9,'ต.ค.':10,'พ.ย.':11,'ธ.ค.':12}; const cleaned=String(dateStr||'').trim(); const parts=cleaned.split(/\s+/); if(parts.length>=3){ const day=parseInt(parts[0],10)||1, month=months[parts[1]]||1; let year=parseInt(parts[2],10)||2569; if(year<2500) year+=2543; return new Date(year-543,month-1,day).getTime(); } return 0; }
  function getNextDateStr(dateStr){ const cleaned=String(dateStr||'').trim(); const parts=cleaned.split(/\s+/); if(parts.length>=3){ const day=parseInt(parts[0],10)||1, monthsMap={'ม.ค.':0,'ก.พ.':1,'มี.ค.':2,'เม.ย.':3,'พ.ค.':4,'มิ.ย.':5,'ก.ค.':6,'ส.ค.':7,'ก.ย.':8,'ต.ค.':9,'พ.ย.':10,'ธ.ค.':11}; const mIndex=monthsMap[parts[1]]!==undefined?monthsMap[parts[1]]:0, d=new Date((parseInt(parts[2],10)||2569)-543,mIndex,day+1); const thaiMonths=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.']; return `${d.getDate()} ${thaiMonths[d.getMonth()]} ${d.getFullYear()+543}`; } return dateStr; }
  function parseInput(text){ const raw=String(text||'').replace(/\r/g,'').trim(); if(!raw) return {records:[],errors:[]}; const lines=raw.split('\n').map(v=>v.trim()).filter(v=>v!==''); const records=[], errors=[]; let i=0; while(i<lines.length){ const headerLine=lines[i], header=headerLine.match(/^(.+?)\s*\|\s*(.+?)$/); if(!header){ errors.push(`บรรทัดที่ ${i+1}: รูปแบบหัวข้อไม่ถูกต้อง (${headerLine})`); i++; continue; } const name=header[1].trim(), date=header[2].trim(); if(i+2>=lines.length){ errors.push(`${name} | ${date}: ข้อมูลผลรางวัลไม่ครบถ้วน`); break; } const n3=lines[i+1], n2=lines[i+2]; if(!/^\d{3}$/.test(n3)||!/^\d{2}$/.test(n2)){ errors.push(`${name} | ${date}: เลข 3 ตัวบน (${n3}) หรือ 2 ตัวล่าง (${n2}) ไม่ถูกต้องตามรูปแบบตัวเลข`); i+=3; continue; } records.push({ name, date, n3, n2, timestamp:parseThaiDate(date) }); i+=3; } return { records, errors }; }

  // 15 สูตรคำนวณต้นฉบับ 100% (Pure Raw Formulas)
  const formulas = {
    "อันดับ 1 — สูตร 2 N1": (A,B,C,D,E) => [norm(-2*A - 2*B + C + D - 2*E + 9), norm(-2*B + C + 3)],
    "N2 — สูตรใหม่": (A,B,C,D,E) => [norm(-A + B - C + 2*D + E + 4), norm(A - 2*C - 2*E + 7)],

    "N4 — สูตรหลัก": (A,B,C,D,E) => [norm(-2*A - B - C - 2*D - 2*E + 5), norm(-2*A + B + 2*C - 2*D + E + 9)],
    "N5 — สูตรคำนวณเด่น": (A,B,C,D,E) => [norm(-2*A - 2*B - C - D - 2*E + 7), norm(-A + B + 2*C - 2*D + E + 6)],
    "N6 — Master Formula": (A,B,C,D,E) => [norm(-A - 2*B + C - E + 1), norm(A - C - D - 2*E)],
    "N1+ — สูตรเสริม": (A,B,C,D,E) => [norm(2*A - 3*C - D - 2*E + 8), norm(-3*A - 2*C - D + E + 2)],
    "N1+ V2 — สูตรเสริมตัวที่ 2": (A,B,C,D,E) => [norm(A + 3*B + C + 3*D + 3*E + 6), norm(-A - B - C + D - 3*E + 1)],
    "Hybrid — สิบบบน + หน่วยล่าง + 2": (A,B,C,D,E) => { const d1 = norm(B + E + 2); return [d1, norm(d1 + 2)]; },
    "สูตร 1 — สิบบบน + สิบล่าง": (A,B,C,D,E) => { const d1 = norm(B + D); return [d1, norm(d1 + 1)]; },
    "สูตร 2 — ผลรวม 3 ตัวบน": (A,B,C,D,E) => { const d1 = norm(A + B + C); return [d1, norm(d1 + 1)]; },
    "สูตร 3 — ร้อยบน + สิบล่าง": (A,B,C,D,E) => { const d1 = norm(A + D); return [d1, norm(d1 + 1)]; },
    "สูตร 4 — หน่วยบน + หน่วยล่าง": (A,B,C,D,E) => { const d1 = norm(C + E); return [d1, norm(d1 + 1)]; },
    "สูตร 5 — ฐาน 10 - หน่วยล่าง": (A,B,C,D,E) => { const d1 = norm(10 - E); return [d1, norm(d1 + 1)]; },
    "สูตร 6 — ร้อยบน + สิบล่าง": (A,B,C,D,E) => { const d1 = norm(A + D); return [d1, norm(d1 + 1)]; }
  };

  function sanitizeFormulaResult(rawRes){ let d1=norm(rawRes[0]), d2=norm(rawRes[1]); if(d1===d2) d2=norm(d2+1); return [d1,d2]; }
  function checkHitDetail(predictedDigits, actualN3, actualN2){ const topDigits=actualN3.split('').map(Number), bottomDigits=actualN2.split('').map(Number), hundredsDigit=topDigits[0], tensAndUnits=topDigits.slice(1); let hitAny=false, hitHundredsOnly=false, matchedInValidPos=false; predictedDigits.forEach(d => { const inBottom=bottomDigits.includes(d), inTensOrUnits=tensAndUnits.includes(d), inHundreds=(hundredsDigit===d); if(inBottom||inTensOrUnits){ hitAny=true; matchedInValidPos=true; } else if(inHundreds && !inBottom && !inTensOrUnits){ hitHundredsOnly=true; } }); if(!matchedInValidPos && hitHundredsOnly) hitAny=false; return { hitAny, hitHundredsOnly }; }
  function showToast(msg){ const toast=$('toast'); if(msg) toast.textContent=msg; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),1500); }
  function updateIndicator(){ try{ const stored=localStorage.getItem(STORAGE_KEY); $('recordCountIndicator').textContent = stored ? `สะสมในระบบ: ${JSON.parse(stored).length} งวด` : `สะสมในระบบ: 0 งวด`; }catch(e){ $('recordCountIndicator').textContent=`สะสมในระบบ: 0 งวด`; } }

  window.copyCardText = function(cardId, lotteryTitle, dateStr, d1Pairs, d2Pairs){ const allPairs=[...d1Pairs, ...d2Pairs].map(p=>p.pair).join(', '); navigator.clipboard.writeText(`🎯 ${lotteryTitle} (${dateStr}) | บ้านกองเงิน\nชุดเจาะเน้น: ${allPairs}`).then(()=>showToast(`✓ คัดลอกเลขเด่น ${lotteryTitle} เรียบร้อย`)).catch(()=>showToast('❌ คัดลอกไม่สำเร็จ')); };
  window.captureCardImage = function(cardId, lotteryTitle){ const cardEl=$(cardId); if(!cardEl) return; showToast('📸 กำลังประมวลผลจับภาพการ์ด...'); const btnGroup=cardEl.querySelector('.card-btn-group'); if(btnGroup) btnGroup.style.display='none'; html2canvas(cardEl, { scale:2, backgroundColor:'#ffffff' }).then(canvas=>{ if(btnGroup) btnGroup.style.display='flex'; const link=document.createElement('a'); link.download=`BanKongNgern_${lotteryTitle.replace(/\s+/g,'_')}.png`; link.href=canvas.toDataURL('image/png'); link.click(); showToast('✓ บันทึกภาพการ์ดสำเร็จ'); }).catch(err=>{ if(btnGroup) btnGroup.style.display='flex'; console.error(err); showToast('❌ ไม่สามารถจับภาพได้'); }); };

  function renderFullUI(globalAuditMap, auditDataMap, predictionDataMap){
    let html = '';
    const sortedGlobalFormulas = Object.keys(globalAuditMap).sort((a,b)=>globalAuditMap[b].hitRate - globalAuditMap[a].hitRate);

    // Section 0
    html += `<div class="section-title">🌐 0. ตารางออดิตสะสมรวมทุกหวย & จัดอันดับความแม่นยำ (Ranking 1, 2, 3...)</div><div class="summary-table-container"><h3 style="color:#78590f; font-size:.78rem; margin:0 0 8px;">ภาพรวมความแม่นยำของทุกสูตร (ค่าดิบแท้ 100% ไม่ปรับ Offset)</h3><table class="audit-table"><thead><tr><th>อันดับ (Rank)</th><th>ชื่อสูตร</th><th>เลขเด่นงวดล่าสุด (ค่าดิบ)</th><th>งวดทดสอบรวม</th><th>เข้า / หลุด</th><th>ออกหลักร้อยเดี่ยว</th><th>Hit Rate (%)</th><th>สถานะภาพรวม</th></tr></thead><tbody>`;
    sortedGlobalFormulas.forEach((fName, index) => {
      const g = globalAuditMap[fName], rank = index + 1;
      let rankBadge = rank===1?'<span class="badge-rank-1">🥇 อันดับ 1 (ทอง)</span>':rank===2?'<span class="badge-rank-2">🥈 อันดับ 2 (เงิน)</span>':rank===3?'<span class="badge-rank-3">🥉 อันดับ 3 (ทองแดง)</span>':`<span class="badge-rank-other">อันดับ ${rank}</span>`;
      const latestDigitsText = g.latestDigits ? `<b style="color:#78590f; font-size:.55rem; background:#fff8e7; padding:2px 8px; border:1px solid #d4af37; border-radius:6px;">${g.latestDigits[0]}-${g.latestDigits[1]}</b>` : `-`;
      html += `<tr><td>${rankBadge}</td><td style="font-weight:bold; text-align:left;">${esc(fName)}</td><td>${latestDigitsText}</td><td>${g.totalTested}</td><td><span style="color:#2e7d32; font-weight:bold;">${g.hits}</span> / <span style="color:#c62828;">${g.misses}</span></td><td style="color:#ef6c00; font-weight:bold;">${g.hundredsOnlyCount || 0} งวด</td><td style="font-weight:bold; color:${g.hitRate>=50?'#2e7d32':'#c62828'};">${g.hitRate}%</td><td>${g.hitRate>=60?'<span class="badge-status status-hot">ยอดเยี่ยม</span>':'<span class="badge-status status-cooling">ปานกลาง</span>'}</td></tr>`;
    });
    html += `</tbody></table></div>`;

    // Section 1
    html += `<div class="section-title">📊 1. ส่วนตารางออดิตย้อนหลังรายหวย & จัดอันดับ Ranking 1-3 ตามเปอร์เซ็นต์</div>`;
    Object.keys(auditDataMap).forEach(lotteryName => {
      const formulasResult = auditDataMap[lotteryName];
      const sortedFormulas = Object.keys(formulasResult).sort((a,b)=>formulasResult[b].hitRate - formulasResult[a].hitRate);
      html += `<div class="summary-table-container"><h3 style="color:#78590f; font-size:.78rem; margin:0 0 8px;">หวย: ${esc(lotteryName)} (ค่าดิบตามสูตรต้นฉบับ 100%)</h3><table class="audit-table"><thead><tr><th>อันดับ (Rank)</th><th>ชื่อสูตร</th><th>เลขเด่นงวดล่าสุด (ค่าดิบ)</th><th>งวดทดสอบ</th><th>เข้า / หลุด</th><th>ออกหลักร้อยเดี่ยว</th><th>Hit Rate (%)</th><th>สถานะงวดล่าสุด</th><th>เข้า/หลุดติดต่อกัน</th></tr></thead><tbody>`;
      sortedFormulas.forEach((fName, index) => {
        const f = formulasResult[fName], rank = index + 1;
        let rankBadge = rank===1?'<span class="badge-rank-1">🥇 อันดับ 1 (ทอง)</span>':rank===2?'<span class="badge-rank-2">🥈 อันดับ 2 (เงิน)</span>':rank===3?'<span class="badge-rank-3">🥉 อันดับ 3 (ทองแดง)</span>':`<span class="badge-rank-other">อันดับ ${rank}</span>`;
        const latestDigitsText = f.latestDigits ? `<b style="color:#78590f; font-size:.55rem; background:#fff8e7; padding:2px 8px; border:1px solid #d4af37; border-radius:6px;">${f.latestDigits[0]}-${f.latestDigits[1]}</b>` : `-`;
        let badgeHTML = f.lastHit===false ? (f.hitHundredsOnly?'<span class="badge-status status-warning">⚠️ หลุด (ออกหลักร้อย)</span>':f.curMissStreak>=2?`<span class="badge-status status-danger">🔴 หลุด ${f.curMissStreak} งวดติด</span>`:'<span class="badge-status status-cooling">🟡 หลุด 1 งวด</span>') : '<span class="badge-status status-hot">🟢 เข้า</span>';
        html += `<tr><td>${rankBadge}</td><td style="font-weight:bold; text-align:left;">${esc(fName)}</td><td>${latestDigitsText}</td><td>${f.totalTested}</td><td style="font-weight:bold;"><span style="color:#2e7d32;">${f.hits}</span> / <span style="color:#c62828;">${f.misses}</span></td><td style="color:#ef6c00; font-weight:bold;">${f.hundredsOnlyCount || 0} งวด</td><td style="font-weight:bold; color:${f.hitRate>=50?'#2e7d32':'#c62828'};">${f.hitRate}%</td><td>${badgeHTML}</td><td><span style="color:#2e7d32;">${f.curStreak} ติด</span> / <span style="color:#c62828;">${f.curMissStreak} หลุด</span></td></tr>`;
      });
      html += `</tbody></table></div>`;
    });

    // Section 2: การ์ดคำนวณแบบ Luxury Look
    html += `<div class="section-title">🎯 2. ส่วนคำนวณเลขเด่นงวดถัดไป (บ้านกองเงิน V31.3 Luxury Edition)</div>`;
    let cardIdx = 0;
    Object.keys(predictionDataMap).forEach(lotteryName => {
      const p = predictionDataMap[lotteryName], flagIcon = getLotteryFlag(lotteryName), cId = `card_${cardIdx++}`;
      const displayTitle = formatDisplayTitle(lotteryName);
      const jsonD1 = JSON.stringify(p.d1Pairs).replace(/"/g, '&quot;'), jsonD2 = JSON.stringify(p.d2Pairs).replace(/"/g, '&quot;');

      html += `
        <div class="prediction-card" id="${cId}">
          <div class="card-btn-group">
            <button class="card-action-btn" onclick="copyCardText('${cId}', '${esc(displayTitle)}', '${esc(p.nextDate)}', ${jsonD1}, ${jsonD2})">📋 คัดลอก</button>
            <button class="card-action-btn" onclick="captureCardImage('${cId}', '${esc(displayTitle)}')">📸 แคปภาพ</button>
          </div>
          <div class="card-header">
            <div class="card-title-group">
              <div class="card-flag">${flagIcon}</div>
              <div class="card-info"><b>${esc(displayTitle)}</b><small>${esc(p.nextDate)}</small></div>
            </div>
            <div class="card-brand-tag">✦ บ้านกองเงิน ✦</div>
          </div>
          <div class="pair-row">
            <div class="digit-box ${p.d1IsGold ? 'digit-box-gold' : 'digit-box-silver'}">${p.d1}</div>
            <div class="pairs-container">
              ${p.d1Pairs.map(item => `<div class="pair-item ${item.rankClass}">${item.pair}</div>`).join('')}
            </div>
          </div>
          <div class="pair-row">
            <div class="digit-box ${p.d2IsGold ? 'digit-box-gold' : 'digit-box-silver'}">${p.d2}</div>
            <div class="pairs-container">
              ${p.d2Pairs.map(item => `<div class="pair-item ${item.rankClass}">${item.pair}</div>`).join('')}
            </div>
          </div>
        </div>
      `;
    });

    html += `<div class="brand-footer"><span class="brand-star">✦</span><span>ระบบบ้านกองเงิน V31.3 Pure Raw Calculation (ไม่ปรับแต่ง Offset) สมบูรณ์แบบ 100%</span><span class="brand-star">✦</span></div>`;
    $('result').innerHTML = html;
    updateIndicator();
  }

  function runEngine(){
    const textVal = $('bulkInput').value.trim(); let newRecords = [];
    if(textVal){
      const parsed = parseInput(textVal);
      if(parsed.errors.length > 0 && parsed.records.length === 0){
        $('result').innerHTML = `<div class="errorbox"><b>ไม่สามารถประมวลผลได้เนื่องจากรูปแบบข้อมูลไม่ถูกต้อง:</b><br>${parsed.errors.join('<br>')}</div>`;
        return;
      }
      newRecords = parsed.records;
    }

    let masterRecords = [];
    try { const stored = localStorage.getItem(STORAGE_KEY); if(stored) masterRecords = JSON.parse(stored); } catch(e) {}
    if(newRecords.length > 0){
      newRecords.forEach(nr => {
        const idx = masterRecords.findIndex(r => r.name === nr.name && r.date === nr.date);
        if(idx >= 0) masterRecords[idx] = nr; else masterRecords.push(nr);
      });
    }
    masterRecords.sort((a,b) => (a.timestamp||0) - (b.timestamp||0));
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(masterRecords)); } catch(e) {}

    if(masterRecords.length === 0){
      $('result').innerHTML = '<div class="errorbox">ยังไม่มีข้อมูลในระบบ กรุณากรอกข้อมูลสถิติย้อนหลังในกล่องข้อความด้านบน</div>';
      return;
    }

    const groups = {}; masterRecords.forEach(r => { if(!groups[r.name]) groups[r.name] = []; groups[r.name].push(r); });
    const auditDataMap = {}, predictionDataMap = {}, globalAccumulator = {};
    Object.keys(formulas).forEach(fName => { globalAccumulator[fName] = { totalTested:0, hits:0, misses:0, hundredsOnlyCount:0, latestDigits:null }; });

    Object.keys(groups).forEach(lotteryName => {
      const recs = groups[lotteryName]; if(recs.length < 2) return;
      auditDataMap[lotteryName] = {}; const formulaNames = Object.keys(formulas);
      const latestRec = recs[recs.length - 1], lTop = latestRec.n3.split('').map(Number), lBot = latestRec.n2.split('').map(Number);

      formulaNames.forEach(fName => {
        let hits=0, misses=0, hundredsOnlyCount=0, currentStreak=0, maxStreak=0, currentMissStreak=0, maxMissStreak=0, totalTested=0, lastHitResult=true, lastHitHundredsOnly=false;
        for(let i=0; i<recs.length-1; i++){
          const curr=recs[i], next=recs[i+1], top=curr.n3.split('').map(Number), bot=curr.n2.split('').map(Number);
          const rawPred = formulas[fName](top[0], top[1], top[2], bot[0], bot[1]), predicted = sanitizeFormulaResult(rawPred);
          const check = checkHitDetail(predicted, next.n3, next.n2);
          totalTested++; if(check.hitHundredsOnly) hundredsOnlyCount++;
          if(check.hitAny){ hits++; currentStreak++; currentMissStreak=0; lastHitResult=true; lastHitHundredsOnly=false; if(currentStreak>maxStreak) maxStreak=currentStreak; }
          else{ misses++; currentMissStreak++; currentStreak=0; lastHitResult=false; lastHitHundredsOnly=check.hitHundredsOnly; if(currentMissStreak>maxMissStreak) maxMissStreak=currentMissStreak; }
        }
        const rawLatestPred = formulas[fName](lTop[0], lTop[1], lTop[2], lBot[0], lBot[1]), latestDigits = sanitizeFormulaResult(rawLatestPred);
        globalAccumulator[fName].totalTested += totalTested; globalAccumulator[fName].hits += hits; globalAccumulator[fName].misses += misses; globalAccumulator[fName].hundredsOnlyCount += hundredsOnlyCount; globalAccumulator[fName].latestDigits = latestDigits;
        auditDataMap[lotteryName][fName] = { totalTested, hits, misses, hundredsOnlyCount, hitRate: totalTested>0 ? Number(((hits/totalTested)*100).toFixed(2)) : 0, maxStreak, maxMissStreak, curStreak:currentStreak, curMissStreak:currentMissStreak, lastHit:lastHitResult, hitHundredsOnly:lastHitHundredsOnly, latestDigits };
      });

      const sortedFormulasForThisLottery = Object.keys(formulas).sort((a,b) => auditDataMap[lotteryName][b].hitRate - auditDataMap[lotteryName][a].hitRate);
      const rank1FormulaName = sortedFormulasForThisLottery[0];
      const rank1Digits = auditDataMap[lotteryName][rank1FormulaName].latestDigits;
      let rawD1 = rank1Digits[0], rawD2 = rank1Digits[1];
      if(rawD1 === rawD2) rawD2 = norm(rawD1 + 1);

      const digitScore = (digit) => {
        let score = 0;
        formulaNames.forEach(f => {
          const res = auditDataMap[lotteryName][f].latestDigits;
          if(res && res.includes(digit)) score += (auditDataMap[lotteryName][f].hitRate || 1);
        });
        return score;
      };
      const score1 = digitScore(rawD1), score2 = digitScore(rawD2);
      let d1 = rawD1, d2 = rawD2, d1IsGold = true, d2IsGold = false;
      if(score2 > score1){
        d1 = rawD2; d2 = rawD1; d1IsGold = true; d2IsGold = false;
      }

      const hundredsDigit = lTop[0];
      const anchor = Math.abs(7 - hundredsDigit) % 10;
      const normalRange = [-2, -1, 0, 1, 2].map(off => norm(anchor + off));
      const isCollided = normalRange.some(num => [d1, d2].includes(num));
      const offsets = isCollided ? [-3, -2, -1, 0, 1, 2, 3] : [-2, -1, 0, 1, 2];
      const poolDigits = offsets.map(off => norm(anchor + off));

      const generatePairsForDigit = (mainDigit, otherDigit) => {
        let validUnits = poolDigits.filter(u => u !== mainDigit && u !== otherDigit);
        validUnits = Array.from(new Set(validUnits));
        if(validUnits.length < 5){
          for(let d=0; d<=9; d++){
            if(d !== mainDigit && d !== otherDigit && !validUnits.includes(d)){
              validUnits.push(d); if(validUnits.length === 5) break;
            }
          }
        }
        const selectedUnits = validUnits.slice(0, 5);

        const scoredPairs = selectedUnits.map(unit => {
          const pairStr = `${mainDigit}${unit}`;
          const pairVal = parseInt(pairStr, 10);
          let pairScore = 0;
          formulaNames.forEach(fName => {
            const digits = auditDataMap[lotteryName][fName].latestDigits;
            if(digits && (digits.includes(mainDigit) || digits.includes(unit))){
              pairScore += (auditDataMap[lotteryName][fName].hitRate || 1);
            }
          });
          if(Math.abs(unit - anchor) <= 1) pairScore += 15;
          return { pair: pairStr, val: pairVal, score: pairScore };
        });

        const sortedByScore = [...scoredPairs].sort((a,b) => b.score - a.score);
        const rank1Pair = sortedByScore[0] ? sortedByScore[0].pair : null;
        const rank2Pair = sortedByScore[1] ? sortedByScore[1].pair : null;
        const rank3Pair = sortedByScore[2] ? sortedByScore[2].pair : null;

        scoredPairs.sort((a,b) => a.val - b.val);

        return scoredPairs.map(item => {
          let rankClass = 'pair-rank-normal';
          if(item.pair === rank1Pair) rankClass = 'pair-rank-gold';
          else if(item.pair === rank2Pair) rankClass = 'pair-rank-silver';
          else if(item.pair === rank3Pair) rankClass = 'pair-rank-rosegold';
          return { pair: item.pair, val: item.val, rankClass };
        });
      };

      const d1Pairs = generatePairsForDigit(d1, d2);
      const d2Pairs = generatePairsForDigit(d2, d1);

      predictionDataMap[lotteryName] = {
        nextDate: getNextDateStr(latestRec.date),
        d1, d2, d1IsGold, d2IsGold, d1Pairs, d2Pairs
      };
    });

    const globalAuditMap = {};
    Object.keys(globalAccumulator).forEach(fName => {
      const g = globalAccumulator[fName];
      globalAuditMap[fName] = { totalTested:g.totalTested, hits:g.hits, misses:g.misses, hundredsOnlyCount:g.hundredsOnlyCount, hitRate: g.totalTested>0 ? Number(((g.hits/g.totalTested)*100).toFixed(2)) : 0, latestDigits:g.latestDigits };
    });

    renderFullUI(globalAuditMap, auditDataMap, predictionDataMap);
    showToast('✓ ประมวลผลระบบ V31.3 (Luxury) สำเร็จ');
  }

  window.addEventListener('DOMContentLoaded', () => {
    if($('run')) $('run').onclick = runEngine;
    if($('clearInput')) $('clearInput').onclick = () => { $('bulkInput').value = ''; showToast('✓ ล้างกล่องกรอกข้อมูลแล้ว'); };
    if($('clearGlobal')) $('clearGlobal').onclick = () => {
      if(confirm('ต้องการล้างข้อมูลสะสมทั้งหมดในระบบจริงหรือไม่?')){
        try { localStorage.removeItem(STORAGE_KEY); localStorage.removeItem('lottery_audit_master_records_v312'); } catch(e){}
        $('result').innerHTML = ''; updateIndicator(); showToast('✓ ล้างข้อมูลสะสมทั้งหมดเรียบร้อย');
      }
    };
    updateIndicator();
    try { const stored = localStorage.getItem(STORAGE_KEY); if(stored && JSON.parse(stored).length > 0) runEngine(); } catch(e){}
  });
})();
</script>
