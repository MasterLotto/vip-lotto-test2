<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#F4FBF7">
<title>Enterprise Quant Platform — Smart Batch Processing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--white:#FFF;--bg:#EEF8F3;--bg2:#F5FBF7;--surface:#FFF;--surface2:#EAF6F0;--surface3:#D3EFE2;--navy:#081B14;--navy-2:#0F2A20;--emerald:#0A6647;--emerald-2:#0D7A55;--emerald-light:#E1F8ED;--red:#BE123C;--text:#051912;--muted:#47685B;--shadow2:0 8px 24px rgba(10,102,71,.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;overflow-x:hidden;color:var(--text);font-family:'Prompt',sans-serif;background:radial-gradient(circle at 15% 5%,rgba(16,185,129,.28),transparent 45%),linear-gradient(135deg,#FFF,#F0FAF5 60%,#E2F2EC)}
button,input,textarea{font-family:'Prompt',sans-serif}
.app-shell{width:100%;max-width:600px;min-height:100vh;margin:0 auto;padding:12px;position:relative;z-index:2}
.app-card{position:relative;overflow:hidden;border:1px solid #A8D5C2;border-radius:24px;background:rgba(255,255,255,.94);box-shadow:0 25px 60px rgba(10,102,71,.14);backdrop-filter:blur(24px);padding:16px}
.top-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.brand-name{font-size:.9rem;font-weight:800;color:var(--text)}
.system-pill{padding:5px 11px;border-radius:99px;color:var(--emerald);background:var(--emerald-light);border:1px solid rgba(10,102,71,.25);font-size:.6rem;font-weight:800}
.command-center{padding:14px;border-radius:18px;background:#fff;border:1px solid #A8D5C2;box-shadow:var(--shadow2);margin-bottom:14px}
.command-title{font-size:.9rem;font-weight:800;margin-bottom:6px}
textarea.paste-box{width:100%;height:150px;padding:12px;border-radius:12px;border:1px solid #A8D5C2;background:var(--bg2);font-family:'IBM Plex Mono',monospace;font-size:.9rem;color:var(--text);resize:vertical;outline:none;margin-bottom:10px}
textarea.paste-box:focus{background:#fff;border-color:var(--emerald)}
.action-row{display:grid;grid-template-columns:1fr 85px;gap:7px}
.calculate-btn{height:44px;border:0;border-radius:12px;color:#fff;cursor:pointer;background:linear-gradient(135deg,#0A6647,#0D7A55);font-size:.75rem;font-weight:800}
.clear-btn{height:44px;border-radius:12px;color:var(--muted);background:var(--bg2);border:1px solid #A8D5C2;font-size:.65rem;font-weight:700;cursor:pointer}
.batch-summary{background:var(--surface2);border:1px solid #A8D5C2;border-radius:14px;padding:12px;margin-bottom:10px}
.batch-total{font-size:1.05rem;font-weight:800;color:var(--emerald);margin-bottom:8px}
.lotto-card{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;border:1px solid #B5DBCB}
.lotto-head{font-size:.85rem;font-weight:800;color:var(--navy);margin-bottom:6px;border-bottom:1px dashed #B5DBCB;padding-bottom:4px}
.lotto-row{display:flex;justify-content:space-between;font-size:.8rem;font-family:'IBM Plex Mono',monospace;margin-top:3px}
.lotto-label{color:var(--muted);font-weight:600}
.lotto-val{color:var(--emerald);font-weight:700}
.disclaimer{padding:10px;border-radius:12px;color:var(--muted);background:var(--bg2);border:1px solid #A8D5C2;text-align:center;font-size:.55rem}
</style>
</head>
<body>

<div class="app-shell">
  <div class="app-card">
    <div class="top-nav">
      <div class="brand-name">Enterprise Quant — Multi Batch</div>
      <div class="system-pill">SYSTEM READY</div>
    </div>

    <section class="command-center">
      <div class="command-title">คัดลอกและวางข้อความ (ได้หลายหวยพร้อมกัน)</div>
      <textarea id="pasteBox" class="paste-box" placeholder="วางข้อความที่นี่...
ตัวอย่าง:
ลาวเช้า | 23 ส.ค. 69
351
36

ฮานอย VIP
892
14=100x100"></textarea>
      
      <div class="action-row">
        <button class="calculate-btn" onclick="processBatch()">⚡ ประมวลผลและแยกแยะรายการ</button>
        <button class="clear-btn" onclick="clearInput()">ล้าง / CLEAR</button>
      </div>
    </section>

    <div id="resultOutput"></div>

    <div class="disclaimer">
      <strong>รองรับทั้งแบบ:</strong> เลขอย่างเดียว (แยก 3 ตัวบน/2 ตัวล่าง) และแบบพร้อมราคา (= / - / x)
    </div>
  </div>
</div>

<script>
function processBatch() {
    const rawText = document.getElementById('pasteBox').value.trim();
    if (!rawText) {
        alert("กรุณาวางข้อความก่อนทำการประมวลผลครับ");
        return;
    }

    const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    let results = [];
    let currentGroup = null;
    let grandTotal = 0;

    lines.forEach(line => {
        // รูปแบบมีราคา เช่น 123=100x100 หรือ 123-50
        const priceMatch = line.match(/^(\d{2,3})\s*[\=\-]\s*(\d+)(?:\s*x\s*(\d+))?/i);
        // รูปแบบเลขอย่างเดียว เช่น 351 หรือ 36
        const numOnlyMatch = line.match(/^(\d{2,3})$/);

        if (priceMatch) {
            let num = priceMatch[1];
            let v1 = parseInt(priceMatch[2]) || 0;
            let v2 = parseInt(priceMatch[3]) || 0;
            let sum = v1 + v2;
            grandTotal += sum;

            if (!currentGroup) {
                currentGroup = { title: "รายการทั่วไป", items: [] };
                results.push(currentGroup);
            }
            currentGroup.items.push({
                label: num.length === 3 ? "3 ตัวบน" : "2 ตัวล่าง",
                val: `${num} (${v1}${v2 ? 'x'+v2 : ''} = ${sum.toLocaleString()} บ.)`
            });
        } 
        else if (numOnlyMatch) {
            let num = numOnlyMatch[1];
            if (!currentGroup) {
                currentGroup = { title: "รายการทั่วไป", items: [] };
                results.push(currentGroup);
            }
            currentGroup.items.push({
                label: num.length === 3 ? "3 ตัวบน" : "2 ตัวล่าง",
                val: num
            });
        } 
        else {
            // ถ้าบรรทัดไม่ใช่ตัวเลข ให้ถือว่าเป็น "ชื่อหวย / หัวข้อ"
            currentGroup = { title: line, items: [] };
            results.push(currentGroup);
        }
    });

    displayResult(results, grandTotal);
}

function displayResult(results, grandTotal) {
    const out = document.getElementById('resultOutput');
    if (results.length === 0) {
        out.innerHTML = `<div class="batch-summary"><b style="color:var(--red);">ไม่พบข้อมูลตัวเลข กรุณาตรวจสอบข้อความ</b></div>`;
        return;
    }

    let html = `<div class="batch-summary">`;
    if (grandTotal > 0) {
        html += `<div class="batch-total">💰 ยอดเงินคำนวณรวม: ${grandTotal.toLocaleString()} บาท</div>`;
    } else {
        html += `<div class="batch-total">📋 แยกแยะข้อมูลผลรางวัลเรียบร้อย</div>`;
    }

    results.forEach(group => {
        if (group.items.length > 0) {
            html += `<div class="lotto-card">`;
            html += `<div class="lotto-head">📌 ${group.title}</div>`;
            group.items.forEach(item => {
                html += `<div class="lotto-row">`;
                html += `<span class="lotto-label">${item.label}:</span>`;
                html += `<span class="lotto-val">${item.val}</span>`;
                html += `</div>`;
            });
            html += `</div>`;
        }
    });

    html += `</div>`;
    out.innerHTML = html;
}

function clearInput() {
    document.getElementById('pasteBox').value = "";
    document.getElementById('resultOutput').innerHTML = "";
}
</script>
</body>
</html>
