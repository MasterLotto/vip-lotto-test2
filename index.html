<script>

(() => {

  "use strict";


  /* =========================================================
     PREMIUM BACKGROUND PARTICLES
  ========================================================= */

  const canvas =
    document.getElementById("snow");

  const ctx =
    canvas.getContext("2d");


  let width =
    canvas.width =
      window.innerWidth;

  let height =
    canvas.height =
      window.innerHeight;


  window.addEventListener(
    "resize",
    () => {

      width =
        canvas.width =
          window.innerWidth;

      height =
        canvas.height =
          window.innerHeight;

    }
  );


  const particles =
    Array.from(
      { length:34 },
      () => ({
        x:Math.random() * width,
        y:Math.random() * height,
        r:.45 + Math.random() * 1.25,
        s:.08 + Math.random() * .26,
        a:.08 + Math.random() * .18,
        p:Math.random() * Math.PI * 2,
        gold:Math.random() > .28
      })
    );


  function drawParticles(){

    ctx.clearRect(
      0,
      0,
      width,
      height
    );


    particles.forEach(p => {

      p.p += .006;

      p.y += p.s;

      p.x +=
        Math.sin(p.p) * .08;


      if(
        p.y >
        height + 4
      ){

        p.y = -4;

        p.x =
          Math.random() * width;

      }


      ctx.beginPath();


      ctx.arc(
        p.x,
        p.y,
        p.r,
        0,
        Math.PI * 2
      );


      ctx.fillStyle =
        p.gold
          ? `rgba(215,182,107,${p.a})`
          : `rgba(255,255,255,${p.a * .45})`;


      ctx.fill();

    });


    requestAnimationFrame(
      drawParticles
    );

  }


  drawParticles();


  /* =========================================================
     HELPERS
  ========================================================= */

  const $ =
    id =>
      document.getElementById(id);


  const esc =
    value =>
      String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(

        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );


  /* =========================================================
     APPLICATION
  ========================================================= */

  const app = {

    lastCopyText:"",
    toastTimer:null,


    norm(value){

      return (
        (value % 10) + 10
      ) % 10;

    },


    /* =======================================================
       FLAG
    ======================================================= */

    flag(name){

      const n =

      if(

      )
        return "🇨🇳";


      if(
        /ฮั่งเส็ง|hang seng|hong kong|ฮ่องกง/.test(n)
      )
        return "🇭🇰";


      if(
        /นิเคอิ|นิคเคอิ|นิกเคอิ|nikkei|ญี่ปุ่น|japan/.test(n)
      )
        return "🇯🇵";


      if(
        /เกาหลี|korea|kospi/.test(n)
      )
        return "🇰🇷";


      if(
        /สิงคโปร์|singapore/.test(n)
      )
        return "🇸🇬";


      if(
        /อินเดีย|india|sensex/.test(n)
      )
        return "🇮🇳";


      if(
        /รัสเซีย|russia|moscow/.test(n)
      )
        return "🇷🇺";


      if(
        /เยอรมัน|germany|dax/.test(n)
      )
        return "🇩🇪";


      if(
        /อังกฤษ|uk|ftse|london/.test(n)
      )
        return "🇬🇧";


      if(
        /อียิปต์|egypt/.test(n)
      )
        return "🇪🇬";


      if(
        /ไต้หวัน|taiwan|tse/.test(n)
      )
        return "🇹🇼";


      if(
        /สหรัฐ|usa|america|dow|nasdaq|s&p/.test(n)
      )
        return "🇺🇸";


      if(
        /ฝรั่งเศส|france|cac/.test(n)
      )
        return "🇫🇷";


      if(
        /ออสเตรเลีย|australia|asx/.test(n)
      )
        return "🇦🇺";


      if(
        /แคนาดา|canada/.test(n)
      )
        return "🇨🇦";


      if(
        /หุ้นไทย|ไทย|thai|set|หุ้น/.test(n)
      )
        return "🇹🇭";


      return "🌐";

    },


    /* =======================================================
       DATE PARSER
    ======================================================= */

    parseDateValue(date){

      const value =
        String(date || "").trim();


      if(!value)
        return false;


      if(
        /^\d{1,2}\s+\S+\s+\d{2,4}$/
          .test(value)
      )
        return true;


      if(
        /^\d{1,2}\/\d{1,2}\/\d{2,4}$/
          .test(value)
      )
        return true;


      if(
        /^\d{1,2}-\d{1,2}-\d{2,4}$/
          .test(value)
      )
        return true;


      return false;

    },


    dateKey(date){

      const value =
        String(date || "").trim();


      const thai =
        value.match(
          /^(\d{1,2})\s+(\S+)\s+(\d{2,4})$/
        );


      if(thai){

        const months = {

          "ม.ค.":1,
          "ก.พ.":2,
          "มี.ค.":3,
          "เม.ย.":4,
          "พ.ค.":5,
          "มิ.ย.":6,
          "ก.ค.":7,
          "ส.ค.":8,
          "ก.ย.":9,
          "ต.ค.":10,
          "พ.ย.":11,
          "ธ.ค.":12

        };


        const month =
          months[thai[2]] || 0;


        let year =
          Number(thai[3]);


        if(year < 100)
          year += 2500;


        return [

          year,

          String(month)
            .padStart(2,"0"),

          String(
            Number(thai[1])
          ).padStart(2,"0")

        ].join("-");

      }


      const numeric =
        value.match(
          /^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/
        );


      if(numeric){

        let year =
          Number(numeric[3]);


        if(year < 100)
          year += 2500;


        return [

          year,

          String(
            Number(numeric[2])
          ).padStart(2,"0"),

          String(
            Number(numeric[1])
          ).padStart(2,"0")

        ].join("-");

      }


      return value;

    },


    sortChronological(records){

      return records

        .map(
          (record,index) => ({
            ...record,
            __index:index
          })
        )

        .sort(
          (a,b) => {

            const ka =
              this.dateKey(a.date);

            const kb =
              this.dateKey(b.date);


            if(ka < kb)
              return -1;


            if(ka > kb)
              return 1;


            return (
              a.__index -
              b.__index
            );

          }
        )

        .map(record => {

          const clean = {
            ...record
          };


          delete clean.__index;


          return clean;

        });

    },


    /* =======================================================
       INPUT PARSER
    ======================================================= */

    parse(text){

      const raw =
        String(text || "")
          .replace(/\r/g,"")
          .trim();


      if(!raw){

        return {

          records:[],

          errors:[
            "ยังไม่มีข้อมูลสำหรับประมวลผล"
          ]

        };

      }


      const lines =
        raw
          .split("\n")
          .map(v => v.trim());


      const records = [];
      const errors = [];


      let i = 0;


      while(
        i < lines.length
      ){

        if(!lines[i]){

          i++;

          continue;

        }


        const header =
          lines[i].match(
            /^(.+?)\s*\|\s*(.+?)$/
          );


        if(!header){

          errors.push(
            `บรรทัดที่ ${i + 1}: ไม่พบรูปแบบ "ชื่อหวย | วันที่"`
          );

          i++;

          continue;

        }


        const name =
          header[1].trim();


        const date =
          header[2].trim();


        if(
          !this.parseDateValue(
            date
          )
        ){

          errors.push(
            `${name} | ${date}: รูปแบบวันที่ไม่ถูกต้อง เช่น 25 ส.ค. 69`
          );

          i++;

          continue;

        }


        const n3raw =
          lines[i + 1] || "";


        const n2raw =
          lines[i + 2] || "";


        const n3 =
          /^[\d\s]+$/.test(n3raw)
            ? n3raw.replace(/\s+/g,"")
            : n3raw;


        const n2 =
          /^[\d\s]+$/.test(n2raw)
            ? n2raw.replace(/\s+/g,"")
            : n2;


        if(
          !/^\d{3}$/.test(n3)
        ){

          errors.push(
            `${name} | ${date}: เลข 3 ตัวบนต้องเป็น 3 หลัก`
          );

          i += 1;

          continue;

        }


        if(
          !/^\d{2}$/.test(n2)
        ){

          errors.push(
            `${name} | ${date}: เลข 2 ตัวล่างต้องเป็น 2 หลัก`
          );

          i += 2;

          continue;

        }


        records.push({

          name,
          date,
          n3,
          n2

        });


        i += 3;

      }


      return {
        records,
        errors
      };

    },


    /* =======================================================
       GROUP LOTTERIES
    ======================================================= */

    groupByLottery(records){

      const groupsMap = {};


      records.forEach(
        (record,index) => {

          const key =
            record.name.trim();


          if(!groupsMap[key]){

            groupsMap[key] = {

              name:key,

              records:[],

              duplicateCount:0,

              conflictCount:0,

              __order:index

            };

          }


          groupsMap[key]
            .records
            .push(record);

        }
      );


      const groups =
        Object.values(
          groupsMap
        );


      groups.forEach(
        group => {

          const sorted =
            this.sortChronological(
              group.records
            );


          const byDate =
            new Map();


          const clean = [];


          sorted.forEach(
            record => {

              const key =
                this.dateKey(
                  record.date
                );


              if(
                !byDate.has(key)
              ){

                byDate.set(
                  key,
                  record
                );

                clean.push(
                  record
                );

                return;

              }


              const previous =
                byDate.get(key);


              if(
                previous.n3 ===
                  record.n3 &&
                previous.n2 ===
                  record.n2
              ){

                group.duplicateCount++;

                return;

              }


              group.conflictCount++;


              const index =
                clean.indexOf(
                  previous
                );


              if(index >= 0){

                clean[index] =
                  record;

              }


              byDate.set(
                key,
                record
              );

            }
          );


          group.records =
            this.sortChronological(
              clean
            );

        }
      );


      return groups

        .sort(
          (a,b) =>
            a.__order -
            b.__order
        )

        .map(group => {

          delete group.__order;

          return group;

        });

    },


    /* =======================================================
       MODEL 01
       ORIGINAL LOGIC PRESERVED
    ======================================================= */

    mainModel(n3){

      const digits =
        String(n3)
          .padStart(3,"0")
          .split("")
          .map(Number);


      const H =
        digits[0];


      const T =
        digits[1];


      const U =
        digits[2];


      const sum =
        H + T + U;


      const first =
        this.norm(sum);


      const second =
        this.norm(
          first + 1
        );


      return {

        sum,

        first,

        second,

        set:[
          first,
          second
        ]

      };

    },


    /* =======================================================
       BACKEND SUPPORT FORMULA 1
       ORIGINAL LOGIC PRESERVED
    ======================================================= */

    backendFormula1(n3,n2){

      const top =
        String(n3)
          .padStart(3,"0")
          .split("")
          .map(Number);


      const bottom =
        String(n2)
          .padStart(2,"0")
          .split("")
          .map(Number);


      const T =
        top[1];


      const R1 =
        bottom[0];


      const sum =
        T + R1;


      const q =
        this.norm(sum);


      const result =
        this.norm(
          q + 1
        );


      return {

        sum,
        q,
        result

      };

    },


    /* =======================================================
       BACKEND SUPPORT FORMULA 2
       ORIGINAL LOGIC PRESERVED
    ======================================================= */

    backendFormula2(n3,n2){

      const top =
        String(n3)
          .padStart(3,"0")
          .split("")
          .map(Number);


      const bottom =
        String(n2)
          .padStart(2,"0")
          .split("")
          .map(Number);


      const H =
        top[0];


      const R1 =
        bottom[0];


      const sum =
        H + R1;


      const q =
        this.norm(sum);


      const result =
        this.norm(
          q + 1
        );


      return {

        sum,
        q,
        result

      };

    },


    /* =======================================================
       VIP CONFIRMATION
       ORIGINAL LOGIC PRESERVED
    ======================================================= */

    checkVIP(
      main,
      backend1,
      backend2
    ){

      const mainSet =
        new Set(
          main.set
        );


      return (

        mainSet.has(
          backend1.result
        ) ||

        mainSet.has(
          backend2.result
        )

      );

    },


    /* =======================================================
       PROTECTED ORIGINAL PAIR ENGINE
       ORIGINAL LOGIC PRESERVED
    ======================================================= */

    buildPairs(
      mainSet,
      anchor
    ){

      const pairsMap = {};


      mainSet.forEach(
        sourceDigit => {

          let range = [];

          let collision =
            false;


          for(
            let offset = -2;

            offset <= 2;

            offset++
          ){

            if(
              mainSet.includes(
                this.norm(
                  anchor +
                  offset
                )
              )
            ){

              collision = true;

              break;

            }

          }


          for(
            let offset =
              collision
                ? -3
                : -2;

            offset <=
              (
                collision
                  ? 3
                  : 2
              );

            offset++
          ){

            const digit =
              this.norm(
                anchor +
                offset
              );


            if(
              !range.includes(
                digit
              )
            ){

              range.push(
                digit
              );

            }

          }


          const pairs = [];


          range.forEach(
            target => {

              if(
                target ===
                sourceDigit
              )
                return;


              if(
                mainSet.includes(
                  target
                )
              )
                return;


              const pair =
                `${sourceDigit}${target}`;


              if(
                pair[0] ===
                pair[1]
              )
                return;


              if(
                !pairs.includes(
                  pair
                )
              )
                pairs.push(pair);

            }
          );


          let next =
            this.norm(
              sourceDigit + 1
            );


          let guard = 0;


          while(
            pairs.length < 5 &&
            guard < 20
          ){

            if(

              next !==
                sourceDigit &&

              !mainSet.includes(
                next
              )

            ){

              const pair =
                `${sourceDigit}${next}`;


              if(

                pair[0] !==
                  pair[1] &&

                !pairs.includes(
                  pair
                )

              ){

                pairs.push(
                  pair
                );

              }

            }


            next =
              this.norm(
                next + 1
              );


            guard++;

          }


          pairsMap[sourceDigit] =
            [
              ...new Set(
                pairs
              )
            ]

            .filter(
              pair =>
                pair[0] !==
                pair[1]
            )

            .slice(0,5);

        }
      );


      return pairsMap;

    },


    /* =======================================================
       PAIR CONSENSUS
       ORIGINAL LOGIC PRESERVED
    ======================================================= */

    pairKey(pair){

      const value =
        String(pair);


      if(
        !/^\d{2}$/.test(value)
      )
        return value;


      return [

        value[0],
        value[1]

      ]
      .sort()
      .join("");

    },


    buildPairConsensus(
      pairSets
    ){

      const all = [];


      pairSets.forEach(
        (set,rowIndex) => {

          set
            .slice(0,5)
            .forEach(
              pair => {

                all.push({

                  pair:String(pair),

                  rowIndex

                });

              }
            );

        }
      );


      const counts = {};


      all.forEach(
        item => {

          const key =
            this.pairKey(
              item.pair
            );


          if(!counts[key]){

            counts[key] = {

              key,

              score:0,

              rows:new Set(),

              pairs:new Set()

            };

          }


          counts[key].score++;


          counts[key]
            .rows
            .add(
              item.rowIndex
            );


          counts[key]
            .pairs
            .add(
              item.pair
            );

        }
      );


      const ranked =
        Object.values(
          counts
        )
        .sort(
          (a,b) =>

            b.score -
            a.score ||

            b.rows.size -
            a.rows.size ||

            Number(a.key) -
            Number(b.key)

        );


      const colorMap = {};


      ranked
        .slice(0,6)
        .forEach(
          (item,index) => {

            let color;


            if(index < 2){

              color =
                "gold";

            }else if(index < 4){

              color =
                "silver";

            }else{

              color =
                "rose";

            }


            colorMap[item.key] = {

              color,

              rank:
                index + 1,

              score:
                item.score

            };

          }
        );


      return {

        counts,

        ranked,

        colorMap

      };

    },


    sortPairs(pairs){

      return pairs

        .map(String)

        .filter(
          pair =>

            /^\d{2}$/.test(pair) &&

            pair[0] !==
              pair[1]

        )

        .sort(
          (a,b) =>
            Number(a) -
            Number(b)
        );

    },


    pairClass(
      pair,
      colorMap
    ){

      const info =
        colorMap[
          this.pairKey(
            pair
          )
        ];


      if(!info)
        return "pair";


      if(
        info.color ===
        "gold"
      )
        return "pair pair-gold";


      if(
        info.color ===
        "silver"
      )
        return "pair pair-silver";


      return "pair pair-rose";

    },


    /* =======================================================
       MAIN ENGINE
       ORIGINAL LOGIC PRESERVED
    ======================================================= */

    run(n3,n2){

      const topDigits =
        String(n3)
          .padStart(3,"0")
          .split("")
          .map(Number);


      const H =
        topDigits[0];


      const main =
        this.mainModel(
          n3
        );


      const backend1 =
        this.backendFormula1(
          n3,
          n2
        );


      const backend2 =
        this.backendFormula2(
          n3,
          n2
        );


      const vip =
        this.checkVIP(
          main,
          backend1,
          backend2
        );


      /*
        Protected original anchor:
        7 - hundreds top
      */

      const rawAnchor =
        7 - H;


      const anchor =
        this.norm(
          rawAnchor
        );


      const pairsMap =
        this.buildPairs(
          main.set,
          anchor
        );


      const pairSets =
        main.set.map(
          digit =>
            this.sortPairs(
              pairsMap[digit] || []
            ).slice(0,5)
        );


      const consensus =
        this.buildPairConsensus(
          pairSets
        );


      return {

        main,

        backend1,

        backend2,

        vip,

        rawAnchor,

        anchor,

        pairsMap,

        pairSets,

        consensus,

        top1Digit:
          main.first,

        top2Digit:
          main.second

      };

    },


    /* =======================================================
       NEXT DATE
    ======================================================= */

    nextDateLabel(record){

      if(!record)
        return "";


      const value =
        String(
          record.date || ""
        ).trim();


      const thai =
        value.match(
          /^(\d{1,2})\s+(\S+)\s+(\d{2,4})$/
        );


      if(thai){

        const day =
          Number(
            thai[1]
          );


        let year =
          Number(
            thai[3]
          );


        if(year < 100)
          year += 2500;


        const months = [

          "ม.ค.",
          "ก.พ.",
          "มี.ค.",
          "เม.ย.",
          "พ.ค.",
          "มิ.ย.",
          "ก.ค.",
          "ส.ค.",
          "ก.ย.",
          "ต.ค.",
          "พ.ย.",
          "ธ.ค."

        ];


        const monthIndex =
          months.indexOf(
            thai[2]
          );


        if(
          monthIndex >= 0
        ){

          const date =
            new Date(
              year - 543,
              monthIndex,
              day
            );


          date.setDate(
            date.getDate() + 1
          );


          return [

            String(
              date.getDate()
            ),

            months[
              date.getMonth()
            ],

            String(
              date.getFullYear() +
              543
            )

          ].join(" ");

        }

      }


      return "งวดถัดไป";

    },


    /* =======================================================
       CAPTURE CARD
       SCREENSHOT-SAFE
    ======================================================= */

    async captureCard(
      cardId,
      name
    ){

      const element =
        document.getElementById(
          cardId
        );


      if(!element)
        return;


      const controls =
        [
          ...element.querySelectorAll(
            "[data-no-capture]"
          )
        ];


      try{

        if(
          typeof html2canvas ===
          "undefined"
        ){

          throw new Error(
            "ไม่พบระบบแคปภาพ"
          );

        }


        controls.forEach(
          el => {

            el.style.visibility =
              "hidden";

          }
        );


        element.classList.add(
          "capture-mode"
        );


        /*
          Wait for the browser to repaint
          the clean capture state.
        */

        await new Promise(
          resolve =>
            requestAnimationFrame(
              () =>
                requestAnimationFrame(
                  resolve
                )
            )
        );


        const canvas =
          await html2canvas(
            element,
            {

              /*
                Stable flat background.
                This is intentionally NOT transparent.
              */

              backgroundColor:
                "#0e1013",


              /*
                Higher scale produces cleaner
                digit edges on mobile screenshots.
              */

              scale:
                Math.min(
                  3,
                  Math.max(
                    2,
                    window.devicePixelRatio ||
                    2
                  )
                ),


              useCORS:true,

              allowTaint:false,

              logging:false,

              imageTimeout:10000,

              removeContainer:true,

              /*
                Prevent animation / subpixel noise
                from affecting capture.
              */

              onclone:
                clonedDocument => {

                  const clonedCard =
                    clonedDocument
                      .getElementById(
                        cardId
                      );


                  if(
                    clonedCard
                  ){

                    clonedCard.style.animation =
                      "none";

                    clonedCard.style.transition =
                      "none";

                  }

                }

            }
          );


        const link =
          document.createElement(
            "a"
          );


        const safe =
          String(
            name ||
            "lottery"
          )
          .replace(
            /[^ก-๙A-Za-z0-9_-]+/g,
            "_"
          )
          .slice(
            0,
            60
          );


        link.download =
          `${
            safe ||
            "lottery"
          }_VIP_card.png`;


        link.href =
          canvas.toDataURL(
            "image/png",
            1
          );


        link.click();


        this.show(
          "✦ แคปการ์ด VIP+ แล้ว"
        );


      }catch(error){

        console.error(
          error
        );


        this.show(
          "❌ แคปภาพไม่สำเร็จ"
        );


      }finally{

        controls.forEach(
          el => {

            el.style.visibility =
              "";

          }
        );


        element.classList.remove(
          "capture-mode"
        );

      }

    },


    /* =======================================================
       COPY
    ======================================================= */

    copy(text){

      if(

        navigator.clipboard &&

        navigator.clipboard.writeText

      ){

        navigator.clipboard
          .writeText(text)

          .then(
            () =>
              this.show()
          )

          .catch(
            () =>
              this.fallbackCopy(
                text
              )
          );

        return;

      }


      this.fallbackCopy(
        text
      );

    },


    fallbackCopy(text){

      const textarea =
        document.createElement(
          "textarea"
        );


      textarea.value =
        text;


      textarea.style.position =
        "fixed";


      textarea.style.opacity =
        "0";


      document.body.appendChild(
        textarea
      );


      textarea.select();


      textarea.setSelectionRange(
        0,
        textarea.value.length
      );


      try{

        document.execCommand(
          "copy"
        );

      }finally{

        textarea.remove();

      }


      this.show();

    },


    /* =======================================================
       TOAST
    ======================================================= */

    show(message){

      const toast =
        $("toast");


      toast.textContent =
        message ||
        "คัดลอกแล้ว";


      toast.classList.add(
        "show"
      );


      clearTimeout(
        this.toastTimer
      );


      this.toastTimer =
        setTimeout(
          () =>
            toast.classList.remove(
              "show"
            ),
          1600
        );

    },


    /* =======================================================
       CALCULATE
    ======================================================= */

    async calculate(){

      const parsed =
        this.parse(
          $("bulkInput").value
        );


      if(
        !parsed.records.length
      ){

        $("result").innerHTML = `

          <div class="errorbox">

            ❌ ไม่พบข้อมูลที่ถูกต้อง
            กรุณาตรวจรูปแบบอีกครั้ง

          </div>

        `;


        return;

      }


      const scanner =
        $("scanner");


      const runButton =
        $("run");


      runButton.disabled =
        true;


      scanner.style.display =
        "block";


      const scan =
        message => {

          $("scanText")
            .textContent =
            message;

        };


      const yieldUI =
        () =>
          new Promise(
            resolve =>
              requestAnimationFrame(
                resolve
              )
          );


      try{

        const groups =
          this.groupByLottery(
            parsed.records
          );


        const cards = [];

        const copyBlocks = [];


        let groupIndex = 0;


        for(
          const group of groups
        ){

          groupIndex++;


          const records =
            group.records;


          if(
            !records.length
          )
            continue;


          /*
            Latest chronological record
            is used as source for
            the next prediction card.
          */

          const latest =
            records[
              records.length - 1
            ];


          scan(
            `ประมวลผล ${group.name} • ${groupIndex}/${groups.length}`
          );


          await yieldUI();


          const result =
            this.run(
              latest.n3,
              latest.n2
            );


          const mainDigits =
            result.main.set;


          const pair1 =
            result.pairSets[0] ||
            [];


          const pair2 =
            result.pairSets[1] ||
            [];


          const nextDate =
            this.nextDateLabel(
              latest
            );


          /* =================================================
             PAIR HTML
          ================================================== */

          const makePairHTML =
            pairs => {

              return pairs
                .map(
                  pair => {

                    const info =
                      result
                        .consensus
                        .colorMap[
                          this.pairKey(
                            pair
                          )
                        ];


                    const title =
                      info

                        ? `Consensus อันดับ ${info.rank} • พบ ${info.score} ครั้ง`

                        : "เลขเจาะ";


                    return `

                      <span
                        class="${this.pairClass(
                          pair,
                          result.consensus.colorMap
                        )}"
                        title="${esc(title)}"
                      >
                        ${esc(pair)}
                      </span>

                    `;

                  }
                )
                .join("");

            };


          const pairHTML1 =
            makePairHTML(
              pair1
            );


          const pairHTML2 =
            makePairHTML(
              pair2
            );


          /* =================================================
             VIP BADGE
          ================================================== */

          const vipHTML =
            result.vip

              ? `

                <div
                  class="vip-label"
                  title="VIP confirmation"
                >
                  VIP+
                </div>

              `

              : `

                <div
                  class="vip-label empty"
                  aria-hidden="true"
                >
                  VIP+
                </div>

              `;


          const cardId =
            `lottery-card-${groupIndex}`;


          /* =================================================
             RANK 01
          ================================================= */

          const row1 = `

            <div class="row">

              <span
                class="row-label"
                aria-hidden="true"
              >
                RANK 01
              </span>


              <span
                class="digit digit-gold"
                aria-label="เลขเด่นอันดับหนึ่ง"
              >
                ${esc(
                  mainDigits[0]
                )}
              </span>


              <span
                class="sep"
                aria-hidden="true"
              >
                :
              </span>


              <div class="pairs">
                ${pairHTML1}
              </div>

            </div>

          `;


          /* =================================================
             RANK 02
          ================================================== */

          const row2 = `

            <div class="row">

              <span
                class="row-label"
                aria-hidden="true"
              >
                RANK 02
              </span>


              <span
                class="digit digit-gold"
                aria-label="เลขรองอันดับสอง"
              >
                ${esc(
                  mainDigits[1]
                )}
              </span>


              <span
                class="sep"
                aria-hidden="true"
              >
                :
              </span>


              <div class="pairs">
                ${pairHTML2}
              </div>

            </div>

          `;


          /* =================================================
             PREMIUM FOOTER
             Backend formula names are intentionally hidden.
          ================================================== */

          const footer = `

            <div class="card-footer">

              <div class="footer-brand">

                <span class="brand-star">
                  ✦
                </span>

                <span>
                  MESTER VIP
                </span>

                <span class="brand-star">
                  ✦
                </span>

              </div>


              <div class="footer-code">
                RANK 01 • RANK 02
              </div>

            </div>

          `;


          /* =================================================
             CARD
          ================================================== */

          cards.push(`

            <article
              class="lottery"
              id="${cardId}"
              data-lottery-card="true"
            >


              <div class="lottery-head">

                <div class="lottery-meta">


                  <div class="lottery-kicker">
                    PREMIUM MEMBER • NEXT DRAW
                  </div>


                  <div class="lottery-name">

                    <span
                      class="flag"
                      aria-hidden="true"
                    >
                      ${this.flag(
                        group.name
                      )}
                    </span>


                    <span>
                      ${esc(
                        group.name
                      )}
                    </span>

                  </div>


                  <div class="date">
                    ${esc(
                      nextDate
                    )}
                  </div>


                </div>


                ${vipHTML}


                <div
                  class="card-actions"
                  data-no-capture="true"
                >

                  <button
                    class="card-capture"
                    type="button"
                    data-capture-card="${cardId}"
                    data-capture-name="${esc(group.name)}"
                    aria-label="แคปการ์ด ${esc(group.name)}"
                  >
                    📷 แคปการ์ด
                  </button>

                </div>


              </div>


              <div class="rows">

                ${row1}

                ${row2}

              </div>


              ${footer}


            </article>

          `);


          /* =================================================
             COPY BLOCK
          ================================================== */

          copyBlocks.push(

            [

              `${this.flag(
                group.name
              )} ${group.name} | ${nextDate}`,

              `RANK 01 : ${mainDigits[0]} | ${pair1.join("-")}`,

              `RANK 02 : ${mainDigits[1]} | ${pair2.join("-")}`

            ].join("\n")

          );

        }


        scan(
          "ตรวจสอบความเรียบร้อยของผลลัพธ์..."
        );


        await yieldUI();


        scan(
          "FINALIZING PREMIUM OUTPUT..."
        );


        await yieldUI();


        scanner.style.display =
          "none";


        runButton.disabled =
          false;


        const all =
          copyBlocks.join(
            "\n\n"
          );


        this.lastCopyText =
          all;


        $("result").innerHTML = `

          <div class="summary">

            <span>

              วิเคราะห์สำเร็จ

              <strong>
                ${cards.length}
              </strong>

              ประเภท

            </span>


            <button
              class="copy"
              id="copyTop"
              type="button"
            >
              📋 COPY ALL
            </button>

          </div>


          ${
            parsed.errors.length

              ? `

                <div class="errorbox">

                  ${parsed.errors
                    .map(esc)
                    .join("<br>")}

                </div>

              `

              : ""
          }


          ${cards.join("")}


          <button
            class="copyall"
            id="copyBottom"
            type="button"
          >
            ✦ คัดลอกหวยทั้งหมด
          </button>

        `;


        $("copyTop").onclick =
          () =>
            this.copy(
              all
            );


        $("copyBottom").onclick =
          () =>
            this.copy(
              all
            );


        $("copyInput").disabled =
          !all;


        $("copyInput").onclick =
          () =>
            this.copy(
              this.lastCopyText
            );


        /*
          Capture button events
        */

        $("result")
          .querySelectorAll(
            "[data-capture-card]"
          )
          .forEach(
            button => {

              button.onclick =
                () =>
                  this.captureCard(

                    button.dataset
                      .captureCard,

                    button.dataset
                      .captureName

                  );

            }
          );


        $("result").scrollIntoView({

          behavior:"smooth",

          block:"start"

        });


      }catch(error){

        console.error(
          error
        );


        scanner.style.display =
          "none";


        runButton.disabled =
          false;


        $("result").innerHTML = `

          <div class="errorbox">

            ❌ เกิดข้อผิดพลาดระหว่างประมวลผล:

            ${esc(
              error?.message ||
              error
            )}

          </div>

        `;

      }

    }

  };


  /* =========================================================
     EVENTS
  ========================================================= */

  $("run").addEventListener(
    "click",
    () =>
      app.calculate()
  );


  $("clearInput").addEventListener(
    "click",
    () => {

      $("bulkInput").value =
        "";


      $("result").innerHTML =
        "";


      $("scanner").style.display =
        "none";


      $("run").disabled =
        false;


      $("copyInput").disabled =
        true;


      app.lastCopyText =
        "";


      $("bulkInput").focus();


      app.show(
        "✓ ล้างข้อมูลแล้ว"
      );

    }
  );


  /*
    Keyboard shortcut:
    Ctrl/Cmd + Enter = Calculate
  */

  $("bulkInput").addEventListener(
    "keydown",
    event => {

      if(

        (
          event.ctrlKey ||
          event.metaKey
        ) &&

        event.key === "Enter"

      ){

        event.preventDefault();

        app.calculate();

      }

    }
  );


})();

</script>
