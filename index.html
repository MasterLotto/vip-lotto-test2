<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Expires" content="0">
<title>Master Lotto VIP+ - Quantum Intelligence</title>
<style>
:root{--navy:#0a0f1d;--gold:#d4af37;--emerald:#00e676;--card-bg:rgba(16,24,48,0.85);--border:rgba(212,175,55,0.25);--text:#e2e8f0;--text-muted:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
body{background:var(--navy);color:var(--text);min-height:100vh;padding:15px;background-image:radial-gradient(circle at 50% 0%,#1e293b 0%,var(--navy) 70%)}
.container{max-width:800px;margin:0 auto}
.header-card{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:20px;text-align:center;margin-bottom:15px;backdrop-filter:blur(10px)}
.gold-text{color:var(--gold);text-shadow:0 0 10px rgba(212,175,55,0.3)}
.input-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:15px}
.input-group{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:12px}
.input-group label{display:block;font-size:0.85rem;color:var(--text-muted);margin-bottom:6px}
.input-group input,.input-group select{width:100%;background:rgba(0,0,0,0.4);border:1px solid var(--border);border-radius:8px;padding:10px;color:#fff;font-size:1.1rem;text-align:center;outline:none}
.primary-btn{width:100%;padding:14px;background:linear-gradient(135deg,#d4af37,#aa7c11);border:none;border-radius:12px;color:#000;font-weight:bold;font-size:1.1rem;cursor:pointer;margin-bottom:20px;box-shadow:0 4px 15px rgba(212,175,55,0.3)}
.primary-btn:hover{opacity:0.95}
.result-section{display:none}
.stats-analytics-card{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:15px;margin-bottom:15px}
.top3-signal-board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.top3-position{background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.rank-one{border-color:var(--gold);box-shadow:0 0 10px rgba(212,175,55,0.2)}
.three-d-item{font-size:1.5rem;font-weight:bold;color:var(--emerald);margin:5px 0}
.meta-chip{font-size:0.75rem;color:var(--text-muted)}
.overview-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(255,255,255,0.05);border-radius:8px;margin-top:6px}
.engine-card{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.engine-title{font-size:0.9rem;color:var(--gold);margin-bottom:8px;display:flex;justify-content:space-between}
.pair-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.pair-badge{background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);padding:6px;border-radius:6px;font-size:0.95rem}
@media(max-width:400px){.pair-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="container">
  <div class="header-card">
    <h1 class="gold-text">MASTER LOTTO VIP+</h1>
    <p style="font-size:0.8rem;color:var(--text-muted);">Quantum Multi-Engine Intelligence (v2.2)</p>
  </div>
  <div class="input-grid">
    <div class="input-group">
      <label>3 ตัวบน (งวดล่าสุด)</label>
      <input type="text" id="top3Input" maxlength="3" placeholder="583">
    </div>
    <div class="input-group">
      <label>2 ตัวล่าง (งวดล่าสุด)</label>
      <input type="text" id="bot2Input" maxlength="2" placeholder="27">
    </div>
  </div>
  <div class="input-group" style="margin-bottom:15px;">
    <label>เลือกประเภท/ช่วงเวลาตลาด (สำหรับ K-Factor)</label>
    <select id="marketType">
      <option value="6">หุ้นรอบเช้า (K = 6)</option>
      <option value="7">หุ้นรอบบ่าย (K = 7)</option>
      <option value="8" selected>หวยชุดลาว / ฮานอย (K = 8)</option>
    </select>
  </div>
  <button class="primary-btn" onclick="processLotto()">ประมวลผลวิเคราะห์สูตร</button>

  <div id="resultSection" class="result-section">
    <div class="stats-analytics-card">
      <div class="engine-title"><span>🎯 เลขเด่นคัดสรรจากทุกสูตร (Consensus Top Picks)</span></div>
      <div class="top3-signal-board" id="topPickBoard"></div>
    </div>
    <div id="engineDetails"></div>
  </div>
</div>

<script>
// ฟังก์ชั่นจัดการ Modulo สำหรับเลขติดลบ
const mod10 = n => ((n % 10) + 10) % 10;

// ฟังก์ชั่นเจาะชุดเลขมาตรฐานจากเลขเด่น 2 ตัว
function generatePairs(d1, d2) {
  let set = new Set();
  const arr = [d1, d2];
  // วิ่งคู่ / วิ่งรูด / เจาะ
  arr.forEach(d => {
    for(let i=0; i<=9; i++) {
      set.add(`${d}${i}`);
      set.add(`${i}${d}`);
    }
  });
  // ชุดเน้นเบิ้ล/วินคู่
  set.add(`${d1}${d1}`); set.add(`${d2}${d2}`); set.add(`${d1}${d2}`); set.add(`${d2}${d1}`);
  return Array.from(set).slice(0, 8); // คัดตัวแทน 8 ชุดหลัก
}

function processLotto() {
  const top3 = document.getElementById('top3Input').value;
  const bot2 = document.getElementById('bot2Input').value;
  const K = parseInt(document.getElementById('marketType').value);

  if(top3.length !== 3 || bot2.length !== 2 || isNaN(top3) || isNaN(bot2)) {
    alert('กรุณากรอกข้อมูล 3 ตัวบน และ 2 ตัวล่างให้ครบถ้วน');
    return;
  }

  const A = parseInt(top3[0]), B = parseInt(top3[1]), C = parseInt(top3[2]);
  const D = parseInt(bot2[0]), E = parseInt(bot2[1]);

  // รวมสูตรคำนวณทั้งหมด (ลบสูตรซ้ำออกและรวมตรรกะเดียวกัน)
  const engines = [];

  // 1. N1+ V2 Ultra-Stability
  let f1_v2 = mod10(A + (3*B) + C + (3*D) + (3*E) + K);
  let step2_v2 = (-A - B - C + D - (3*E) + 1);
  if(step2_v2 === A) step2_v2 += 1;
  let f2_v2 = mod10(step2_v2);
  if(f2_v2 === f1_v2) f2_v2 = mod10(f2_v2 + 1);
  engines.push({ name: "N1+ V2 (Ultra-Stability)", d1: f1_v2, d2: f2_v2 });

  // 2. N1
  engines.push({ name: "N1 (Original Rank 1)", d1: mod10(-2*A - 2*B + C + D - 2*E + 9), d2: mod10(-2*B + C + 3) });

  // 3. N2
  engines.push({ name: "N2 (Balanced Engine)", d1: mod10(-A + B - C + 2*D + E + 4), d2: mod10(A - 2*C - 2*E + 7) });

  // 4. N3
  engines.push({ name: "N3 (Direct Formula)", d1: mod10(2*A - B + C + 2*D - E + 3), d2: mod10(A + 2*B - 2*C + D + 2*E + 6) });

  // 5. N4
  engines.push({ name: "N4 (Symmetric Engine)", d1: mod10(-2*A - B - C - 2*D - 2*E + 5), d2: mod10(-2*A + B + 2*C - 2*D + E + 9) });

  // 6. N5
  engines.push({ name: "N5 (Algorithmic)", d1: mod10(-2*A - 2*B - C - D - 2*E + 7), d2: mod10(-A + B + 2*C - 2*D + E + 6) });

  // 7. N6
  engines.push({ name: "N6 (Master Dual)", d1: mod10(-A - 2*B + C - E + 1), d2: mod10(A - C - D - 2*E) });

  // 8. สูตรพื้นฐาน 1: สิบบน + สิบล่าง
  engines.push({ name: "สูตรพื้นฐาน 1 (สิบบน+สิบล่าง)", d1: mod10(B + D), d2: mod10(B + D + 1) });

  // 9. สูตรพื้นฐาน 2 / อันดับ 2: ผลรวม 3 ตัวบน / (2xสิบบน + หน่วยบน + 2)
  engines.push({ name: "สูตร 3 (อันดับ 2)", d1: mod10(2*B + C + 2), d2: mod10(9 - 2*A + C - 2*D) });

  // 10. สูตรพื้นฐาน 3: ร้อยบน + สิบล่าง
  engines.push({ name: "สูตรพื้นฐาน 3 (ร้อยบน+สิบล่าง)", d1: mod10(A + D), d2: mod10(A + D + 1) });

  // 11. สูตรพื้นฐาน 4: หน่วยบน + หน่วยล่าง
  engines.push({ name: "สูตรพื้นฐาน 4 (หน่วยบน+หน่วยล่าง)", d1: mod10(C + E), d2: mod10(C + E + 1) });

  // 12. สูตรพื้นฐาน 5 / อันดับ 3: ฐาน 10 - หน่วยล่าง
  engines.push({ name: "สูตร 5 (อันดับ 3)", d1: mod10(10 - E), d2: mod10(10 - E + 1) });

  // 13. สูตรพื้นฐาน 6: ร้อยบน + หน่วยสิบ ล่าง
  engines.push({ name: "สูตรพื้นฐาน 6 (ร้อยบน+หน่วยสิบล่าง)", d1: mod10(A + D + E), d2: mod10(A + D + E + 1) });

  // 14. สูตรใหม่: สิบบน + หน่วยล่าง + 2
  engines.push({ name: "สูตรใหม่ (สิบบน+หน่วยล่าง+2)", d1: mod10(B + E + 2), d2: mod10(B + E + 4) });

  // นับความถี่เลขเด่นทั้งหมดเพื่อเลือก Top 3 Consensus
  const freq = {};
  engines.forEach(e => {
    freq[e.d1] = (freq[e.d1] || 0) + 1.2; // ให้น้ำหนักตัวแรก
    freq[e.d2] = (freq[e.d2] || 0) + 1.0;
  });

  const sortedDigits = Object.keys(freq).sort((a,b) => freq[b] - freq[a]);
  const top Picks = sortedDigits.slice(0, 3);

  // Render Top Picks
  const board = document.getElementById('topPickBoard');
  board.innerHTML = '';
  top Picks.forEach((digit, idx) => {
    board.innerHTML += `
      <div class="top3-position ${idx===0?'rank-one':''}">
        <div class="meta-chip">อันดับ ${idx+1}</div>
        <div class="three-d-item">${digit}</div>
        <div class="meta-chip">คะแนน ${freq[digit].toFixed(1)}</div>
      </div>
    `;
  });

  // Render Engines & ชุดเจาะ
  const details = document.getElementById('engineDetails');
  details.innerHTML = '';
  engines.forEach(e => {
    const pairs = generatePairs(e.d1, e.d2);
    details.innerHTML += `
      <div class="engine-card">
        <div class="engine-title">
          <span>${e.name}</span>
          <span style="color:var(--emerald)">เด่น ${e.d1} - ${e.d2}</span>
        </div>
        <div class="pair-grid">
          ${pairs.map(p => `<div class="pair-badge">${p}</div>`).join('')}
        </div>
      </div>
    `;
  });

  document.getElementById('resultSection').style.display = 'block';
}
</script>
</body>
</html>
