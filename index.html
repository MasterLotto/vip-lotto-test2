<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ban Ngern Kong V33.0 - AI Ensemble Engine</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --bg-card-hover: #334155;
            --gold-primary: #F59E0B;
            --gold-light: #FCD34D;
            --gold-dark: #D97706;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border-color: #334155;
            --accent-green: #10B981;
            --accent-red: #EF4444;
            --accent-blue: #3B82F6;
            --shadow-glow: 0 0 25px rgba(245, 158, 11, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        #snowCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.8) 100%);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-glow);
        }

        h1 {
            color: var(--gold-primary);
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .input-section {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
        }

        .input-label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--gold-light);
        }

        textarea {
            width: 100%;
            height: 160px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            padding: 12px;
            font-size: 0.9rem;
            resize: vertical;
            margin-bottom: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: var(--gold-primary);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            color: #000;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
        }

        .btn-secondary {
            background: rgba(148, 163, 184, 0.1);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: rgba(148, 163, 184, 0.2);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--gold-light);
        }

        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-high { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); }
        .badge-moderate { background: rgba(245, 158, 11, 0.2); color: var(--gold-primary); }
        .badge-low { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); }

        .digit-display {
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin-bottom: 20px;
        }

        .digit-box {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--gold-primary);
            border-radius: 12px;
            padding: 12px;
            width: 45%;
        }

        .digit-box.secondary {
            border-color: var(--border-color);
        }

        .digit-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .digit-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--gold-light);
        }

        .pairs-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .pair-group {
            background: rgba(15, 23, 42, 0.4);
            border-radius: 8px;
            padding: 10px;
        }

        .pair-group-title {
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .pill-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .gold-pill { border-color: var(--gold-primary); color: var(--gold-light); }
        .silver-pill { border-color: #94A3B8; color: #E2E8F0; }
        .rose-pill { border-color: #F472B6; color: #FBCFE8; }

        .table-section {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.85rem;
        }

        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--gold-light);
            font-weight: 600;
            background: rgba(15, 23, 42, 0.5);
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        select {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
        }
    </style>
</head>
<body>
    <canvas id="snowCanvas"></canvas>

    <div class="container">
        <header>
            <h1>บ้านเงินกอง V33.0</h1>
            <div class="subtitle">AI Ensemble Engine — ระบบคำนวณและวิเคราะห์สถิติหวย/หุ้น</div>
        </header>

        <div class="input-section">
            <label class="input-label" for="rawData">กรอกสถิติย้อนหลัง (คัดลอกมาวางได้ทันที):</label>
            <textarea id="rawData" placeholder="ตัวอย่างรูปแบบข้อมูล:
ดาวโจนส์ | 01 มกราคม 2567
123
45
ดาวโجونส์ | 02 มกราคม 2567
678
90"></textarea>
            <div class="btn-group">
                <button class="btn-primary" onclick="processData()">⚡ คำนวณและประมวลผล AI</button>
                <button class="btn-secondary" onclick="clearData()">🗑️ ล้างข้อมูล</button>
            </div>
        </div>

        <div id="aiDashboard" class="dashboard-grid"></div>

        <div class="controls-bar">
            <h2>📊 ตารางวิเคราะห์สูตรดั้งเดิม (Audit Table)</h2>
            <div>
                <select id="cardFormulaSelect">
                    <!-- Dynamic Options -->
                </select>
                <button class="btn-secondary" onclick="addManualCard()">＋ เพิ่มการ์ด</button>
            </div>
        </div>

        <div class="table-section">
            <table id="auditTable">
                <thead>
                    <tr>
                        <th>สูตร</th>
                        <th>Hit Rate</th>
                        <th>Miss Streak</th>
                        <th>AI Weight</th>
                        <th>คำนวณงวดถัดไป</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="5" style="text-align: center; color: var(--text-muted);">กรุณากรอกข้อมูลเพื่อคำนวณสถิติ</td></tr>
                </tbody>
            </table>
        </div>

        <div id="manualCardsContainer" class="dashboard-grid"></div>
    </div>

    <script>
        // --- 1. Snow Effect Engine ---
        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const numFlakes = 60;
        const flakes = Array.from({ length: numFlakes }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            r: Math.random() * 3 + 1,
            d: Math.random() * 1 + 0.5
        }));

        function drawSnow() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.beginPath();
            for (let f of flakes) {
                ctx.moveTo(f.x, f.y);
                ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
            }
            ctx.fill();
            updateSnow();
            requestAnimationFrame(drawSnow);
        }

        function updateSnow() {
            for (let f of flakes) {
                f.y += f.d;
                if (f.y > height) {
                    f.y = 0;
                    f.x = Math.random() * width;
                }
            }
        }
        drawSnow();

        // --- 2. Parser Engine ---
        const MONTHS = {
            "มกราคม":1, "กุมภาพันธ์":2, "มีนาคม":3, "เมษายน":4, "พฤษภาคม":5, "มิถุนายน":6,
            "กรกฎาคม":7, "สิงหาคม":8, "กันยายน":9, "ตุลาคม":10, "พฤศจิกายน":11, "ธันวาคม":12,
            "ม.ค.":1, "ก.พ.":2, "มี.ค.":3, "เม.ย.":4, "พ.ค.":5, "มิ.ย.":6,
            "ก.ค.":7, "ส.ค.":8, "ก.ย.":9, "ต.ค.":10, "พ.ย.":11, "ธ.ค.":12
        };

        function parseRawData(text) {
            const lines = text.split('\n').map(l => l.trim()).filter(l => l);
            const records = [];
            let i = 0;

            while (i < lines.length) {
                if (lines[i].includes('|')) {
                    const header = lines[i];
                    let top = lines[i+1] || "";
                    let bot = lines[i+2] || "";

                    if (top.includes('งด') || top.includes('หยุด')) {
                        i++; continue;
                    }

                    if (/^\d{3}$/.test(top) && /^\d{2}$/.test(bot)) {
                        records.push({
                            header,
                            top,
                            bot,
                            tDigits: top.split('').map(Number),
                            bDigits: bot.split('').map(Number)
                        });
                        i += 3;
                    } else {
                        i++;
                    }
                } else {
                    i++;
                }
            }
            return records.reverse(); // เรียงจากอดีต -> ปัจจุบัน
        }

        // --- 3. Traditional Formulas Engine (15 Formulas) ---
        const FORMULAS = [
            { id: 1, name: "อันดับ 1 — สูตร 2 N1", fn: r => (r.tDigits[0] + r.tDigits[2] + 2) % 10 },
            { id: 2, name: "N2 — สูตรใหม่", fn: r => (r.tDigits[1] + r.bDigits[1] + 5) % 10 },
            { id: 3, name: "N3 — สูตรเด่นชุดเดียวจบ", fn: r => (r.tDigits[2] + r.bDigits[0] + 1) % 10 },
            { id: 4, name: "N4 Master Formula", fn: r => (r.tDigits[0] + r.bDigits[0] + 7) % 10 },
            { id: 5, name: "N5 Master Formula", fn: r => (r.tDigits[1] + r.tDigits[2] + 4) % 10 },
            { id: 6, name: "N6 Master Formula", fn: r => (r.bDigits[0] + r.bDigits[1] + 9) % 10 },
            { id: 7, name: "N1+ Super", fn: r => (r.tDigits[0] * 2 + r.tDigits[1]) % 10 },
            { id: 8, name: "N1+ V2 Super", fn: r => (r.tDigits[2] * 2 + r.bDigits[1]) % 10 },
            { id: 9, name: "Hybrid Alpha", fn: r => (r.tDigits[0] + r.bDigits[1] + 3) % 10 },
            { id: 10, name: "สูตร 1 Standard", fn: r => (r.tDigits[1] + 1) % 10 },
            { id: 11, name: "สูตร 2 Standard", fn: r => (r.tDigits[2] + 8) % 10 },
            { id: 12, name: "สูตร 3 Standard", fn: r => (r.bDigits[0] + 6) % 10 },
            { id: 13, name: "สูตร 4 Standard", fn: r => (r.bDigits[1] + 4) % 10 },
            { id: 14, name: "สูตร 5 Standard", fn: r => (r.tDigits[0] + r.tDigits[1] + r.bDigits[0]) % 10 },
            { id: 15, name: "สูตร 6 Standard", fn: r => (r.tDigits[2] + r.bDigits[0] + r.bDigits[1]) % 10 }
        ];

        // --- 4. Backtest & AI Ensemble Core ---
        function runBacktest(records) {
            const stats = FORMULAS.map(f => ({
                ...f,
                hits: 0,
                total: 0,
                streak: 0,
                history: [],
                nextVal: records.length > 0 ? f.fn(records[records.length - 1]) : null
            }));

            for (let i = 0; i < records.length - 1; i++) {
                const current = records[i];
                const next = records[i + 1];

                stats.forEach(f => {
                    const predicted = f.fn(current);
                    const isHit = next.top.includes(predicted.toString()) || next.bot.includes(predicted.toString());
                    
                    f.total++;
                    if (isHit) {
                        f.hits++;
                        f.streak = 0;
                    } else {
                        f.streak++;
                    }
                    f.history.push(isHit);
                });
            }

            return stats;
        }

        function calculateAIWeights(stats) {
            return stats.map(s => {
                if (s.total === 0) return { ...s, weight: 1 };
                
                // Decay Recency Weighting
                let recencyScore = 0;
                s.history.slice(-10).forEach((hit, index) => {
                    if (hit) recencyScore += Math.pow(0.92, 9 - index);
                });

                const hitRate = s.hits / s.total;
                const penalty = Math.pow(0.5, s.streak);
                const weight = (hitRate * 0.4 + (recencyScore / 10) * 0.6) * penalty;

                return { ...s, weight: Math.max(weight, 0.01) };
            });
        }

        function buildAIPrediction(weightedStats, records) {
            if (records.length === 0) return null;

            const votes = Array(10).fill(0);
            weightedStats.forEach(s => {
                if (s.nextVal !== null) {
                    votes[s.nextVal] += s.weight;
                }
            });

            // Post-Filter Frequency
            const freq = Array(10).fill(0);
            records.forEach(r => {
                r.tDigits.forEach(d => freq[d]++);
                r.bDigits.forEach(d => freq[d]++);
            });

            const combinedScores = votes.map((v, d) => v * 0.7 + (freq[d] / (records.length * 5)) * 0.3);

            const sorted = combinedScores
                .map((score, digit) => ({ digit, score }))
                .sort((a, b) => b.score - a.score);

            const primary = sorted[0].digit;
            const secondary = sorted[1].digit;
            
            const confidenceVal = sorted[0].score / (sorted.reduce((a, b) => a + b.score, 0) || 1);
            let confidence = "LOW";
            if (confidenceVal > 0.2) confidence = "HIGH";
            else if (confidenceVal > 0.14) confidence = "MODERATE";

            return {
                primary,
                secondary,
                confidence,
                pairs: generatePairs(primary, secondary)
            };
        }

        function generatePairs(primary, secondary) {
            const gold = [], silver = [], rose = [];
            for (let i = 0; i <= 9; i++) {
                gold.push(`${primary}${i}`);
                if (i !== primary) silver.push(`${secondary}${i}`);
                if (i !== primary && i !== secondary) rose.push(`${i}${i}`);
            }
            return { gold, silver, rose: rose.slice(0, 5) };
        }

        // --- 5. UI Renderers ---
        let currentRecords = [];
        let currentWeightedStats = [];

        function processData() {
            const rawText = document.getElementById('rawData').value;
            currentRecords = parseRawData(rawText);

            if (currentRecords.length < 2) {
                alert("กรุณากรอกข้อมูลสถิติย้อนหลังอย่างน้อย 2 งวดขึ้นไป");
                return;
            }

            const rawStats = runBacktest(currentRecords);
            currentWeightedStats = calculateAIWeights(rawStats);
            const aiPred = buildAIPrediction(currentWeightedStats, currentRecords);

            renderAIDashboard(aiPred);
            renderAuditTable(currentWeightedStats);
            populateFormulaSelect();

            // Save to LocalStorage
            localStorage.setItem('lottery_audit_master_records_v330', rawText);
        }

        function renderAIDashboard(pred) {
            const container = document.getElementById('aiDashboard');
            if (!pred) {
                container.innerHTML = "";
                return;
            }

            const badgeClass = `badge-${pred.confidence.toLowerCase()}`;

            container.innerHTML = `
                <div class="card" style="grid-column: 1 / -1;">
                    <div class="card-header">
                        <div class="card-title">🤖 ผลวิเคราะห์ปัญญาประดิษฐ์ (AI Ensemble Prediction)</div>
                        <span class="badge ${badgeClass}">Confidence: ${pred.confidence}</span>
                    </div>
                    <div class="digit-display">
                        <div class="digit-box">
                            <div class="digit-label">เลขเด่น AI (Primary)</div>
                            <div class="digit-value">${pred.primary}</div>
                        </div>
                        <div class="digit-box secondary">
                            <div class="digit-label">เลขรอง AI (Secondary)</div>
                            <div class="digit-value" style="color: var(--text-main);">${pred.secondary}</div>
                        </div>
                    </div>
                    <div class="pairs-container">
                        <div class="pair-group">
                            <div class="pair-group-title">🌟 ชุดเด่น Gold (เน้นหลัก)</div>
                            <div class="pill-container">
                                ${pred.pairs.gold.map(p => `<span class="pill gold-pill">${p}</span>`).join('')}
                            </div>
                        </div>
                        <div class="pair-group">
                            <div class="pair-group-title">✨ ชุดรอง Silver (กันหลุด)</div>
                            <div class="pill-container">
                                ${pred.pairs.silver.map(p => `<span class="pill silver-pill">${p}</span>`).join('')}
                            </div>
                        </div>
                        <div class="pair-group">
                            <div class="pair-group-title">🌸 ชุดเบิ้ล Rose Gold</div>
                            <div class="pill-container">
                                ${pred.pairs.rose.map(p => `<span class="pill rose-pill">${p}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAuditTable(stats) {
            const tbody = document.querySelector('#auditTable tbody');
            tbody.innerHTML = stats.map(s => {
                const hitRate = s.total > 0 ? ((s.hits / s.total) * 100).toFixed(1) : "0.0";
                return `
                    <tr>
                        <td style="font-weight: 500;">${s.name}</td>
                        <td>${hitRate}% (${s.hits}/${s.total})</td>
                        <td style="color: ${s.streak > 2 ? 'var(--accent-red)' : 'var(--text-main)'}">${s.streak} งวด</td>
                        <td style="color: var(--gold-light);">${s.weight.toFixed(3)}</td>
                        <td style="font-weight: 700; color: var(--gold-primary);">${s.nextVal !== null ? s.nextVal : '-'}</td>
                    </tr>
                `;
            }).join('');
        }

        function populateFormulaSelect() {
            const select = document.getElementById('cardFormulaSelect');
            select.innerHTML = FORMULAS.map(f => `<option value="${f.id}">${f.name}</option>`).join('');
        }

        function addManualCard() {
            const id = parseInt(document.getElementById('cardFormulaSelect').value);
            const stat = currentWeightedStats.find(s => s.id === id);
            if (!stat) return;

            const container = document.getElementById('manualCardsContainer');
            const cardId = `manual-card-${Date.now()}`;
            
            const pairs = generatePairs(stat.nextVal, (stat.nextVal + 1) % 10);

            const cardHTML = `
                <div class="card" id="${cardId}">
                    <div class="card-header">
                        <div class="card-title">${stat.name}</div>
                        <button onclick="document.getElementById('${cardId}').remove()" style="background:none; border:none; color:var(--accent-red); cursor:pointer;">✕</button>
                    </div>
                    <div class="digit-display">
                        <div class="digit-box" style="width: 100%;">
                            <div class="digit-label">คำนวณงวดถัดไป</div>
                            <div class="digit-value">${stat.nextVal}</div>
                        </div>
                    </div>
                    <div class="pairs-container">
                        <div class="pair-group">
                            <div class="pair-group-title">🌟 ชุดจับคู่สูตร</div>
                            <div class="pill-container">
                                ${pairs.gold.slice(0, 5).map(p => `<span class="pill gold-pill">${p}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', cardHTML);
        }

        function clearData() {
            document.getElementById('rawData').value = '';
            document.getElementById('aiDashboard').innerHTML = '';
            document.getElementById('manualCardsContainer').innerHTML = '';
            document.querySelector('#auditTable tbody').innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">กรุณากรอกข้อมูลเพื่อคำนวณสถิติ</td></tr>`;
            localStorage.removeItem('lottery_audit_master_records_v330');
        }

        // --- Auto Restore Session ---
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('lottery_audit_master_records_v330');
            if (saved) {
                document.getElementById('rawData').value = saved;
                processData();
            }
        });
    </script>
</body>
</html>
