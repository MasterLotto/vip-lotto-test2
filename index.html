<script>
(()=>{

const c=document.getElementById('snow');
const x=c.getContext('2d');

let w=c.width=innerWidth;
let h=c.height=innerHeight;

addEventListener('resize',()=>{
w=c.width=innerWidth;
h=c.height=innerHeight;
});

const particles=Array.from({length:42},()=>({
x:Math.random()*w,
y:Math.random()*h,
r:.7+Math.random()*1.8,
s:.15+Math.random()*.45,
a:.18+Math.random()*.35,
p:Math.random()*6.28,
tone:Math.random()>.72?'rose':'gold'
}));

(function draw(){
x.clearRect(0,0,w,h);

particles.forEach(q=>{
q.p+=.01;
q.y+=q.s;
q.x+=Math.sin(q.p)*.25;

if(q.y>h+5){
q.y=-5;
q.x=Math.random()*w;
}

x.beginPath();
x.arc(q.x,q.y,q.r,0,Math.PI*2);

x.fillStyle=q.tone==='rose'
?`rgba(185,130,121,${q.a*.55})`
:`rgba(195,154,67,${q.a})`;

x.fill();
});

requestAnimationFrame(draw);
})();

const $=id=>document.getElementById(id);

const esc=s=>String(s)
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#039;');

const sec={
tokens:[
'4d617374657241646d696e32303236',
'54396b4c326d5037',
'5a71345738785431'
],

dec(h){
let s='';
for(let i=0;i<h.length;i+=2){
s+=String.fromCharCode(parseInt(h.slice(i,i+2),16));
}
return s;
},

ok(v){
return this.tokens.some(t=>v===this.dec(t));
}
};

const app={

cache:[],
lastCopyText:'',
toastTimer:null,

audio(){},

norm(x){
return(x%10+10)%10;
},

clamp(v,lo=0,hi=1){
return Math.max(lo,Math.min(hi,Number(v)||0));
},

/*==========================================================
SMALL SAMPLE CONTROL
==========================================================*/

historyLimit:10,

effectiveSampleWeight(samples,target=10){
const n=Math.max(0,Number(samples)||0);
return this.clamp(n/target);
},

sampleConfidence(samples){
const n=Math.max(0,Number(samples)||0);

if(n<=0)return 0;
if(n===1)return .16;
if(n===2)return .25;
if(n===3)return .34;
if(n===4)return .43;
if(n===5)return .51;
if(n===6)return .59;
if(n===7)return .67;
if(n===8)return .75;
if(n===9)return .83;
return 1;
},

normalizeScores(map){
const vals=Object.values(map);
const max=Math.max(...vals,0);

if(max<=0)
return Object.fromEntries(
Object.keys(map).map(k=>[k,0])
);

return Object.fromEntries(
Object.entries(map).map(([k,v])=>[
k,
this.clamp(v/max)
])
);
},

sourceBreadthScore(v){
return this.clamp(
1-Math.exp(-Math.max(0,v)/1.6)
);
},

consensusTier(count,total){
const n=Math.max(1,total||1);

if(count>=n)return 1;
if(count===2&&n===3)return .82;
if(count>=2)return .70;
if(count===1)return .24;

return 0;
},

flag(n){
n=String(n).toLowerCase();

if(/ลาว|lao/.test(n))return'🇱🇦';
if(/ฮานอย|เวียดนาม|vietnam|viet/.test(n))return'🇻🇳';
if(/พม่า|เมียนมา|myanmar|2d|internet|modern/.test(n))return'🇲🇲';
if(/จีน|china|shanghai/.test(n))return'🇨🇳';
if(/ฮั่งเส็ง|hang seng|hong kong|ฮ่องกง/.test(n))return'🇭🇰';
if(/นิเคอิ|นิคเคอิ|นิกเคอิ|nikkei|ญี่ปุ่น|japan/.test(n))return'🇯🇵';
if(/เกาหลี|korea|kospi/.test(n))return'🇰🇷';
if(/สิงคโปร์|singapore/.test(n))return'🇸🇬';
if(/อินเดีย|india|sensex/.test(n))return'🇮🇳';
if(/รัสเซีย|russia|moscow/.test(n))return'🇷🇺';
if(/เยอรมัน|germany|dax/.test(n))return'🇩🇪';
if(/อังกฤษ|uk|ftse|london/.test(n))return'🇬🇧';
if(/อียิปต์|egypt/.test(n))return'🇪🇬';
if(/ไต้หวัน|taiwan|tse/.test(n))return'🇹🇼';
if(/สหรัฐ|usa|america|dow|nasdaq|s&p/.test(n))return'🇺🇸';
if(/ฝรั่งเศส|france|cac/.test(n))return'🇫🇷';
if(/ออสเตรเลีย|australia|asx/.test(n))return'🇦🇺';
if(/แคนาดา|canada/.test(n))return'🇨🇦';
if(/หุ้นไทย|ไทย|thai|set|หุ้น/.test(n))return'🇹🇭';

return'🌐';
},

parse(text){

const z=String(text||'')
.replace(/\r/g,'')
.trim();

if(!z)
return{
records:[],
errors:['ยังไม่มีข้อมูลสำหรับประมวลผล']
};

const lines=z.split('\n').map(v=>v.trim());
const records=[];
const errors=[];

let i=0;

while(i<lines.length){

if(!lines[i]){
i++;
continue;
}

const m=lines[i].match(/^(.+?)\s*\|\s*(.+?)$/);

if(!m){
errors.push(
`บรรทัดที่ ${i+1}: ไม่พบรูปแบบ "ชื่อหวย | วันที่"`
);
i++;
continue;
}

const name=m[1].trim();
const date=m[2].trim();

if(!this.parseDateValue(date)){
errors.push(
`${name} | ${date}: รูปแบบวันที่ไม่ถูกต้อง เช่น 25 ส.ค. 69`
);
i++;
continue;
}

const n3raw=lines[i+1]||'';
const n2raw=lines[i+2]||'';

const n3=/^[\d\s]+$/.test(n3raw)
?n3raw.replace(/\s+/g,'')
:n3raw;

const n2=/^[\d\s]+$/.test(n2raw)
?n2raw.replace(/\s+/g,'')
:n2raw;

if(!/^\d{3}$/.test(n3)){
errors.push(
`${name} | ${date}: เลข 3 ตัวบนต้องเป็น 3 หลัก`
);
i++;
continue;
}

if(!/^\d{2}$/.test(n2)){
errors.push(
`${name} | ${date}: เลข 2 ตัวล่างต้องเป็น 2 หลัก`
);
i+=2;
continue;
}

records.push({
name,
date,
n3,
n2
});

i+=3;
}

return{records,errors};
},

parseDateValue(date){

const s=String(date||'').trim();

if(!s)return false;

if(/^\d{1,2}\s+\S+\s+\d{2,4}$/.test(s))
return true;

if(/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(s))
return true;

if(/^\d{1,2}-\d{1,2}-\d{2,4}$/.test(s))
return true;

return false;
},

dateKey(date){

const s=String(date||'').trim();

const m=s.match(
(/^(\d{1,2})\s+(\S+)\s+(\d{2,4})$/)
);

if(m){

const months={
'ม.ค.':1,
'ก.พ.':2,
'มี.ค.':3,
'เม.ย.':4,
'พ.ค.':5,
'มิ.ย.':6,
'ก.ค.':7,
'ส.ค.':8,
'ก.ย.':9,
'ต.ค.':10,
'พ.ย.':11,
'ธ.ค.':12
};

const month=months[m[2]]||0;

let year=Number(m[3]);

if(year<100)
year+=2500;

return[
year,
String(month).padStart(2,'0'),
String(Number(m[1])).padStart(2,'0')

const m2=s.match(

);

if(m2){

let year=Number(m2[3]);

if(year<100)
year+=2500;

return[
year,
String(Number(m2[2])).padStart(2,'0'),

].join('-');
}

sortChronological(records){

return records
.map((r,index)=>({
...r,
__index:index
}))
.sort((a,b)=>{

const ka=this.dateKey(a.date);
const kb=this.dateKey(b.date);

if(ka<kb)return-1;
if(ka>kb)return 1;

return a.__index-b.__index;

})
.map(r=>{

const z={...r};
delete z.__index;

return z;
});
},

/*==========================================================
IMPORTANT:
Only the latest 10 chronological draws are used.
This prevents old data from overpowering current regime.
==========================================================*/

limitHistory(records){

const ordered=this.sortChronological(records||[]);

if(ordered.length<=this.historyLimit)
return ordered;

return ordered.slice(-this.historyLimit);
},

groupByLottery(records){

const groupsMap={};

records.forEach((r,index)=>{

const key=r.name.trim();

if(!groupsMap[key]){
groupsMap[key]={
name:key,
records:[],
duplicateCount:0,
conflictCount:0,
__order:index
};
}

groupsMap[key].records.push(r);

});

const groups=Object.values(groupsMap);

groups.forEach(g=>{

const sorted=this.sortChronological(g.records);

const byDate=new Map();
const clean=[];

sorted.forEach(r=>{

const key=this.dateKey(r.date);

if(!byDate.has(key)){
byDate.set(key,r);
clean.push(r);
return;
}

const previous=byDate.get(key);

if(
previous.n3===r.n3 &&
previous.n2===r.n2
){
g.duplicateCount++;
return;
}

g.conflictCount++;

const idx=clean.indexOf(previous);

if(idx>=0)
clean[idx]=r;

byDate.set(key,r);

});

g.records=this.limitHistory(clean);

});

return groups
.sort((a,b)=>a.__order-b.__order)
.map(g=>{
delete g.__order;
return g;
});
},

/*==========================================================
PROTECTED PAIR / เลขเจาะ ENGINE
==========================================================*/

buildPairs(models,anchor){

models.forEach(m=>{

let range=[];
let collision=false;

for(let o=-2;o<=2;o++){

if(
m.set.includes(this.norm(anchor+o))
){
collision=true;
break;
}

}

for(
let o=collision?-3:-2;
o<=(collision?3:2);
o++
){
range.push(this.norm(anchor+o));
}

m.pairsMap={};

m.set.forEach(src=>{

let pairs=range
.filter(p=>p!==src&&!m.set.includes(p))
.map(p=>`${src}${p}`);

let next=(src+1)%10;

while(pairs.length<5){

if(
next!==src &&
!m.set.includes(next) &&
!pairs.includes(`${src}${next}`)
){
pairs.push(`${src}${next}`);
}

next=(next+1)%10;
}

m.pairsMap[src]=[
...new Set(pairs)
]
.filter(p=>p[0]!==p[1])
.slice(0,5);

});

});

},

featureVector(record){

const d3=
String(record.n3)
.padStart(3,'0')
.split('')
.map(Number);

const d2=
String(record.n2)
.padStart(2,'0')
.split('')
.map(Number);

const H=d3[0];
const T=d3[1];
const U=d3[2];
const R1=d2[0];
const R2=d2[1];

const sumT=(H+T+U)%10;
const sumB=(R1+R2)%10;

return[
H,T,U,R1,R2,
sumT,sumB,
(sumT+sumB)%10
];

},

featureSimilarity(a,b){

const A=this.featureVector(a);
const B=this.featureVector(b);

const weights=[
.12,.15,.12,.12,
.15,.12,.10,.12
];

let s=0;
let w=0;

for(let i=0;i<A.length;i++){

const dist=
Math.min(
Math.abs(A[i]-B[i]),
10-Math.abs(A[i]-B[i])
);

const part=
dist===0
?1
:dist===1
?.55
:dist===2
?.20
:0;

s+=weights[i]*part;
w+=weights[i];

}

return this.clamp(s/w);
},

m03Predict(source,records){

const ordered=this.limitHistory(records||[]);

const candidates=[];
const global=Array.from(
{length:10},
()=>0
);

let totalTargets=0;

for(
let i=1;
i<ordered.length;
i++
){

const pastSource=ordered[i-1];
const target=ordered[i];

const sim=
this.featureSimilarity(
source,
pastSource
);

if(sim<0.60)
continue;

const age=
ordered.length-1-i;

const recency=
Math.pow(
.985,
Math.max(0,age)
);

const weight=
Math.pow(
.55+.45*sim,
2
)*recency;

const actual=
this.actualDigits(target);

actual.forEach(d=>{
global[d]+=weight;
});

totalTargets+=weight;

candidates.push({
index:i,
similarity:sim,
weight,
targetDate:target.date,
actual:[...actual]
});

}

if(!candidates.length){

return{
set:[],
scores:{},
matches:0
};

}

const scores=
Array.from(
{length:10},
(_,d)=>
global[d]/
Math.max(totalTargets,1)
);

const ranked=
scores
.map((score,d)=>({
d,
score
}))
.sort(
(a,b)=>
b.score-a.score||
a.d-b.d
);

const set=
ranked
.slice(0,2)
.map(x=>x.d);

return{
set,
scores:Object.fromEntries(
ranked.map(x=>[x.d,x.score])
),
matches:candidates.length,
details:candidates.slice(-20)
};

},

posterior(
rate,
samples,
prior=.5,
priorN=6
){

const n=
Math.max(
0,
Number(samples)||0
);

return(
rate*n+
prior*priorN
)/
(n+priorN);

},

});

});

/*==========================================================
MODEL CONSENSUS
==========================================================*/

for(let d=0;d<=9;d++){

const supporters=
models.filter(
m=>m.set.includes(d)
);

score[d].modelConsensusCount=
supporters.length;

score[d].modelScore=
totalModelWeight
?
supporters.reduce(
(sum,m)=>
sum+modelWeights[m.id],
0
)/
totalModelWeight
:0;

score[d].modelSupportScore=
score[d].modelScore;

score[d].modelId=
supporters[0]?.id??null;

score[d].m03Score=
history?.m03?.scores?.[d]??0;

score[d].modelAgreementScore=
this.consensusTier(
supporters.length,
models.length
);

}

/*==========================================================
FORMULA 100
==========================================================*/

const weightedFormulaCounts=
Object.fromEntries(
Array.from(
{length:10},
(_,d)=>[d,0]
)
);

F.signals.forEach(sig=>{

weightedFormulaCounts[sig.value]+=
this.formulaWeight(
sig.id,
history
);

});

const maxF=
Math.max(
...Object.values(weightedFormulaCounts),
1
);

for(let d=0;d<=9;d++){

score[d].formula100Score=
this.clamp(
weightedFormulaCounts[d]/maxF
);

}

/*==========================================================
RADAR
==========================================================*/

const x=(R1+R2)%10;
const y=sumT%10;
const z=total%10;

const r1=[
this.norm(x-1),
x,
this.norm(x+1)
];

const r2=[
this.norm(y-1),
y,
this.norm(y+1)
];

const r3=[
this.norm(z-1),
z,
this.norm(z+1)
];

for(let d=0;d<=9;d++){

let h=0;

if(r1.includes(d))h++;
if(r2.includes(d))h++;
if(r3.includes(d))h++;

score[d].radarScore=h/3;

}

/*==========================================================
BACKEND
==========================================================*/

const back=[
(2*H+R1)%10,
(T+R2)%10,
sumT%10,
Math.abs(T-U)%10,
total%10
];

for(let d=0;d<=9;d++){

score[d].backendScore=
back.includes(d)?1:0;

score[d].winSetScore=
(d===z||
d===this.norm(z+5))
?1:0;

/*----------------------------------------
CANDIDATE-CONDITIONED HISTORY
----------------------------------------*/

const dp=
history&&
history.digitPerf&&
history.digitPerf[d];

if(dp&&dp.samples){

const longPost=
this.posterior(
dp.long,
dp.samples,
.5,
6
);

const recentPost=
this.posterior(
dp.recent,
dp.recentSamples||
Math.min(dp.samples,5),
.5,
5
);

score[d].historicalScore=
longPost;

score[d].recentFormScore=
recentPost;

score[d].stabilityScore=
dp.stability??.5;

/*----------------------------------------
GLOBAL HISTORY
----------------------------------------*/

const gp=
history&&
history.globalDigitPerf&&
history.globalDigitPerf[d];

if(gp&&gp.samples){

const globalLong=
this.posterior(
gp.long,
gp.samples,
.5,
10
);

const globalRecent=
this.posterior(
gp.recent,
gp.recentSamples||
Math.min(gp.samples,5),
.5,
6
);

score[d].globalHistoricalScore=
this.clamp(
.65*globalLong+
.35*globalRecent
);

}

/*----------------------------------------
EVIDENCE
----------------------------------------*/

score[d].evidenceScore=
this.clamp(
.45*longPost+
.25*recentPost+
.20*score[d].globalHistoricalScore+
.10*(dp.stability??.5)
);

score[d].uncertainty=
1/
Math.sqrt(
dp.samples+1
);

const streak=
Math.max(
0,
dp.streak||0
);

score[d].hotStreakBonus=
1+
Math.min(
.035,
Math.max(
0,
streak-1
)*.008
);

score[d].sampleConfidence=
this.sampleConfidence(
dp.samples
);

}else{

/*
If digit has never been candidate-conditioned,
do NOT pretend it has strong historical evidence.
*/

const gp=
history&&
history.globalDigitPerf&&
history.globalDigitPerf[d];

if(gp&&gp.samples){

const globalLong=
this.posterior(
gp.long,
gp.samples,
.5,
10
);

const globalRecent=
this.posterior(
gp.recent,
gp.recentSamples||
Math.min(gp.samples,5),
.5,
6
);

score[d].globalHistoricalScore=
this.clamp(
.65*globalLong+
.35*globalRecent
);

score[d].evidenceScore=
this.clamp(
.70*.5+
.30*score[d].globalHistoricalScore
);

}

}

}

/*==========================================================
FINAL COMPOSITE
==========================================================*/

for(let d=0;d<=9;d++){

const v=score[d];

const consensus=
v.modelScore;

const supportValues=[
v.formula100Score,
v.radarScore,
v.backendScore,
v.winSetScore
];

v.supportSignals=
supportValues.filter(
x=>x>=.60
).length;

v.conflictSignals=
supportValues.filter(
x=>x<=.25
).length;

const sortedSupport=
[...supportValues]
.sort((a,b)=>b-a);

const supportStrength=
this.clamp(
.40*sortedSupport[0]+
.24*sortedSupport[1]+
.14*sortedSupport[2]+
.08*sortedSupport[3]
);

const supportBreadth=
this.sourceBreadthScore(
v.supportSignals
);

const hist=
v.evidenceScore;

const m03Boost=
this.clamp(
v.m03Score*1.8
);

/*----------------------------------------
MODEL AGREEMENT
----------------------------------------*/

const agreement=
v.modelAgreementScore;

/*----------------------------------------
MODEL CONFLICT
----------------------------------------*/

const modelConflict=
v.modelConsensusCount===1
?
.10
:
v.modelConsensusCount===2
?
.035
:
0;

v.modelConflictPenalty=
1-modelConflict;

/*----------------------------------------
RELIABILITY
----------------------------------------*/

v.reliabilityScore=
this.clamp(

.32*consensus+
.23*hist+
.12*agreement+
.08*supportBreadth+
.08*supportStrength+
.17*m03Boost

);

/*----------------------------------------
V12.7 TOTAL SCORE
----------------------------------------

Weight philosophy:

32% Model Consensus
13% Historical Evidence
08% Recent Form
07% Model Agreement
10% M03 Historical Similarity
10% Formula-100
05% Radar
04% Backend
01% WinSet

Remaining weight is distributed through
support breadth / reliability gates.
----------------------------------------*/

v.totalScore=
this.clamp(

.32*consensus+
.10*v.formula100Score+
.05*v.radarScore+
.04*v.backendScore+
.01*v.winSetScore+

.13*v.historicalScore+
.08*v.recentFormScore+

.07*agreement+
.02*v.stabilityScore+

.03*supportBreadth+
.10*m03Boost+

.05*v.globalHistoricalScore

);

/*----------------------------------------
HISTORICAL QUALITY GATE
----------------------------------------*/

if(history&&history.usable>0){

const histQuality=
this.sampleConfidence(
history.usable
);

v.totalScore*=
.92+
.08*this.clamp(
v.evidenceScore
);

v.totalScore*=
.94+
.06*histQuality;

}

/*----------------------------------------
ANTI-OVERFIT GATE
----------------------------------------*/

if(history&&history.usable<4){

/*
When there are only 1-3 transitions,
historical evidence cannot safely dominate.
*/

v.totalScore=
.65*v.totalScore+
.35*consensus;

}

/*----------------------------------------
CONFLICT PENALTY
----------------------------------------*/

const externalConflict=
Math.min(
.18,
Math.max(
0,
v.conflictSignals
)*.045
);

const finalConflictPenalty=
v.modelConflictPenalty*
(1-externalConflict);

v.selectionPenalty=
finalConflictPenalty;

v.totalScore*=
v.selectionPenalty;

/*----------------------------------------
CANDIDATE POOL BONUS
----------------------------------------*/

if(allowed.has(v.digit)){

const poolStrength=
v.modelConsensusCount/
Math.max(
1,
models.length
);

const supportBreadthRatio=
v.supportSignals/4;

v.selectorBonus=
.025*poolStrength+
.018*supportBreadthRatio+
.022*Math.max(
0,
v.reliabilityScore-.5
)+
.025*m03Boost+
.030*agreement;

}else{

v.selectorBonus=0;

}

/*----------------------------------------
DEAD CANDIDATE PROTECTION
----------------------------------------*/

const deadCandidate=
allowed.has(v.digit)&&
v.modelConsensusCount<=1&&
v.reliabilityScore<.32&&
v.evidenceScore<.40&&
v.supportSignals===0&&
m03Boost<.15;

if(deadCandidate){

v.qualityGate=.80;
v.totalScore*=.80;

}else{

v.qualityGate=1;

}

/*----------------------------------------
FINAL HOT STREAK
----------------------------------------*/

v.totalScore*=
v.hotStreakBonus;

/*----------------------------------------
SMALL SAMPLE PROTECTION
----------------------------------------

Do not allow weak historical evidence
to create an artificial winner.
----------------------------------------*/

if(
history&&
history.usable>0&&
v.modelConsensusCount===1&&
v.sampleConfidence<
.60
){

v.totalScore=
.90*v.totalScore+
.10*v.modelScore;

}

/*----------------------------------------
FINAL SELECTOR SCORE
----------------------------------------*/

v.totalScore+=
Math.min(
.06,
v.selectorBonus
);

v.selectorScore=
this.clamp(
v.totalScore
);

v.selectionScore=
v.selectorScore;

}

return{
score,
allowed
};

},

/*==========================================================
TOURNAMENT ENGINE — V12.7
==========================================================*/

tournament(models,score){

const compareDigits=(a,b)=>{

if(!a)return b;
if(!b)return a;

if(
Math.abs(
a.selectorScore-
b.selectorScore
)>.000001
){
return
a.selectorScore>b.selectorScore
?a:b;
}

/* 1. Historical evidence */

if(
Math.abs(
a.evidenceScore-
b.evidenceScore
)>.000001
){
return
a.evidenceScore>b.evidenceScore
?a:b;
}

/* 2. Model agreement */

if(
a.modelAgreementScore!==
b.modelAgreementScore
){
return
a.modelAgreementScore>
b.modelAgreementScore
?a:b;
}

/* 3. Model consensus */

if(
a.modelSupportScore!==
b.modelSupportScore
){
return
a.modelSupportScore>
b.modelSupportScore
?a:b;
}

/* 4. Recent form */

if(
a.recentFormScore!==
b.recentFormScore
){
return
a.recentFormScore>
b.recentFormScore
?a:b;
}

/* 5. Backend */

if(
a.backendScore!==
b.backendScore
){
return
a.backendScore>
b.backendScore
?a:b;
}

/* 6. Formula */

if(
a.formula100Score!==
b.formula100Score
){
return
a.formula100Score>
b.formula100Score
?a:b;
}

/* deterministic final tie */

return
a.digit<=b.digit
?a:b;

};

const modelRounds=
models.map(model=>{

const first=
score[model.set[0]];

const second=
score[model.set[1]];

const winner=
compareDigits(
first,
second
);

return{
modelId:model.id,
modelName:model.name,
candidates:[
first,
second
],
winner,
margin:
Math.abs(
(first?.selectorScore||0)-
(second?.selectorScore||0)
),
base:model.base,
variant:model.variant
};

});

let finalWinner=null;

const finalists=
modelRounds
.filter(x=>x.winner)
.map(x=>x.winner);

finalists.forEach(x=>{

finalWinner=
compareDigits(
finalWinner,
x
);

});

const losers=
finalists
.filter(x=>x!==finalWinner)
.sort(
(a,b)=>
(b?.selectorScore||0)-
(a?.selectorScore||0)
);

const finalLoser=
losers[0]||null;

const finalMargin=
finalWinner&&finalLoser
?
Math.abs(
finalWinner.selectorScore-
finalLoser.selectorScore
)
:0;

const winningModelId=
finalWinner?.modelId??null;

/*==========================================================
FINAL CONFIDENCE
==========================================================*/

if(finalWinner){

const finalMarginScore=
this.clamp(
finalMargin/.10
);

const supportBreadth=
this.sourceBreadthScore(
finalWinner.supportSignals
);

const agreement=
finalWinner.modelAgreementScore;

const baseConfidence=
.28*this.clamp(
finalWinner.selectorScore
)+

.18*finalMarginScore+

.20*this.clamp(
finalWinner.evidenceScore
)+

.15*supportBreadth+

.12*this.clamp(
finalWinner.m03Score*1.8
)+

.07*agreement;

finalWinner.confidence=
this.clamp(
.30+
.70*baseConfidence
);

finalWinner.finalMargin=
finalMargin;

finalWinner.finalOpponent=
finalLoser?.digit??null;

finalWinner.finalWinner=true;

}

return{

modelRounds,

winner01:
modelRounds.find(
x=>x.modelId===1
)?.winner||null,

winner02:
modelRounds.find(
x=>x.modelId===2
)?.winner||null,

winner03:
modelRounds.find(
x=>x.modelId===3
)?.winner||null,

finalWinner,
finalLoser,
finalMargin,
winningModelId

};

},

/*==========================================================
PROTECTED PAIR CANDIDATES
==========================================================*/

collectPairCandidates(digit,models,score){

const candidates=[];

models
.filter(m=>m.set.includes(digit))
.forEach(m=>{

const sourceStrength=
Math.max(
0,
Math.min(
1,
.70*
(
(m.historyWeight||1)/1.30
)+
.30*
(
score[digit]?.reliabilityScore??.5
)
)
);

const digitStrength=
score[digit]
?score[digit].selectorScore
:0;

const modelConsensus=
score[digit]
?score[digit].modelScore
:0;

(m.pairsMap[digit]||[])
.forEach(pair=>{

const key=this.pairKey(pair);

const pairScore=
.55*sourceStrength+
.30*digitStrength+
.15*modelConsensus;

candidates.push({
pair:String(pair),
key,
pairScore,
modelId:m.id
});

});

});

return candidates;

},

bestPairsForDigit(digit,models,score){

const candidates=
this.collectPairCandidates(
digit,
models,
score
);

const bestByKey={};

candidates.forEach(c=>{

if(
!bestByKey[c.key]||
c.pairScore>
bestByKey[c.key].pairScore
){
bestByKey[c.key]=c;
}

});

return Object.values(bestByKey)
.sort(
(a,b)=>
b.pairScore-a.pairScore||
Number(a.key)-Number(b.key)
)
.slice(0,5)
.map(v=>v.pair);

},

pairKey(pair){

const p=String(pair);

if(!/^\d{2}$/.test(p))
return p;

return[
p[0],
p[1]
]
.sort()
.join('');
},

buildConsensus(pairSets){

const all=[];

pairSets.forEach((set,rowIndex)=>{

set.slice(0,6).forEach(pair=>{

all.push({
pair:String(pair),
rowIndex
});

});

});

const counts={};

all.forEach(item=>{

const key=this.pairKey(item.pair);

if(!counts[key]){

counts[key]={
key,
score:0,
rows:new Set(),
pairs:new Set()
};

}

counts[key].score++;

counts[key].rows.add(
item.rowIndex
);

counts[key].pairs.add(
item.pair
);

});

const ranked=
Object.values(counts)
.sort(
(a,b)=>
b.score-a.score||
b.rows.size-a.rows.size||
Number(a.key)-Number(b.key)
);

const colorMap={};

ranked
.slice(0,6)
.forEach((item,index)=>{

let color;

if(index<2)
color='gold';
else if(index<4)
color='silver';
else
color='rose';

colorMap[item.key]={
color,
rank:index+1,
score:item.score
};

});

return{
counts,
ranked,
colorMap
};

},

sortPairs(pairs){

return pairs
.map(String)
.sort(
(a,b)=>Number(a)-Number(b)
);

},

pairClass(pair,colorMap){

const info=
colorMap[
this.pairKey(pair)
];

if(!info)
return'pair';

if(info.color==='gold')
return'pair pair-gold';

if(info.color==='silver')
return'pair pair-silver';

return'pair pair-rose';

},

formatPct(v){

return`${Math.round(
Math.max(0,Math.min(1,v))*1000
)/10}%`;

},

formatDate(date){

const s=String(date||'').trim();

if(/\d+\s+\S+\s+\d+/.test(s)){

const p=s.split(/\s+/);

if(p.length>=3)
return[
p[0],
p[1],
p.slice(2).join(' ')
].join(' · ');

}

return s;

},

/*==========================================================
MAIN ENGINE
==========================================================*/

run(n3,n2,history=null){

const d3=n3.split('').map(Number);
const d2=n2.split('').map(Number);

const[H,T,U]=d3;
const[R1,R2]=d2;

const sumT=H+T+U;
const sumB=R1+R2;
const total=sumT+sumB;

const F=this.formulas(
H,T,U,
R1,R2,
sumT,
sumB,
total
);

const models=this.buildModels(
H,T,U,
R1,R2,
sumT,
history
);

const anchor=
this.norm(7-H);

/*
IMPORTANT:
Protected Pair Engine is called exactly as before.
*/

this.buildPairs(
models,
anchor
);

const scored=
this.scoreDigits(
models,
F,
H,T,U,
R1,R2,
sumT,sumB,total,
history
);

const tournament=
this.tournament(
models,
scored.score
);

const finalWinner=
tournament.finalWinner;

const top1Digits=
finalWinner
?[finalWinner.digit]
:[];

/*----------------------------------------
Protected pair output
----------------------------------------*/

let pairSet=
finalWinner
?
this.bestPairsForDigit(
finalWinner.digit,
models,
scored.score
)
:[];

if(
finalWinner&&
tournament.finalLoser&&
Number.isInteger(finalWinner.digit)&&
Number.isInteger(tournament.finalLoser.digit)
){

const extraPair=
`${finalWinner.digit}${tournament.finalLoser.digit}`;

if(
/^\d{2}$/.test(extraPair)&&
!pairSet.includes(extraPair)
){
pairSet=[
...pairSet,
extraPair
];
}

}

const consensus=
this.buildConsensus([
pairSet
]);

return{

top1Digit:
finalWinner
?finalWinner.digit
:null,

top2Digits:
top1Digits,

pairSets:[
pairSet
],

modelScores:
scored.score,

modelCount:3,

models,

tournament,

selectedModelId:
tournament.winningModelId,

selectedModel:
models.find(
m=>m.id===
tournament.winningModelId
)||null,

confidence:
finalWinner
?finalWinner.confidence
:0,

finalMargin:
tournament.finalMargin,

consensus

};

},

nextDateLabel(records){

if(!records.length)
return'';

const latest=
records[records.length-1];

const s=
String(latest.date||'').trim();

const m=
s.match(
(/^(\d{1,2})\s+(\S+)\s+(\d{2,4})$/)
);

if(m){

const day=
Number(m[1]);

let year=
Number(m[3]);

if(year<100)
year+=2500;

const months=[
'ม.ค.',
'ก.พ.',
'มี.ค.',
'เม.ย.',
'พ.ค.',
'มิ.ย.',
'ก.ค.',
'ส.ค.',
'ก.ย.',
'ต.ค.',
'พ.ย.',
'ธ.ค.'
];

const monthIndex=
months.indexOf(m[2]);

if(monthIndex>=0){

let d=
new Date(
year-543,
monthIndex,
day
);

d.setDate(
d.getDate()+1
);

return[
String(d.getDate()),
months[d.getMonth()],
String(d.getFullYear()+543)
].join(' ');

}

}

return'งวดถัดไป';

}

};

function enterConsole(){

sessionStorage.setItem(
'mester_auth_ok',
'1'
);

'mester_auto_login',
'1'
);

$('login')

$('console')
.classList.add('active');

$('loginErr').style.display='none';

}

function login(){

const value=
$('password').value;

if(sec.ok(value))
enterConsole();
else
$('loginErr').style.display='block';

}

function initAuth(){

if(
sessionStorage.getItem(
'mester_auth_ok'
)==='1'||
localStorage.getItem(
'mester_auto_login'
)==='1'
)
enterConsole();

}

$('loginBtn').onclick=login;

$('password').addEventListener(
'keydown',
e=>{
if(e.key==='Enter')
login();
}
);

initAuth();

$('logout').onclick=()=>{

sessionStorage.removeItem(
'mester_auth_ok'
);

);
