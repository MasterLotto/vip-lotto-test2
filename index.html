<script>
(()=>{

/* ==========================================================
   VISUAL PARTICLES
========================================================== */

const c=document.getElementById('snow');
const x=c.getContext('2d');

let w=c.width=innerWidth;
let h=c.height=innerHeight;

addEventListener('resize',()=>{
  w=c.width=innerWidth;
  h=c.height=innerHeight;
});

const particles=Array.from(
  {length:42},
  ()=>({
    x:Math.random()*w,
    y:Math.random()*h,
    r:.7+Math.random()*1.8,
    s:.15+Math.random()*.45,
    a:.18+Math.random()*.35,
    p:Math.random()*6.28,
    tone:Math.random()>.72?'rose':'gold'
  })
);

(function draw(){

  x.clearRect(0,0,w,h);

  particles.forEach(q=>{

    q.p+=.01;
    q.y+=q.s;
    q.x+=Math.sin(q.p)*.25;

    if(q.y>h+5){
      q.y=-5;
      q.x=Math.random()*w;
    }

    x.beginPath();
    x.arc(q.x,q.y,q.r,0,Math.PI*2);

    x.fillStyle=
      q.tone==='rose'
      ?`rgba(185,130,121,${q.a*.55})`
      :`rgba(195,154,67,${q.a})`;

    x.fill();

  });

  requestAnimationFrame(draw);

})();


/* ==========================================================
   UTILITIES
========================================================== */

const $=id=>document.getElementById(id);

const esc=s=>
  String(s)
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;')
  .replace(/'/g,'&#039;');


/* ==========================================================
   AUTH
   AUTO LOGIN IS ENABLED.
========================================================== */

const sec={

  tokens:[
    '4d617374657241646d696e32303236',
    '54396b4c326d5037',
    '5a71345738785431'
  ],

  dec(h){
    let s='';
    for(let i=0;i<h.length;i+=2){
      s+=String.fromCharCode(
        parseInt(h.slice(i,i+2),16)
      );
    }
    return s;
  },

  ok(v){
    return this.tokens.some(
      t=>v===this.dec(t)
    );
  }

};


/* ==========================================================
   MAIN APP
========================================================== */

const app={

cache:[],

lastCopyText:'',

toastTimer:null,

audio(){},

/* ----------------------------------------------------------
   BASIC MATH
---------------------------------------------------------- */

norm(x){
  return(x%10+10)%10;
},

clamp(v,lo=0,hi=1){
  return Math.max(
    lo,
    Math.min(hi,Number(v)||0)
  );
},

mean(arr,fallback=.5){

  if(!Array.isArray(arr)||!arr.length){
    return fallback;
  }

  return arr.reduce(
    (a,b)=>a+b,
    0
  )/arr.length;
},

std(arr){

  if(!Array.isArray(arr)||arr.length<2){
    return 0;
  }

  const m=this.mean(arr,0);

  return Math.sqrt(
    arr.reduce(
      (s,v)=>s+Math.pow(v-m,2),
      0
    )/arr.length
  );
},

normalizeScores(map){

  const vals=Object.values(map);

  const max=Math.max(...vals,0);

  if(max<=0){

    return Object.fromEntries(
      Object.keys(map).map(k=>[k,0])
    );

  }

  return Object.fromEntries(
    Object.entries(map).map(
      ([k,v])=>[
        k,
        this.clamp(v/max)
      ]
    )
  );

},

sourceBreadthScore(v){

  return this.clamp(
    1-Math.exp(
      -Math.max(0,v)/1.6
    )
  );

},

consensusTier(count,total){

  const n=Math.max(
    1,
    total||1
  );

  if(count>=n)return 1;

  if(count===2&&n===3)return .78;

  if(count>=2)return .68;

  if(count===1)return .30;

  return 0;

},

        'ยังไม่มีข้อมูลสำหรับประมวลผล'
      ]
    };

  }

  const lines=z
    .split('\n')
    .map(v=>v.trim());

  const records=[];
  const errors=[];

  let i=0;

  while(i<lines.length){

    if(!lines[i]){
      i++;
      continue;
    }

    const m=lines[i].match(
      /^(.+?)\s*\|\s*(.+?)$/
    );

    if(!m){

      errors.push(
        `บรรทัดที่ ${i+1}: ไม่พบรูปแบบ "ชื่อหวย | วันที่"`
      );

      i++;
      continue;
    }

    const name=m[1].trim();
    const date=m[2].trim();

    if(!this.parseDateValue(date)){

      errors.push(
        `${name} | ${date}: รูปแบบวันที่ไม่ถูกต้อง เช่น 25 ส.ค. 69`
      );

      i++;
      continue;
    }

    const n3raw=lines[i+1]||'';
    const n2raw=lines[i+2]||'';

    const n3=/^[\d\s]+$/.test(n3raw)
      ?n3raw.replace(/\s+/g,'')
      :n3raw;

    const n2=/^[\d\s]+$/.test(n2raw)
      ?n2raw.replace(/\s+/g,'')
      :n2raw;

    if(!/^\d{3}$/.test(n3)){

      errors.push(
        `${name} | ${date}: เลข 3 ตัวบนต้องเป็น 3 หลัก`
      );

      i+=1;
      continue;
    }

    if(!/^\d{2}$/.test(n2)){

      errors.push(
        `${name} | ${date}: เลข 2 ตัวล่างต้องเป็น 2 หลัก`
      );

      i+=2;
      continue;
    }

    records.push({
      name,
      date,
      n3,
      n2
    });

    i+=3;
  }

  return{
    records,
    errors
  };

},

parseDateValue(date){

  const s=String(date||'').trim();

  if(!s)return false;

  if(/^\d{1,2}\s+\S+\s+\d{2,4}$/.test(s))
    return true;

  if(/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(s))
    return true;

  if(/^\d{1,2}-\d{1,2}-\d{2,4}$/.test(s))
    return true;

  return false;

},

dateKey(date){

  const s=String(date||'').trim();

  const m=s.match(
    /^(\d{1,2})\s+(\S+)\s+(\d{2,4})$/
  );

  if(m){

    const months={
      'ม.ค.':1,
      'ก.พ.':2,
      'มี.ค.':3,
      'เม.ย.':4,
      'พ.ค.':5,
      'มิ.ย.':6,
      'ก.ค.':7,
      'ส.ค.':8,
      'ก.ย.':9,
      'ต.ค.':10,
      'พ.ย.':11,
      'ธ.ค.':12
    };

    const month=months[m[2]]||0;

    let year=Number(m[3]);

    if(year<100){
      year+=2500;
    }

    return[
      year,
      String(month).padStart(2,'0'),
      String(Number(m[1])).padStart(2,'0')
    ].join('-');

  }

  const m2=s.match(
    /^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/
  );

  if(m2){

    let year=Number(m2[3]);

    if(year<100){
      year+=2500;
    }

    return[
      year,
      String(Number(m2[2])).padStart(2,'0'),
      String(Number(m2[1])).padStart(2,'0')
    ].join('-');

  }

  return s;
},

sortChronological(records){

  return records
    .map((r,index)=>({
      ...r,
      __index:index
    }))
    .sort((a,b)=>{

      const ka=this.dateKey(a.date);
      const kb=this.dateKey(b.date);

      if(ka<kb)return-1;
      if(ka>kb)return 1;

      return a.__index-b.__index;

    })
    .map(r=>{

      const z={...r};

      delete z.__index;

      return z;

    });

},

groupByLottery(records){

  const groupsMap={};

  records.forEach((r,index)=>{

    const key=r.name.trim();

    if(!groupsMap[key]){

      groupsMap[key]={
        name:key,
        records:[],
        duplicateCount:0,
        conflictCount:0,
        __order:index
      };

    }

    groupsMap[key].records.push(r);

  });

  const groups=Object.values(groupsMap);

  groups.forEach(g=>{

    const sorted=this.sortChronological(g.records);

    const byDate=new Map();
    const clean=[];

    sorted.forEach(r=>{

      const key=this.dateKey(r.date);

      if(!byDate.has(key)){

        byDate.set(key,r);
        clean.push(r);
        return;

      }

      const previous=byDate.get(key);

      if(
        previous.n3===r.n3 &&
        previous.n2===r.n2
      ){

        g.duplicateCount++;
        return;

      }

      g.conflictCount++;

      const idx=clean.indexOf(previous);

      if(idx>=0){
        clean[idx]=r;
      }

      byDate.set(key,r);

    });

    g.records=this.sortChronological(clean);

  });

  return groups
    .sort((a,b)=>a.__order-b.__order)
    .map(g=>{

      delete g.__order;

      return g;

    });

},

/* ==========================================================
   PROTECTED PAIR / เลขเจาะ ENGINE
   EXACT ORIGINAL
========================================================== */

buildPairs(models,anchor){

  models.forEach(m=>{

    let range=[];
    let collision=false;

    for(let o=-2;o<=2;o++){

      if(
        m.set.includes(
          this.norm(anchor+o)
        )
      ){

        collision=true;
        break;

      }

    }

    for(
      let o=collision?-3:-2;
      o<=(collision?3:2);
      o++
    ){

      range.push(
        this.norm(anchor+o)
      );

    }

    m.pairsMap={};

    m.set.forEach(src=>{

      let pairs=range
        .filter(
          p=>p!==src&&!m.set.includes(p)
        )
        .map(
          p=>`${src}${p}`
        );

      let next=(src+1)%10;

      while(pairs.length<5){

        if(
          next!==src&&
          !m.set.includes(next)&&
          !pairs.includes(
            `${src}${next}`
          )
        ){

          pairs.push(
            `${src}${next}`
          );

        }

        next=(next+1)%10;

      }

      m.pairsMap[src]=[
        ...new Set(pairs)
      ]
      .filter(
        p=>p[0]!==p[1]
      )
      .slice(0,5);

    });

  });

},

   FEATURE VECTOR

featureVector(record){

  const d3=
    String(record.n3)
    .padStart(3,'0')
    .split('')
    .map(Number);

  const d2=
    String(record.n2)

    R1,
    R2,
    sumT,
    sumB,
    (sumT+sumB)%10
  ];

},


/* ==========================================================
   CIRCULAR DIGIT DISTANCE
========================================================== */

digitDistance(a,b){

  const d=Math.abs(a-b);

  return Math.min(
    d,
    10-d
  );

},


/* ==========================================================
   FEATURE SIMILARITY
========================================================== */

featureSimilarity(a,b){

  const A=this.featureVector(a);
  const B=this.featureVector(b);

  /*
    The weighting is deliberately conservative.
    It prevents one coincidental digit from dominating.
  */

  const weights=[
    .12,
    .15,
    .12,
    .12,
    .15,
    .12,
    .10,
    .12
  ];

  let s=0;
  let w=0;

  for(let i=0;i<A.length;i++){

    const dist=this.digitDistance(
      A[i],
      B[i]
    );

    const part=
      dist===0
      ?1
      :dist===1
      ?.55
      :dist===2
      ?.20
      :0;

    s+=weights[i]*part;
    w+=weights[i];

  }

  return this.clamp(
    s/w
  );

},


/* ==========================================================
   MODEL 03
   HISTORICAL SIMILARITY + RECENCY
========================================================== */

m03Predict(source,records){

  const ordered=this.sortChronological(
    records||[]
  );

  const candidates=[];

  const global=
    Array.from(
      {length:10},
      ()=>0
    );

  let totalTargets=0;

  for(let i=1;i<ordered.length;i++){

    const pastSource=ordered[i-1];
    const target=ordered[i];

    const sim=
      this.featureSimilarity(
        source,
        pastSource
      );

    /*
      V13:
      0.60 remains the minimum similarity gate.
      No lowering merely to manufacture samples.
    */

    if(sim<0.60){
      continue;
    }

    const age=
      ordered.length-1-i;

    const recency=
      Math.pow(
        .985,
        Math.max(0,age)
      );

    /*
      Similarity is squared.
      Strong matches therefore matter more,
      but not infinitely more.
    */

    const similarityWeight=
      Math.pow(
        .55+.45*sim,
        2
      );

    const weight=
      similarityWeight*
      recency;

    const actual=
      this.actualDigits(target);

    actual.forEach(d=>{
      global[d]+=weight;
    });

    totalTargets+=weight;

    candidates.push({
      index:i,
      similarity:sim,
      weight,
      targetDate:target.date,
      actual:[...actual]
    });

  }

  if(!candidates.length){

    return{
      set:[],
      scores:{},
      matches:0,
      details:[]
    };

  }

  const scores=
    Array.from(
      {length:10},
      (_,d)=>
        global[d]/
        Math.max(
          totalTargets,
          1
        )
    );

  /*
    Stability filter:
    If the best digit is only marginally above
    the second digit, do not manufacture confidence.
  */

  const ranked=
    scores
      .map(
        (score,d)=>({
          d,
          score
        })
      )
      .sort(
        (a,b)=>
          b.score-a.score||
          a.d-b.d
      );

  return{

    set:
      ranked
      .slice(0,2)
      .map(x=>x.d),

    scores:
      Object.fromEntries(
        ranked.map(
          x=>[x.d,x.score]
        )
      ),

    matches:candidates.length,

    details:
      candidates.slice(-20)

  };

},


/* ==========================================================
   BAYESIAN STABILIZATION
========================================================== */

posterior(
  rate,
  samples,
  prior=.5,
  priorN=6
){

  const n=Math.max(
    0,
    Number(samples)||0
  );

  return(
    rate*n+
    prior*priorN
  )/
  (
    n+priorN
  );

},


/* ==========================================================
   EFFECTIVE SAMPLE SIZE
========================================================== */

effectiveSample(
  samples,
  recentSamples=0,
  matches=0
){

  const a=Math.max(
    0,
    Number(samples)||0
  );

  const b=Math.max(
    0,
    Number(recentSamples)||0
  );

  const c=Math.max(
    0,
    Number(matches)||0
  );

  /*
    Do not simply add samples.
    Recent observations overlap with long-term evidence.
  */

  return Math.max(
    0,
    Math.min(
      40,
      a+
      .35*b+
      .25*c
    )
  );

},


/* ==========================================================
   ADAPTIVE MODEL WEIGHT
========================================================== */

modelWeight(m,history){

  const hp=
    history&&
    history.modelPerf&&
    history.modelPerf[m.id];

  if(!hp){
    return 1;
  }

  const long=
    this.posterior(
      hp.long,
      hp.samples,
      .5,
      8
    );

  const recent=
    this.posterior(
      hp.recent,
      hp.recentSamples||0,
      .5,
      5
    );

  const base=
    this.posterior(
      hp.baseRate,
      hp.samples,
      .5,
      6
    );

  const plus=
    this.posterior(
      hp.plusRate,
      hp.samples,
      .5,
      6
    );

  const variant=
    Math.max(
      base,
      plus
    );

  /*
    Model weight is deliberately bounded.
    No model can dominate solely because of a
    short lucky streak.
  */

  const blended=
    .40*long+
    .25*recent+
    .15*(hp.stability??.5)+
    .20*variant;

  const sampleFactor=
    this.clamp(
      Math.sqrt(
        Math.max(
          0,
          hp.samples
        )/
        (
          Math.max(
            1,
            hp.samples
          )+8
        )
      )
    );

  const raw=
    .86+
    .34*this.clamp(
      blended
    );

  return(
    1+
    sampleFactor*(raw-1)
  );

},

formulaWeight(id,history){

      H+T+U;

    const F=this.formulas(
      H,T,U,
      R1,R2,
      sumT,
      R1+R2,
      sumT+R1+R2
    );

    /*
      Model 01 and Model 02 are tested exactly
      as the live system will use them.
    */

    const models=
      this.buildModels(
        H,T,U,
        R1,R2,
        sumT,
        null
      );

    const actual=
      this.actualDigits(
        target
      );

    const recent=
      i>
      ordered.length-1-recentWindow;

    const recencyWeight=
      Math.pow(
        .92,
        ordered.length-1-i
      );

    models
      .slice(0,2)
      .forEach(m=>{

        const unique=[
          ...new Set(m.set)
        ];

        const hit=
          unique.filter(
            d=>actual.has(d)
          ).length/
          Math.max(
            1,
            unique.length
          );

        const mp=
          modelPerf[m.id];

        const base=m.base;
        const plus=
          (base+1)%10;

        mp.hits+=hit;
        mp.samples++;

        mp.baseHits+=
          actual.has(base)
          ?1
          :0;

        mp.plusHits+=
          actual.has(plus)
          ?1
          :0;

        if(hit===0){
          mp.misses++;
        }

        if(recent){

          mp.recentHits+=
            hit*
            recencyWeight;

          mp.recentWeight+=
            recencyWeight;

          mp.recentSamples++;

        }

      });


    F.signals.forEach(sig=>{

      const fp=
        formulaPerf[sig.id];

      const hit=
        actual.has(sig.value)
        ?1
        :0;

      fp.hits+=hit;
      fp.samples++;

      if(recent){

        fp.recentHits+=
          hit*
          recencyWeight;

        fp.recentWeight+=
          recencyWeight;

        fp.recentSamples++;

      }

    });


    const candidateDigits=
      new Set(
        models
          .slice(0,2)
          .flatMap(
            m=>m.set
          )
      );

    candidateDigits.forEach(d=>{

      const dp=
        digitPerf[d];

      const hit=
        actual.has(d)
        ?1
        :0;

      dp.hits+=hit;
      dp.samples++;

      if(recent){

        dp.recentHits+=
          hit*
          recencyWeight;

        dp.recentWeight+=
          recencyWeight;

        dp.recentSamples++;

      }

    });


    transitions.push({

      index:i,

      sourceDate:source.date,

      targetDate:target.date,

      source,

      target,

      models:
        models.slice(0,2),

      formulaSignals:F.signals,

      actual:[
        ...actual
      ]

    });

  }


  /* --------------------------------------------------------
     MODEL PERFORMANCE
  -------------------------------------------------------- */

  Object.values(
    modelPerf
  ).forEach(mp=>{

    mp.long=
      mp.samples
      ?mp.hits/mp.samples
      :.5;

    mp.recent=
      mp.recentWeight
      ?mp.recentHits/mp.recentWeight
      :mp.long;

    mp.stability=
      1-
      Math.min(
        1,
        Math.abs(
          mp.long-mp.recent
        )*2
      );

    mp.baseRate=
      mp.samples
      ?mp.baseHits/mp.samples
      :.5;

    mp.plusRate=
      mp.samples
      ?mp.plusHits/mp.samples
      :.5;

  });


  /* --------------------------------------------------------
     FORMULA PERFORMANCE
  -------------------------------------------------------- */

  Object.values(
    formulaPerf
  ).forEach(fp=>{

    fp.long=
      fp.samples
      ?fp.hits/fp.samples
      :.5;

    fp.recent=
      fp.recentWeight
      ?fp.recentHits/fp.recentWeight
      :fp.long;

  });


  /* --------------------------------------------------------
     DIGIT PERFORMANCE
  -------------------------------------------------------- */

  for(let d=0;d<=9;d++){

    const dp=
      digitPerf[d];

    if(!dp.samples){
      continue;
    }

    dp.long=
      dp.hits/
      dp.samples;

    dp.recent=
      dp.recentWeight
      ?dp.recentHits/dp.recentWeight
      :dp.long;

    dp.stability=
      1-
      Math.min(
        1,
        Math.abs(
          dp.long-dp.recent
        )*2
      );

    let streak=0;

    for(
      let j=transitions.length-1;
      j>=0;
      j--
    ){

      const tr=
        transitions[j];

      if(
        !tr.models.some(
          m=>m.set.includes(d)
        )
      ){
        continue;
      }

      if(
        tr.actual.includes(d)
      ){

        streak++;

        dp.maxStreak=
          Math.max(
            dp.maxStreak,
            streak
          );

      }else{

        break;

      }

    }

    dp.streak=streak;

  }


  /* --------------------------------------------------------
     MODEL 03 WALK-FORWARD VALIDATION
  -------------------------------------------------------- */

  const m03Perf={
    samples:0,
    patternSamples:0,
    baseHits:0,
    plusHits:0,
    misses:0,
    long:.5,
    recent:.5,
    stability:.5,
    foldRates:[]
  };

  const m03FoldRates=[];

  /*
    Start only when enough training data exists.
    This prevents 2-3 observations from controlling M03.
  */

  for(let i=2;i<ordered.length;i++){

    const source=
      ordered[i-1];

    const train=
      ordered.slice(
        0,
        i
      );

    const pred=
      this.m03Predict(
        source,
        train
      );

    const actual=
      this.actualDigits(
        ordered[i]
      );

    if(!pred.set.length){
      continue;
    }

    const hit=
      pred.set.filter(
        d=>actual.has(d)
      ).length/
      Math.max(
        1,
        pred.set.length
      );

    m03Perf.samples++;

    m03Perf.patternSamples+=
      pred.matches||0;

    m03Perf.baseHits+=
      pred.set[0]!==undefined &&
      actual.has(pred.set[0])
      ?1
      :0;

    m03Perf.plusHits+=
      pred.set[1]!==undefined &&
      actual.has(pred.set[1])
      ?1
      :0;

    if(hit===0){
      m03Perf.misses++;
    }

    m03FoldRates.push(hit);

  }


  if(m03Perf.samples){

    m03Perf.long=
      (
        m03Perf.baseHits+
        m03Perf.plusHits
      )/
      (
        m03Perf.samples*2
      );

    /*
      Recent performance is estimated from
      the last few walk-forward folds.
    */

    const recentFolds=
      m03FoldRates.slice(-8);

    m03Perf.recent=
      recentFolds.length
      ?this.mean(recentFolds)
      :m03Perf.long;

    m03Perf.stability=
      this.clamp(
        1-
        this.std(m03FoldRates)*2.5
      );

    m03Perf.foldRates=
      m03FoldRates;

  }


  /*
    Current M03 prediction:
    training excludes current source.
  */

  const current=
    this.m03Predict(
      ordered[ordered.length-1],
      ordered.slice(
        0,
        -1
      )
    );


  /* --------------------------------------------------------
     OVERALL WALK-FORWARD QUALITY
  -------------------------------------------------------- */

  const wfRates=
    transitions
      .map((tr,index)=>{

        const candidates=
          tr.models
            .slice(0,2)
            .flatMap(
              m=>m.set
            );

        const unique=[
          ...new Set(candidates)
        ];

        if(!unique.length){
          return null;
        }

        const hit=
          unique.some(
            d=>tr.actual.includes(d)
          )
          ?1
          :0;

        return hit;

      })
      .filter(
        v=>v!==null
      );

  const wfAverage=
    wfRates.length
    ?this.mean(wfRates)
    :.5;

  const wfStability=
    wfRates.length
    ?this.clamp(
      1-
      this.std(wfRates)*.5
    )
    :.5;


  return{

    modelPerf,

    formulaPerf,

    digitPerf,

    transitions,

    usable,

    recentWindow,

    m03:{
      ...m03Perf,

      currentSet:
        current.set.slice(0,2),

      scores:
        current.scores||{},

      matches:
        current.matches||0,

      samples:
        m03Perf.samples,

      patternSamples:
        current.matches||0,

      baseHits:
        m03Perf.baseHits,

      plusHits:
        m03Perf.plusHits,

      misses:
        m03Perf.misses,

      long:
        m03Perf.long,

      recent:
        m03Perf.recent,

      stability:
        m03Perf.stability
    },

    walkForward:{
      folds:wfRates.length,
      average:wfAverage,
      stability:wfStability,
      rates:wfRates
    }

  };

},


/* ==========================================================
   SCORE ENGINE V13
========================================================== */

scoreDigits(
  models,
  F,
  H,T,U,
  R1,R2,
  sumT,sumB,total,
  history
){

  const score=
    Object.fromEntries(
      Array.from(
        {length:10},
        (_,d)=>[
          d,
          {
            digit:d,

            modelScore:0,

            formula100Score:0,

            radarScore:0,

            backendScore:0,

            winSetScore:0,

            selectorBonus:0,

            selectorScore:0,

            historicalScore:.5,

            recentFormScore:.5,

            stabilityScore:.5,

            hotStreakBonus:1,

            confidence:0,

            redundancyPenalty:1,

            modelConsensusCount:0,

            supportSignals:0,

            conflictSignals:0,

            reliabilityScore:.5,

            evidenceScore:.5,

            uncertainty:1,

            selectionPenalty:1,

            selectionScore:0,

            totalScore:0,

            qualityGate:1,

            modelId:null,

            modelSupportScore:0,

            modelPriority:1,

            selectedModel:false,

            m03Score:0,

            consensusStrength:0,

            historicalDepth:0,

            conflictPenalty:1,

            stabilityGate:1

          }
        ]
      )
    );


  const allowed=new Set();

  const modelWeights={};

  let totalModelWeight=0;


  /* --------------------------------------------------------
     MODEL WEIGHTS
  -------------------------------------------------------- */

  models.forEach(m=>{

    const mw=
      m.id===3
      ?this.m03Weight(history)
      :this.modelWeight(
        m,
        history
      );

    modelWeights[m.id]=mw;

    m.historyWeight=mw;

    totalModelWeight+=mw;

    m.set.forEach(d=>{

      if(Number.isInteger(d)){
        allowed.add(d);
      }

    });

  });


  /* --------------------------------------------------------
     MODEL CONSENSUS
  -------------------------------------------------------- */

  for(let d=0;d<=9;d++){

    const supporters=
      models.filter(
        m=>m.set.includes(d)
      );

    score[d].modelConsensusCount=
      supporters.length;

    score[d].modelScore=
      totalModelWeight
      ?supporters.reduce(
        (sum,m)=>
          sum+modelWeights[m.id],
        0
      )/
      totalModelWeight
      :0;

    score[d].modelSupportScore=
      score[d].modelScore;

    score[d].modelId=
      supporters[0]?.id??null;

    score[d].m03Score=
      history?.m03?.scores?.[d]??0;

    score[d].consensusStrength=
      this.consensusTier(
        supporters.length,
        models.length
      );

  }


  /* --------------------------------------------------------
     100-FORMULA SUPPORT
  -------------------------------------------------------- */

  const weightedFormulaCounts=
    Object.fromEntries(
      Array.from(
        {length:10},
        (_,d)=>[d,0]
      )
    );

  F.signals.forEach(sig=>{

    weightedFormulaCounts[
      sig.value
    ]+=this.formulaWeight(
      sig.id,
      history
    );

  });

  const maxF=
    Math.max(
      ...Object.values(
        weightedFormulaCounts
      ),
      1
    );

  for(let d=0;d<=9;d++){

    score[d].formula100Score=
      this.clamp(
        weightedFormulaCounts[d]/
        maxF
      );

  }


  /* --------------------------------------------------------
     RADAR
  -------------------------------------------------------- */

  const x=(R1+R2)%10;
  const y=sumT%10;
  const z=total%10;

  const r1=[
    this.norm(x-1),
    x,
    this.norm(x+1)
  ];

  const r2=[
    this.norm(y-1),
    y,
    this.norm(y+1)
  ];

  const r3=[
    this.norm(z-1),
    z,
    this.norm(z+1)
  ];

  for(let d=0;d<=9;d++){

    let h=0;

    if(r1.includes(d))h++;
    if(r2.includes(d))h++;
    if(r3.includes(d))h++;

    score[d].radarScore=
      h/3;

  }


  /* --------------------------------------------------------
     BACKEND SIGNALS
  -------------------------------------------------------- */

  const back=[
    (2*H+R1)%10,
    (T+R2)%10,
    sumT%10,
    Math.abs(T-U)%10,
    total%10
  ];

  for(let d=0;d<=9;d++){

    score[d].backendScore=
      back.includes(d)
      ?1
      :0;

    score[d].winSetScore=
      (
        d===z||
        d===this.norm(z+5)
      )
      ?1
      :0;


    /* ------------------------------------------------------
       HISTORICAL DIGIT EVIDENCE
    ------------------------------------------------------ */

    const dp=
      history&&
      history.digitPerf&&
      history.digitPerf[d];

    if(
      dp&&
      dp.samples
    ){

      const longPost=
        this.posterior(
          dp.long,
          dp.samples,
          .5,
          6
        );

      const recentPost=
        this.posterior(
          dp.recent,
          dp.recentSamples||0,
          .5,
          4
        );

      score[d].historicalScore=
        longPost;

      score[d].recentFormScore=
        recentPost;

      score[d].stabilityScore=
        dp.stability??.5;

      score[d].evidenceScore=
        this.clamp(
          .55*longPost+
          .35*recentPost+
          .10*(dp.stability??.5)
        );

      score[d].historicalDepth=
        this.effectiveSample(
          dp.samples,
          dp.recentSamples
        );

      score[d].uncertainty=
        1/
        Math.sqrt(
          dp.samples+1
        );

      const streak=
        Math.max(
          0,
          dp.streak||0
        );

      /*
        Hot streak is deliberately tiny.
        It must never override consensus.
      */

      score[d].hotStreakBonus=
        1+
        Math.min(
          .025,
          Math.max(
            0,
            streak-1
          )*.006
        );

    }


  }


  /* --------------------------------------------------------
     FINAL SCORE
  -------------------------------------------------------- */

  for(let d=0;d<=9;d++){

    const v=score[d];

    const consensus=
      v.modelScore;

    const supportValues=[
      v.formula100Score,
      v.radarScore,
      v.backendScore,
      v.winSetScore
    ];

    v.supportSignals=
      supportValues.filter(
        x=>x>=.60
      ).length;

    v.conflictSignals=
      supportValues.filter(
        x=>x<=.25
      ).length;


    const sortedSupport=
      [...supportValues]
      .sort(
        (a,b)=>b-a
      );

    const supportStrength=
      this.clamp(
        .40*sortedSupport[0]+
        .24*sortedSupport[1]+
        .14*sortedSupport[2]+
        .08*sortedSupport[3]
      );

    const supportBreadth=
      this.sourceBreadthScore(
        v.supportSignals
      );

    const hist=
      v.evidenceScore;

    const m03Evidence=
      v.m03Score;

    const m03Boost=
      this.clamp(
        m03Evidence*1.65
      );


    /* ------------------------------------------------------
       RELIABILITY
    ------------------------------------------------------ */

    v.reliabilityScore=
      this.clamp(
        .38*consensus+
        .24*hist+
        .12*supportBreadth+
        .10*supportStrength+
        .16*m03Boost
      );


    /* ------------------------------------------------------
       CONSENSUS PRIORITY
    ------------------------------------------------------ */

    /*
      The primary score deliberately gives most weight
      to model agreement and historical evidence.

      This is the central change from the previous version.
    */

    v.totalScore=
      this.clamp(

        .42*consensus+

        .15*v.historicalScore+

        .09*v.recentFormScore+

        .08*v.stabilityScore+

        .10*v.formula100Score+

        .04*v.radarScore+

        .03*v.backendScore+

        .02*v.winSetScore+

        .03*supportBreadth+

        .04*m03Boost

      );


    /* ------------------------------------------------------
       SMALL SAMPLE GUARD
    ------------------------------------------------------ */

    const samples=
      history?.usable||0;

    if(samples<3){

      v.qualityGate=.72;

    }else if(samples<5){

      v.qualityGate=.82;

    }else if(samples<8){

      v.qualityGate=.91;

    }else{

      v.qualityGate=1;

    }

    v.totalScore*=
      v.qualityGate;


    /* ------------------------------------------------------
       HISTORICAL DEPTH ADJUSTMENT
    ------------------------------------------------------ */

    const depth=
      Math.min(
        1,
        (v.historicalDepth||0)/
        10
      );

    /*
      Historical evidence should become stronger
      gradually, not suddenly.
    */

    v.totalScore*=
      .92+
      .08*depth;


    /* ------------------------------------------------------
       MODEL AGREEMENT BONUS
    ------------------------------------------------------ */

    if(
      v.modelConsensusCount===3
    ){

      v.totalScore*=1.045;

    }else if(
      v.modelConsensusCount===2
    ){

      v.totalScore*=1.018;

    }


    /* ------------------------------------------------------
       ALLOWED CANDIDATE BONUS
    ------------------------------------------------------ */

    if(
      allowed.has(v.digit)
    ){

      v.totalScore*=1.04;

    }


    /* ------------------------------------------------------
       CONFLICT PENALTY
    ------------------------------------------------------ */

    /*
      Conflict is stronger when:
      - Model consensus is weak
      - evidence is weak
      - support signals disagree
    */

    const conflictIntensity=
      v.conflictSignals/
      4;

    const disagreement=
      1-
      v.consensusStrength;

    const conflictPenalty=
      1-
      Math.min(
        .18,
        .10*conflictIntensity+
        .08*
        disagreement*
        (1-hist)
      );

    v.conflictPenalty=
      conflictPenalty;

    v.totalScore*=
      conflictPenalty;


    /* ------------------------------------------------------
       DEAD CANDIDATE GUARD
    ------------------------------------------------------ */

    const deadCandidate=
      allowed.has(v.digit)&&
      v.modelConsensusCount<=1&&
      v.reliabilityScore<.30&&
      v.evidenceScore<.40&&
      v.supportSignals===0&&
      m03Boost<.15;

    if(deadCandidate){

      v.selectionPenalty=.82;

      v.totalScore*=.82;

    }


    /* ------------------------------------------------------
       OVERFIT GUARD FOR M03
    ------------------------------------------------------ */

    if(
      m03Evidence>.75&&
      v.modelConsensusCount<=1&&
      v.historicalDepth<5
    ){

      /*
        Do not let M03 create a false super-signal
        from insufficient historical matches.
      */

      v.stabilityGate=.82;

      v.totalScore*=.82;

    }


    /* ------------------------------------------------------
       TINY STREAK BONUS
    ------------------------------------------------------ */

    v.totalScore*=
      v.hotStreakBonus;


    /* ------------------------------------------------------
       FINAL SELECTOR BONUS
    ------------------------------------------------------ */

    const poolStrength=
      v.modelConsensusCount/
      Math.max(
        1,
        models.length
      );

    const supportBreadthRatio=
      v.supportSignals/
      4;

    v.selectorBonus=
      allowed.has(v.digit)
      ?(
        .025*poolStrength+
        .018*supportBreadthRatio+
        .020*Math.max(
          0,
          v.reliabilityScore-.5
        )+
        .020*m03Boost
      )
      :0;

    v.totalScore+=
      Math.min(
        .055,
        v.selectorBonus
      );


    /* ------------------------------------------------------
       UNCERTAINTY
    ------------------------------------------------------ */

    /*
      With only 10 historical rounds, uncertainty remains
      meaningful. This is intentional.
    */

    const uncertaintyPenalty=
      this.clamp(
        1-
        .06*
        Math.min(
          1,
          v.uncertainty
        )
      );

    v.totalScore*=
      uncertaintyPenalty;


    v.selectorScore=
      this.clamp(
        v.totalScore
      );

    v.selectionScore=
      v.selectorScore;

  }


  return{
    score,
    allowed
  };

},


/* ==========================================================
   TOURNAMENT
========================================================== */

tournament(models,score){

  const compareDigits=(a,b)=>{

    if(!a)return b;
    if(!b)return a;

    if(
      Math.abs(
        a.selectorScore-
        b.selectorScore
      )>.000001
    ){

      return
        a.selectorScore>
        b.selectorScore
        ?a
        :b;

    }

    if(
      Math.abs(
        a.evidenceScore-
        b.evidenceScore
      )>.000001
    ){

      return
        a.evidenceScore>
        b.evidenceScore
        ?a
        :b;

    }

    if(
      a.modelConsensusCount!==
      b.modelConsensusCount
    ){

      return
        a.modelConsensusCount>
        b.modelConsensusCount
        ?a
        :b;

    }

    if(
      a.modelSupportScore!==
      b.modelSupportScore
    ){

      return
        a.modelSupportScore>
        b.modelSupportScore
        ?a
        :b;

    }

    if(
      a.stabilityScore!==
      b.stabilityScore
    ){

      return
        a.stabilityScore>
        b.stabilityScore
        ?a
        :b;

    }

    if(
      a.backendScore!==
      b.backendScore
    ){

      return
        a.backendScore>
        b.backendScore
        ?a
        :b;

    }

    if(
      a.formula100Score!==
      b.formula100Score
    ){

      return
        a.formula100Score>
        b.formula100Score
        ?a
        :b;

    }

    return a.digit<=b.digit
      ?a
      :b;

  };


  const modelRounds=
    models.map(model=>{

      const first=
        score[model.set[0]];

      const second=
        score[model.set[1]];

      const winner=
        compareDigits(
          first,
          second
        );

      return{

        modelId:model.id,

        modelName:model.name,

        candidates:[
          first,
          second
        ],

        winner,

        margin:
          Math.abs(
            (first?.selectorScore||0)-
            (second?.selectorScore||0)
          ),

        base:model.base,

        variant:model.variant

      };

    });


  let finalWinner=null;

  const finalists=
    modelRounds
      .filter(x=>x.winner)
      .map(x=>x.winner);


  finalists.forEach(x=>{

    finalWinner=
      compareDigits(
        finalWinner,
        x
      );

  });


  const losers=
    finalists
      .filter(
        x=>x!==finalWinner
      )
      .sort(
        (a,b)=>
          (b?.selectorScore||0)-
          (a?.selectorScore||0)
      );

  const finalLoser=
    losers[0]||null;

  const finalMargin=
    finalWinner&&finalLoser
    ?Math.abs(
      finalWinner.selectorScore-
      finalLoser.selectorScore
    )
    :0;

  const winningModelId=
    finalWinner?.modelId??null;


  if(finalWinner){

    const finalMarginScore=
      this.clamp(
        finalMargin/.10
      );

    const supportBreadth=
      this.sourceBreadthScore(
        finalWinner.supportSignals
      );

    const consensusQuality=
      this.clamp(
        finalWinner.modelConsensusCount/
        3
      );

    const baseConfidence=

      .34*
      this.clamp(
        finalWinner.selectorScore
      )+

      .18*
      finalMarginScore+

      .20*
      this.clamp(
        finalWinner.evidenceScore
      )+

      .12*
      supportBreadth+

      .08*
      this.clamp(
        finalWinner.m03Score*1.65
      )+

      .08*
      consensusQuality;


    finalWinner.confidence=
      this.clamp(
        .30+
        .70*baseConfidence
      );

    finalWinner.finalMargin=
      finalMargin;

    finalWinner.finalOpponent=
      finalLoser?.digit??null;

    finalWinner.finalWinner=true;

  }


  return{

    modelRounds,

    winner01:
      modelRounds.find(
        x=>x.modelId===1
      )?.winner||null,

    winner02:
      modelRounds.find(
        x=>x.modelId===2
      )?.winner||null,

    winner03:
      modelRounds.find(
        x=>x.modelId===3
      )?.winner||null,

    finalWinner,

    finalLoser,

    finalMargin,

    winningModelId

  };

},


/* ==========================================================
   PROTECTED PAIR CANDIDATES
   DO NOT MODIFY
========================================================== */

collectPairCandidates(
  digit,
  models,
  score
){

  const candidates=[];

  models
    .filter(
      m=>m.set.includes(digit)
    )
    .forEach(m=>{

      const sourceStrength=
        Math.max(
          0,
          Math.min(
            1,
            .70*
            (
              (m.historyWeight||1)/
              1.30
            )+
            .30*
            (
              score[digit]
              ?.reliabilityScore??.5
            )
          )
        );

      const digitStrength=
        score[digit]
        ?score[digit].selectorScore
        :0;

      const modelConsensus=
        score[digit]
        ?score[digit].modelScore
        :0;

      (m.pairsMap[digit]||[])
        .forEach(pair=>{

          const key=
            this.pairKey(pair);

          const pairScore=
            .55*sourceStrength+
            .30*digitStrength+
            .15*modelConsensus;

          candidates.push({
            pair:String(pair),
            key,
            pairScore,
            modelId:m.id
          });

        });

    });

  return candidates;

},

bestPairsForDigit(
  digit,
  models,
  score
){

  const candidates=
    this.collectPairCandidates(
      digit,
      models,
      score
    );

  const bestByKey={};

  candidates.forEach(c=>{

    if(
      !bestByKey[c.key]||
      c.pairScore>
      bestByKey[c.key].pairScore
    ){

      bestByKey[c.key]=c;

    }

  });

  return Object.values(
    bestByKey
  )
  .sort(
    (a,b)=>
      b.pairScore-a.pairScore||
      Number(a.key)-Number(b.key)
  )
  .slice(0,5)
  .map(v=>v.pair);

},


pairKey(pair){

  const p=String(pair);

  if(!/^\d{2}$/.test(p)){
    return p;
  }

  return[
    p[0],
    p[1]
  ]
  .sort()
  .join('');

},

buildConsensus(pairSets){

  const all=[];

  pairSets.forEach(
    (set,rowIndex)=>{

      set
        .slice(0,6)
        .forEach(pair=>{

          all.push({
            pair:String(pair),
            rowIndex
          });

        });

    }
  );

  const counts={};

  all.forEach(item=>{

    const key=
      this.pairKey(
        item.pair
      );

    if(!counts[key]){

      counts[key]={
        key,
        score:0,
        rows:new Set(),
        pairs:new Set()
      };

    }

    counts[key].score++;

    counts[key].rows.add(
      item.rowIndex
    );

    counts[key].pairs.add(
      item.pair
    );

  });

  const ranked=
    Object.values(
      counts
    )
    .sort(
      (a,b)=>
        b.score-a.score||
        b.rows.size-a.rows.size||
        Number(a.key)-Number(b.key)
    );

  const colorMap={};

  ranked
    .slice(0,6)
    .forEach(
      (item,index)=>{

        let color;

        if(index<2)
          color='gold';
        else if(index<4)
          color='silver';
        else
          color='rose';

        colorMap[item.key]={
          color,
          rank:index+1,
          score:item.score
        };

      }
    );

  return{
    counts,
    ranked,
    colorMap
  };

},

sortPairs(pairs){

  return pairs
    .map(String)
    .sort(
      (a,b)=>
        Number(a)-Number(b)
    );

},

pairClass(pair,colorMap){

  const info=
    colorMap[
      this.pairKey(pair)
    ];

  if(!info){
    return'pair';
  }

  if(info.color==='gold')
    return'pair pair-gold';

  if(info.color==='silver')
    return'pair pair-silver';

  return'pair pair-rose';

},

formatPct(v){

  return`${Math.round(
    Math.max(
      0,
      Math.min(1,v)
    )*1000
  )/10}%`;

},

formatDate(date){

  const s=
    String(date||'')
    .trim();

  if(
    /\d+\s+\S+\s+\d+/.test(s)
  ){

    const p=
      s.split(/\s+/);

    if(p.length>=3){

      return[
        p[0],
        p[1],
        p.slice(2).join(' ')
      ].join(' · ');

    }

  }

  return s;

},


/* ==========================================================
   MAIN CALCULATOR
========================================================== */

run(
  n3,
  n2,
  history=null
){

  const d3=
    n3.split('').map(Number);

  const d2=
    n2.split('').map(Number);

  const[
    H,
    T,
    U
  ]=d3;

  const[
    R1,
    R2
  ]=d2;

  const sumT=
    H+T+U;

  const sumB=
    R1+R2;

  const total=
    sumT+sumB;


  const F=
    this.formulas(
      H,T,U,
      R1,R2,
      sumT,
      sumB,
      total
    );


  const models=
    this.buildModels(
      H,T,U,
      R1,R2,
      sumT,
      history
    );


  const anchor=
    this.norm(
      7-H
    );


  /*
    PROTECTED PAIR ENGINE
  */

  this.buildPairs(
    models,
    anchor
  );


  const scored=
    this.scoreDigits(
      models,
      F,
      H,T,U,
      R1,R2,
      sumT,sumB,total,
      history
    );


  const tournament=
    this.tournament(
      models,
      scored.score
    );


  const finalWinner=
    tournament.finalWinner;

  const top1Digits=
    finalWinner
    ?[finalWinner.digit]
    :[];


  let pairSet=
    finalWinner
    ?this.bestPairsForDigit(
      finalWinner.digit,
      models,
      scored.score
    )
    :[];


  /*
    PROTECTED EXISTING BEHAVIOR:
    add final winner + final loser pair.
  */

  if(
    finalWinner&&
    tournament.finalLoser&&
    Number.isInteger(
      finalWinner.digit
    )&&
    Number.isInteger(
      tournament.finalLoser.digit
    )
  ){

    const extraPair=
      `${finalWinner.digit}${tournament.finalLoser.digit}`;

    if(
      /^\d{2}$/.test(extraPair)&&
      !pairSet.includes(extraPair)
    ){

      pairSet=[
        ...pairSet,
        extraPair
      ];

    }

  }


  const consensus=
    this.buildConsensus(
      [pairSet]
    );


  return{

    top1Digit:
      finalWinner
      ?finalWinner.digit
      :null,

    top2Digits:
      top1Digits,

    pairSets:[
      pairSet
    ],

    modelScores:
      scored.score,

    modelCount:3,

    models,

    tournament,

    selectedModelId:
      tournament.winningModelId,

    selectedModel:
      models.find(
        m=>
          m.id===
          tournament.winningModelId
      )||null,

    confidence:
      finalWinner
      ?finalWinner.confidence
      :0,

    finalMargin:
      tournament.finalMargin,

    consensus,

    allowed:
      scored.allowed

  };

},


/* ==========================================================
   CAPTURE
========================================================== */

async captureCard(
  cardId,
  name
){

  const el=
    document.getElementById(
      cardId
    );

  if(!el)return;

  const controls=[
    ...el.querySelectorAll(
      '[data-no-capture]'
    )
  ];

  try{

    if(
      typeof html2canvas===
      'undefined'
    ){

      throw new Error(
        'ไม่พบระบบแคปภาพ กรุณาเปิดอินเทอร์เน็ตแล้วลองใหม่'
      );

    }

    controls.forEach(
      x=>
        x.style.visibility='hidden'
    );

    const canvas=
      await html2canvas(
        el,
        {
          backgroundColor:'#ffffff',
          scale:Math.min(
            3,
            Math.max(
              2,
              window.devicePixelRatio||2
            )
          ),
          useCORS:true,
          logging:false
        }
      );

    const link=
      document.createElement(
        'a'
      );

    const safe=
      String(name||'lottery')
      .replace(
        /[^ก-๙A-Za-z0-9_-]+/g,
        '_'
      )
      .slice(0,60);

    link.download=
      `${safe||'lottery'}_card.png`;

    link.href=
      canvas.toDataURL(
        'image/png'
      );

    link.click();

    this.show(
      '✓ แคปการ์ดแล้ว'
    );

  }catch(err){

    console.error(err);

    this.show(
      '❌ แคปภาพไม่สำเร็จ'
    );

  }finally{

    controls.forEach(
      x=>
        x.style.visibility=''
    );

  }

},


/* ==========================================================
   COPY
========================================================== */

copy(text){

  navigator.clipboard
    ?.writeText(text)
    .then(
      ()=>this.show()
    )
    .catch(()=>{

      const t=
        document.createElement(
          'textarea'
        );

      t.value=text;

      document.body.appendChild(t);

      t.select();

      document.execCommand(
        'copy'
      );

      t.remove();

      this.show();

    });

},

show(message){

  const t=$('toast');

  if(message){
    t.textContent=message;
  }

  t.classList.add(
    'show'
  );

  clearTimeout(
    this.toastTimer
  );

  this.toastTimer=
    setTimeout(
      ()=>t.classList.remove(
        'show'
      ),
      1500
    );

},


/* ==========================================================
   NEXT DATE
========================================================== */

nextDateLabel(records){

  if(!records.length)
    return'';

  const latest=
    records[
      records.length-1
    ];

  const s=
    String(
      latest.date||''
    ).trim();

  const m=
    s.match(
      /^(\d{1,2})\s+(\S+)\s+(\d{2,4})$/
    );

  if(m){

    const day=
      Number(m[1]);

    let year=
      Number(m[3]);

    if(year<100){
      year+=2500;
    }

    const months=[
      'ม.ค.',
      'ก.พ.',
      'มี.ค.',
      'เม.ย.',
      'พ.ค.',
      'มิ.ย.',
      'ก.ค.',
      'ส.ค.',
      'ก.ย.',
      'ต.ค.',
      'พ.ย.',
      'ธ.ค.'
    ];

    const monthIndex=
      months.indexOf(
        m[2]
      );

    if(monthIndex>=0){

      let d=
        new Date(
          year-543,
          monthIndex,
          day
        );

      d.setDate(
        d.getDate()+1
      );

      return[
        String(d.getDate()),
        months[d.getMonth()],
        String(
          d.getFullYear()+543
        )
      ].join(' ');

    }

  }

  return'งวดถัดไป';

},

confidenceLabel(v){

  if(v>=.72)
    return{
      cls:'confidence-high',
      text:'เสถียรสูง'
    };

  if(v>=.55)
    return{
      cls:'confidence-mid',
      text:'เสถียรปานกลาง'
    };

  return{
    cls:'confidence-low',
    text:'หลักฐานยังน้อย'
  };

},


/* ==========================================================
   CALCULATE
========================================================== */

async calculate(){

  const parsed=
    this.parse(
      $('bulkInput').value
    );

  if(
    !parsed.records.length
  ){

    $('result').innerHTML=
      '<div class="errorbox">❌ ไม่พบข้อมูลที่ถูกต้อง กรุณาตรวจรูปแบบอีกครั้ง</div>';

    return;

  }


  const scanner=
    $('scanner');

  const btn=
    $('run');

  btn.disabled=true;

  scanner.style.display=
    'block';


  const scan=
    msg=>
      $('scanText')
      .textContent=msg;


  const yieldUI=
    ()=>new Promise(
      resolve=>
        requestAnimationFrame(
          resolve
        )
    );


  try{

    scan(
      'อ่านข้อมูล 3 ตัวบน + 2 ตัวล่าง...'
    );

    await yieldUI();


    this.cache=[];

    const groups=
      this.groupByLottery(
        parsed.records
      );

    const cards=[];
    const outputData=[];
    const copyBlocks=[];

    let groupIndex=0;


    for(
      const group of groups
    ){

      groupIndex++;

      const records=
        group.records;

      if(!records.length)
        continue;


      const latest=
        records[
          records.length-1
        ];


      scan(
        `สร้าง Walk-forward history ${group.name} • ${groupIndex}/${groups.length}`
      );

      await yieldUI();


      const history=
        this.buildHistory(
          records
        );


      scan(
        `Adaptive Model 01/02/03 • ${group.name}`
      );

      await yieldUI();


      const a=
        this.run(
          latest.n3,
          latest.n2,
          history
        );


      this.cache.push({
        group:group.name,
        result:a,
        history
      });


      const allowed=
        new Set();

      a.models.forEach(
        m=>
          m.set.forEach(
            d=>
              allowed.add(d)
          )
      );


      const valid=
        a.top1Digit!==null&&
        allowed.has(
          a.top1Digit
        );


      if(!valid){

        parsed.errors.push(
          `${group.name} | ${latest.date}: ไม่สามารถคัดเลข TOP 1 จาก Candidate Pool ของ 3 Main Models ได้`
        );

        continue;

      }


      const digit=
        a.top1Digit;

      const sourcePairs=
        a.pairSets[0]||[];

      const sorted=
        this.sortPairs(
          sourcePairs
        );


      const pairHTML=
        sorted
        .map(pair=>{

          const info=
            a.consensus
            .colorMap[
              this.pairKey(pair)
            ];

          const title=
            info
            ?`อันดับ Consensus ${info.rank} • พบ ${info.score} ครั้ง`
            :'เลขเจาะจาก 3 Main Models';

          return`
            <span
              class="${this.pairClass(
                pair,
                a.consensus.colorMap
              )}"
              title="${esc(title)}"
            >${esc(pair)}</span>
          `;

        })
        .join('');


      const row=`
        <div class="row">
          <span
            class="digit digit-gold"
            aria-label="เลขเด่น"
          >${esc(digit)}</span>

          <span class="sep">:</span>

          <div class="pairs">
            ${pairHTML}
          </div>
        </div>
      `;


      const footer=`
        <div class="brand-footer">
          <span class="brand-star">✦</span>
          <span>บ้านเงินกอง</span>
          <span class="brand-star">✦</span>
        </div>
      `;


      const nextDate=
        this.nextDateLabel(
          [latest]
        );


      const cardId=
        `lottery-card-${groupIndex}`;


      cards.push(`
        <article
          class="lottery"
          id="${cardId}"
          data-lottery-card="true"
        >

          <div class="lottery-head">

            <div>

              <div class="lottery-name">
                <span class="flag">
                  ${this.flag(group.name)}
                </span>

                <span>
                  ${esc(group.name)}
                </span>
              </div>

              <div class="date">
                ${esc(nextDate)}
              </div>

            </div>

            <div class="vip-label"></div>

            <div
              class="card-actions"
              data-no-capture="true"
            >

              <button
                class="card-capture"
                data-capture-card="${cardId}"
                data-capture-name="${esc(group.name)}"
              >
                📷 แคปการ์ด
              </button>

            </div>

          </div>

          <div class="rows">
            ${row}
          </div>

          ${footer}

        </article>
      `);


      copyBlocks.push(
        [
          `${this.flag(group.name)} ${group.name} | ${nextDate}`,
          `${digit} : ${sorted.join('-')}`
        ].join('\n')
      );


      outputData.push({
        group,
        latest,
        a,
        nextDate
      });

    }


    /* ------------------------------------------------------
       FINALIZATION
    ------------------------------------------------------ */

    scan(
      'ตรวจสอบ Model Consensus...'
    );

    await yieldUI();

    scan(
      'ตรวจสอบ Historical Stability...'
    );

    await yieldUI();

    scan(
      'ตรวจสอบ Conflict / Overfit...'
    );

    await yieldUI();

    scan(
      'FINALIZING...'
    );

    await yieldUI();


    scanner.style.display=
      'none';

    btn.disabled=false;


    const all=
      copyBlocks.join(
        '\n\n'
      );

    this.lastCopyText=
      all;


    /*
      Summary
    */

    const avgConfidence=
      outputData.length
      ?this.mean(
        outputData.map(
          x=>x.a.confidence
        )
      )
      :0;


    const confidenceInfo=
      this.confidenceLabel(
        avgConfidence
      );


    const avgWF=
      outputData.length
      ?this.mean(
        outputData.map(
          x=>
            x.a?
            (
              x.a.selectedModelId
              ?(
                x.a.confidence
              )
              :0
            )
            :0
        )
      )
      :0;


    $('result').innerHTML=`

      <div class="summary">

        <span>
          ประมวลผลสำเร็จ
          <strong>
            ${outputData.length}
          </strong>
          ประเภท
        </span>

        <button
          class="copy"
          id="copyTop"
        >
          📋 COPY ALL
        </button>

      </div>


      <div class="auditbox">

        <b>ENGINE STATUS</b><br>

        Adaptive Consensus:
        ${confidenceInfo.text}<br>

        ค่าเฉลี่ย Confidence:
        <b>
          ${this.formatPct(avgConfidence)}
        </b><br>

        ระบบใช้:
        Walk-forward +
        Historical Evidence +
        Model Consensus +
        Conflict Guard

        ${
          parsed.records.length<10
          ?'<br><b>หมายเหตุ:</b> ข้อมูลย้อนหลังน้อยกว่า 10 งวด ระบบลดน้ำหนักความมั่นใจอัตโนมัติ'
          :''
        }

      </div>


      ${
        parsed.errors.length
        ?`
          <div class="errorbox">
            ${parsed.errors.map(
              esc
            ).join('<br>')}
          </div>
        `
        :''
      }


      ${cards.join('')}


      <button
        class="copyall"
        id="copyBottom"
      >
        📋 คัดลอกหวยทั้งหมด
      </button>

    `;


    $('copyTop').onclick=
      ()=>this.copy(all);

    $('copyBottom').onclick=
      ()=>this.copy(all);


    $('copyInput').disabled=
      !all;


    $('copyInput').onclick=
      ()=>this.copy(
        this.lastCopyText
      );


    $('result')
      .querySelectorAll(
        '[data-capture-card]'
      )
      .forEach(btn=>{

        btn.onclick=()=>{

          this.captureCard(
            btn.dataset.captureCard,
            btn.dataset.captureName
          );

        };

      });


    $('result')
      .scrollIntoView({
        behavior:'smooth',
        block:'start'
      });


  }catch(err){

    scanner.style.display=
      'none';

    btn.disabled=false;

    $('result').innerHTML=`
      <div class="errorbox">
        ❌ เกิดข้อผิดพลาดระหว่างประมวลผล:
        ${esc(
          err?.message||err
        )}
      </div>
    `;

  }

}

};
