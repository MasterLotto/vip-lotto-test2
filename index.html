<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคำนวณ - แก้ไขแล้ว</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }
        body {
            padding: 20px;
            background: #f5f5f5;
            max-width: 800px;
            margin: 0 auto;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #444;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover {
            background: #1d4ed8;
        }
        button:active {
            transform: scale(0.98);
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f0fdf4;
            border-left: 4px solid #22c55e;
            border-radius: 6px;
            display: none;
        }
        .result.show {
            display: block;
        }
        .copy-btn {
            background: #f3f4f6;
            color: #374151;
            margin-top: 12px;
            font-size: 14px;
            padding: 10px;
        }
        .copy-btn.copied {
            background: #22c55e;
            color: white;
        }
        .formula {
            margin-top: 10px;
            font-family: monospace;
            background: #f9fafb;
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
            color: #1f2937;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 ระบบคำนวณ</h1>
        
        <div class="input-group">
            <label>ค่าที่ 1</label>
            <input type="number" id="val1" placeholder="กรอกค่าตัวเลข">
        </div>
        
        <div class="input-group">
            <label>ค่าที่ 2</label>
            <input type="number" id="val2" placeholder="กรอกค่าตัวเลข">
        </div>

        <button onclick="calculate()">คำนวณทันที</button>

        <div class="result" id="resultBox">
            <strong>ผลลัพธ์:</strong>
            <p id="resultText" style="font-size: 18px; margin-top: 8px; color: #166534;"></p>
            <div class="formula" id="formulaDisplay"></div>
            <button class="copy-btn" id="copyResult" onclick="copyResult()">📋 คัดลอกผลลัพธ์</button>
        </div>
    </div>

    <script>
        // ========== คำนวณและแสดงสูตร ==========
        function calculate() {
            const v1 = parseFloat(document.getElementById('val1').value) || 0;
            const v2 = parseFloat(document.getElementById('val2').value) || 0;

            // === ปรับสูตรตรงนี้ตามที่ต้องการ ===
            const sum = v1 + v2;
            const product = v1 * v2;
            const avg = sum / 2;

            // แสดงผล
            document.getElementById('resultText').innerHTML = 
                `ผลรวม = ${sum}<br>คูณกัน = ${product}<br>ค่าเฉลี่ย = ${avg}`;
            
            document.getElementById('formulaDisplay').innerHTML = 
                `สูตร: (${v1} + ${v2}) = ${sum} | (${v1} × ${v2}) = ${product} | (${sum} ÷ 2) = ${avg}`;

            document.getElementById('resultBox').classList.add('show');
        }

        // ========== ปุ่มคัดลอกที่ทำงานแน่นอน ==========
        function copyResult() {
            const text = document.getElementById('resultText').innerText + 
                        '\n' + document.getElementById('formulaDisplay').innerText;
            
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copyResult');
                btn.textContent = '✅ คัดลอกแล้ว!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = '📋 คัดลอกผลลัพธ์';
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                // สำรองถ้า clipboard ไม่ได้
                const textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('คัดลอกเรียบร้อยแล้ว ✅');
            });
        }
    </script>
</body>
</html>
