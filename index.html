<!DOCTYPE html>
<!--
MESTER LOTTO VIP+ — V16.2 (FIXED AUDIT & BACKTEST ENGINE)
============================================================
-->
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Mester Lotto VIP+ — Full Formula Audit V16.2</title>

<style>
:root{
  --bg:#f8f5ef;
  --panel:#fffdf9;
  --line:#e8dfcf;
  --text:#403a31;
  --muted:#8b8173;
  --gold:#b8944a;
  --gold2:#806329;
  --rose:#b98279;
  --shadow:0 14px 40px rgba(79,58,31,.08);
}

*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{
  margin:0;
  background:
    radial-gradient(circle at 15% 10%,rgba(195,154,67,.08),transparent 25%),
    radial-gradient(circle at 85% 20%,rgba(185,130,121,.06),transparent 25%),
    var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button, input, textarea{ font:inherit; }
button{ cursor:pointer; }
#snow{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:0;
}
.shell{
  position:relative;
  z-index:1;
  min-height:100vh;
  padding:18px 12px 40px;
}
.app{
  width:min(940px,100%);
  margin:0 auto;
}
.inner{ padding:12px; }
.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
}
.logo{
  width:37px;
  height:37px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#d3b16d,#806329);
  color:#fff;
  font-weight:900;
  font-size:.72rem;
  box-shadow:0 8px 18px rgba(128,99,41,.18);
}
.brand b{ display:block; font-size:.78rem; letter-spacing:.1px; }
.brand small{ display:block; margin-top:2px; font-size:.48rem; color:var(--muted); font-weight:600; }
.pill{
  padding:6px 9px;
  border:1px solid var(--line);
  border-radius:99px;
  background:#fffaf0;
  color:#806329;
  font-size:.45rem;
  font-weight:800;
  white-space:nowrap;
}
.hero{
  padding:18px;
  margin-bottom:14px;
  border:1px solid var(--line);
  border-radius:18px;
  background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(250,245,235,.96));
  box-shadow:var(--shadow);
}
.hero-tag{ font-size:.43rem; font-weight:900; letter-spacing:1.2px; color:var(--gold2); }
.hero h1{ margin:7px 0 5px; font-size:1.55rem; line-height:1.15; }
.hero h1 em{ font-style:normal; color:var(--gold2); }
.hero p{ margin:0; font-size:.55rem; line-height:1.65; color:var(--muted); }
.panel{
  background:rgba(255,253,249,.96);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
  margin-bottom:14px;
}
.bulkbox{ padding:14px; }
.bulkbox label{ display:block; margin-bottom:7px; font-size:.55rem; font-weight:900; color:#806329; }
.bulk{
  display:block;
  width:100%;
  min-height:220px;
  resize:vertical;
  padding:12px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#fff;
  color:var(--text);
  outline:none;
  font-family:"IBM Plex Mono",monospace;
  font-size:.58rem;
  line-height:1.65;
}
.bulk:focus{ border-color:#c6a762; box-shadow:0 0 0 3px rgba(195,154,67,.10); }
.actions{
  padding:0 14px 14px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.run{
  height:43px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,#b8944a,#806329);
  color:#fff;
  font-size:.59rem;
  font-weight:900;
}
.clear{
  height:43px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  color:#8b8173;
  font-size:.59rem;
  font-weight:900;
}
.scanner{
  display:none;
  padding:10px 14px;
  border-top:1px solid var(--line);
  font-size:.52rem;
  color:var(--muted);
}
.scanner span{ font-weight:800; color:#806329; }
.result{ margin-top:14px; }
.summary-table-container{
  overflow-x:auto;
  margin-bottom:14px;
  border:1px solid var(--line);
  border-radius:16px;
  background:#fff;
  padding:14px;
  box-shadow:var(--shadow);
}
.summary-table-container h3{ margin:0 0 10px; font-size:.75rem; color:#806329; }
table.audit-table{
  width:100%;
  border-collapse:collapse;
  font-size:.52rem;
  font-family:"IBM Plex Mono",monospace;
}
table.audit-table th, table.audit-table td{
  border:1px solid var(--line);
  padding:6px 8px;
  text-align:center;
}
table.audit-table th{
  background:#fbf7ed;
  color:#806329;
  font-weight:800;
}
table.audit-table tr:nth-child(even){ background:#fdfbf7; }
.badge-best{
  background:#fff8e7;
  color:#806329;
  border:1px solid #d9bd79;
  padding:2px 6px;
  border-radius:6px;
  font-weight:800;
}
.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  z-index:9;
  transform:translate(-50%,20px);
  opacity:0;
  padding:9px 15px;
  border-radius:99px;
  color:#fff;
  background:#806329;
  font-size:.55rem;
  font-weight:700;
  transition:.2s;
  pointer-events:none;
}
.toast.show{ opacity:1; transform:translate(-50%,0); }
.errorbox{
  padding:12px;
  border-radius:14px;
  border:1px solid #f0c9cd;
  background:#fff0f1;
  color:#a83d46;
  font-size:.6rem;
  line-height:1.7;
}
.brand-footer{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  padding:9px 0;
  color:#80652b;
  font-size:.44rem;
  font-weight:800;
}
.brand-star{ color:#c39a43; font-size:.58rem; }
</style>
</head>

<body>

<canvas id="snow"></canvas>

<div class="shell">
  <div class="app">
    <div class="inner">

      <div class="top">
        <div class="brand">
          <div class="logo">AI</div>
          <div>
            <b>Mester Lotto VIP+</b>
            <small>Full Formula Audit V16.2</small>
          </div>
        </div>
        <div class="pill">● FIXED ENGINE</div>
      </div>

      <section class="hero">
        <span class="hero-tag">COMPREHENSIVE FORMULA AUDIT SYSTEM</span>
        <h1>Multi-Formula <em>Backtest & Audit</em></h1>
        <p>ระบบตรวจสอบความแม่นยำรวมทุกสูตร แก้ไขปัญหาปุ่มกดแล้วไม่ทำงานเรียบร้อยแล้ว</p>
      </section>

      <div id="console">
        <section class="panel">
          <div class="bulkbox">
            <label>📥 ข้อมูลสถิติย้อนหลังสำหรับ Audit (รูปแบบ: ชื่อหวย | วันที่ / บรรทัดถัดมา 3 ตัวบน / บรรทัดถัดมา 2 ตัวล่าง)</label>
            <textarea
              id="bulkInput"
              class="bulk"
              placeholder="ฮานอย HD | 25 ส.ค. 69&#10;123&#10;45&#10;&#10;ฮานอย HD | 26 ส.ค. 69&#10;456&#10;78&#10;&#10;ฮานอย HD | 27 ส.ค. 69&#10;789&#10;12"
            ></textarea>
          </div>

          <div class="actions">
            <button id="run" class="run">⚡ เริ่ม Audit ทุกสูตร</button>
            <button id="clearInput" class="clear">ล้างข้อมูลทั้งหมด</button>
          </div>

          <div id="scanner" class="scanner">
            สถานะ: <span id="scanText">กำลังประมวลผล Backtest...</span>
          </div>
        </section>

        <div id="result" class="result"></div>
      </div>

      <div id="toast" class="toast">ดำเนินการเรียบร้อย</div>

    </div>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('snow');
  const ctx = canvas.getContext('2d');
  let width = canvas.width = innerWidth;
  let height = canvas.height = innerHeight;
  window.addEventListener('resize', () => { width = canvas.width = innerWidth; height = canvas.height = innerHeight; });

  const particles = Array.from({length:30}, () => ({
    x:Math.random()*width, y:Math.random()*height, r:.7+Math.random()*1.5, s:.15+Math.random()*.4, a:.15+Math.random()*.3
  }));

  (function drawSnow(){
    ctx.clearRect(0,0,width,height);
    particles.forEach(p => {
      p.y += p.s;
      if(p.y > height+5){ p.y = -5; p.x = Math.random()*width; }
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = `rgba(195,154,67,${p.a})`;
      ctx.fill();
    });
    requestAnimationFrame(drawSnow);
  })();

  function $(id){ return document.getElementById(id); }
  function esc(val){ return String(val || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function norm(v){ return (v % 10 + 10) % 10; }

  function parseInput(text){
    const raw = String(text || '').replace(/\r/g,'').trim();
    if(!raw) return { records:[], errors:['ยังไม่มีข้อมูลสำหรับ Audit'] };
    const lines = raw.split('\n').map(v => v.trim());
    const records = [];
    const errors = [];
    let i = 0;
    while(i < lines.length){
      if(!lines[i]){ i++; continue; }
      const header = lines[i].match(/^(.+?)\s*\|\s*(.+?)$/);
      if(!header){ errors.push(`บรรทัดที่ ${i+1}: รูปแบบไม่ถูกต้อง`); i++; continue; }
      const name = header[1].trim();
      const date = header[2].trim();
      const n3 = lines[i+1] || '';
      const n2 = lines[i+2] || '';
      if(!/^\d{3}$/.test(n3) || !/^\d{2}$/.test(n2)){
        errors.push(`${name} | ${date}: เลข 3 ตัวบนหรือ 2 ตัวล่างไม่ครบ 3 หรือ 2 หลัก`);
        i += 3; continue;
      }
      records.push({ name, date, n3, n2 });
      i += 3;
    }
    return { records, errors };
  }

  const formulas = {
    "สูตรใหม่ (สิบบบน + หน่วยล่าง + 2)": (A, B, C, D, E) => {
      const d1 = norm(B + E + 2);
      return [d1, norm(d1 + 2)];
    },
    "สูตร 1 (สิบบบน + สิบล่าง)": (A, B, C, D, E) => {
      const d1 = norm(B + D);
      return [d1, norm(d1 + 1)];
    },
    "สูตร 2 (ผลรวม 3 ตัวบน)": (A, B, C, D, E) => {
      const d1 = norm(A + B + C);
      return [d1, norm(d1 + 1)];
    },
    "สูตร 3 (ร้อยบน + สิบล่าง)": (A, B, C, D, E) => {
      const d1 = norm(A + D);
      return [d1, norm(d1 + 1)];
    },
    "สูตร 4 (หน่วยบน + หน่วยล่าง)": (A, B, C, D, E) => {
      const d1 = norm(C + E);
      return [d1, norm(d1 + 1)];
    },
    "สูตร 5 (ฐาน 10 - หน่วยล่าง)": (A, B, C, D, E) => {
      const d1 = norm(10 - E);
      return [d1, norm(d1 + 1)];
    },
    "สูตร 6 (ร้อยบน + หน่วยสิบล่าง -> N6)": (A, B, C, D, E) => {
      const aVal = norm(-A - 2*B + C - E + 1);
      const bVal = norm(A - C - D - 2*E);
      return [aVal, bVal];
    },
    "สูตรทดสอบ ตัวที่ 1": (A, B, C, D, E) => {
      const d1 = norm(B + C + E + 3);
      return [d1, norm(d1 + 1)];
    },
    "สูตรทดสอบ ตัวที่ 2": (A, B, C, D, E) => {
      const d1 = norm(A + B + D - 1);
      return [d1, norm(d1 + 1)];
    }
  };

  function checkHit(predictedDigits, actualN3, actualN2){
    const topDigits = actualN3.split('').map(Number);
    const bottomDigits = actualN2.split('').map(Number);
    const allActual = [...topDigits, ...bottomDigits];
    let hit = false;
    predictedDigits.forEach(d => {
      if(allActual.includes(d)) hit = true;
    });
    return hit;
  }

  function showToast(msg){
    const toast = $('toast');
    if(msg) toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1500);
  }

  function renderSummary(data){
    if(!data || Object.keys(data).length === 0){
      $('result').innerHTML = '<div class="errorbox">ไม่มีข้อมูลเพียงพอสำหรับการทำ Backtest (ต้องการข้อมูลย้อนหลังอย่างน้อย 2 งวด)</div>';
      return;
    }

    let html = '';
    Object.keys(data).forEach(lotteryName => {
      const formulasResult = data[lotteryName];
      html += `
        <div class="summary-table-container">
          <h3>📊 ผลการ Audit ทุกสูตร: ${esc(lotteryName)}</h3>
          <table class="audit-table">
            <thead>
              <tr>
                <th>ชื่อสูตร</th>
                <th>งวดทั้งหมด</th>
                <th>เข้า</th>
                <th>หลุด</th>
                <th>Hit Rate (%)</th>
                <th>เข้าต่อเนื่องสูงสุด</th>
                <th>หลุดสะสมสูงสุด</th>
                <th>ประเมิน</th>
              </tr>
            </thead>
            <tbody>
      `;

      let bestFormula = '';
      let highestRate = -1;

      Object.keys(formulasResult).forEach(fName => {
        const f = formulasResult[fName];
        if(f.hitRate > highestRate){
          highestRate = f.hitRate;
          bestFormula = fName;
        }
      });

      Object.keys(formulasResult).forEach(fName => {
        const f = formulasResult[fName];
        const isBest = (fName === bestFormula);
        html += `
          <tr>
            <td style="font-weight:bold; text-align:left;">${esc(fName)} ${isBest ? '<span class="badge-best">ดีที่สุด 🔥</span>' : ''}</td>
            <td>${f.totalTested}</td>
            <td style="color:#2e7d32; font-weight:bold;">${f.hits}</td>
            <td style="color:#c62828;">${f.misses}</td>
            <td style="font-weight:bold; color:${f.hitRate >= 50 ? '#2e7d32' : '#c62828'};">${f.hitRate}%</td>
            <td>${f.maxStreak}</td>
            <td>${f.maxMiss}</td>
            <td>${f.hitRate >= 60 ? '✨ เสถียรสูง' : (f.hitRate >= 45 ? '⚠️ ปานกลาง' : '❌ หลุดบ่อย')}</td>
          </tr>
        `;
      });

      html += `
            </tbody>
          </table>
        </div>
      `;
    });

    html += `
      <div class="brand-footer">
        <span class="brand-star">✦</span>
        <span>บันทึกผลถาวรเรียบร้อยแล้ว</span>
        <span class="brand-star">✦</span>
      </div>
    `;

    $('result').innerHTML = html;
  }

  function runAuditProcess(){
    const parsed = parseInput($('bulkInput').value);
    if(parsed.errors.length > 0 && parsed.records.length === 0){
      $('result').innerHTML = `<div class="errorbox">${parsed.errors.join('<br>')}</div>`;
      return;
    }

    const groups = {};
    parsed.records.forEach(r => {
      if(!groups[r.name]) groups[r.name] = [];
      groups[r.name].push(r);
    });

    const auditResults = {};

    Object.keys(groups).forEach(lotteryName => {
      const recs = groups[lotteryName];
      if(recs.length < 2) return;

      auditResults[lotteryName] = {};
      const formulaNames = Object.keys(formulas);

      formulaNames.forEach(fName => {
        let hits = 0;
        let misses = 0;
        let currentStreak = 0;
        let maxStreak = 0;
        let currentMiss = 0;
        let maxMiss = 0;
        let totalTested = 0;

        for(let i = 0; i < recs.length - 1; i++){
          const curr = recs[i];
          const next = recs[i+1];

          const top = curr.n3.split('').map(Number);
          const bot = curr.n2.split('').map(Number);
          
          const predicted = formulas[fName](top[0], top[1], top[2], bot[0], bot[1]);
          const isHit = checkHit(predicted, next.n3, next.n2);

          totalTested++;
          if(isHit){
            hits++;
            currentStreak++;
            currentMiss = 0;
            if(currentStreak > maxStreak) maxStreak = currentStreak;
          } else {
            misses++;
            currentMiss++;
            currentStreak = 0;
            if(currentMiss > maxMiss) maxMiss = currentMiss;
          }
        }

        const hitRate = totalTested > 0 ? ((hits / totalTested) * 100).toFixed(2) : 0;
        auditResults[lotteryName][fName] = {
          totalTested, hits, misses, hitRate: Number(hitRate), maxStreak, maxMiss
        };
      });
    });

    try {
      localStorage.setItem('lottery_audit_full_data_v162', JSON.stringify(auditResults));
    } catch(e) {}

    renderSummary(auditResults);
    showToast('✓ Audit และคำนวณสถิติสำเร็จ');
  }

  // Bind Events Properly
  window.addEventListener('DOMContentLoaded', () => {
    const runBtn = $('run');
    const clearBtn = $('clearInput');

    if(runBtn){
      runBtn.onclick = runAuditProcess;
    }

    if(clearBtn){
      clearBtn.onclick = () => {
        $('bulkInput').value = '';
        $('result').innerHTML = '';
        try { localStorage.removeItem('lottery_audit_full_data_v162'); } catch(e){}
        showToast('✓ ล้างข้อมูลเรียบร้อย');
      };
    }

    // Load saved data on start
    try {
      const saved = localStorage.getItem('lottery_audit_full_data_v162');
      if(saved){
        const data = JSON.parse(saved);
        renderSummary(data);
      }
    } catch(e){}
  });
})();
</script>

</body>
</html>
