<script>

(()=>{

const c=document.getElementById('snow');

const x=c.getContext('2d');

let w=c.width=innerWidth;
let h=c.height=innerHeight;

addEventListener('resize',()=>{

w=c.width=innerWidth;
h=c.height=innerHeight;

});


const particles=Array.from(
{length:42},
()=>({

x:Math.random()*w,
y:Math.random()*h,
r:.7+Math.random()*1.8,
s:.15+Math.random()*.45,
a:.18+Math.random()*.35,
p:Math.random()*6.28,
tone:Math.random()>.72?'rose':'gold'

})
);


(function draw(){

x.clearRect(0,0,w,h);

particles.forEach(q=>{

q.p+=.01;

q.y+=q.s;

q.x+=Math.sin(q.p)*.25;

if(q.y>h+5){

q.y=-5;

q.x=Math.random()*w;

}

x.beginPath();

x.arc(
q.x,
q.y,
q.r,
0,
Math.PI*2
);

x.fillStyle=
q.tone==='rose'
?`rgba(185,130,121,${q.a*.55})`
:`rgba(195,154,67,${q.a})`;

x.fill();

});

requestAnimationFrame(draw);

})();


const $=id=>document.getElementById(id);

tokens:[

],

dec(h){

let s='';

for(let i=0;i<h.length;i+=2){

s+=String.fromCharCode(
parseInt(h.slice(i,i+2),16)
);

}

return s;

},

ok(v){

return this.tokens.some(
t=>v===this.dec(t)
);

}

};

cache:[],

lastCopyText:'',

toastTimer:null,

audio(){},


norm(x){

},


clamp(v,lo=0,hi=1){

return Math.max(
lo,
Math.min(
hi,
Number(v)||0
)
);

},


normalizeScores(map){

const vals=Object.values(map);

const max=Math.max(
...vals,
0
);

if(max<=0){

return Object.fromEntries(
Object.keys(map)
.map(k=>[k,0])
);

}

return Object.fromEntries(
Object.entries(map)
.map(
([k,v])=>[
k,
this.clamp(v/max)
]
)
);

},

return this.clamp(
1-
Math.exp(

if(!lines[i]){

i++;

continue;

}

const m=lines[i]
.match(
/^(.+?)\s*\|\s*(.+?)$/
);

if(!m){

errors.push(
`บรรทัดที่ ${i+1}: ไม่พบรูปแบบ "ชื่อหวย | วันที่"`
);

i++;

continue;

}

const name=m[1].trim();

const date=m[2].trim();

if(!this.parseDateValue(date)){

errors.push(
`${name} | ${date}: รูปแบบวันที่ไม่ถูกต้อง เช่น 25 ส.ค. 69`
);

i+=1;

continue;

}

const n3raw=lines[i+1]||'';

const n2raw=lines[i+2]||'';

const n3=/^[\d\s]+$/.test(n3raw)
?n3raw.replace(/\s+/g,'')
:n3raw;

const n2=/^[\d\s]+$/.test(n2raw)
?n2raw.replace(/\s+/g,'')
:n2raw;

if(!/^\d{3}$/.test(n3)){

errors.push(
`${name} | ${date}: เลข 3 ตัวบนต้องเป็น 3 หลัก`
);

i+=1;

continue;

}

if(!/^\d{2}$/.test(n2)){

errors.push(
`${name} | ${date}: เลข 2 ตัวล่างต้องเป็น 2 หลัก`
);

i+=2;

continue;

}

records.push({

name,
date,
n3,
n2

});

i+=3;

}

return{

records,
errors

};

},


parseDateValue(date){

const s=String(date||'').trim();

if(!s)
return false;

if(
/^\d{1,2}\s+\S+\s+\d{2,4}$/.test(s)
)
return true;

if(
/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(s)
)
return true;

if(
/^\d{1,2}-\d{1,2}-\d{2,4}$/.test(s)
)
return true;

return false;

},


dateKey(date){

const s=String(date||'')
.trim();

const m=s.match(
/^(\d{1,2})\s+(\S+)\s+(\d{2,4})$/
);

if(m){

const months={

'ม.ค.':1,
'ก.พ.':2,
'มี.ค.':3,
'เม.ย.':4,
'พ.ค.':5,
'มิ.ย.':6,
'ก.ค.':7,
'ส.ค.':8,
'ก.ย.':9,
'ต.ค.':10,
'พ.ย.':11,
'ธ.ค.':12

};

const month=months[m[2]]||0;

let year=Number(m[3]);

if(year<100)
year+=2500;

return[
year,
String(month).padStart(2,'0'),
String(Number(m[1])).padStart(2,'0')
].join('-');

}

const m2=s.match(
/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/
);

if(m2){

let year=Number(m2[3]);

if(year<100)
year+=2500;

return[
year,
String(Number(m2[2])).padStart(2,'0'),
String(Number(m2[1])).padStart(2,'0')
].join('-');

}

return s;

},


sortChronological(records){

return records
.map((r,index)=>({

...r,
__index:index

}))
.sort((a,b)=>{

const ka=this.dateKey(a.date);

const kb=this.dateKey(b.date);

if(ka<kb)
return-1;

if(ka>kb)
return 1;

return a.__index-b.__index;

})
.map(r=>{

const z={...r};

delete z.__index;

return z;

});

},


groupByLottery(records){

const groupsMap={};

records.forEach((r,index)=>{

const key=r.name.trim();

if(!groupsMap[key]){

groupsMap[key]={

name:key,
records:[],
duplicateCount:0,
conflictCount:0,
__order:index

};

}

groupsMap[key].records.push(r);

});

const groups=Object.values(groupsMap);

groups.forEach(g=>{

const sorted=this.sortChronological(g.records);

const byDate=new Map();

const clean=[];

sorted.forEach(r=>{

const key=this.dateKey(r.date);

if(!byDate.has(key)){

byDate.set(
key,
r
);

clean.push(r);

return;

}

const previous=byDate.get(key);

if(
previous.n3===r.n3 &&
previous.n2===r.n2
){

g.duplicateCount++;

return;

}

g.conflictCount++;

const idx=clean.indexOf(previous);

if(idx>=0)
clean[idx]=r;

byDate.set(key,r);

});

g.records=this.sortChronological(clean);

});

return groups
.sort((a,b)=>a.__order-b.__order)
.map(g=>{

delete g.__order;

return g;

});

},

/*
==========================================================
PROTECTED PAIR / เลขเจาะ ENGINE
==========================================================
*/
buildPairs(
models,
anchor
){

models.forEach(m=>{

let range=[];
let collision=false;

for(let o=-2;o<=2;o++){

if(
m.set.includes(
this.norm(anchor+o)
)
){

collision=true;

break;

}

}

for(
let o=collision?-3:-2;
o<=(collision?3:2);
o++
){

range.push(
this.norm(anchor+o)
);

}

m.pairsMap={};

m.set.forEach(src=>{

let pairs=range
.filter(
p=>
p!==src &&
!m.set.includes(p)
)
.map(
p=>`${src}${p}`
);

let next=(src+1)%10;

while(pairs.length<5){

if(
next!==src &&
!m.set.includes(next) &&
!pairs.includes(
`${src}${next}`
)
){

pairs.push(
`${src}${next}`
);

}

next=(next+1)%10;

}

m.pairsMap[src]=[
...new Set(pairs)
]
.filter(
p=>p[0]!==p[1]
)
.slice(0,5);

});

});

},


/*

CURRENT INPUT SUPPORT SCORE
==========================================================
*/
scoreDigits(
models,
F,
H,T,U,R1,R2,
sumT,sumB,total
){

const score=Object.fromEntries(
Array.from(
{length:10},
(_,d)=>[d,{

digit:d,

modelScore:0,

formula100Score:0,

radarScore:0,

backendScore:0,

winSetScore:0,

selectorBonus:0,

selectorScore:0,

historicalScore:0,

recentFormScore:0,

stabilityScore:0,

hotStreakBonus:1,

confidence:0,

redundancyPenalty:1,

modelConsensusCount:0,

supportSignals:0,

conflictSignals:0,

reliabilityScore:0,

evidenceScore:0,

uncertainty:0,

selectionPenalty:1,

selectionScore:0,

totalScore:0,

qualityGate:1,

modelId:null,

modelSupportScore:0,

modelPriority:1,

selectedModel:false

}])
);


for(let d=0;d<=9;d++){

const count=
models.filter(
m=>m.set.includes(d)
).length;

score[d].modelConsensusCount=count;

score[d].modelScore=
this.consensusTier(
count,
models.length
);

const owner=models.find(
m=>m.set.includes(d)
);

score[d].modelId=
owner?.id??null;

}


const formulaCounts=
F.counts||{};

const maxFormula=
Math.max(
...Object.values(formulaCounts),
0
);

for(let d=0;d<=9;d++){

score[d].formula100Score=
maxFormula>0
?this.clamp(
(Number(formulaCounts[d])||0)/maxFormula
)
:0;

}


const x=(R1+R2)%10;
const y=sumT%10;
const z=total%10;

const r1=[
this.norm(x-1),
x,
this.norm(x+1)
];

const r2=[
this.norm(y-1),
y,
this.norm(y+1)
];

const r3=[
this.norm(z-1),
z,
this.norm(z+1)
];

for(let d=0;d<=9;d++){

let h=0;

if(r1.includes(d))
h++;

if(r2.includes(d))
h++;

if(r3.includes(d))
h++;

score[d].radarScore=h/3;

}


const back=[

(2*H+R1)%10,
(T+R2)%10,
sumT%10,
Math.abs(T-U)%10,
total%10

];


for(let d=0;d<=9;d++){

score[d].backendScore=
back.includes(d)
?1
:0;

score[d].winSetScore=
(
d===z ||
d===this.norm(z+5)
)
?1
:0;

}


for(let d=0;d<=9;d++){

const v=score[d];

const consensus=
this.consensusTier(
v.modelConsensusCount,
models.length
);

const supportValues=[

v.formula100Score,
v.radarScore,
v.backendScore,
v.winSetScore

];

v.supportSignals=
supportValues.filter(
x=>x>=.60
).length;

v.conflictSignals=
supportValues.filter(
x=>x<=.25
).length;

const supportBreadth=
this.sourceBreadthScore(
v.supportSignals
);

const supportStrength=(

.45*v.formula100Score+
.25*v.radarScore+
.20*v.backendScore+
.10*v.winSetScore

);

v.reliabilityScore=
this.clamp(

.65*consensus+
.35*supportBreadth

);

v.evidenceScore=
this.clamp(

.70*supportStrength+
.30*consensus

);


/*
ไม่มี historical database ใน engine นี้
จึงไม่สร้างข้อมูลย้อนหลังปลอม
*/
v.historicalScore=.5;
v.recentFormScore=.5;
v.stabilityScore=.5;
v.uncertainty=0;
v.hotStreakBonus=1;


/*
คะแนนพื้นฐานของเลข
*/
v.totalScore=

.55*consensus+
.20*v.formula100Score+
.10*v.radarScore+
.08*v.backendScore+
.07*v.winSetScore;


v.selectorBonus=

.045*consensus+
.030*supportBreadth+
.025*Math.max(
0,
v.evidenceScore-.5
);


const primaryGate=

v.modelConsensusCount===2
?1.00
:
v.modelConsensusCount===1
?.62
:.20;


const conflictPenalty=

1-
Math.min(
.18,
Math.max(
0,
v.conflictSignals-1
)*.06
);


const weakSupportPenalty=

v.modelConsensusCount===1 &&
v.supportSignals===0

?.82
:1;


v.selectionPenalty=
conflictPenalty*
weakSupportPenalty;


v.totalScore*=primaryGate;

v.totalScore+=
Math.min(
.06,
v.selectorBonus
);

v.totalScore*=v.selectionPenalty;

if(v.modelConsensusCount>0){

v.totalScore*=1.05;

}

v.selectorScore=v.totalScore;

v.selectionScore=v.selectorScore;

}


return{

score,

allowed:new Set(
models.flatMap(m=>m.set)
)

};

},


/*
==========================================================
TOURNAMENT ENGINE
==========================================================

ROUND 1
- Model 01: digit 1 vs digit 2
- Model 02: digit 1 vs digit 2

ROUND 2 / FINAL
- Winner Model 01 vs Winner Model 02

The final winner is TOP 1 only.
==========================================================
*/
tournament(
models,
score
){

const compareDigits=(a,b)=>{

if(!a)
return b;

if(!b)
return a;


/*
1. selectorScore
2. support evidence
3. backend support
4. formula support
5. deterministic digit order
*/

if(
Math.abs(
a.selectorScore-b.selectorScore
)>0.000001
){

return a.selectorScore>b.selectorScore
?a
:b;

}

if(
Math.abs(
a.evidenceScore-b.evidenceScore
)>0.000001
){

return a.evidenceScore>b.evidenceScore
?a
:b;

}

if(
a.backendScore!==b.backendScore
){

return a.backendScore>b.backendScore
?a
:b;

}

if(
a.formula100Score!==b.formula100Score
){

return a.formula100Score>b.formula100Score
?a
:b;

}

return a.digit<=b.digit
?a
:b;

};


const modelRounds=
models.map(model=>{

const first=score[model.set[0]];
const second=score[model.set[1]];

const winner=
compareDigits(
first,
second
);

return{

modelId:model.id,

modelName:model.name,

candidates:[
first,
second
],

winner,

margin:
Math.abs(
first.selectorScore-
second.selectorScore
)

};

});


const winner01=
modelRounds.find(
x=>x.modelId===1
)?.winner||null;

const winner02=
modelRounds.find(
x=>x.modelId===2
)?.winner||null;


/*
FINAL:
ผู้ชนะของแต่ละ Main Model มาแข่งกัน
*/
const finalWinner=
compareDigits(
winner01,
winner02
);


const finalLoser=
finalWinner===winner01
?winner02
:winner01;


const finalMargin=
finalWinner&&finalLoser
?
Math.abs(
finalWinner.selectorScore-
finalLoser.selectorScore
)
:0;


/*
Model winner
*/
const winningModelId=
finalWinner?.modelId??null;


/*
Confidence:
- คะแนนตัวชนะ
- margin รอบ Final
- support evidence
- model support
*/
if(finalWinner){

const finalMarginScore=
this.clamp(
finalMargin/.10
);

const supportBreadth=
this.sourceBreadthScore(
finalWinner.supportSignals
);

const baseConfidence=

.38*this.clamp(
finalWinner.selectorScore
)+

.22*finalMarginScore+

.22*this.clamp(
finalWinner.evidenceScore
)+

.18*supportBreadth;

finalWinner.confidence=
this.clamp(
.35+
.65*baseConfidence
);

finalWinner.finalMargin=
finalMargin;

finalWinner.finalOpponent=
finalLoser?.digit??null;

finalWinner.finalWinner=true;

}


return{

modelRounds,

winner01,

winner02,

finalWinner,

finalLoser,

finalMargin,

winningModelId

};

},

/*
==========================================================
MAIN ENGINE
==========================================================
*/
run(
n3,
n2
){

const d3=
n3.split('').map(Number);

const d2=
n2.split('').map(Number);

const[
H,T,U
]=d3;

const[
R1,R2
]=d2;

const sumT=
H+T+U;

const sumB=
R1+R2;

const total=
sumT+
sumB;


/*
Original formula engine remains available as backend support.
*/
const F=
this.formulas(
H,T,U,
R1,R2,
sumT,
sumB,
total
);


/*
Only two Main Models.
*/
const models=
this.buildModels(
H,T,U,
R1,R2,
sumT
);


/*
Protected pair generation remains separate.
*/
const anchor=
this.norm(
7-H
);

this.buildPairs(
models,
anchor
);


/*
Current-input support scoring.
*/
const scored=
this.scoreDigits(
models,
F,
H,T,U,
R1,R2,
sumT,
sumB,
total
);


/*
Tournament:
A1 vs A2
B1 vs B2
Winner A vs Winner B
*/
const tournament=
this.tournament(
models,
scored.score
);


/*
Only ONE digit survives.
*/
const finalWinner=
tournament.finalWinner;

const top1Digits=
finalWinner
?
[finalWinner.digit]
:
[];


/*
Only the selected TOP 1 goes into protected pair engine.
*/
const pairSet=
finalWinner
?
this.bestPairsForDigit(
finalWinner.digit,
models,
scored.score
)
:[ ];


const consensus=
this.buildConsensus(
[pairSet]
);


return{

top1Digit:
finalWinner
?
finalWinner.digit
:null,

top2Digits:
top1Digits,

pairSets:[
pairSet
],

modelScores:
scored.score,

modelCount:2,

models,

tournament,

selectedModelId:
tournament.winningModelId,

selectedModel:
models.find(
m=>m.id===
tournament.winningModelId
)||null,

confidence:
finalWinner
?
finalWinner.confidence
:0,

finalMargin:
tournament.finalMargin,

consensus

};

},


/*
==========================================================
CAPTURE
==========================================================
*/
async captureCard(
cardId,
name
){

const el=
document.getElementById(
cardId
);

if(!el)
return;

const controls=[
...el.querySelectorAll(
'[data-no-capture]'
)
];

try{

if(
typeof html2canvas==='undefined'
)
throw new Error(
'ไม่พบระบบแคปภาพ กรุณาเปิดอินเทอร์เน็ตแล้วลองใหม่'
);

controls.forEach(
x=>
x.style.visibility='hidden'
);

const canvas=
await html2canvas(
el,
{
backgroundColor:'#ffffff',

scale:
Math.min(
3,
Math.max(
2,
window.devicePixelRatio||2
)
),

useCORS:true,

logging:false

}
);

const link=
document.createElement('a');

const safe=
String(
name||'lottery'
)
.replace(
/[^ก-๙A-Za-z0-9_-]+/g,
'_'
)
.slice(
0,
60
);

link.download=
`${safe||'lottery'}_card.png`;

link.href=
canvas.toDataURL(
'image/png'
);

link.click();

this.show(
'✓ แคปการ์ดแล้ว'
);

}catch(err){

console.error(err);

this.show(
'❌ แคปภาพไม่สำเร็จ'
);

}finally{

controls.forEach(
x=>
x.style.visibility=''
);

}

},


copy(text){

navigator.clipboard
?.writeText(text)
.then(
()=>this.show()
)
.catch(()=>{

const t=
document.createElement(
'textarea'
);

t.value=text;

document.body.appendChild(t);

t.select();

document.execCommand(
'copy'
);

t.remove();

this.show();

});

},


show(message){

const t=
$('toast');

if(message)
t.textContent=message;

t.classList.add('show');

clearTimeout(
this.toastTimer
);

this.toastTimer=
setTimeout(
()=>t.classList.remove('show'),
1500
);

},


/*
==========================================================
CALCULATE
==========================================================
*/
async calculate(){

const parsed=
this.parse(
$('bulkInput').value
);

if(!parsed.records.length){

$('result').innerHTML=
'<div class="errorbox">❌ ไม่พบข้อมูลที่ถูกต้อง กรุณาตรวจรูปแบบอีกครั้ง</div>';

return;

}

const scanner=
$('scanner');

const btn=
$('run');

btn.disabled=true;

scanner.style.display='block';

const scan=
msg=>
$('scanText').textContent=msg;

const yieldUI=
()=>new Promise(
resolve=>
requestAnimationFrame(
resolve
)
);

try{

scan(
'อ่านข้อมูล 3 ตัวบน + 2 ตัวล่าง...'
);

await yieldUI();

this.cache=[];

const groups=
this.groupByLottery(
parsed.records
);

const cards=[];
const outputData=[];
const copyBlocks=[];

let groupIndex=0;

for(
const group of groups
){

groupIndex++;

const records=
group.records;

if(!records.length)
continue;


/*
ใช้รายการล่าสุดของหวยนั้นเป็น Current Input
ไม่มีการสร้าง historical statistics
*/
const latest=
records[
records.length-1
];

scan(
`ประมวลผล ${group.name} • ${groupIndex}/${groups.length}`
);

await yieldUI();

const a=
this.run(
latest.n3,
latest.n2
);

this.cache.push({

group:
group.name,

result:a

});


/*
======================================================
CANDIDATE POOL GUARD
======================================================
*/
const allowed=
new Set();

a.models.forEach(
m=>
m.set.forEach(
d=>allowed.add(d)
)
);

const valid=
a.top1Digit!==null &&
allowed.has(a.top1Digit);

if(!valid){

parsed.errors.push(
`${group.name} | ${latest.date}: ไม่สามารถคัดเลข TOP 1 จาก Candidate Pool ของ 2 Main Models ได้`
);

continue;

}


/*
======================================================
DISPLAY
======================================================
*/

const digit=
a.top1Digit;

const sourcePairs=
(a.pairSets[0]||[])
.slice(0,5);

const sorted=
this.sortPairs(
sourcePairs
);

const pairHTML=
sorted
.map(pair=>{

const info=
a.consensus.colorMap[
this.pairKey(pair)
];

const title=
info
?
`อันดับ Consensus ${info.rank} • พบ ${info.score} ครั้ง`
:
'เลขเจาะจาก 2 Main Models';

return`
<span
class="${this.pairClass(
pair,
a.consensus.colorMap
)}"
title="${esc(title)}"
>
${esc(pair)}
</span>
`;

})
.join('');


/*
เลขเด่นเหลือเพียงตัวเดียว
*/
const row=`

<div class="row">

<span
class="digit digit-gold"
aria-label="เลขเด่น"
>
${esc(digit)}
</span>

<span class="sep">
:
</span>

<div class="pairs">
${pairHTML}
</div>

</div>

`;


const footer=`

<div class="brand-footer">

<span class="brand-star">
✦
</span>

<span>
บ้านเงินกอง
</span>

<span class="brand-star">
✦
</span>

</div>

`;


const nextDate=
this.nextDateLabel(
[latest]
);


const cardId=
`lottery-card-${groupIndex}`;


cards.push(`

<article
class="lottery"
id="${cardId}"
data-lottery-card="true"
>

<div class="lottery-head">

<div>

<div class="lottery-name">

<span class="flag">
${this.flag(group.name)}
</span>

<span>
${esc(group.name)}
</span>

</div>

<div class="date">
${esc(nextDate)}
</div>

</div>

<div class="vip-label"></div>

</div>


<div class="rows">
${row}
</div>


<div
class="card-actions"
data-no-capture="true"
>

<button
class="card-capture"
data-capture-card="${cardId}"
data-capture-name="${esc(group.name)}"
>
📷 แคปการ์ด
</button>

</div>


${footer}

</article>

`);


copyBlocks.push([

`${this.flag(group.name)} ${group.name} | ${nextDate}`,

`${digit} : ${sorted.join('-')}`

].join('\n'));


outputData.push({

group,

latest,

a,

nextDate

});

}


scan(
'ตรวจสอบความสอดคล้องของผลลัพธ์...'
);

await yieldUI();

scan(
'FINALIZING...'
);

await yieldUI();

scanner.style.display='none';

btn.disabled=false;


const all=
copyBlocks.join(
'\n\n'
);

this.lastCopyText=
all;


$('result').innerHTML=`

<div class="summary">

<span>

ประมวลผลสำเร็จ

<strong>
${outputData.length}
</strong>

ประเภท

</span>

<button
class="copy"
id="copyTop"
>
📋 COPY ALL
</button>

</div>


${
parsed.errors.length
?
`
<div class="errorbox">
${parsed.errors
.map(esc)
.join('<br>')}
</div>
`
:
''
}


${cards.join('')}


<button
class="copyall"
id="copyBottom"
>
📋 คัดลอกหวยทั้งหมด
</button>

`;


$('copyTop').onclick=
()=>this.copy(all);

$('copyBottom').onclick=
()=>this.copy(all);


$('copyInput').disabled=
!all;

$('copyInput').onclick=
()=>this.copy(
this.lastCopyText
);


$('result')
.querySelectorAll(
'[data-capture-card]'
)
.forEach(btn=>{

btn.onclick=
()=>this.captureCard(
btn.dataset.captureCard,
btn.dataset.captureName
);

});


$('result').scrollIntoView({

behavior:'smooth',

block:'start'

});


}catch(err){

scanner.style.display='none';

btn.disabled=false;

$('result').innerHTML=
`

<div class="errorbox">

❌ เกิดข้อผิดพลาดระหว่างประมวลผล:

${esc(err?.message||err)}

</div>

`;

}

},


nextDateLabel(records){

if(!records.length)
return'';

const latest=
records[
records.length-1
];

const s=
String(
latest.date||''
)
.trim();

const m=
s.match(
/^(\d{1,2})\s+(\S+)\s+(\d{2,4})$/
);

if(m){

const day=
Number(m[1]);

let year=
Number(m[3]);

if(year<100)
year+=2500;

const months=[

'ม.ค.',
'ก.พ.',
'มี.ค.',
'เม.ย.',
'พ.ค.',
'มิ.ย.',
'ก.ค.',
'ส.ค.',
'ก.ย.',
'ต.ค.',
'พ.ย.',
'ธ.ค.'

];

const monthIndex=
months.indexOf(m[2]);

if(monthIndex>=0){

let d=
new Date(
year-543,
monthIndex,
day
);

d.setDate(
d.getDate()+1
);

return[

String(d.getDate()),

months[d.getMonth()],

String(d.getFullYear()+543)

].join(' ');

}

}

return'งวดถัดไป';

}

};


function login(){

const value=
$('password').value;

if(
sec.ok(value)
){

$('login').classList.remove(
'active'
);

$('console').classList.add(
'active'
);

$('loginErr').style.display=
'none';

}else{

$('loginErr').style.display=
'block';

}

}


$('loginBtn').onclick=
login;


$('password').addEventListener(
'keydown',
e=>{

if(e.key==='Enter')
login();

});


$('run').onclick=
()=>app.calculate();


$('clearInput').onclick=
()=>{

$('bulkInput').value='';

$('result').innerHTML='';

$('scanner').style.display='none';

$('run').disabled=false;

$('copyInput').disabled=true;

app.lastCopyText='';

app.cache=[];

$('bulkInput').focus();

app.show(
'✓ ล้างข้อมูลแล้ว'
);

};


})();

</script>

</body>
</html>
