<script>
(() => {


  /* =========================================================
     SNOW / BACKGROUND
  ========================================================= */


  const canvas = document.getElementById('snow');
  const ctx = canvas.getContext('2d');


  let width = canvas.width = innerWidth;
  let height = canvas.height = innerHeight;


  addEventListener('resize', () => {
    width = canvas.width = innerWidth;
    height = canvas.height = innerHeight;
  });


  const particles = Array.from({length:42}, () => ({
    x:Math.random()*width,
    y:Math.random()*height,
    r:.7+Math.random()*1.8,
    s:.15+Math.random()*.45,
    a:.18+Math.random()*.35,
    p:Math.random()*6.28,
    tone:Math.random()>.72 ? 'rose' : 'gold'
  }));


  (function drawSnow(){
    ctx.clearRect(0,0,width,height);


    particles.forEach(p => {
      p.p += .01;
      p.y += p.s;
      p.x += Math.sin(p.p)*.25;


      if(p.y > height+5){
        p.y = -5;
        p.x = Math.random()*width;
      }


      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);


      ctx.fillStyle =
        p.tone === 'rose'
          ? `rgba(185,130,121,${p.a*.55})`
          : `rgba(195,154,67,${p.a})`;


      ctx.fill();
    });


    requestAnimationFrame(drawSnow);
  })();




  /* =========================================================
     HELPERS
  ========================================================= */


  const $ = id => document.getElementById(id);


  const esc = value =>
    String(value)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#039;');




  /* =========================================================
     MAIN APPLICATION
  ========================================================= */


  const app = {


    lastCopyText:'',
    toastTimer:null,


    norm(value){
      return (value % 10 + 10) % 10;
    },


    flag(name){
      const n = String(name).toLowerCase();


      if(/ลาว|lao/.test(n)) return '🇱🇦';
      if(/ฮานอย|เวียดนาม|vietnam|viet/.test(n)) return '🇻🇳';
      if(/พม่า|เมียนมา|myanmar|2d|internet|modern/.test(n)) return '🇲🇲';
      if(/จีน|china|shanghai/.test(n)) return '🇨🇳';
      if(/ฮั่งเส็ง|hang seng|hong kong|ฮ่องกง/.test(n)) return '🇭🇰';
      if(/นิเคอิ|นิคเคอิ|นิกเคอิ|nikkei|ญี่ปุ่น|japan/.test(n)) return '🇯🇵';
      if(/เกาหลี|korea|kospi/.test(n)) return '🇰🇷';
      if(/สิงคโปร์|singapore/.test(n)) return '🇸🇬';
      if(/มาเลย์|มาเลเซีย|malaysia|malay/.test(n)) return '🇲🇾';
      if(/อินเดีย|india|sensex/.test(n)) return '🇮🇳';
      if(/รัสเซีย|russia|moscow/.test(n)) return '🇷🇺';
      if(/เยอรมัน|germany|dax/.test(n)) return '🇩🇪';
      if(/อังกฤษ|uk|ftse|london/.test(n)) return '🇬🇧';
      if(/อียิปต์|egypt/.test(n)) return '🇪🇬';
      if(/ไต้หวัน|taiwan|tse/.test(n)) return '🇹🇼';
      if(/ดาวโจนส์|สหรัฐ|usa|america|dow|nasdaq|s&p/.test(n)) return '🇺🇸';
      if(/ฝรั่งเศส|france|cac/.test(n)) return '🇫🇷';
      if(/ออสเตรเลีย|australia|asx/.test(n)) return '🇦🇺';
      if(/แคนาดา|canada/.test(n)) return '🇨🇦';
      if(/หุ้นไทย|ไทย|thai|set/.test(n)) return '🇹🇭';


      return '🌐';
    },




    /* =======================================================
       INPUT PARSER
    ======================================================= */


    parse(text){


      const raw = String(text || '')
        .replace(/\r/g,'')
        .trim();


      if(!raw){
        return {
          records:[],
          errors:['ยังไม่มีข้อมูลสำหรับประมวลผล']
        };
      }


      const lines = raw
        .split('\n')
        .map(v => v.trim());


      const records = [];
      const errors = [];


      let i = 0;


      while(i < lines.length){


        if(!lines[i]){
          i++;
          continue;
        }


        const header = lines[i].match(/^(.+?)\s*\|\s*(.+?)$/);


        if(!header){
          errors.push(
            `บรรทัดที่ ${i+1}: ไม่พบรูปแบบ "ชื่อหวย | วันที่"`
          );


          i++;
          continue;
        }


        const name = header[1].trim();
        const date = header[2].trim();


        if(!this.parseDateValue(date)){
          errors.push(
            `${name} | ${date}: รูปแบบวันที่ไม่ถูกต้อง เช่น 25 ส.ค. 69`
          );


          i++;
          continue;
        }


        const n3raw = lines[i+1] || '';
        const n2raw = lines[i+2] || '';


        const n3 =
          /^[\d\s]+$/.test(n3raw)
            ? n3raw.replace(/\s+/g,'')
            : n3raw;


        const n2 =
          /^[\d\s]+$/.test(n2raw)
            ? n2raw.replace(/\s+/g,'')
            : n2raw;


        if(!/^\d{3}$/.test(n3)){
          errors.push(
            `${name} | ${date}: เลข 3 ตัวบนต้องเป็น 3 หลัก`
          );


          i += 1;
          continue;
        }


        if(!/^\d{2}$/.test(n2)){
          errors.push(
            `${name} | ${date}: เลข 2 ตัวล่างต้องเป็น 2 หลัก`
          );


          i += 2;
          continue;
        }


        records.push({
          name,
          date,
          n3,
          n2
        });


        i += 3;
      }


      return {
        records,
        errors
      };
    },




    parseDateValue(date){


      const value = String(date || '').trim();


      if(!value) return false;


      if(/^\d{1,2}\s+\S+\s+\d{2,4}$/.test(value))
        return true;


      if(/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(value))
        return true;


      if(/^\d{1,2}-\d{1,2}-\d{2,4}$/.test(value))
        return true;


      return false;
    },




    dateKey(date){


      const value = String(date || '').trim();


      const thai = value.match(
        /^(\d{1,2})\s+(\S+)\s+(\d{2,4})$/
      );


      if(thai){


        const months = {
          'ม.ค.':1,
          'ก.พ.':2,
          'มี.ค.':3,
          'เม.ย.':4,
          'พ.ค.':5,
          'มิ.ย.':6,
          'ก.ค.':7,
          'ส.ค.':8,
          'ก.ย.':9,
          'ต.ค.':10,
          'พ.ย.':11,
          'ธ.ค.':12
        };


        const month = months[thai[2]] || 0;


        let year = Number(thai[3]);


        if(year < 100){
          year += 2500;
        }


        return [
          year,
          String(month).padStart(2,'0'),
          String(Number(thai[1])).padStart(2,'0')
        ].join('-');
      }


      const numeric = value.match(
        /^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/
      );


      if(numeric){


        let year = Number(numeric[3]);


        if(year < 100){
          year += 2500;
        }


        return [
          year,
          String(Number(numeric[2])).padStart(2,'0'),
          String(Number(numeric[1])).padStart(2,'0')
        ].join('-');
      }


      return value;
    },




    sortChronological(records){


      return records
        .map((record,index) => ({
          ...record,
          __index:index
        }))
        .sort((a,b) => {


          const ka = this.dateKey(a.date);
          const kb = this.dateKey(b.date);


          if(ka < kb) return -1;
          if(ka > kb) return 1;


          return a.__index - b.__index;
        })
        .map(record => {


          const clean = {...record};


          delete clean.__index;


          return clean;
        });
    },




    groupByLottery(records){


      const groupsMap = {};


      records.forEach((record,index) => {


        const key = record.name.trim();


        if(!groupsMap[key]){
          groupsMap[key] = {
            name:key,
            records:[],
            duplicateCount:0,
            conflictCount:0,
            __order:index
          };
        }


        groupsMap[key].records.push(record);
      });


      const groups = Object.values(groupsMap);


      groups.forEach(group => {


        const sorted = this.sortChronological(group.records);


        const byDate = new Map();
        const clean = [];


        sorted.forEach(record => {


          const key = this.dateKey(record.date);


          if(!byDate.has(key)){


            byDate.set(key,record);
            clean.push(record);


            return;
          }


          const previous = byDate.get(key);


          if(
            previous.n3 === record.n3 &&
            previous.n2 === record.n2
          ){
            group.duplicateCount++;
            return;
          }


          group.conflictCount++;


          const index = clean.indexOf(previous);


          if(index >= 0){
            clean[index] = record;
          }


          byDate.set(key,record);
        });


        group.records = this.sortChronological(clean);
      });


      return groups
        .sort((a,b) => a.__order - b.__order)
        .map(group => {


          delete group.__order;


          return group;
        });
    },




    /* =======================================================
       MAIN MODEL 01 (FORMULA N1 / EXPERIMENTAL MOD 10)
       - Digit 1: 9 - (Hundreds top * 2) - (Tens top * 2) + Units top + Tens bottom - (Units bottom * 2) -> units digit
       - Digit 2: 3 - (Tens top * 2) + Units top -> units digit
    ======================================================= */


    mainModel(n3, n2){


      const top = String(n3)
        .padStart(3,'0')
        .split('')
        .map(Number);


      const bottom = String(n2)
        .padStart(2,'0')
        .split('')
        .map(Number);


      const H = top[0];
      const T = top[1];
      const U = top[2];
      const R1 = bottom[0];
      const R2 = bottom[1];


      // Digit 1: 9 - (Hundreds top * 2) - (Tens top * 2) + Units top + Tens bottom - (Units bottom * 2)
      const sum1 = 9 - (H * 2) - (T * 2) + U + R1 - (R2 * 2);
      const first = this.norm(sum1);


      // Digit 2: 3 - (Tens top * 2) + Units top
      const sum2 = 3 - (T * 2) + U;
      const second = this.norm(sum2);


      return {
        first,
        second,
        set:[first, second]
      };
    },




    /* =======================================================
       BACKEND SUPPORT FORMULA 1 (FORMER MAIN MODEL 01)
    ======================================================= */


    backendFormula1(n3, n2){
      const top = String(n3).padStart(3,'0').split('').map(Number);
      const bottom = String(n2).padStart(2,'0').split('').map(Number);
      const H = top[0];
      const T = top[1];
      const U = top[2];
      const R1 = bottom[0];

      const sum1 = (T * 2) + U + 2;
      const first = this.norm(sum1);

      const sum2 = 9 - (H * 2) + U - (R1 * 2);
      const second = this.norm(sum2);

      return { result: first };
    },




    /* =======================================================
       BACKEND SUPPORT FORMULA 2 (FORMULA 2 / ~68.50%)
    ======================================================= */


    backendFormula2(n3, n2){
      const top = String(n3).padStart(3,'0').split('').map(Number);
      const bottom = String(n2).padStart(2,'0').split('').map(Number);
      const sum = top[0] + top[1] + top[2] + bottom[0] + bottom[1];
      const result = this.norm(sum * 3 + 7);
      return { result };
    },




    /* =======================================================
       BACKEND SUPPORT FORMULA 3 (FORMULA 3 / ~62.07%)
    ======================================================= */


    backendFormula3(n3, n2){
      const top = String(n3).padStart(3,'0').split('').map(Number);
      const bottom = String(n2).padStart(2,'0').split('').map(Number);
      const sum = top[2] + bottom[1];
      const result = this.norm(sum);
      return { result };
    },




    /* =======================================================
       VIP+ CONFIRMATION


       Backend formulas may only confirm.
       They NEVER replace Model 01.
    ======================================================= */


    checkVIP(main,backend1,backend2,backend3){


      const mainSet = new Set(main.set);


      return (
        mainSet.has(backend1.result) ||
        mainSet.has(backend2.result) ||
        mainSet.has(backend3.result)
      );
    },




    /* =======================================================
       PROTECTED ORIGINAL PAIR / เลขเจาะ ENGINE


       Base:
       7 - hundreds top


       Normal:
       ±2


       Collision with main digit:
       ±3


       No main digits inside the pair range.
       No double pairs.
    ======================================================= */


    buildPairs(mainSet,anchor){


      const pairsMap = {};


      mainSet.forEach(sourceDigit => {


        let range = [];
        let collision = false;


        for(let offset = -2; offset <= 2; offset++){


          if(
            mainSet.includes(
              this.norm(anchor + offset)
            )
          ){
            collision = true;
            break;
          }
        }


        for(
          let offset = collision ? -3 : -2;
          offset <= (collision ? 3 : 2);
          offset++
        ){


          const digit = this.norm(anchor + offset);


          if(!range.includes(digit)){
            range.push(digit);
          }
        }


        const pairs = [];


        range.forEach(target => {


          if(target === sourceDigit){
            return;
          }


          if(mainSet.includes(target)){
            return;
          }


          const pair = `${sourceDigit}${target}`;


          if(
            pair[0] === pair[1]
          ){
            return;
          }


          if(!pairs.includes(pair)){
            pairs.push(pair);
          }
        });


        let next = this.norm(sourceDigit + 1);


        while(pairs.length < 5){


          if(
            next !== sourceDigit &&
            !mainSet.includes(next)
          ){


            const pair = `${sourceDigit}${next}`;


            if(
              pair[0] !== pair[1] &&
              !pairs.includes(pair)
            ){
              pairs.push(pair);
            }
          }


          next = this.norm(next + 1);
        }


        pairsMap[sourceDigit] =
          [...new Set(pairs)]
            .filter(pair => pair[0] !== pair[1])
            .slice(0,5);
      });


      return pairsMap;
    },




    /* =======================================================
       PAIR COLOR / CONSENSUS
       Kept clean and lightweight.
    ======================================================= */


    pairKey(pair){


      const value = String(pair);


      if(!/^\d{2}$/.test(value)){
        return value;
      }


      return [
        value[0],
        value[1]
      ].sort().join('');
    },




    buildPairConsensus(pairSets){


      const all = [];


      pairSets.forEach((set,rowIndex) => {


        set.slice(0,5).forEach(pair => {


          all.push({
            pair:String(pair),
            rowIndex
          });
        });
      });


      const counts = {};


      all.forEach(item => {


        const key = this.pairKey(item.pair);


        if(!counts[key]){


          counts[key] = {
            key,
            score:0,
            rows:new Set(),
            pairs:new Set()
          };
        }


        counts[key].score++;
        counts[key].rows.add(item.rowIndex);
        counts[key].pairs.add(item.pair);
      });


      const ranked =
        Object.values(counts)
          .sort(
            (a,b) =>
              b.score - a.score ||
              b.rows.size - a.rows.size ||
              Number(a.key) - Number(b.key)
          );


      const colorMap = {};


      ranked.slice(0,6).forEach((item,index) => {


        let color;


        if(index < 2){
          color = 'gold';
        }else if(index < 4){
          color = 'silver';
        }else{
          color = 'rose';
        }


        colorMap[item.key] = {
          color,
          rank:index + 1,
          score:item.score
        };
      });


      return {
        counts,
        ranked,
        colorMap
      };
    },




    sortPairs(pairs){


      return pairs
        .map(String)
        .filter(pair =>
          /^\d{2}$/.test(pair) &&
          pair[0] !== pair[1]
        )
        .sort((a,b) => Number(a) - Number(b));
    },




    pairClass(pair,colorMap){


      const info =
        colorMap[this.pairKey(pair)];


      if(!info){
        return 'pair';
      }


      if(info.color === 'gold'){
        return 'pair pair-gold';
      }


      if(info.color === 'silver'){
        return 'pair pair-silver';
      }


      return 'pair pair-rose';
    },




    /* =======================================================
       MAIN ENGINE
    ======================================================= */


    run(n3,n2){


      const topDigits = String(n3)
        .padStart(3,'0')
        .split('')
        .map(Number);


      const H = topDigits[0];


      const main = this.mainModel(n3, n2);


      const backend1 =
        this.backendFormula1(n3, n2);


      const backend2 =
        this.backendFormula2(n3, n2);


      const backend3 =
        this.backendFormula3(n3, n2);


      const vip =
        this.checkVIP(
          main,
          backend1,
          backend2,
          backend3
        );


      const rawAnchor = 7 - H;
      const anchor = this.norm(rawAnchor);


      const pairsMap =
        this.buildPairs(
          main.set,
          anchor
        );


      const pairSets = main.set.map(
        digit =>
          this.sortPairs(
            pairsMap[digit] || []
          ).slice(0,5)
      );


      const consensus =
        this.buildPairConsensus(pairSets);


      return {
        main,
        backend1,
        backend2,
        backend3,
        vip,
        rawAnchor,
        anchor,
        pairsMap,
        pairSets,
        consensus,
        top1Digit:main.first,
        top2Digit:main.second
      };
    },




    /* =======================================================
       CAPTURE
    ======================================================= */


    async captureCard(cardId,name){


      const element =
        document.getElementById(cardId);


      if(!element){
        return;
      }


      const controls =
        [...element.querySelectorAll('[data-no-capture]')];


      try{


        if(typeof html2canvas === 'undefined'){
          throw new Error(
            'ไม่พบระบบแคปภาพ กรุณาเปิดอินเทอร์เน็ตแล้วลองใหม่'
          );
        }


        controls.forEach(
          element =>
            element.style.visibility = 'hidden'
        );


        const canvas =
          await html2canvas(
            element,
            {
              backgroundColor:'#ffffff',
              scale:Math.min(
                3,
                Math.max(
                  2,
                  window.devicePixelRatio || 2
                )
              ),
              useCORS:true,
              logging:false
            }
          );


        const link =
          document.createElement('a');


        const safe =
          String(name || 'lottery')
            .replace(
              /[^ก-๙A-Za-z0-9_-]+/g,
              '_'
            )
            .slice(0,60);


        link.download =
          `${safe || 'lottery'}_card.png`;


        link.href =
          canvas.toDataURL('image/png');


        link.click();


        this.show('✓ แคปการ์ดแล้ว');


      }catch(error){


        console.error(error);


        this.show('❌ แคปภาพไม่สำเร็จ');


      }finally{


        controls.forEach(
          element =>
            element.style.visibility = ''
        );
      }
    },




    /* =======================================================
       COPY
    ======================================================= */


    copy(text){


      if(
        navigator.clipboard &&
        navigator.clipboard.writeText
      ){


        navigator.clipboard
          .writeText(text)
          .then(() => this.show())
          .catch(() => this.fallbackCopy(text));


        return;
      }


      this.fallbackCopy(text);
    },




    fallbackCopy(text){


      const textarea =
        document.createElement('textarea');


      textarea.value = text;


      document.body.appendChild(textarea);


      textarea.select();


      document.execCommand('copy');


      textarea.remove();


      this.show();
    },




    show(message){


      const toast = $('toast');


      if(message){
        toast.textContent = message;
      }


      toast.classList.add('show');


      clearTimeout(this.toastTimer);


      this.toastTimer =
        setTimeout(
          () => toast.classList.remove('show'),
          1500
        );
    },




    /* =======================================================
       NEXT DATE
    ======================================================= */


    nextDateLabel(record){


      if(!record){
        return '';
      }


      const value =
        String(record.date || '').trim();


      const thai =
        value.match(
          /^(\d{1,2})\s+(\S+)\s+(\d{2,4})$/
        );


      if(thai){


        const day = Number(thai[1]);


        let year = Number(thai[3]);


        if(year < 100){
          year += 2500;
        }


        const months = [
          'ม.ค.',
          'ก.พ.',
          'มี.ค.',
          'เม.ย.',
          'พ.ค.',
          'มิ.ย.',
          'ก.ค.',
          'ส.ค.',
          'ก.ย.',
          'ต.ค.',
          'พ.ย.',
          'ธ.ค.'
        ];


        const monthIndex =
          months.indexOf(thai[2]);


        if(monthIndex >= 0){


          const date =
            new Date(
              year - 543,
              monthIndex,
              day
            );


          date.setDate(
            date.getDate() + 1
          );


          return [
            String(date.getDate()),
            months[date.getMonth()],
            String(date.getFullYear() + 543)
          ].join(' ');
        }
      }


      return 'งวดถัดไป';
    },




    /* =======================================================
       CALCULATE
    ======================================================= */


    async calculate(){


      const parsed =
        this.parse(
          $('bulkInput').value
        );


      if(!parsed.records.length){


        $('result').innerHTML =
          '<div class="errorbox">❌ ไม่พบข้อมูลที่ถูกต้อง กรุณาตรวจรูปแบบอีกครั้ง</div>';


        return;
      }


      const scanner = $('scanner');
      const runButton = $('run');


      runButton.disabled = true;


      scanner.style.display = 'block';


      const scan = message => {
        $('scanText').textContent = message;
      };


      const yieldUI = () =>
        new Promise(
          resolve =>
            requestAnimationFrame(resolve)
        );


      try{


        const groups =
          this.groupByLottery(
            parsed.records
          );


        const cards = [];
        const copyBlocks = [];


        let groupIndex = 0;


        for(const group of groups){


          groupIndex++;


          const records =
            group.records;


          if(!records.length){
            continue;
          }


          const latest =
            records[records.length - 1];


          scan(
            `ประมวลผล ${group.name} • ${groupIndex}/${groups.length}`
          );


          await yieldUI();


          const result =
            this.run(
              latest.n3,
              latest.n2
            );


          const mainDigits =
            result.main.set;


          const pair1 =
            result.pairSets[0] || [];


          const pair2 =
            result.pairSets[1] || [];


          const nextDate =
            this.nextDateLabel(latest);


          const pairHTML1 =
            pair1
              .map(pair => {


                const info =
                  result.consensus
                    .colorMap[
                      this.pairKey(pair)
                    ];


                const title =
                  info
                    ? `อันดับ Consensus ${info.rank} • พบ ${info.score} ครั้ง`
                    : 'เลขเจาะ';


                return `
                  <span
                    class="${this.pairClass(pair,result.consensus.colorMap)}"
                    title="${esc(title)}"
                  >${esc(pair)}</span>
                `;
              })
              .join('');


          const pairHTML2 =
            pair2
              .map(pair => {


                const info =
                  result.consensus
                    .colorMap[
                      this.pairKey(pair)
                    ];


                const title =
                  info
                    ? `อันดับ Consensus ${info.rank} • พบ ${info.score} ครั้ง`
                    : 'เลขเจาะ';


                return `
                  <span
                    class="${this.pairClass(pair,result.consensus.colorMap)}"
                    title="${esc(title)}"
                  >${esc(pair)}</span>
                `;
              })
              .join('');


          const vipHTML =
            result.vip
              ? '<div class="vip-label">VIP+</div>'
              : '<div class="vip-label"></div>';


          const cardId =
            `lottery-card-${groupIndex}`;


          const row1 = `
            <div class="row">
              <span
                class="digit digit-gold"
                aria-label="เลขเด่นตัวที่หนึ่ง"
              >${esc(mainDigits[0])}</span>


              <span class="sep">:</span>


              <div class="pairs">
                ${pairHTML1}
              </div>
            </div>
          `;


          const row2 = `
            <div class="row">
              <span
                class="digit digit-gold"
                aria-label="เลขเด่นตัวที่สอง"
              >${esc(mainDigits[1])}</span>


              <span class="sep">:</span>


              <div class="pairs">
                ${pairHTML2}
              </div>
            </div>
          `;


          const footer = `
            <div class="brand-footer">
              <span class="brand-star">✦</span>
              <span>บ้านเงินกอง</span>
              <span class="brand-star">✦</span>
            </div>
          `;


          cards.push(`
            <article
              class="lottery"
              id="${cardId}"
              data-lottery-card="true"
            >


              <div class="lottery-head">


                <div>
                  <div class="lottery-name">
                    <span class="flag">${this.flag(group.name)}</span>
                    <span>${esc(group.name)}</span>
                  </div>


                  <div class="date">
                    ${esc(nextDate)}
                  </div>
                </div>


                ${vipHTML}


                <div
                  class="card-actions"
                  data-no-capture="true"
                >
                  <button
                    class="card-capture"
                    data-capture-card="${cardId}"
                    data-capture-name="${esc(group.name)}"
                  >
                    📷 แคปการ์ด
                  </button>
                </div>


              </div>


              <div class="rows">
                ${row1}
                ${row2}
              </div>


              ${footer}


            </article>
          `);


          copyBlocks.push(
            [
              `${this.flag(group.name)} ${group.name} | ${nextDate}`,
              `${mainDigits[0]} : ${pair1.join('-')}`,
              `${mainDigits[1]} : ${pair2.join('-')}`
            ].join('\n')
          );
        }


        scan('ตรวจสอบความเรียบร้อยของผลลัพธ์...');


        await yieldUI();


        scan('FINALIZING...');


        await yieldUI();


        scanner.style.display = 'none';


        runButton.disabled = false;


        const all =
          copyBlocks.join('\n\n');


        this.lastCopyText = all;


        $('result').innerHTML = `
          <div class="summary">


            <span>
              ประมวลผลสำเร็จ
              <strong>${cards.length}</strong>
              ประเภท
            </span>


            <button
              class="copy"
              id="copyTop"
            >
              📋 COPY ALL
            </button>


          </div>


          ${
            parsed.errors.length
              ? `
                <div class="errorbox">
                  ${parsed.errors.map(esc).join('<br>')}
                </div>
              `
              : ''
          }


          ${cards.join('')}


          <button
            class="copyall"
            id="copyBottom"
          >
            📋 คัดลอกหวยทั้งหมด
          </button>
        `;


        $('copyTop').onclick =
          () => this.copy(all);


        $('copyBottom').onclick =
          () => this.copy(all);


        $('copyInput').disabled =
          !all;


        $('copyInput').onclick =
          () => this.copy(this.lastCopyText);


        $('result')
          .querySelectorAll(
            '[data-capture-card]'
          )
          .forEach(button => {


            button.onclick = () =>
              this.captureCard(
                button.dataset.captureCard,
                button.dataset.captureName
              );
          });


        $('result').scrollIntoView({
          behavior:'smooth',
          block:'start'
        });


      }catch(error){


        console.error(error);


        scanner.style.display = 'none';


        runButton.disabled = false;


        $('result').innerHTML = `
          <div class="errorbox">
            ❌ เกิดข้อผิดพลาดระหว่างประมวลผล:
            ${esc(error?.message || error)}
          </div>
        `;
      }
    }
  };




  /* =========================================================
     EVENTS
  ========================================================= */


  $('run').onclick =
    () => app.calculate();




  $('clearInput').onclick = () => {


    $('bulkInput').value = '';


    $('result').innerHTML = '';


    $('scanner').style.display = 'none';


    $('run').disabled = false;


    $('copyInput').disabled = true;


    app.lastCopyText = '';


    $('bulkInput').focus();


    app.show('✓ ล้างข้อมูลแล้ว');
  };




})();
</script>
