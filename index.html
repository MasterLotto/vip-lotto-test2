<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mester Lotto VIP+ — Audit Intelligence Engine Engine V33.0</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 28, 45, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --accent-gold: #f59e0b;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-card, .result-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h2 {
            margin-top: 0;
            font-size: 1.25rem;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        textarea {
            width: 100%;
            height: 180px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #10b981;
            font-family: monospace;
            padding: 12px;
            box-sizing: border-box;
            resize: vertical;
            font-size: 0.9rem;
        }

        textarea:focus {
            outline: 1px solid var(--accent-gold);
        }

        .btn-process {
            width: 100%;
            padding: 14px;
            margin-top: 16px;
            background: linear-gradient(135deg, #d97706, #b45309);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-process:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* หน้าตาการ์ดเดิม (Clean UI Frame) */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .market-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .date-badge {
            font-size: 0.85rem;
            color: var(--text-sub);
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .grid-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 16px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.25);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        .stat-value-main {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--accent-gold);
            letter-spacing: 2px;
        }

        .stat-value-sub {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent-green);
            letter-spacing: 1px;
        }

        .pair-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
        }

        .pair-chip {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #93c5fd;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .double-warning {
            color: var(--accent-red);
            font-size: 0.8rem;
            text-align: center;
            margin-top: 8px;
            font-weight: 600;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="input-card">
        <h2>📊 สถิติสำหรับการประมวลผล (Audit Input)</h2>
        <textarea id="rawInput" placeholder="วางสถิติย้อนหลังที่นี่..."></textarea>
        <button class="btn-process" onclick="processAuditData()">เริ่มประมวลผลคำนวณขั้นสูง</button>
    </div>

    <div id="outputContainer" class="hidden">
        <!-- Render Result Cards -->
    </div>
</div>

<script>
/**
 * CORE AUDIT ENGINE V33.0 — HIGH PRECISION LOGIC
 * Upgraded Weighting System, Time-Decay Factor, and Pair-Co-occurrence Engine
 */

class AuditEngine {
    constructor() {
        this.timeDecayWeight = [3.5, 2.8, 2.2, 1.7, 1.3, 1.0]; // ถ่วงน้ำหนักวันล่าสุดสูงเป็นพิเศษ
        this.doubleProbabilityThreshold = 0.95; // กฎเหล็ก: เบิ้ลต้อง ≥ 95% เท่านั้น
    }

    parseData(rawText) {
        const lines = rawText.trim().split('\n').map(l => l.trim()).filter(l => l.length > 0);
        const records = [];

        lines.forEach(line => {
            // จับแพตเทิร์น วันที่ / รอบ / ตัวเลข
            const matches = line.match(/\d+/g);
            if (matches && matches.length >= 2) {
                records.push({
                    raw: line,
                    numbers: matches.map(n => n.padStart(2, '0'))
                });
            }
        });
        return records;
    }

    calculateDigitScores(records) {
        const scores = Array(10).fill(0);
        const pairMatrix = Array(10).fill(0).map(() => Array(10).fill(0));
        let doubleHits = 0;
        let totalSessions = records.length;

        records.forEach((rec, idx) => {
            // Time decay: ข้อมูลล่าสุดได้ Weight สูงกว่า
            const weight = this.timeDecayWeight[idx] || 0.8;
            
            rec.numbers.forEach(numStr => {
                const digits = numStr.split('').map(Number);
                
                // เช็คเลขเบิ้ล
                if (digits.length >= 2 && digits[0] === digits[1]) {
                    doubleHits += weight;
                }

                // สะสมคะแนนรายหลัก
                digits.forEach(d => {
                    if (!isNaN(d)) scores[d] += weight;
                });

                // สร้าง Co-occurrence Matrix (จับคู่ตัวเลขที่เคยมาด้วยกันจริง)
                if (digits.length >= 2) {
                    const d1 = digits[0];
                    const d2 = digits[1];
                    if (d1 !== d2) {
                        pairMatrix[d1][d2] += weight;
                        pairMatrix[d2][d1] += weight;
                    }
                }
            });
        });

        const doubleProbability = totalSessions > 0 ? (doubleHits / (totalSessions * 2)) : 0;
        return { scores, pairMatrix, doubleProbability };
    }

    selectTopDigits(scores) {
        return scores
            .map((score, digit) => ({ digit, score }))
            .sort((a, b) => b.score - a.score);
    }

    generatePairs(topDigits, pairMatrix) {
        // กฎเหล็ก: เด่น 2 ตัวแรก (Primary Top 2) ห้ามนำมาจับคู่กันเอง
        const primaryA = topDigits[0].digit;
        const primaryB = topDigits[1].digit;
        
        // คัดเลือกเลขประกบ (Secondary Support Digits) จาก Co-occurrence Matrix
        const getBestMatches = (mainDigit, excludeDigits) => {
            return pairMatrix[mainDigit]
                .map((weight, digit) => ({ digit, weight }))
                .filter(item => !excludeDigits.includes(item.digit))
                .sort((a, b) => b.weight - a.weight)
                .slice(0, 3)
                .map(item => item.digit);
        };

        // เจาะเลขจาก Primary A + เลขประกบ
        const matchesA = getBestMatches(primaryA, [primaryA, primaryB]);
        // เจาะเลขจาก Primary B + เลขประกบ
        const matchesB = getBestMatches(primaryB, [primaryA, primaryB]);

        const pairs = [];
        
        matchesA.forEach(m => {
            pairs.push(`${primaryA}${m}`);
        });

        matchesB.forEach(m => {
            pairs.push(`${primaryB}${m}`);
        });

        // คืนค่าชุดเจาะที่ไม่ซ้ำ และไม่มีการเอาเด่น A กับ B มาจับคู่กันเอง
        return [...new Set(pairs)].slice(0, 6);
    }

    analyze(rawText) {
        const records = this.parseData(rawText);
        if (records.length === 0) return null;

        const { scores, pairMatrix, doubleProbability } = this.calculateDigitScores(records);
        const sortedDigits = this.selectTopDigits(scores);
        
        const topMain = [sortedDigits[0].digit, sortedDigits[1].digit];
        const pairs = this.generatePairs(sortedDigits, pairMatrix);

        // ตรวจสอบเงื่อนไข 95% สำหรับเลขเบิ้ล
        const isDoubleAllowed = doubleProbability >= this.doubleProbabilityThreshold;

        return {
            primaryDigits: topMain.join(' - '),
            pairList: pairs,
            allowDouble: isDoubleAllowed,
            doubleProbabilityPercent: (doubleProbability * 100).toFixed(1)
        };
    }
}

const engine = new AuditEngine();

function processAuditData() {
    const rawInput = document.getElementById('rawInput').value;
    const outputContainer = document.getElementById('outputContainer');

    if (!rawInput.trim()) {
        alert('กรุณากรอกข้อมูลสถิติย้อนหลังก่อนประมวลผล');
        return;
    }

    const result = engine.analyze(rawInput);

    if (!result) {
        alert('ไม่สามารถประมวลผลรูปแบบข้อมูลนี้ได้ กรุณาตรวจสอบรูปแบบข้อความ');
        return;
    }

    // แสดงผลบนการ์ดเดิม (Clean UI Frame)
    outputContainer.innerHTML = `
        <div class="result-card">
            <div class="card-header">
                <span class="market-title">🎯 สรุปผลการคำนวณเลขเด่น / เลขเจาะ</span>
                <span class="date-badge">V33.0 Precision</span>
            </div>

            <div class="grid-stats">
                <div class="stat-box">
                    <div class="stat-label">เลขเด่นประจำรอบ</div>
                    <div class="stat-value-main">${result.primaryDigits}</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">ชุดเจาะแม่นยำ (Co-occurrence)</div>
                    <div class="pair-list">
                        ${result.pairList.map(p => `<span class="pair-chip">${p}</span>`).join('')}
                    </div>
                </div>
            </div>

            ${result.allowDouble ? `
                <div class="stat-box" style="margin-top: 10px; border-color: rgba(239, 68, 68, 0.4);">
                    <div class="stat-label" style="color: #f87171;">⚠️ ตรวจพบแนวโน้มเลขเบิ้ลสูง (≥ 95%)</div>
                    <div class="stat-value-sub" style="color: #ef4444;">ระวังเบิ้ล: ${result.primaryDigits.replace(' - ', '')} / ${result.primaryDigits.split(' - ')[0]}${result.primaryDigits.split(' - ')[0]}</div>
                </div>
            ` : ''}
        </div>
    `;

    outputContainer.classList.remove('hidden');
}
</script>

</body>
</html>
