<script>
(()=>{

/* ==========================================================
   VISUAL PARTICLES
========================================================== */

const c=document.getElementById('snow');
const x=c.getContext('2d');

let w=c.width=innerWidth;
let h=c.height=innerHeight;

addEventListener('resize',()=>{
  w=c.width=innerWidth;
  h=c.height=innerHeight;
});

const particles=Array.from({length:42},()=>({
  x:Math.random()*w,
  y:Math.random()*h,
  r:.7+Math.random()*1.8,
  s:.15+Math.random()*.45,
  a:.18+Math.random()*.35,
  p:Math.random()*6.28,
  tone:Math.random()>.72?'rose':'gold'
}));

(function draw(){
  x.clearRect(0,0,w,h);

  particles.forEach(q=>{
    q.p+=.01;
    q.y+=q.s;
    q.x+=Math.sin(q.p)*.25;

    if(q.y>h+5){
      q.y=-5;
      q.x=Math.random()*w;
    }

    x.beginPath();
    x.arc(q.x,q.y,q.r,0,Math.PI*2);

    x.fillStyle=q.tone==='rose'
      ?`rgba(185,130,121,${q.a*.55})`
      :`rgba(195,154,67,${q.a})`;

    x.fill();
  });

  requestAnimationFrame(draw);
})();


/* ==========================================================
   HELPERS
========================================================== */

const $=id=>document.getElementById(id);

const esc=s=>String(s)
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;')
  .replace(/'/g,'&#039;');


/* ==========================================================
   AUTH
   - เดิมยังคงระบบรหัสผ่าน
   - login สำเร็จแล้วจำสถานะ
   - ครั้งต่อไปไม่ต้องกรอกรหัสซ้ำ
========================================================== */

const sec={
  tokens:[
    '4d617374657241646d696e32303236',
    '54396b4c326d5037',
    '5a71345738785431'
  ],

  dec(h){
    let s='';
    for(let i=0;i<h.length;i+=2){
      s+=String.fromCharCode(parseInt(h.slice(i,i+2),16));
    }
    return s;
  },

  ok(v){
    return this.tokens.some(t=>v===this.dec(t));
  }
};


/* ==========================================================
   APPLICATION ENGINE
========================================================== */

const app={

cache:[],
lastCopyText:'',
toastTimer:null,

audio(){},

norm(x){
  return(x%10+10)%10;
},

clamp(v,lo=0,hi=1){
  return Math.max(lo,Math.min(hi,Number(v)||0));
},

mean(arr,fallback=.5){
  if(!Array.isArray(arr)||!arr.length)return fallback;
  const valid=arr.filter(Number.isFinite);
  return valid.length
    ?valid.reduce((a,b)=>a+b,0)/valid.length
    :fallback;
},

variance(arr){
  if(!Array.isArray(arr)||arr.length<2)return 0;
  const m=this.mean(arr,0);
  return this.mean(arr.map(v=>(v-m)*(v-m)),0);
},

standardDeviation(arr){
  return Math.sqrt(this.variance(arr));
},

/* ----------------------------------------------------------
   Bayesian shrinkage
   สำคัญมากเมื่อมีประวัติย้อนหลังเพียง 10 งวด
---------------------------------------------------------- */

posterior(rate,samples,prior=.5,priorN=6){

  const n=Math.max(0,Number(samples)||0);
  const r=this.clamp(rate,.0,1);

  return(
    r*n+
    prior*priorN
  )/
  (n+priorN);
},

effectiveSampleSize(weights){

  const clean=(weights||[])
    .filter(v=>Number.isFinite(v)&&v>0);

  if(!clean.length)return 0;

  const sum=clean.reduce((a,b)=>a+b,0);
  const sum2=clean.reduce((a,b)=>a+b*b,0);

  if(sum2<=0)return 0;

  return(sum*sum)/sum2;
},

normalizeScores(map){

  const vals=Object.values(map);

  const max=Math.max(...vals,0);

  if(max<=0){
    return Object.fromEntries(
      Object.keys(map).map(k=>[k,0])
    );
  }

  return Object.fromEntries(
    Object.entries(map).map(([k,v])=>[
      k,
      this.clamp(v/max)
    ])
  );
},

sourceBreadthScore(v){

  return this.clamp(
    1-Math.exp(-Math.max(0,v)/1.6)
  );
},

consensusTier(count,total){

  const n=Math.max(1,total||1);

  if(count>=n)return 1;
  if(count===2&&n===3)return .78;
  if(count>=2)return .68;
  if(count===1)return .30;

  return 0;
},

flag(n){

  n=String(n).toLowerCase();

  if(/ลาว|lao/.test(n))return'🇱🇦';
  if(/ฮานอย|เวียดนาม|vietnam|viet/.test(n))return'🇻🇳';
  if(/พม่า|เมียนมา|myanmar|2d|internet|modern/.test(n))return'🇲🇲';
  if(/จีน|china|shanghai/.test(n))return'🇨🇳';
  if(/ฮั่งเส็ง|hang seng|hong kong|ฮ่องกง/.test(n))return'🇭🇰';
  if(/นิเคอิ|นิคเคอิ|นิกเคอิ|nikkei|ญี่ปุ่น|japan/.test(n))return'🇯🇵';
  if(/เกาหลี|korea|kospi/.test(n))return'🇰🇷';
  if(/สิงคโปร์|singapore/.test(n))return'🇸🇬';
  if(/อินเดีย|india|sensex/.test(n))return'🇮🇳';
  if(/รัสเซีย|russia|moscow/.test(n))return'🇷🇺';
  if(/เยอรมัน|germany|dax/.test(n))return'🇩🇪';
  if(/อังกฤษ|uk|ftse|london/.test(n))return'🇬🇧';
  if(/อียิปต์|egypt/.test(n))return'🇪🇬';
  if(/ไต้หวัน|taiwan|tse/.test(n))return'🇹🇼';
  if(/สหรัฐ|usa|america|dow|nasdaq|s&p/.test(n))return'🇺🇸';
  if(/ฝรั่งเศส|france|cac/.test(n))return'🇫🇷';
  if(/ออสเตรเลีย|australia|asx/.test(n))return'🇦🇺';
  if(/แคนาดา|canada/.test(n))return'🇨🇦';
  if(/หุ้นไทย|ไทย|thai|set|หุ้น/.test(n))return'🇹🇭';

  return'🌐';
},


/* ==========================================================
   INPUT PARSER
========================================================== */

parse(text){

  const z=String(text||'')
    .replace(/\r/g,'')
    .trim();

  if(!z){
    return{
      records:[],
      errors:['ยังไม่มีข้อมูลสำหรับประมวลผล']
    };
  }

  const lines=z
    .split('\n')
    .map(v=>v.trim());

  const records=[];
  const errors=[];

  let i=0;

  while(i<lines.length){

    if(!lines[i]){
      i++;
      continue;
    }

    const m=lines[i].match(/^(.+?)\s*\|\s*(.+?)$/);

    if(!m){
      errors.push(
        `บรรทัดที่ ${i+1}: ไม่พบรูปแบบ "ชื่อหวย | วันที่"`
      );
      i++;
      continue;
    }

    const name=m[1].trim();
    const date=m[2].trim();

    if(!this.parseDateValue(date)){
      errors.push(
        `${name} | ${date}: รูปแบบวันที่ไม่ถูกต้อง เช่น 25 ส.ค. 69`
      );
      i++;
      continue;
    }

    const n3raw=lines[i+1]||'';
    const n2raw=lines[i+2]||'';

    const n3=/^[\d\s]+$/.test(n3raw)
      ?n3raw.replace(/\s+/g,'')
      :n3raw;

    const n2=/^[\d\s]+$/.test(n2raw)
      ?n2raw.replace(/\s+/g,'')
      :n2raw;

    if(!/^\d{3}$/.test(n3)){
      errors.push(
        `${name} | ${date}: เลข 3 ตัวบนต้องเป็น 3 หลัก`
      );
      i+=1;
      continue;
    }

    if(!/^\d{2}$/.test(n2)){
      errors.push(
        `${name} | ${date}: เลข 2 ตัวล่างต้องเป็น 2 หลัก`
      );
      i+=2;
      continue;
    }

    records.push({
      name,
      date,
      n3,
      n2
    });

    i+=3;
  }

  return{
    records,
    errors
  };
},

parseDateValue(date){

  const s=String(date||'').trim();

  if(!s)return false;

  if(/^\d{1,2}\s+\S+\s+\d{2,4}$/.test(s))return true;

  if(/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(s))return true;

  if(/^\d{1,2}-\d{1,2}-\d{2,4}$/.test(s))return true;

  return false;
},

dateKey(date){

  const s=String(date||'').trim();

  const m=s.match(/^(\d{1,2})\s+(\S+)\s+(\d{2,4})$/);

  if(m){

    const months={
      'ม.ค.':1,
      'ก.พ.':2,
      'มี.ค.':3,
      'เม.ย.':4,
      'พ.ค.':5,
      'มิ.ย.':6,
      'ก.ค.':7,
      'ส.ค.':8,
      'ก.ย.':9,
      'ต.ค.':10,
      'พ.ย.':11,
      'ธ.ค.':12
    };

    const month=months[m[2]]||0;

    let year=Number(m[3]);

    if(year<100)year+=2500;

    return[
      year,
      String(month).padStart(2,'0'),
      String(Number(m[1])).padStart(2,'0')
    ].join('-');
  }

  const m2=s.match(
    /^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/
  );

  if(m2){

    let year=Number(m2[3]);

    if(year<100)year+=2500;

    return[
      year,
      String(Number(m2[2])).padStart(2,'0'),
      String(Number(m2[1])).padStart(2,'0')
    ].join('-');
  }

  return s;
},

sortChronological(records){

  return records
    .map((r,index)=>({
      ...r,
      __index:index
    }))
    .sort((a,b)=>{

      const ka=this.dateKey(a.date);
      const kb=this.dateKey(b.date);

      if(ka<kb)return-1;
      if(ka>kb)return 1;

      return a.__index-b.__index;

    })
    .map(r=>{

      const z={...r};

      delete z.__index;

      return z;
    });
},

groupByLottery(records){

  const groupsMap={};

  records.forEach((r,index)=>{

    const key=r.name.trim();

    if(!groupsMap[key]){
      groupsMap[key]={
        name:key,
        records:[],
        duplicateCount:0,
        conflictCount:0,
        __order:index
      };
    }

    groupsMap[key].records.push(r);
  });

  const groups=Object.values(groupsMap);

  groups.forEach(g=>{

    const sorted=this.sortChronological(g.records);
    const byDate=new Map();
    const clean=[];

    sorted.forEach(r=>{

      const key=this.dateKey(r.date);

      if(!byDate.has(key)){
        byDate.set(key,r);
        clean.push(r);
        return;
      }

      const previous=byDate.get(key);

      if(
        previous.n3===r.n3 &&
        previous.n2===r.n2
      ){
        g.duplicateCount++;
        return;
      }

      g.conflictCount++;

      const idx=clean.indexOf(previous);

      if(idx>=0){
        clean[idx]=r;
      }

      byDate.set(key,r);
    });

    g.records=this.sortChronological(clean);
  });

  return groups
    .sort((a,b)=>a.__order-b.__order)
    .map(g=>{
      delete g.__order;
      return g;
    });
},

/* ==========================================================
   PROTECTED PAIR / เลขเจาะ ENGINE
   ห้ามแก้
========================================================== */

buildPairs(models,anchor){

  models.forEach(m=>{

    let range=[];
    let collision=false;

    for(let o=-2;o<=2;o++){

      if(
        m.set.includes(
          this.norm(anchor+o)
        )
      ){
        collision=true;
        break;
      }
    }

    for(
      let o=collision?-3:-2;
      o<=(collision?3:2);
      o++
    ){
      range.push(
        this.norm(anchor+o)
      );
    }

    m.pairsMap={};

    m.set.forEach(src=>{

      let pairs=range
        .filter(
          p=>
            p!==src &&
            !m.set.includes(p)
        )
        .map(
          p=>`${src}${p}`
        );

      let next=(src+1)%10;

      while(pairs.length<5){

        if(
          next!==src &&
          !m.set.includes(next) &&
          !pairs.includes(`${src}${next}`)
        ){
          pairs.push(`${src}${next}`);
        }

        next=(next+1)%10;
      }

      m.pairsMap[src]=[
        ...new Set(pairs)
      ]
      .filter(
        p=>p[0]!==p[1]
      )
      .slice(0,5);
    });
  });
},


/* ==========================================================
   HISTORICAL BACKEND
   ปรับปรุงสำหรับย้อนหลังเพียง 10 งวด
========================================================== */

actualDigits(record){

  return new Set(
    (
      String(record.n3)+
      String(record.n2)
    )
    .split('')
    .map(Number)
  );
},


/* ----------------------------------------------------------
   Feature representation
---------------------------------------------------------- */

featureVector(record){

  const d3=String(record.n3)
    .padStart(3,'0')
    .split('')
    .map(Number);

  const d2=String(record.n2)
    .padStart(2,'0')
    .split('')
    .map(Number);

  const H=d3[0];
  const T=d3[1];
  const U=d3[2];
  const R1=d2[0];
  const R2=d2[1];

  const sumT=(H+T+U)%10;
  const sumB=(R1+R2)%10;

  return[
    H,
    T,
    U,
    R1,
    R2,
    sumT,
    sumB,
    (sumT+sumB)%10
  ];
},


featureSimilarity(a,b){

  const A=this.featureVector(a);
  const B=this.featureVector(b);

  const weights=[
    .12,
    .15,
    .12,
    .12,
    .15,
    .12,
    .10,
    .12
  ];

  let s=0;
  let w=0;

  for(let i=0;i<A.length;i++){

    const rawDist=Math.abs(A[i]-B[i]);

    const dist=Math.min(
      rawDist,
      10-rawDist
    );

    let part=0;

    if(dist===0)part=1;
    else if(dist===1)part=.55;
    else if(dist===2)part=.20;

    s+=weights[i]*part;
    w+=weights[i];
  }

  return this.clamp(s/w);
},


/* ==========================================================
   MODEL 03 — STABLE SIMILARITY ENGINE
   ----------------------------------------------------------
   หลักการใหม่:

   1. similarity >= .60
   2. weighted historical target
   3. recency
   4. similarity squared
   5. global digit baseline
   6. lift จาก pattern
   7. Bayesian shrinkage
   8. effective sample size
   9. anti-overfit
   10. ไม่ใช้ข้อมูล target ในการสร้าง prediction
========================================================== */

m03Predict(source,records){

  const ordered=this.sortChronological(records||[]);

  const candidates=[];

  const global=Array.from(
    {length:10},
    ()=>0
  );

  const globalCount=Array.from(
    {length:10},
    ()=>0
  );

  let totalTargets=0;

  for(let i=1;i<ordered.length;i++){

    const pastSource=ordered[i-1];
    const target=ordered[i];

    const sim=this.featureSimilarity(
      source,
      pastSource
    );

    /*
      Threshold เดิม > 0.60 ยังคงเป็น gate
      แต่ไม่ได้ให้ทุก match น้ำหนักเท่ากัน
    */

    if(sim<0.60)continue;

    const age=
      ordered.length-1-i;

    /*
      Recency ไม่แรงเกินไป
      เพราะมีเพียงประมาณ 10 งวด
    */

    const recency=
      Math.pow(.975,Math.max(0,age));

    /*
      similarity weighting
      match สูง = น้ำหนักสูง
    */

    const similarityWeight=
      Math.pow(
        .55+.45*sim,
        2
      );

    const weight=
      similarityWeight*
      recency;

    const actual=this.actualDigits(target);

    actual.forEach(d=>{
      global[d]+=weight;
      globalCount[d]++;
    });

    totalTargets+=weight;

    candidates.push({
      index:i,
      similarity:sim,
      weight,
      targetDate:target.date,
      actual:[...actual]
    });
  }

  if(!candidates.length){
    return{
      set:[],
      scores:{},
      rawScores:{},
      matches:0,
      effectiveSamples:0,
      details:[]
    };
  }


  /*
    Base-rate ของ digit จากข้อมูลที่มี
    ใช้เป็น prior เท่านั้น
  */

  const allDigitCounts=
    Array.from({length:10},()=>0);

  let allDigits=0;

  ordered.forEach(record=>{

    this.actualDigits(record)
      .forEach(d=>{
        allDigitCounts[d]++;
        allDigits++;
      });

  });

  const baseRate=
    Array.from(
      {length:10},
      (_,d)=>
        allDigits
          ?allDigitCounts[d]/allDigits
          :0.1
    );


  /*
    Pattern probability
  */

  const patternProbability=
    Array.from(
      {length:10},
      (_,d)=>
        global[d]/
        Math.max(totalTargets,1)
    );


  /*
    Lift:
    ถ้า pattern มีแนวโน้มสูงกว่า
    base-rate จึงให้คะแนนเพิ่ม
  */

  const lift=
    Array.from(
      {length:10},
      (_,d)=>{
        const p=patternProbability[d];
        const b=baseRate[d];

        return p/
          Math.max(b,.05);
      }
    );


  /*
    Effective sample size
    ป้องกัน match เพียง 1-2 ครั้ง
    แล้วทำคะแนนพุ่งเกินจริง
  */

  const weights=candidates.map(
    c=>c.weight
  );

  const effectiveSamples=
    this.effectiveSampleSize(weights);

  const sampleConfidence=
    this.clamp(
      effectiveSamples/
      4
    );


  /*
    Bayesian posterior
    shrink กลับเข้า prior
    เมื่อข้อมูลน้อย
  */

  const rawScores={};

  for(let d=0;d<=9;d++){

    const posterior=
      this.posterior(
        patternProbability[d],
        effectiveSamples,
        baseRate[d],
        5
      );

    const liftScore=
      this.clamp(
        (lift[d]-1)/
        1.5
      );

    /*
      Pattern evidence
      + base rate
      + lift
      - overfit control
    */

    const raw=
      .62*posterior+
      .24*liftScore+
      .14*baseRate[d];

    rawScores[d]=this.clamp(raw);
  }


  /*
    Normalize เฉพาะ candidate evidence
  */

  const maxRaw=
    Math.max(
      ...Object.values(rawScores),
      .000001
    );

  const scores={};

  for(let d=0;d<=9;d++){

    const relative=
      rawScores[d]/
      maxRaw;

    /*
      sampleConfidence ต่ำ
      ไม่อนุญาตให้ historical pattern
      ครอบงำระบบมากเกินไป
    */

    scores[d]=this.clamp(
      .55*relative+
      .45*(
        .5+
        sampleConfidence*
        (relative-.5)
      )
    );
  }


  const ranked=
    scores
      |> undefined;

  /*
    JS ไม่มี pipeline operator ที่ต้องพึ่ง browser
    จึงสร้าง ranking ตรงนี้
  */

  const ranking=Array
    .from({length:10},(_,d)=>({
      d,
      score:scores[d],
      raw:rawScores[d],
      lift:lift[d]
    }))
    .sort(
      (a,b)=>
        b.score-a.score||
        b.lift-a.lift||
        b.raw-a.raw||
        a.d-b.d
    );

  const set=
    ranking
      .slice(0,2)
      .map(x=>x.d);


  return{
    set,
    scores,
    rawScores,
    matches:candidates.length,
    effectiveSamples,
    sampleConfidence,
    details:candidates.slice(-20),
    ranking
  };
},


/* ==========================================================
   MODEL 03 BACKTEST
========================================================== */

backtestM03(records){

  const ordered=this.sortChronological(
    records||[]
  );

  const results=[];

  if(ordered.length<4){

    return{
      samples:0,
      hitRate:.5,
      exactTop1Rate:.5,
      stability:.5,
      effectiveSamples:0,
      results:[]
    };
  }

  /*
    Walk-forward:
    prediction ของ target i
    ใช้ข้อมูลก่อน target i เท่านั้น
  */

  for(let i=2;i<ordered.length;i++){

    const train=ordered.slice(0,i);
    const source=ordered[i-1];
    const target=ordered[i];

    const pred=this.m03Predict(
      source,
      train
    );

    if(!pred.set.length)continue;

    const actual=
      this.actualDigits(target);

    const hitCount=
      pred.set.filter(
        d=>actual.has(d)
      ).length;

    const hitRate=
      hitCount/
      Math.max(1,pred.set.length);

    const exactTop1=
      actual.has(pred.set[0])
        ?1
        :0;

    results.push({
      date:target.date,
      set:pred.set.slice(0,2),
      actual:[...actual],
      hitRate,
      exactTop1,
      matches:pred.matches,
      effectiveSamples:pred.effectiveSamples
    });
  }

  if(!results.length){

    return{
      samples:0,
      hitRate:.5,
      exactTop1Rate:.5,
      stability:.5,
      effectiveSamples:0,
      results:[]
    };
  }

  const hitRates=
    results.map(r=>r.hitRate);

  const top1Rates=
    results.map(r=>r.exactTop1);

  const hitRate=
    this.mean(
      hitRates,
      .5
    );

  const exactTop1Rate=
    this.mean(
      top1Rates,
      .5
    );

  const sd=
    this.standardDeviation(
      hitRates
    );

  const stability=
    this.clamp(
      1-
      Math.min(
        1,
        sd*2
      )
    );

  const effectiveSamples=
    this.mean(
      results.map(
        r=>r.effectiveSamples
      ),
      0
    );

  return{
    samples:results.length,
    hitRate,
    exactTop1Rate,
    stability,
    effectiveSamples,
    results
  };
},

      transitions,
      usable:0,
      recentWindow:0,
      walkForward:{},
      m03:{
        currentSet:[],
        scores:{},
        samples:0,
        patternSamples:0,
        baseHits:0,
        plusHits:0,
        misses:0,
        long:.5,
        recent:.5,
        stability:.5,
        effectiveSamples:0,
        sampleConfidence:0,
        exactTop1Rate:.5
      }
    };
  }


  for(let i=1;i<ordered.length;i++){

    const source=ordered[i-1];
    const target=ordered[i];

    const d3=source.n3
      .split('')
      .map(Number);

    const d2=source.n2
      .split('')
      .map(Number);

    const H=d3[0];
    const T=d3[1];
    const U=d3[2];
    const R1=d2[0];
    const R2=d2[1];

    const sumT=H+T+U;

    const F=this.formulas(
      H,T,U,R1,R2,
      sumT,
      R1+R2,
      sumT+R1+R2
    );

    /*
      Model 01 / 02 backtest
      ใช้สูตรเดิม
    */

    const models=
      this.buildModels(
        H,T,U,R1,R2,
        sumT,
        null
      );

    const actual=
      this.actualDigits(target);

    const recent=
      i>
      ordered.length-1-recentWindow;

    const recencyWeight=
      Math.pow(
        .92,
        ordered.length-1-i
      );


    models
      .slice(0,2)
      .forEach(m=>{

        const unique=[
          ...new Set(m.set)
        ];

        const hit=
          unique.filter(
            d=>actual.has(d)
          ).length/
          Math.max(
            1,
            unique.length
          );

        const mp=
          modelPerf[m.id];

        const base=m.base;

        const plus=
          (base+1)%10;

        mp.hits+=hit;
        mp.samples++;

        mp.baseHits+=
          actual.has(base)
            ?1
            :0;

        mp.plusHits+=
          actual.has(plus)
            ?1
            :0;

        if(hit===0){
          mp.misses++;
        }

        if(recent){

          mp.recentHits+=
            hit*recencyWeight;

          mp.recentWeight+=
            recencyWeight;

          mp.recentSamples++;
        }
      });


    F.signals.forEach(sig=>{

      const fp=
        formulaPerf[sig.id];

      const hit=
        actual.has(sig.value)
          ?1
          :0;

      fp.hits+=hit;
      fp.samples++;

      if(recent){

        fp.recentHits+=
          hit*recencyWeight;

        fp.recentWeight+=
          recencyWeight;

        fp.recentSamples++;
      }
    });


    const candidateDigits=
      new Set(
        models
          .slice(0,2)
          .flatMap(
            m=>m.set
          )
      );


    candidateDigits.forEach(d=>{

      const dp=
        digitPerf[d];

      const hit=
        actual.has(d)
          ?1
          :0;

      dp.hits+=hit;
      dp.samples++;

      if(recent){

        dp.recentHits+=
          hit*recencyWeight;

        dp.recentWeight+=
          recencyWeight;

        dp.recentSamples++;
      }
    });


    transitions.push({
      index:i,
      sourceDate:source.date,
      targetDate:target.date,
      source,
      target,
      models:models.slice(0,2),
      formulaSignals:F.signals,
      actual:[...actual]
    });
  }


  Object.values(modelPerf)
    .forEach(mp=>{

      mp.long=
        mp.samples
          ?mp.hits/mp.samples
          :.5;

      mp.recent=
        mp.recentWeight
          ?mp.recentHits/mp.recentWeight
          :mp.long;

      mp.stability=
        1-
        Math.min(
          1,
          Math.abs(
            mp.long-mp.recent
          )*2
        );

      mp.baseRate=
        mp.samples
          ?mp.baseHits/mp.samples
          :.5;

      mp.plusRate=
        mp.samples
          ?mp.plusHits/mp.samples
          :.5;
    });


  Object.values(formulaPerf)
    .forEach(fp=>{

      fp.long=
        fp.samples
          ?fp.hits/fp.samples
          :.5;

      fp.recent=
        fp.recentWeight
          ?fp.recentHits/fp.recentWeight
          :fp.long;
    });


  for(let d=0;d<=9;d++){

    const dp=digitPerf[d];

    if(!dp.samples)continue;

    dp.long=
      dp.hits/dp.samples;

    dp.recent=
      dp.recentWeight
        ?dp.recentHits/dp.recentWeight
        :dp.long;

    dp.stability=
      1-
      Math.min(
        1,
        Math.abs(
          dp.long-dp.recent
        )*2
      );


    let streak=0;

    for(
      let j=transitions.length-1;
      j>=0;
      j--
    ){

      const tr=transitions[j];

      if(
        !tr.models.some(
          m=>m.set.includes(d)
        )
      ){
        continue;
      }

      if(tr.actual.includes(d)){

        streak++;

        dp.maxStreak=
          Math.max(
            dp.maxStreak,
            streak
          );

      }else{
        break;
      }
    }

    dp.streak=streak;
  }


  /* --------------------------------------------------------
     MODEL 03 WALK-FORWARD BACKTEST
  -------------------------------------------------------- */

  const m03Test=
    this.backtestM03(
      ordered
    );


  const current=
    this.m03Predict(
      ordered[ordered.length-1],
      ordered.slice(0,-1)
    );


  const m03Perf={
    samples:m03Test.samples,
    patternSamples:current.matches||0,
    baseHits:0,
    plusHits:0,
    misses:0,
    long:m03Test.hitRate,
    recent:m03Test.exactTop1Rate,
    stability:m03Test.stability,
    effectiveSamples:m03Test.effectiveSamples,
    exactTop1Rate:m03Test.exactTop1Rate,
    currentSet:current.set.slice(0,2),
    scores:current.scores||{},
    sampleConfidence:current.sampleConfidence||0
  };


  if(m03Test.results.length){

    m03Test.results.forEach(r=>{

      if(r.actual.includes(r.set[0])){
        m03Perf.baseHits++;
      }

      if(r.set[1]!==undefined&&
         r.actual.includes(r.set[1])){
        m03Perf.plusHits++;
      }

      if(r.hitRate===0){
        m03Perf.misses++;
      }
    });
  }


  return{
    modelPerf,
    formulaPerf,
    digitPerf,
    transitions,
    usable,
    recentWindow,
    walkForward:{
      m03:m03Test
    },
    m03:m03Perf
  };
},


/* ==========================================================
   MODEL WEIGHTS
========================================================== */

modelWeight(m,history){

  const hp=
    history&&
    history.modelPerf&&
    history.modelPerf[m.id];

  if(!hp)return 1;


  const long=
    this.posterior(
      hp.long,
      hp.samples,
      .5,
      8
    );

  const recent=
    this.posterior(
      hp.recent,
      hp.recentSamples||
      Math.min(
        hp.samples,
        6
      ),
      .5,
      6
    );

  const base=
    this.posterior(
      hp.baseRate,
      hp.samples,
      .5,
      6
    );

  const plus=
    this.posterior(
      hp.plusRate,
      hp.samples,
      .5,
      6
    );

  const variant=
    Math.max(
      base,
      plus
    );

  const blended=
    .40*long+
    .24*recent+
    .16*(hp.stability??.5)+
    .20*variant;

  /*
    weight range:
    0.78 — 1.22
  */

  return(
    .78+
    .44*
    this.clamp(blended)
  );
},


formulaWeight(id,history){

  const fp=
    history&&
    history.formulaPerf&&
    history.formulaPerf[id];

  if(!fp)return 1;


  /*
    สูตรแต่ละตัวใน formula engine
    มีความสัมพันธ์กันสูงมาก
    จึง shrink หนักกว่าปกติ
  */

  const long=
    this.posterior(
      fp.long,
      fp.samples,
      .5,
      10
    );

  const recent=
    this.posterior(
      fp.recent,
      fp.recentSamples||
      Math.min(
        fp.samples,
        6
      ),
      .5,
      7
    );

  const blended=
    .58*long+
    .32*recent+
    .10;


  return(
    .88+
    .24*
    this.clamp(blended)
  );
},


m03Weight(history){

  const p=
    history&&
    history.m03;

  if(!p||!p.samples){

    /*
      Model 03 ไม่มีหลักฐานย้อนหลังพอ
      ไม่ให้มันครอบงำ Model 01/02
    */

    return .82;
  }


  const long=
    this.posterior(
      p.long,
      p.samples,
      .5,
      8
    );

  const recent=
    this.posterior(
      p.recent,
      p.samples,
      .5,
      6
    );

  const stability=
    p.stability??.5;

  const confidence=
    p.sampleConfidence??0;

  const blended=
    .40*long+
    .25*recent+
    .15*stability+
    .20*confidence;

  return(
    .76+
    .48*
    this.clamp(blended)
  );
},


/* ==========================================================
   ADAPTIVE HISTORY QUALITY
========================================================== */

historyQuality(history){

  if(!history||!history.usable){

    return{
      quality:.15,
      sampleFactor:.15,
      reliability:.5
    };
  }

  const sampleFactor=
    this.clamp(
      history.usable/9
    );

  const transitionRates=
    (history.transitions||[])
      .map(tr=>{

        const hits=
          tr.models
            .slice(0,2)
            .map(m=>
              m.set.some(
                d=>tr.actual.includes(d)
              )
                ?1
                :0
            );

        return this.mean(
          hits,
          .5
        );
      });

  const stability=
    transitionRates.length>1
      ?this.clamp(
        1-
        this.standardDeviation(
          transitionRates
        )*2
      )
      :.5;

  const quality=
    this.clamp(
      .55*sampleFactor+
      .25*stability+
      .20*.5
    );

  return{
    quality,
    sampleFactor,
    reliability:stability
  };
},


/* ==========================================================
   SCORE ENGINE — V12.7
========================================================== */

scoreDigits(
  models,
  F,
  H,T,U,R1,R2,
  sumT,
  sumB,
  total,
  history
){

  const score=
    Object.fromEntries(
      Array.from(
        {length:10},
        (_,d)=>[
          d,
          {
            digit:d,

            modelScore:0,
            formula100Score:0,
            radarScore:0,
            backendScore:0,
            winSetScore:0,

            selectorBonus:0,
            selectorScore:0,

            historicalScore:.5,
            recentFormScore:.5,
            stabilityScore:.5,

            hotStreakBonus:1,

            confidence:0,

            redundancyPenalty:1,

            modelConsensusCount:0,
            supportSignals:0,
            conflictSignals:0,

            reliabilityScore:.5,
            evidenceScore:.5,

            uncertainty:1,

            selectionPenalty:1,
            selectionScore:0,
            totalScore:0,

            qualityGate:1,

            modelId:null,
            modelSupportScore:0,
            modelPriority:1,
            selectedModel:false,

            m03Score:0,

            independentSupport:0,
            conflictStrength:0
          }
        ]
      )
    );


  const allowed=new Set();

  const modelWeights={};

  let totalModelWeight=0;


  /* --------------------------------------------------------
     Model weights
  -------------------------------------------------------- */

  models.forEach(m=>{

    const mw=
      m.id===3
        ?this.m03Weight(history)
        :this.modelWeight(
          m,
          history
        );

    modelWeights[m.id]=mw;

    m.historyWeight=mw;

    totalModelWeight+=mw;

    m.set.forEach(d=>{
      if(Number.isInteger(d)){
        allowed.add(d);
      }
    });
  });


  /* --------------------------------------------------------
     Consensus
  -------------------------------------------------------- */

  for(let d=0;d<=9;d++){

    const supporters=
      models.filter(
        m=>m.set.includes(d)
      );

    score[d].modelConsensusCount=
      supporters.length;

    score[d].modelScore=
      totalModelWeight
        ?supporters.reduce(
          (sum,m)=>
            sum+
            modelWeights[m.id],
          0
        )/
        totalModelWeight
        :0;

    score[d].modelSupportScore=
      score[d].modelScore;

    score[d].modelId=
      supporters[0]?.id??null;

    score[d].m03Score=
      history?.m03?.scores?.[d]??0;

    /*
      Consensus strength
    */

    score[d].independentSupport=
      this.consensusTier(
        supporters.length,
        models.length
      );
  }


  /* --------------------------------------------------------
     Formula 100
  -------------------------------------------------------- */

  const weightedFormulaCounts=
    Object.fromEntries(
      Array.from(
        {length:10},
        (_,d)=>[d,0]
      )
    );

  F.signals.forEach(sig=>{

    weightedFormulaCounts[
      sig.value
    ]+=this.formulaWeight(
      sig.id,
      history
    );
  });

  const maxF=
    Math.max(
      ...Object.values(
        weightedFormulaCounts
      ),
      1
    );

  for(let d=0;d<=9;d++){

    score[d].formula100Score=
      this.clamp(
        weightedFormulaCounts[d]/
        maxF
      );
  }


  /* --------------------------------------------------------
     Radar
  -------------------------------------------------------- */

  const x=(R1+R2)%10;
  const y=sumT%10;
  const z=total%10;

  const r1=[
    this.norm(x-1),
    x,
    this.norm(x+1)
  ];

  const r2=[
    this.norm(y-1),
    y,
    this.norm(y+1)
  ];

  const r3=[
    this.norm(z-1),
    z,
    this.norm(z+1)
  ];

  for(let d=0;d<=9;d++){

    let h=0;

    if(r1.includes(d))h++;
    if(r2.includes(d))h++;
    if(r3.includes(d))h++;

    score[d].radarScore=h/3;
  }


  /* --------------------------------------------------------
     Backend signals
  -------------------------------------------------------- */

  const back=[
    (2*H+R1)%10,
    (T+R2)%10,
    sumT%10,
    Math.abs(T-U)%10,
    total%10
  ];

  for(let d=0;d<=9;d++){

    score[d].backendScore=
      back.includes(d)
        ?1
        :0;

    score[d].winSetScore=
      (
        d===z||
        d===this.norm(z+5)
      )
        ?1
        :0;


    const dp=
      history&&
      history.digitPerf&&
      history.digitPerf[d];


    if(dp&&dp.samples){

      const longPost=
        this.posterior(
          dp.long,
          dp.samples,
          .5,
          7
        );

      const recentPost=
        this.posterior(
          dp.recent,
          dp.recentSamples||
          Math.min(
            dp.samples,
            6
          ),
          .5,
          5
        );

      score[d].historicalScore=
        longPost;

      score[d].recentFormScore=
        recentPost;

      score[d].stabilityScore=
        dp.stability??.5;

      score[d].evidenceScore=
        this.clamp(
          .52*longPost+
          .32*recentPost+
          .16*(dp.stability??.5)
        );

      score[d].uncertainty=
        1/
        Math.sqrt(
          dp.samples+1
        );

      const streak=
        Math.max(
          0,
          dp.streak||0
        );

      /*
        streak bonus จำกัดมาก
        ไม่ให้ hot digit หลอกระบบ
      */

      score[d].hotStreakBonus=
        1+
        Math.min(
          .025,
          Math.max(
            0,
            streak-1
          )*.006
        );
    }
  }


  /* --------------------------------------------------------
     Final quantitative scoring
  -------------------------------------------------------- */

  const hq=
    this.historyQuality(
      history
    );


  for(let d=0;d<=9;d++){

    const v=score[d];

    const consensus=
      v.modelScore;

    const supportValues=[
      v.formula100Score,
      v.radarScore,
      v.backendScore,
      v.winSetScore
    ];


    v.supportSignals=
      supportValues.filter(
        q=>q>=.60
      ).length;

    v.conflictSignals=
      supportValues.filter(
        q=>q<=.25
      ).length;


    /*
      Strength ของ supporting systems
    */

    const sortedSupport=
      [...supportValues]
        .sort((a,b)=>b-a);

    const supportStrength=
      this.clamp(
        .40*sortedSupport[0]+
        .24*sortedSupport[1]+
        .14*sortedSupport[2]+
        .08*sortedSupport[3]
      );


    const supportBreadth=
      this.sourceBreadthScore(
        v.supportSignals
      );


    const hist=
      v.evidenceScore;


    /*
      Model 03 evidence
    */

    const m03Boost=
      this.clamp(
        v.m03Score*1.55
      );


    /*
      Reliability:
      consensus + historical + independent support
      + Model 03 + supporting signals
    */

    v.reliabilityScore=
      this.clamp(
        .40*consensus+
        .24*hist+
        .10*supportBreadth+
        .09*supportStrength+
        .17*m03Boost
      );


    /*
      ========================================================
      CORE SCORE
      ========================================================

      Consensus            = highest
      Historical Evidence  = second highest
      Model03               = meaningful but controlled
      Formula               = supporting
      Radar/backend         = secondary
      ========================================================
    */

    v.totalScore=
      this.clamp(
        .40*consensus+
        .13*v.formula100Score+
        .045*v.radarScore+
        .045*v.backendScore+
        .015*v.winSetScore+
        .14*v.historicalScore+
        .08*v.recentFormScore+
        .025*v.stabilityScore+
        .015*supportBreadth+
        .105*m03Boost
      );


    /*
      เมื่อข้อมูลย้อนหลังน้อย
      historical evidence ต้อง shrink
      ไม่ใช่ขยาย
    */

    if(history&&history.usable>0){

      const evidenceGate=
        .82+
        .18*
        this.clamp(
          hq.quality
        );

      v.totalScore*=
        evidenceGate;

      /*
        ลดอิทธิพล Model03 เมื่อ sample ต่ำ
      */

      if(
        history.m03&&
        history.m03.samples<4
      ){
        v.totalScore*=
          .97;
      }
    }


    v.totalScore*=
      v.hotStreakBonus;


    /*
      Candidate pool
    */

    if(allowed.has(v.digit)){

      v.totalScore*=
        1.06+
        .04*
        v.independentSupport;
    }


    /*
      ========================================================
      ANTI-FALSE-POSITIVE GATE
      ========================================================
    */

    const poolStrength=
      v.modelConsensusCount/
      Math.max(
        1,
        models.length
      );

    const supportBreadthRatio=
      v.supportSignals/4;


    /*
      candidate ที่มี model เดียว
      แต่ไม่มี historical/support
      จะถูกกดลงอย่างแรง
    */

    const deadCandidate=
      allowed.has(v.digit)&&
      v.modelConsensusCount<=1&&
      v.reliabilityScore<.34&&
      v.evidenceScore<.43&&
      v.supportSignals===0&&
      m03Boost<.18;


    const deadPenalty=
      deadCandidate
        ?.72
        :1;


    /*
      Conflict penalty
      ปรับให้เข้มขึ้น แต่ไม่ทำลาย candidate
      ที่มี consensus จริง
    */

    let conflictPenalty=1;

    if(v.conflictSignals===1){
      conflictPenalty=.965;
    }

    if(v.conflictSignals===2){
      conflictPenalty=.91;
    }

    if(v.conflictSignals>=3){
      conflictPenalty=.84;
    }


    /*
      ถ้า consensus 2/3 หรือ 3/3
      ลดผลกระทบ conflict เล็กน้อย
    */

    if(
      v.modelConsensusCount>=2&&
      v.conflictSignals<=2
    ){
      conflictPenalty=
        Math.min(
          1,
          conflictPenalty+.025
        );
    }


    v.selectionPenalty=
      deadPenalty*
      conflictPenalty;


    v.totalScore*=
      v.selectionPenalty;


    /*
      Selector bonus
      ให้เฉพาะ candidate pool
    */

    v.selectorBonus=
      allowed.has(v.digit)
        ?(
          .025*poolStrength+
          .018*supportBreadthRatio+
          .027*Math.max(
            0,
            v.reliabilityScore-.5
          )+
          .020*m03Boost
        )
        :0;


    v.totalScore+=
      Math.min(
        .06,
        v.selectorBonus
      );


    /*
      Quality gate
    */

    v.qualityGate=
      this.clamp(
        .55+
        .25*v.independentSupport+
        .20*v.reliabilityScore
      );


    v.selectorScore=
      v.totalScore*
      v.qualityGate;

    v.selectionScore=
      v.selectorScore;
  }


  return{
    score,
    allowed
  };
},


/* ==========================================================
   TOURNAMENT ENGINE
========================================================== */

tournament(models,score){

  const compareDigits=(a,b)=>{

    if(!a)return b;
    if(!b)return a;

    if(
      Math.abs(
        a.selectorScore-
        b.selectorScore
      )>.000001
    ){
      return a.selectorScore>
        b.selectorScore
        ?a
        :b;
    }


    if(
      Math.abs(
        a.evidenceScore-
        b.evidenceScore
      )>.000001
    ){
      return a.evidenceScore>
        b.evidenceScore
        ?a
        :b;
    }


    if(
      a.modelSupportScore!==
      b.modelSupportScore
    ){
      return a.modelSupportScore>
        b.modelSupportScore
        ?a
        :b;
    }


    if(
      a.modelConsensusCount!==
      b.modelConsensusCount
    ){
      return a.modelConsensusCount>
        b.modelConsensusCount
        ?a
        :b;
    }


    if(
      a.backendScore!==
      b.backendScore
    ){
      return a.backendScore>
        b.backendScore
        ?a
        :b;
    }


    if(
      a.formula100Score!==
      b.formula100Score
    ){
      return a.formula100Score>
        b.formula100Score
        ?a
        :b;
    }


    return a.digit<=b.digit
      ?a
      :b;
  };


  const modelRounds=
    models.map(model=>{

      const first=
        score[model.set[0]];

      const second=
        score[model.set[1]];

      const winner=
        compareDigits(
          first,
          second
        );

      return{
        modelId:model.id,
        modelName:model.name,
        candidates:[
          first,
          second
        ],
        winner,
        margin:Math.abs(
          (first?.selectorScore||0)-
          (second?.selectorScore||0)
        ),
        base:model.base,
        variant:model.variant
      };
    });


  let finalWinner=null;

  const finalists=
    modelRounds
      .filter(x=>x.winner)
      .map(x=>x.winner);


  finalists.forEach(x=>{
    finalWinner=
      compareDigits(
        finalWinner,
        x
      );
  });


  const losers=
    finalists
      .filter(
        x=>x!==finalWinner
      )
      .sort(
        (a,b)=>
          (b?.selectorScore||0)-
          (a?.selectorScore||0)
      );


  const finalLoser=
    losers[0]||null;


  const finalMargin=
    finalWinner&&finalLoser
      ?Math.abs(
        finalWinner.selectorScore-
        finalLoser.selectorScore
      )
      :0;


  const winningModelId=
    finalWinner?.modelId??null;


  /*
    FINAL CONFIDENCE
    ไม่ใช่ความน่าจะเป็นว่าจะถูก
    เป็น confidence ของ "ระบบเลือก candidate"
  */

  if(finalWinner){

    const finalMarginScore=
      this.clamp(
        finalMargin/.10
      );

    const supportBreadth=
      this.sourceBreadthScore(
        finalWinner.supportSignals
      );

    const consensusScore=
      this.consensusTier(
        finalWinner.modelConsensusCount,
        models.length
      );

    const baseConfidence=
      .32*
      this.clamp(
        finalWinner.selectorScore
      )+

      .22*
      finalMarginScore+

      .18*
      this.clamp(
        finalWinner.evidenceScore
      )+

      .16*
      supportBreadth+

      .12*
      consensusScore;


    finalWinner.confidence=
      this.clamp(
        .30+
        .70*
        baseConfidence
      );


    finalWinner.finalMargin=
      finalMargin;

    finalWinner.finalOpponent=
      finalLoser?.digit??null;

    finalWinner.finalWinner=true;
  }


  return{
    modelRounds,

    winner01:
      modelRounds.find(
        x=>x.modelId===1
      )?.winner||null,

    winner02:
      modelRounds.find(
        x=>x.modelId===2
      )?.winner||null,

    winner03:
      modelRounds.find(
        x=>x.modelId===3
      )?.winner||null,

    finalWinner,
    finalLoser,
    finalMargin,
    winningModelId
  };
},


/* ==========================================================
   PROTECTED PAIR CANDIDATES
   ห้ามแก้สูตรเลขเจาะ
========================================================== */

collectPairCandidates(
  digit,
  models,
  score
){

  const candidates=[];

  models
    .filter(
      m=>m.set.includes(digit)
    )
    .forEach(m=>{

      const sourceStrength=
        Math.max(
          0,
          Math.min(
            1,
            .70*
            ((m.historyWeight||1)/1.30)+
            .30*
            (score[digit]?.reliabilityScore??.5)
          )
        );

      const digitStrength=
        score[digit]
          ?score[digit].selectorScore
          :0;

      const modelConsensus=
        score[digit]
          ?score[digit].modelScore
          :0;

      (m.pairsMap[digit]||[])
        .forEach(pair=>{

          const key=
            this.pairKey(pair);

          const pairScore=
            .55*sourceStrength+
            .30*digitStrength+
            .15*modelConsensus;

          candidates.push({
            pair:String(pair),
            key,
            pairScore,
            modelId:m.id
          });
        });
    });

  return candidates;
},

bestPairsForDigit(
  digit,
  models,
  score
){

  const candidates=
    this.collectPairCandidates(
      digit,
      models,
      score
    );

  const bestByKey={};

  candidates.forEach(c=>{

    if(
      !bestByKey[c.key]||
      c.pairScore>
      bestByKey[c.key].pairScore
    ){
      bestByKey[c.key]=c;
    }
  });

  return Object.values(bestByKey)
    .sort(
      (a,b)=>
        b.pairScore-a.pairScore||
        Number(a.key)-Number(b.key)
    )
    .slice(0,5)
    .map(v=>v.pair);
},

pairKey(pair){

  const p=String(pair);

  if(!/^\d{2}$/.test(p))return p;

  return[
    p[0],
    p[1]
  ].sort().join('');
},


/* ==========================================================
   PAIR CONSENSUS
   ห้ามแก้
========================================================== */

buildConsensus(pairSets){

  const all=[];

  pairSets.forEach(
    (set,rowIndex)=>{
      set.slice(0,6).forEach(
        pair=>{
          all.push({
            pair:String(pair),
            rowIndex
          });
        }
      );
    }
  );


  const counts={};

  all.forEach(item=>{

    const key=
      this.pairKey(
        item.pair
      );

    if(!counts[key]){

      counts[key]={
        key,
        score:0,
        rows:new Set(),
        pairs:new Set()
      };
    }

    counts[key].score++;

    counts[key].rows.add(
      item.rowIndex
    );

    counts[key].pairs.add(
      item.pair
    );
  });


  const ranked=
    Object.values(counts)
      .sort(
        (a,b)=>
          b.score-a.score||
          b.rows.size-a.rows.size||
          Number(a.key)-Number(b.key)
      );


  const colorMap={};

  ranked
    .slice(0,6)
    .forEach(
      (item,index)=>{

        let color;

        if(index<2)
          color='gold';
        else if(index<4)
          color='silver';
        else
          color='rose';

        colorMap[item.key]={
          color,
          rank:index+1,
          score:item.score
        };
      }
    );


  return{
    counts,
    ranked,
    colorMap
  };
},

sortPairs(pairs){

  return pairs
    .map(String)
    .sort(
      (a,b)=>Number(a)-Number(b)
    );
},

pairClass(pair,colorMap){

  const info=
    colorMap[
      this.pairKey(pair)
    ];

  if(!info)return'pair';

  if(info.color==='gold')
    return'pair pair-gold';

  if(info.color==='silver')
    return'pair pair-silver';

  return'pair pair-rose';
},

formatPct(v){

  return`${Math.round(
    Math.max(
      0,
      Math.min(1,v)
    )*1000
  )/10}%`;
},

formatDate(date){

  const s=
    String(date||'').trim();

  if(/\d+\s+\S+\s+\d+/.test(s)){

    const p=
      s.split(/\s+/);

    if(p.length>=3){

      return[
        p[0],
        p[1],
        p.slice(2).join(' ')
      ].join(' · ');
    }
  }

  return s;
},


/* ==========================================================
   MAIN ENGINE
========================================================== */

run(
  n3,
  n2,
  history=null
){

  const d3=
    n3.split('').map(Number);

  const d2=
    n2.split('').map(Number);

  const[H,T,U]=d3;
  const[R1,R2]=d2;

  const sumT=
    H+T+U;

  const sumB=
    R1+R2;

  const total=
    sumT+sumB;


  /*
    สูตรเดิม
  */

  const F=
    this.formulas(
      H,T,U,R1,R2,
      sumT,
      sumB,
      total
    );


  /*
    Model 01 / 02 / 03
  */

  const models=
    this.buildModels(
      H,T,U,
      R1,R2,
      sumT,
      history
    );


  /*
    เลขเจาะ / Pair Engine
    คงเดิม
  */

  const anchor=
    this.norm(
      7-H
    );

  this.buildPairs(
    models,
    anchor
  );


  /*
    Score
  */

  const scored=
    this.scoreDigits(
      models,
      F,
      H,T,U,
      R1,R2,
      sumT,
      sumB,
      total,
      history
    );


  /*
    Tournament
  */

  const tournament=
    this.tournament(
      models,
      scored.score
    );


  const finalWinner=
    tournament.finalWinner;


  const top1Digits=
    finalWinner
      ?[finalWinner.digit]
      :[];


  /*
    ========================================================
    PAIR ENGINE
    ไม่แตะสูตร
    ========================================================
  */

  let pairSet=
    finalWinner
      ?this.bestPairsForDigit(
        finalWinner.digit,
        models,
        scored.score
      )
      :[];


  if(
    finalWinner&&
    tournament.finalLoser&&
    Number.isInteger(
      finalWinner.digit
    )&&
    Number.isInteger(
      tournament.finalLoser.digit
    )
  ){

    const extraPair=
      `${finalWinner.digit}${tournament.finalLoser.digit}`;

    if(
      /^\d{2}$/.test(extraPair)&&
      !pairSet.includes(extraPair)
    ){
      pairSet=[
        ...pairSet,
        extraPair
      ];
    }
  }


  const consensus=
    this.buildConsensus([
      pairSet
    ]);


  return{
    top1Digit:
      finalWinner
        ?finalWinner.digit
        :null,

    top2Digits:
      top1Digits,

    pairSets:[
      pairSet
    ],

    modelScores:
      scored.score,

    modelCount:3,

    models,

    tournament,

    selectedModelId:
      tournament.winningModelId,

    selectedModel:
      models.find(
        m=>
          m.id===
          tournament.winningModelId
      )||null,

    confidence:
      finalWinner
        ?finalWinner.confidence
        :0,

    finalMargin:
      tournament.finalMargin,

    consensus,

    diagnostic:{
      historyUsable:
        history?.usable||0,

      m03Matches:
        history?.m03?.patternSamples||0,

      m03EffectiveSamples:
        history?.m03?.effectiveSamples||0,

      m03Backtest:
        history?.walkForward?.m03||null
    }
  };
},


/* ==========================================================
   CAPTURE
========================================================== */

async captureCard(
  cardId,
  name
){

  const el=
    document.getElementById(
      cardId
    );

  if(!el)return;

  const controls=[
    ...el.querySelectorAll(
      '[data-no-capture]'
    )
  ];

  try{

    if(
      typeof html2canvas===
      'undefined'
    ){
      throw new Error(
        'ไม่พบระบบแคปภาพ กรุณาเปิดอินเทอร์เน็ตแล้วลองใหม่'
      );
    }

    controls.forEach(
      x=>
        x.style.visibility='hidden'
    );

    const canvas=
      await html2canvas(
        el,
        {
          backgroundColor:'#ffffff',
          scale:Math.min(
            3,
            Math.max(
              2,
              window.devicePixelRatio||2
            )
          ),
          useCORS:true,
          logging:false
        }
      );


    const link=
      document.createElement('a');

    const safe=
      String(name||'lottery')
        .replace(
          /[^ก-๙A-Za-z0-9_-]+/g,
          '_'
        )
        .slice(0,60);

    link.download=
      `${safe||'lottery'}_card.png`;

    link.href=
      canvas.toDataURL(
        'image/png'
      );

    link.click();

    this.show(
      '✓ แคปการ์ดแล้ว'
    );

  }catch(err){

    console.error(err);

    this.show(
      '❌ แคปภาพไม่สำเร็จ'
    );

  }finally{

    controls.forEach(
      x=>
        x.style.visibility=''
    );
  }
},


copy(text){

  navigator.clipboard
    ?.writeText(text)
    .then(
      ()=>this.show()
    )
    .catch(()=>{

      const t=
        document.createElement(
          'textarea'
        );

      t.value=text;

      document.body.appendChild(t);

      t.select();

      document.execCommand(
        'copy'
      );

      t.remove();

      this.show();
    });
},

show(message){

  const t=$('toast');

  if(message)
    t.textContent=message;

  t.classList.add('show');

  clearTimeout(
    this.toastTimer
  );

  this.toastTimer=
    setTimeout(
      ()=>t.classList.remove('show'),
      1500
    );
},

async calculate(){

  const parsed=
    this.parse(
      $('bulkInput').value

  if(!parsed.records.length){

    $('result').innerHTML=
      '<div class="errorbox">❌ ไม่พบข้อมูลที่ถูกต้อง กรุณาตรวจรูปแบบอีกครั้ง</div>';

    return;
  }


  const scanner=
    $('scanner');

  const btn=
    $('run');

  btn.disabled=true;

  scanner.style.display='block';


  const scan=msg=>
    $('scanText').textContent=msg;

  const yieldUI=()=>
    new Promise(
      resolve=>
        requestAnimationFrame(
          resolve
        )
    );


  try{

    scan(
      'อ่านข้อมูล 3 ตัวบน + 2 ตัวล่าง...'
    );

    await yieldUI();


    this.cache=[];

    const groups=
      this.groupByLottery(
        parsed.records
      );

    const cards=[];
    const outputData=[];
    const copyBlocks=[];

    let groupIndex=0;


    for(const group of groups){

      groupIndex++;

      const records=
        group.records;

      if(!records.length)
        continue;


      const latest=
        records[
          records.length-1
        ];


      /*
        HISTORY:
        รองรับ 1-10 งวด
        โดยไม่พยายามสร้างข้อมูลปลอม
      */

      const history=
        this.buildHistory(
          records
        );


      scan(
        `ประมวลผล ${group.name} • ${groupIndex}/${groups.length}`
      );

      await yieldUI();


      const a=
        this.run(
          latest.n3,
          latest.n2,
          history
        );


      this.cache.push({
        group:group.name,
        result:a,
        history
      });


      const allowed=
        new Set();

      a.models.forEach(
        m=>
          m.set.forEach(
            d=>allowed.add(d)
          )
      );


      const valid=
        a.top1Digit!==null&&
        allowed.has(
          a.top1Digit
        );


      if(!valid){

        parsed.errors.push(
          `${group.name} | ${latest.date}: ไม่สามารถคัดเลข TOP 1 จาก Candidate Pool ของ 3 Main Models ได้`
        );

        continue;
      }


      const digit=
        a.top1Digit;

      const sourcePairs=
        a.pairSets[0]||[];

      const sorted=
        this.sortPairs(
          sourcePairs
        );


      const pairHTML=
        sorted
          .map(pair=>{

            const info=
              a.consensus
                .colorMap[
                  this.pairKey(pair)
                ];

            const title=
              info
                ?`อันดับ Consensus ${info.rank} • พบ ${info.score} ครั้ง`
                :'เลขเจาะจาก 3 Main Models';

            return`
              <span
                class="${this.pairClass(
                  pair,
                  a.consensus.colorMap
                )}"
                title="${esc(title)}"
              >${esc(pair)}</span>
            `;
          })
          .join('');


      const row=`
        <div class="row">
          <span
            class="digit digit-gold"
            aria-label="เลขเด่น"
          >${esc(digit)}</span>

          <span class="sep">:</span>

          <div class="pairs">
            ${pairHTML}
          </div>
        </div>
      `;


      const footer=`
        <div class="brand-footer">
          <span class="brand-star">✦</span>
          <span>บ้านเงินกอง</span>
          <span class="brand-star">✦</span>
        </div>
      `;


      const nextDate=
        this.nextDateLabel([
          latest
        ]);


      const cardId=
        `lottery-card-${groupIndex}`;


      cards.push(`
        <article
          class="lottery"
          id="${cardId}"
          data-lottery-card="true"
        >

          <div class="lottery-head">

            <div>

              <div class="lottery-name">
                <span class="flag">
                  ${this.flag(group.name)}
                </span>

                <span>
                  ${esc(group.name)}
                </span>
              </div>

              <div class="date">
                ${esc(nextDate)}
              </div>

            </div>

            <div class="vip-label"></div>

            <div
              class="card-actions"
              data-no-capture="true"
            >
              <button
                class="card-capture"
                data-capture-card="${cardId}"
                data-capture-name="${esc(group.name)}"
              >
                📷 แคปการ์ด
              </button>
            </div>

          </div>

          <div class="rows">
            ${row}
          </div>

          ${footer}

        </article>
      `);


      copyBlocks.push(
        [
          `${this.flag(group.name)} ${group.name} | ${nextDate}`,
          `${digit} : ${sorted.join('-')}`
        ].join('\n')
      );


      outputData.push({
        group,
        latest,
        a,
        nextDate
      });
    }


    scan(
      'ตรวจสอบความสอดคล้องของผลลัพธ์...'
    );

    await yieldUI();


    scan(
      'ตรวจสอบ Walk-Forward / Historical Stability...'
    );

    await yieldUI();


    scan(
      'FINALIZING...'
    );

    await yieldUI();


    scanner.style.display='none';

    btn.disabled=false;


    const all=
      copyBlocks.join('\n\n');

    this.lastCopyText=
      all;


    $('result').innerHTML=`

      <div class="summary">

        <span>
          ประมวลผลสำเร็จ
          <strong>
            ${outputData.length}
          </strong>
          ประเภท
        </span>

        <button
          class="copy"
          id="copyTop"
        >
          📋 COPY ALL
        </button>

      </div>


      ${
        parsed.errors.length
          ?`
            <div class="errorbox">
              ${parsed.errors
                .map(esc)
                .join('<br>')}
            </div>
          `
          :''
      }


      ${cards.join('')}


      <button
        class="copyall"
        id="copyBottom"
      >
        📋 คัดลอกหวยทั้งหมด
      </button>
    `;


    $('copyTop').onclick=
      ()=>this.copy(all);

    $('copyBottom').onclick=
      ()=>this.copy(all);

    $('copyInput').disabled=
      !all;

    $('copyInput').onclick=
      ()=>this.copy(
        this.lastCopyText
      );


    $('result')
      .querySelectorAll(
        '[data-capture-card]'
      )
      .forEach(btn=>{

        btn.onclick=
          ()=>this.captureCard(
            btn.dataset.captureCard,
            btn.dataset.captureName
          );
      });


    $('result').scrollIntoView({
      behavior:'smooth',
      block:'start'
    });


  }catch(err){

    scanner.style.display='none';

    btn.disabled=false;

    $('result').innerHTML=`
      <div class="errorbox">
        ❌ เกิดข้อผิดพลาดระหว่างประมวลผล:
        ${esc(err?.message||err)}
      </div>
    `;
  }
},


/* ==========================================================
   NEXT DATE
========================================================== */

nextDateLabel(records){

  if(!records.length)return'';

  const latest=
    records[
      records.length-1
    ];

  const s=
    String(
      latest.date||''
    ).trim();

  const m=
    s.match(
      /^(\d{1,2})\s+(\S+)\s+(\d{2,4})$/
    );


  if(m){

    const day=
      Number(m[1]);

    let year=
      Number(m[3]);

    if(year<100)
      year+=2500;


    const months=[
      'ม.ค.',
      'ก.พ.',
      'มี.ค.',
      'เม.ย.',
      'พ.ค.',
      'มิ.ย.',
      'ก.ค.',
      'ส.ค.',
      'ก.ย.',
      'ต.ค.',
      'พ.ย.',
      'ธ.ค.'
    ];


    const monthIndex=
      months.indexOf(
        m[2]
      );


    if(monthIndex>=0){

      let d=
        new Date(
          year-543,
          monthIndex,
          day
        );

      d.setDate(
        d.getDate()+1
      );


      return[
        String(d.getDate()),
        months[d.getMonth()],
        String(
          d.getFullYear()+543
        )
      ].join(' ');
    }
  }

  return'งวดถัดไป';
}
