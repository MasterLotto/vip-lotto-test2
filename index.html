<script>
(()=>{
const c=document.getElementById('snow');
const x=c.getContext('2d');

let w=c.width=innerWidth;
let h=c.height=innerHeight;

addEventListener('resize',()=>{
w=c.width=innerWidth;
h=c.height=innerHeight;
});

const particles=Array.from(
{length:42},
()=>( {
x:Math.random()*w,
y:Math.random()*h,
r:.7+Math.random()*1.8,
s:.15+Math.random()*.45,
a:.18+Math.random()*.35,
p:Math.random()*6.28,
tone:Math.random()>.72?'rose':'gold'
})
);

(function draw(){
x.clearRect(0,0,w,h);

particles.forEach(q=>{
q.p+=.01;
q.y+=q.s;
q.x+=Math.sin(q.p)*.25;

if(q.y>h+5){
q.y=-5;
q.x=Math.random()*w;
}

x.beginPath();

x.arc(
q.x,
q.y,
q.r,
0,
Math.PI*2
);

x.fillStyle=
q.tone==='rose'
?`rgba(185,130,121,${q.a*.55})`
:`rgba(195,154,67,${q.a})`;

x.fill();
});

requestAnimationFrame(draw);
})();

const $=id=>document.getElementById(id);

tokens:[

'54396b4c326d5037',
'5a71345738785431'
],

dec(h){
let s='';

for(let i=0;i<h.length;i+=2){
s+=String.fromCharCode(
parseInt(h.slice(i,i+2),16)
);
}

return s;
},

ok(v){
return this.tokens.some(
t=>v===this.dec(t)
);
}
};

const app={

cache:[],

lastCopyText:'',

toastTimer:null,

audio(){},

norm(x){
return(x%10+10)%10;
},

clamp(v,lo=0,hi=1){
return Math.max(
lo,
Math.min(
hi,
Number(v)||0
)
);
},

normalizeScores(map){
const vals=Object.values(map);

const max=Math.max(
...vals,
0
);

if(max<=0){
return Object.fromEntries(
Object.keys(map)
.map(k=>[k,0])
);
}

return Object.fromEntries(
Object.entries(map)
.map(
([k,v])=>[
k,
this.clamp(v/max)
]
)
);
},

sourceBreadthScore(v){
return this.clamp(

Math.exp(
-Math.max(0,v)/1.6
)

consensusTier(count,total){

},

parse(text){

const z=String(text||'')
.replace(/\r/g,'')
.trim();

if(!z){

return{
records:[],
errors:[
'ยังไม่มีข้อมูลสำหรับประมวลผล'
]
};

}

const lines=z
.split('\n')
.map(v=>v.trim());

const records=[];
const errors=[];

let i=0;

while(i<lines.length){

if(!lines[i]){
i++;
continue;
}

const m=lines[i]
.match(
/^(.+?)\s*\|\s*(.+?)$/
);

if(!m){

errors.push(
`บรรทัดที่ ${i+1}: ไม่พบรูปแบบ "ชื่อหวย | วันที่"`
);

i++;
continue;
}

const name=m[1].trim();
const date=m[2].trim();

if(!this.parseDateValue(date)){

errors.push(
`${name} | ${date}: รูปแบบวันที่ไม่ถูกต้อง เช่น 25 ส.ค. 69`
);

i+=1;
continue;
}

const n3raw=lines[i+1]||'';
const n2raw=lines[i+2]||'';

const n3=/^[\d\s]+$/.test(n3raw)
?n3raw.replace(/\s+/g,'')
:n3raw;

const n2=/^[\d\s]+$/.test(n2raw)
?n2raw.replace(/\s+/g,'')
:n2raw;

if(!/^\d{3}$/.test(n3)){

errors.push(
`${name} | ${date}: เลข 3 ตัวบนต้องเป็น 3 หลัก`
);

i+=1;
continue;
}

if(!/^\d{2}$/.test(n2)){

errors.push(
`${name} | ${date}: เลข 2 ตัวล่างต้องเป็น 2 หลัก`
);

i+=2;
continue;
}

records.push({

date,
n3,
n2
});

i+=3;
}

return{
records,
errors
};

if(
/^\d{1,2}-\d{1,2}-\d{2,4}$/.test(s)
)

return false;
},

if(m){

const months={

sortChronological(records){

return records
.map((r,index)=>({
...r,
__index:index
}))
.sort((a,b)=>{

const ka=this.dateKey(a.date);
const kb=this.dateKey(b.date);

if(ka<kb)
return-1;

if(ka>kb)
return 1;

return a.__index-b.__index;
})
.map(r=>{

const z={...r};

delete z.__index;

return z;
});

},

groupByLottery(records){

const groupsMap={};

records.forEach((r,index)=>{

const key=r.name.trim();

if(!groupsMap[key]){

groupsMap[key]={
name:key,
records:[],
duplicateCount:0,
conflictCount:0,
__order:index
};

}

groupsMap[key].records.push(r);
});

const groups=Object.values(groupsMap);

groups.forEach(g=>{

const sorted=this.sortChronological(g.records);

const byDate=new Map();
const clean=[];

sorted.forEach(r=>{

const key=this.dateKey(r.date);

if(!byDate.has(key)){

byDate.set(
key,
r
);

clean.push(r);

return;
}

const previous=byDate.get(key);

if(
previous.n3===r.n3 &&
previous.n2===r.n2
){

g.duplicateCount++;

return;
}

g.conflictCount++;

const idx=clean.indexOf(previous);

if(idx>=0)
clean[idx]=r;

byDate.set(key,r);
});

g.records=this.sortChronological(clean);

});

return groups
.sort((a,b)=>a.__order-b.__order)
.map(g=>{
delete g.__order;
return g;
});

},

actualDigits(record){

return[
...new Set(
(
String(record.n3||'')+
String(record.n2||'')
)
.split('')
.map(Number)
.filter(Number.isFinite)
)
];
},

/*
==========================================================
PROTECTED PAIR / เลขเจาะ ENGINE
==========================================================
*/
buildPairs(
models,
anchor
){

models.forEach(m=>{

let range=[];
let collision=false;

for(let o=-2;o<=2;o++){

if(
m.set.includes(
this.norm(anchor+o)
)
){

collision=true;
break;

}

}

for(
let o=collision?-3:-2;
o<=(collision?3:2);
o++
){

range.push(
this.norm(anchor+o)
);

}

m.pairsMap={};

m.set.forEach(src=>{

let pairs=range
.filter(
p=>
p!==src &&
!m.set.includes(p)
)
.map(
p=>`${src}${p}`
);

let next=(src+1)%10;

while(pairs.length<5){

if(
next!==src &&
!m.set.includes(next) &&
!pairs.includes(
`${src}${next}`
)
){

pairs.push(
`${src}${next}`
);

}

next=(next+1)%10;
}

m.pairsMap[src]=[
...new Set(pairs)
]
.filter(
p=>p[0]!==p[1]
)
.slice(0,5);

});

});

},

/*
==========================================================
HISTORICAL ENGINE
==========================================================
ONLY USER-SUPPLIED RECORDS ARE USED.
==========================================================
*/
buildHistory(records){

const modelPerf=
Object.fromEntries(
Array.from(
{length:3},
(_,i)=>[
i+1,
{
long:.5,
recent:.5,
stability:.5,
samples:0,
hits:0,
recentHits:0,
recentWeight:0,
recentSamples:0
}
]
)
);

const formulaPerf=
Object.fromEntries(
Array.from(
{length:100},
(_,i)=>[
i+1,
{
long:.5,
recent:.5,
samples:0,
hits:0,
recentHits:0,
recentWeight:0,
recentSamples:0
}
]
)
);

const digitPerf=
Object.fromEntries(
Array.from(
{length:10},
(_,d)=>[
d,
{
long:.5,
recent:.5,
stability:.5,
samples:0,
hits:0,
recentHits:0,
recentWeight:0,
recentSamples:0,
streak:0,
maxStreak:0
}
]
)
);

const transitions=[];

const usable=Math.max(
0,
records.length-1
);

const recentWindow=
Math.min(
8,
usable
);

if(!usable){

return{
modelPerf,
formulaPerf,
digitPerf,
transitions,
usable:0,
recentWindow:0
};

}

for(
let i=1;
i<records.length;
i++
){

const prev=records[i-1];
const target=records[i];

const d3=
prev.n3
.split('')
.map(Number);

const d2=
prev.n2
.split('')
.map(Number);

const H=d3[0];
const T=d3[1];
const U=d3[2];

const R1=d2[0];
const R2=d2[1];

const sumT=
H+T+U;

const F=
this.formulas(
H,T,U,
R1,R2,
sumT,
R1+R2,
sumT+R1+R2
);

const models=
this.buildModels(
H,T,U,
R1,R2,
sumT
);

const actual=
new Set(
(
target.n3+
target.n2
)
.split('')
.map(Number)
);

const recent=
i>
records.length-1-recentWindow;

const recencyWeight=
Math.pow(
.82,
records.length-1-i
);

models.forEach(m=>{

const unique=[
...new Set(m.set)
];

const hit=
unique.filter(
d=>actual.has(d)
).length/
Math.max(
1,
unique.length
);

const mp=modelPerf[m.id];

mp.hits+=hit;
mp.samples++;

if(recent){

mp.recentHits+=
hit*recencyWeight;

mp.recentWeight+=
recencyWeight;

mp.recentSamples++;

}

});

F.signals.forEach(sig=>{

const fp=formulaPerf[sig.id];

const hit=
actual.has(sig.value)
?1
:0;

fp.hits+=hit;
fp.samples++;

if(recent){

fp.recentHits+=
hit*recencyWeight;

fp.recentWeight+=
recencyWeight;

fp.recentSamples++;

}

});

for(let d=0;d<=9;d++){

if(
!models.some(
m=>m.set.includes(d)
)
)
continue;

const dp=digitPerf[d];

const hit=
actual.has(d)
?1
:0;

dp.hits+=hit;
dp.samples++;

if(recent){

dp.recentHits+=
hit*recencyWeight;

dp.recentWeight+=
recencyWeight;

dp.recentSamples++;

}

}

transitions.push({

index:i,

models,

formulaSignals:F.signals,

actual:[
...actual
]

});

}

Object.values(modelPerf).forEach(mp=>{

mp.long=
mp.samples?
mp.hits/mp.samples:
.5;

mp.recent=
mp.recentWeight?
mp.recentHits/mp.recentWeight:
mp.long;

mp.stability=
1-
Math.min(
1,
Math.abs(
mp.long-mp.recent
)*2
);

});

Object.values(formulaPerf).forEach(fp=>{

fp.long=
fp.samples?
fp.hits/fp.samples:
.5;

fp.recent=
fp.recentWeight?
fp.recentHits/fp.recentWeight:
fp.long;

});

for(let d=0;d<=9;d++){

const dp=digitPerf[d];

if(!dp.samples)
continue;

dp.long=
dp.hits/dp.samples;

dp.recent=
dp.recentWeight?
dp.recentHits/dp.recentWeight:
dp.long;

dp.stability=
1-
Math.min(
1,
Math.abs(
dp.long-dp.recent
)*2
);

let streak=0;

for(
let j=transitions.length-1;
j>=0;
j--
){

const tr=transitions[j];

if(
!tr.models.some(
m=>m.set.includes(d)
)
)
continue;

if(
tr.actual.includes(d)
){

streak++;

dp.maxStreak=
Math.max(
dp.maxStreak,
streak
);

}else{

break;

}

}

dp.streak=streak;

}

return{
modelPerf,
formulaPerf,
digitPerf,
transitions,
usable,
recentWindow
};

},

posterior(
rate,
samples,
prior=.5,
priorN=6
){

const n=Math.max(
0,
Number(samples)||0
);

return(
rate*n+
prior*priorN
)/
(
n+
priorN
);

},

modelWeight(
m,
history
){

const hp=
history&&
history.modelPerf[m.id];

if(!hp)
return 1;

const long=
this.posterior(
hp.long,
hp.samples,
.5,
6
);

const recent=
this.posterior(
hp.recent,
hp.recentSamples||
Math.min(
hp.samples,
8
),
.5,
4
);

const blended=
.50*long+
.30*recent+
.20*(hp.stability??.5);

return .70+
.60*
this.clamp(
blended
);

},

formulaWeight(
id,
history
){

const fp=
history&&
history.formulaPerf[id];

if(!fp)
return 1;

const long=
this.posterior(
fp.long,
fp.samples,
.5,
8
);

const recent=
this.posterior(
fp.recent,
fp.recentSamples||
Math.min(
fp.samples,
8
),
.5,
4
);

const blended=
.55*long+
.35*recent+
.10;

return .75+
.50*
this.clamp(
blended
);

},

/*
==========================================================
UPGRADED DIGIT / DECISION SCORE ENGINE V12.1
==========================================================
*/

scoreDigits(
models,
F,
H,T,U,R1,R2,
sumT,sumB,total,
history
){

const score=
Object.fromEntries(
Array.from(
{length:10},
(_,d)=>[
d,
{
digit:d,

modelScore:0,

formula100Score:0,

radarScore:0,

backendScore:0,

winSetScore:0,

selectorBonus:0,

selectorScore:0,

historicalScore:.5,

recentFormScore:.5,

stabilityScore:.5,

hotStreakBonus:1,

confidence:0,

redundancyPenalty:1,

modelConsensusCount:0,

supportSignals:0,

conflictSignals:0,

reliabilityScore:.5,

evidenceScore:.5,

uncertainty:1,

selectionPenalty:1,

selectionScore:0,

totalScore:0,

qualityGate:1
}
]
)
);

/*
==========================================================
1–3
MODEL WEIGHTING
==========================================================
The 3 model outputs remain unchanged.
Only the decision layer learns how much historical evidence
each model deserves.
*/

const modelWeights={};

let totalModelWeight=0;

models.forEach(m=>{

const mw=
this.modelWeight(
m,
history
);

modelWeights[m.id]=mw;

m.historyWeight=mw;

totalModelWeight+=mw;

});

for(let d=0;d<=9;d++){

score[d].modelScore=
totalModelWeight
?
models.reduce(
(sum,m)=>
sum+
(
m.set.includes(d)
?
modelWeights[m.id]
:
0
),
0
)/
totalModelWeight
:
0;

}

/*
==========================================================
6–8
FORMULA SUPPORT CALIBRATION
==========================================================
Repeated formula hits for the same digit are saturated before
normalization. This prevents a digit from gaining unlimited
advantage simply because many related formulas produced it.
*/

const weightedFormulaCounts=
Object.fromEntries(
Array.from(
{length:10},
(_,d)=>[d,0]
)
);

F.signals.forEach(sig=>{

weightedFormulaCounts[
sig.value
]+=
this.formulaWeight(
sig.id,
history
);

});

const saturatedFormula={};

for(let d=0;d<=9;d++){

saturatedFormula[d]=
this.sourceBreadthScore(
weightedFormulaCounts[d]
);

}

const normalizedFormula=
this.normalizeScores(
saturatedFormula
);

for(let d=0;d<=9;d++){

score[d].formula100Score=
normalizedFormula[d];

}

/*
==========================================================
AUXILIARY SUPPORT
These layers support the protected model candidate pool.
They never create a new candidate.
==========================================================
*/

const x=
(R1+R2)%10;

const y=
sumT%10;

const z=
total%10;

const r1=[
this.norm(x-1),
x,
this.norm(x+1)
];

const r2=[
this.norm(y-1),
y,
this.norm(y+1)
];

const r3=[
this.norm(z-1),
z,
this.norm(z+1)
];

for(let d=0;d<=9;d++){

let h=0;

if(r1.includes(d))
h++;

if(r2.includes(d))
h++;

if(r3.includes(d))
h++;

score[d].radarScore=
h/3;

}

const back=[

(2*H+R1)%10,

(T+R2)%10,

sumT%10,

Math.abs(T-U)%10,

total%10

];

for(let d=0;d<=9;d++){

if(back.includes(d))
score[d].backendScore=1;

if(
d===z ||
d===this.norm(z+5)
)
score[d].winSetScore=1;

const dp=
history&&
history.digitPerf[d];

if(dp&&dp.samples){

score[d].historicalScore=
dp.long;

score[d].recentFormScore=
dp.recent;

score[d].stabilityScore=
dp.stability;

const longPost=
this.posterior(
dp.long,
dp.samples,
.5,
6
);

const recentPost=
this.posterior(
dp.recent,
dp.recentSamples||
Math.min(
dp.samples,
8
),
.5,
4
);

score[d].evidenceScore=
.55*longPost+
.35*recentPost+
.10*dp.stability;

score[d].uncertainty=
1/
Math.sqrt(
dp.samples+1
);

const streak=
Math.max(
0,
dp.streak||0
);

score[d].hotStreakBonus=
1+
Math.min(
.06,
Math.max(
0,
streak-1
)*.015
);

}else{

score[d].historicalScore=.5;
score[d].recentFormScore=.5;
score[d].stabilityScore=.5;
score[d].evidenceScore=.5;
score[d].uncertainty=1;
score[d].hotStreakBonus=1;

}

}

/*
==========================================================
4–6
CONSENSUS + CONFLICT
==========================================================
*/

for(let d=0;d<=9;d++){

const v=score[d];

v.modelConsensusCount=
models.filter(
m=>m.set.includes(d)
).length;

const supportValues=[

v.formula100Score,
v.radarScore,
v.backendScore,
v.winSetScore

];

v.supportSignals=
supportValues.filter(
x=>x>=.60
).length;

v.conflictSignals=
supportValues.filter(
x=>x<=.25
).length;

const dp=
history&&
history.digitPerf[d];

const samples=
dp?.samples||0;

const recentSamples=
dp?.recentSamples||
Math.min(
samples,
8
);

const longPost=
this.posterior(
dp?.long??.5,
samples,
.5,
6
);

const recentPost=
this.posterior(
dp?.recent??.5,
recentSamples,
.5,
4
);

v.reliabilityScore=
.50*longPost+
.30*recentPost+
.20*(dp?.stability??.5);

const consensus=
this.consensusTier(
v.modelConsensusCount,
models.length
);

const supportBreadth=
this.sourceBreadthScore(
v.supportSignals
);

const conflictPenalty=
1-
Math.min(
.16,
Math.max(
0,
v.conflictSignals-1
)*.04
);

const deadCandidate=
models.some(
m=>m.set.includes(d)
)&&
v.reliabilityScore<.39
&&
recentPost<.36
&&
v.modelConsensusCount<=1
&&
v.supportSignals===0;

const deadPenalty=
deadCandidate
?
.78
:
1;

v.selectionPenalty=
conflictPenalty*
deadPenalty;

/*
==========================================================
12
QUALITY GATE
==========================================================
Continuous adjustment only.
It never creates or deletes a candidate.
*/

const uncertaintyFactor=
1-
.18*
this.clamp(
v.uncertainty
);

const reliabilityFactor=
.90+
.16*
this.clamp(
v.reliabilityScore
);

const quality=
.82+
.18*
this.clamp(
.55*v.reliabilityScore+
.45*v.evidenceScore
);

v.qualityGate=
this.clamp(
.55*uncertaintyFactor+
.45*reliabilityFactor
)*
quality;

/*
==========================================================
1–8
CALIBRATED TOTAL SCORE
==========================================================
Primary model evidence remains the largest single component.
*/

v.totalScore=

.36*v.modelScore+

.15*v.formula100Score+

.08*v.radarScore+

.05*v.backendScore+

.03*v.winSetScore+

.09*v.historicalScore+

.08*v.recentFormScore+

.04*v.stabilityScore+

.12*v.evidenceScore;

/*
Consensus bonus is bounded.
*/

v.selectorBonus=
models.length===3

?
(
.055*consensus+
.030*supportBreadth+
.020*
Math.max(
0,
v.reliabilityScore-.5
)
)

:
(
.050*consensus+
.030*supportBreadth+
.020*
Math.max(
0,
v.reliabilityScore-.5
)
);

/*
==========================================================
6
SUPPORT CAP
==========================================================
Support can help, but cannot overpower weak primary-model
evidence.
*/

const supportCap=
v.modelConsensusCount===0
?
.25
:
(
v.modelConsensusCount===1
?
.70
:
1
);

v.totalScore*=
this.clamp(
.90+
.10*v.qualityGate
);

v.totalScore*=
v.hotStreakBonus;

v.totalScore+=
Math.min(
.055,
v.selectorBonus
)*
supportCap;

/*
Candidate privilege remains with the protected 3-model pool.
*/

if(
models.some(
m=>m.set.includes(d)
)
){

v.totalScore*=1.10;

}

v.selectorScore=
v.totalScore*
v.selectionPenalty*
v.qualityGate;

v.selectionScore=
v.selectorScore;

}

/*
==========================================================
9
CANDIDATE-ONLY RANKING
==========================================================
*/

let ranked=
Object.values(score)
.filter(
v=>
models.some(
m=>m.set.includes(v.digit)
)
)
.sort(
(a,b)=>

b.selectorScore-
a.selectorScore||

b.modelConsensusCount-
a.modelConsensusCount||

b.modelScore-
a.modelScore||

b.reliabilityScore-
a.reliabilityScore||

b.evidenceScore-
a.evidenceScore||

a.digit-
b.digit
);

/*
==========================================================
10
NEAR-TIE RESOLVER
==========================================================
*/

if(ranked.length>2){

const first=ranked[0];

const second=ranked[1];

const third=ranked[2];

const gap12=
first.selectorScore-
second.selectorScore;

const gap23=
second.selectorScore-
third.selectorScore;

const near12=
gap12<=.030||
(
first.selectorScore>0&&
gap12/
first.selectorScore<=.030
);

const near23=
gap23<=.030||
(
second.selectorScore>0&&
gap23/
second.selectorScore<=.030
);

if(near12||near23){

ranked=
ranked
.map(v=>({

v,

final:

v.selectorScore+

.032*
this.consensusTier(
v.modelConsensusCount,
models.length
)+

.018*
this.sourceBreadthScore(
v.supportSignals
)+

.016*
v.reliabilityScore+

.012*
v.evidenceScore-

.010*
(
v.conflictSignals/4
)-

.008*
v.uncertainty

}))
.sort(
(a,b)=>

b.final-
a.final||

b.v.modelConsensusCount-
a.v.modelConsensusCount||

b.v.reliabilityScore-
a.v.reliabilityScore||

b.v.evidenceScore-
a.v.evidenceScore||

a.v.digit-
b.v.digit
)
.map(
x=>x.v
);

}

}

/*
==========================================================
12
CONFIDENCE
==========================================================
*/

ranked.forEach(
(v,i)=>{

const next=
ranked[i+1];

const margin=
next
?
Math.max(
0,
v.selectorScore-
next.selectorScore
)
:
v.selectorScore;

const consensus=
this.consensusTier(
v.modelConsensusCount,
models.length
);

v.confidence=
this.clamp(

.22+

.25*
v.reliabilityScore+

.18*
consensus+

.10*
this.sourceBreadthScore(
v.supportSignals
)+

.10*
Math.min(
1,
margin/.12
)+

.10*
v.evidenceScore+

.05*
v.qualityGate-

.08*
(
v.conflictSignals/4
)

);

}
);

return{

score,

allowed:
new Set(
models.flatMap(
m=>m.set
)
),

top:
ranked.slice(0,2),

ranked

};

},

/*
==========================================================
PROTECTED PAIR SELECTION
==========================================================
*/
collectPairCandidates(
digit,
models,
score
){

const candidates=[];

models
.filter(
m=>m.set.includes(digit)
)
.forEach(m=>{

const sourceStrength=
Math.max(
0,
Math.min(
1,

.70*
(
(m.historyWeight||1)/
1.30
)+

.30*
(
score[digit]?.reliabilityScore??.5
)

)
);

const digitStrength=
score[digit]
?
score[digit].selectorScore
:
0;

const modelConsensus=
score[digit]
?
score[digit].modelScore
:
0;

(
m.pairsMap[digit]||[]
)
.forEach(pair=>{

const key=
this.pairKey(pair);

const pairScore=

.55*
sourceStrength+

.30*
digitStrength+

.15*
modelConsensus;

candidates.push({

pair:String(pair),

key,

pairScore,

modelId:m.id

});

});

});

return candidates;

},

bestPairsForDigit(
digit,
models,
score
){

const candidates=
this.collectPairCandidates(
digit,
models,
score
);

const bestByKey={};

candidates.forEach(c=>{

if(
!bestByKey[c.key] ||
c.pairScore>
bestByKey[c.key].pairScore
){

bestByKey[c.key]=c;

}

});

return Object.values(
bestByKey
)
.sort(
(a,b)=>
b.pairScore-
a.pairScore||
Number(a.key)-
Number(b.key)
)
.slice(0,5)
.map(
v=>v.pair
);

},

pairKey(pair){

const p=String(pair);

if(!/^\d{2}$/.test(p))
return p;

return[
p[0],
p[1]
]
.sort()
.join('');

},

buildConsensus(pairSets){

const all=[];

pairSets.forEach(
(set,rowIndex)=>{

set.slice(0,5)
.forEach(pair=>{

all.push({

pair:String(pair),

rowIndex

});

});

});

const counts={};

all.forEach(item=>{

const key=
this.pairKey(
item.pair
);

if(!counts[key]){

counts[key]={

key,

score:0,

rows:new Set(),

pairs:new Set()

};

}

counts[key].score++;

counts[key].rows.add(
item.rowIndex
);

counts[key].pairs.add(
item.pair
);

});

const ranked=
Object.values(
counts
)
.sort(
(a,b)=>
b.score-
a.score||

b.rows.size-
a.rows.size||

Number(a.key)-
Number(b.key)
);

const colorMap={};

ranked
.slice(0,6)
.forEach(
(item,index)=>{

let color;

if(index<2)
color='gold';

else if(index<4)
color='silver';

else
color='rose';

colorMap[item.key]={

color,

rank:index+1,

score:item.score

};

});

return{

counts,

ranked,

colorMap

};

},

sortPairs(pairs){

return pairs
.map(String)
.sort(
(a,b)=>
Number(a)-
Number(b)
);

},

pairClass(
pair,
colorMap
){

const info=
colorMap[
this.pairKey(pair)
];

if(!info)
return'pair';

if(info.color==='gold')
return'pair pair-gold';

if(info.color==='silver')
return'pair pair-silver';

return'pair pair-rose';

},

/*
==========================================================
STRICT WALK-FORWARD SELECTOR AUDIT
==========================================================
Target i uses records[0...i-1] only.
==========================================================
*/
auditSelector(records){

const ordered=
this.sortChronological(
records
);

const audit=[];

if(ordered.length<2){

return{

trials:0,

candidateHits:0,

selectorHits:0,

top1Hits:0,

candidateCoverage:0,

selectorRate:0,

top1Rate:0,

selectionLoss:0,

lift:0,

avgConfidence:0,

avgCandidateSize:0,

avgModelAgreement:0,

avgTop2Score:0,

rows:[]

};

}

for(
let targetIndex=1;
targetIndex<ordered.length;
targetIndex++
){

const historyRecords=
ordered.slice(
0,
targetIndex
);

const source=
historyRecords[
historyRecords.length-1
];

if(!source)
continue;

const history=
this.buildHistory(
historyRecords
);

const prediction=
this.run(
source.n3,
source.n2,
history
);

const actual=
this.actualDigits(
ordered[targetIndex]
);

const allowed=
new Set();

prediction.models
.forEach(
m=>
m.set.forEach(
d=>allowed.add(d)
)
);

const candidateHit=
[...actual]
.some(
d=>allowed.has(d)
);

const selectorHit=
prediction.top2Digits
.some(
d=>actual.has(d)
);

const top1Hit=
actual.has(
prediction.top2Digits[0]
);

audit.push({

sourceDate:
source.date,

targetDate:
ordered[targetIndex].date,

actual:
[...actual],

candidateSize:
allowed.size,

top2:
[...prediction.top2Digits],

candidateHit,

selectorHit,

top1Hit,

confidence:
prediction.modelScores[
prediction.top2Digits[0]
]?.confidence||0,

modelAgreement:
prediction.top2Digits.reduce(
(sum,d)=>
sum+
(
prediction.modelScores[d]
?.modelConsensusCount||0
),
0
)/
Math.max(
1,
prediction.top2Digits.length*
prediction.models.length
),

top2Score:
prediction.top2Digits.reduce(
(sum,d)=>
sum+
(
prediction.modelScores[d]
?.selectorScore||0
),
0
)

});

}

const trials=
audit.length;

const candidateHits=
audit.filter(
x=>x.candidateHit
).length;

const selectorHits=
audit.filter(
x=>x.selectorHit
).length;

const top1Hits=
audit.filter(
x=>x.top1Hit
).length;

const avgConfidence=
trials
?
audit.reduce(
(s,x)=>s+x.confidence,
0
)/
trials
:
0;

const avgCandidateSize=
trials
?
audit.reduce(
(s,x)=>s+x.candidateSize,
0
)/
trials
:
0;

const candidateCoverage=
trials
?
candidateHits/
trials
:
0;

const selectorRate=
trials
?
selectorHits/
trials
:
0;

const top1Rate=
trials
?
top1Hits/
trials
:
0;

const lift=
candidateCoverage>0
?
selectorRate/
candidateCoverage
:
0;

const avgModelAgreement=
trials
?
audit.reduce(
(s,x)=>
s+
(
x.modelAgreement||0
),
0
)/
trials
:
0;

const avgTop2Score=
trials
?
audit.reduce(
(s,x)=>
s+
(
x.top2Score||0
),
0
)/
trials
:
0;

return{

trials,

candidateHits,

selectorHits,

top1Hits,

candidateCoverage,

selectorRate,

top1Rate,

selectionLoss:
Math.max(
0,
candidateHits-
selectorHits
),

lift,

avgConfidence,

avgCandidateSize,

avgModelAgreement,

avgTop2Score,

rows:audit

};

},

formatPct(v){

return`${Math.round(
Math.max(
0,
Math.min(
1,
v
)
)*1000
)/10}%`;

},

formatDate(date){

const s=
String(date||'')
.trim();

if(
/\d+\s+\S+\s+\d+/.test(s)
){

const p=
s.split(/\s+/);

if(p.length>=3){

return[
p[0],
p[1],
p.slice(2).join(' ')
].join(' · ');

}

}

return s;

},

/*
==========================================================
MAIN ENGINE
==========================================================
*/
run(
n3,
n2,
history=null
){

const d3=
n3.split('').map(Number);

const d2=
n2.split('').map(Number);

const[
H,T,U
]=d3;

const[
R1,R2
]=d2;

const sumT=
H+T+U;

const sumB=
R1+R2;

const total=
sumT+
sumB;

const F=
this.formulas(
H,T,U,
R1,R2,
sumT,
sumB,
total
);

const models=
this.buildModels(
H,T,U,
R1,R2,
sumT
);

const anchor=
this.norm(
7-H
);

this.buildPairs(
models,
anchor
);

const scored=
this.scoreDigits(
models,
F,
H,T,U,
R1,R2,
sumT,
sumB,
total,
history
);

const top=
scored.top;

const pairSets=
top.map(
t=>
this.bestPairsForDigit(
t.digit,
models,
scored.score
)
);

const consensus=
this.buildConsensus(
pairSets
);

return{

top2Digits:
top.map(
v=>v.digit
),

pairSets:
pairSets.map(
v=>v.slice(0,5)
),

modelScores:
scored.score,

modelCount:3,

history,

models,

consensus

};

},

/*
==========================================================
CALCULATE
==========================================================
1. Parse
2. แยกประเภทหวย
3. เรียงเก่า → ใหม่
4. Strict Walk-forward audit
5. ใช้ประวัติของหวยประเภทเดียวกัน
6. Predict งวดถัดไป
7. Candidate Pool = union ของ 3 Main Models
8. Decision Layer จัดอันดับ Top 2
9. Protected pair / เลขเจาะ ทำงานต่อจาก Top 2
10. แสดงผลโดยไม่เปิดเผยสูตร
==========================================================
*/

async calculate(){

const parsed=
this.parse(
$('bulkInput').value
);

if(!parsed.records.length){

$('result').innerHTML=
'<div class="errorbox">❌ ไม่พบข้อมูลที่ถูกต้อง กรุณาตรวจรูปแบบอีกครั้ง</div>';

return;

}

$('scanner');

const btn=
$('run');

btn.disabled=true;

scanner.style.display='block';

msg=>

()=>new Promise(
resolve=>
requestAnimationFrame(
resolve
)
);

try{

scan(
'แยกประเภทหวยและเรียงข้อมูลเก่า → ใหม่...'
);

await yieldUI();

this.cache=[];

const groups=
this.groupByLottery(
parsed.records
);

groups.forEach(g=>{

if(g.duplicateCount){

parsed.errors.push(
`${g.name}: ตัดข้อมูลซ้ำแบบผลเดียวกัน ${g.duplicateCount} รายการออกก่อน Backtest`
);

}

if(g.conflictCount){

parsed.errors.push(
`${g.name}: พบวันที่ซ้ำแต่ผลต่างกัน ${g.conflictCount} รายการ — ใช้รายการล่าสุดที่ป้อนในวันนั้นเพียงรายการเดียว`
);

}

});

const cards=[];
const outputData=[];
const copyBlocks=[];

let groupIndex=0;

for(
const group of groups
){

groupIndex++;

const records=
group.records;

scan(
`ตรวจ ${group.name} • ${groupIndex}/${groups.length}`
);

await yieldUI();

if(records.length<1)
continue;

/*
======================================================
STRICT WALK-FORWARD AUDIT
======================================================
The audit is diagnostic.
Its target result is NEVER fed into the target prediction.
======================================================
*/

const audit=
this.auditSelector(
records
);

/*
Latest record becomes the source for the next prediction.

*/

const latest=
records[
records.length-1
];

const history=
this.buildHistory(
records
);

const a=
this.run(
latest.n3,
latest.n2,
history
);

this.cache.push({

group:
group.name,

result:
a,

audit

});

/*
======================================================
CANDIDATE POOL GUARD
======================================================
Top 2 must come from the 3 protected main models.
======================================================
*/

const allowed=
new Set();

a.models.forEach(
m=>
m.set.forEach(
d=>allowed.add(d)
)
);

const valid=
a.top2Digits.length===2&&
a.top2Digits.every(
d=>allowed.has(d)
)&&
new Set(
a.top2Digits
).size===2;

if(!valid){

parsed.errors.push(
`${group.name} | ${latest.date}: Top 2 ไม่ผ่าน Candidate Pool ของ 3 Main Models`
);

continue;

}

/*

======================================================
Only Model 01 / 02 / 03 exist internally as main models.

======================================================
*/

const rows=
a.top2Digits
.map(
(d,k)=>{

const sourcePairs=
(a.pairSets[k]||[])
.slice(0,5);

const sorted=
this.sortPairs(
sourcePairs
);

const pairHTML=
sorted
.map(pair=>{

const info=
a.consensus.colorMap[
this.pairKey(pair)
];

const title=
info
?
`อันดับ Consensus ${info.rank} • พบ ${info.score} ครั้ง`
:
'เลขเจาะจาก 3 Main Models';

return`
<span
class="${this.pairClass(
pair,
a.consensus.colorMap
)}"
title="${esc(title)}"
>
${esc(pair)}
</span>
`;

})
.join('');

const digitClass=
k===0
?
'digit digit-gold'
:
'digit digit-silver';

return`

class="${digitClass}"

>

</span>

:

</div>

const footer=`

</span>

<span class="brand-star">
✦
</span>

const nextDate=

/*

*/

const auditTitle=
audit.trials
?
`WF ${audit.trials} • C ${this.formatPct(audit.candidateCoverage)} • Top2 ${this.formatPct(audit.selectorRate)} • Top1 ${this.formatPct(audit.top1Rate)} • Lift ${audit.lift?audit.lift.toFixed(2)+'×':'—'}`
:
'ยังมีข้อมูลย้อนหลังไม่พอสำหรับ Walk-forward audit';

const cardId=
`lottery-card-${groupIndex}`;

</span>

copyBlocks.push([

.slice(0,5)
).join('-')}`

a,

}

scan(

const months=[
'ม.ค.',
