function parseInput(text){

/* คำนวณข้อมูลประวัติแบบหลายหน้าต่าง: 25 / 15 / 8 งวด */
function recentRate(recs,formula,start,end){
let from=Math.max(0,recs.length-end),to=Math.max(0,recs.length-start),total=0,hit=0;
for(let i=from;i<to;i++){
if(i>=recs.length-1)continue;
let a=recs[i],b=recs[i+1],
t=a.n3.split('').map(Number),
u=a.n2.split('').map(Number),
p=sanitizeFormulaResult(formula(t[0],t[1],t[2],u[0],u[1]));
if(checkHitDetail(p,b.n3,b.n2).hitAny)hit++;
total++
}
return total?hit/total:0
}

function digitFrequency(recs,digit){
let total=Math.min(30,recs.length),from=Math.max(0,recs.length-total),count=0;
for(let i=from;i<recs.length;i++){
let n=(recs[i].n3+recs[i].n2).split('');
if(n.includes(String(digit)))count++
}
return total?count/total:0
}

function targetPositionFrequency(recs,digit){
let total=Math.min(30,recs.length),from=Math.max(0,recs.length-total),count=0;
for(let i=from;i<recs.length;i++){
let r=recs[i];
if(r.n3.slice(1).includes(String(digit))||r.n2.includes(String(digit)))count++
}
return total?count/total:0
}

function formulaConsensus(audit,digit){
let arr=Object.values(audit).filter(x=>x.latestDigits?.includes(digit)),sum=0;
arr.forEach(x=>sum+=Math.max(0,x.hitRate));
return Object.keys(audit).length?sum/(Object.keys(audit).length*100):0
}

function makeSmartSelection(recs,audit,latestDigits){
let candidates=[];
for(let d=0;d<10;d++){
let consensus=formulaConsensus(audit,d),
freq=digitFrequency(recs,d),
target=targetPositionFrequency(recs,d);
let r25=0,r15=0,r8=0,count=0;

Object.values(audit).forEach(x=>{
if(x.latestDigits?.includes(d)){
r25+=x.rate25||0;
r15+=x.rate15||0;
r8+=x.rate8||0;
count++
}
});

if(count){
r25/=count;
r15/=count;
r8/=count
}

let latestBoost=latestDigits.includes(d)?1:0;
let score=100*(.27*consensus+.18*freq+.20*target+.15*r25+.10*r15+.07*r8+.03*latestBoost);
candidates.push({digit:d,score})
}

candidates.sort((a,b)=>b.score-a.score);

let selected=[],protectedDigits=[...latestDigits];

protectedDigits.forEach(d=>{
if(!selected.includes(d))selected.push(d)
});

for(let c of candidates){
if(selected.length<4&&!selected.includes(c.digit))selected.push(c.digit)
}

return{selected,candidates}
}

function makeSmartPairs(digits,recs){
let pairs=[];

digits.forEach(main=>{
let units=Array.from({length:10},(_,i)=>i)
.filter(x=>x!==main)
.map(unit=>{
let f=targetPositionFrequency(recs,unit),
pairScore=100*(.65*f+.35*digitFrequency(recs,unit));
return{pair:`${main}${unit}`,val:10*main+unit,score:pairScore}
})
.sort((a,b)=>b.score-a.score)
.slice(0,5);

pairs.push(
units
.sort((a,b)=>a.val-b.val)
.map((x,i)=>({
...x,
rankClass:i===0?'rank-gold':i===1?'rank-silver':i===2?'rank-rosegold':''
}))
)
});

return pairs
}

function runEngine(){
let text=$('bulkInput').value.trim(),newRecords=[];

if(text){
let parsed=parseInput(text);

if(parsed.errors.length&&parsed.records.length===0){
$('result').innerHTML=`<div class="errorbox"><b>ไม่สามารถประมวลผลได้:</b><br>${parsed.errors.join('<br>')}</div>`;
return
}

newRecords=parsed.records
}

let master=[];

try{
master=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')
}catch(e){}

newRecords.forEach(nr=>{
let i=master.findIndex(r=>r.name===nr.name&&r.date===nr.date);
if(i>=0)master[i]=nr;
else master.push(nr)
});

master.sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));

try{
localStorage.setItem(STORAGE_KEY,JSON.stringify(master))
}catch(e){}

if(!master.length){
$('result').innerHTML='<div class="errorbox">ยังไม่มีข้อมูลในระบบ กรุณากรอกข้อมูลสถิติย้อนหลัง</div>';
return
}

let groups={};
master.forEach(r=>(groups[r.name]??=[]).push(r));

let auditDataMap={},predictionDataMap={},smartDataMap={},globalAccumulator={};

Object.keys(formulas).forEach(f=>{
globalAccumulator[f]={
totalTested:0,
hits:0,
misses:0,
hundredsOnlyCount:0,
latestDigits:null
}
});

Object.keys(groups).forEach(name=>{
let recs=groups[name];
if(recs.length<2)return;

let fs={},
latest=recs[recs.length-1],
lt=latest.n3.split('').map(Number),
lb=latest.n2.split('').map(Number);

Object.keys(formulas).forEach(f=>{
let hits=0,misses=0,hundreds=0,cur=0,curMiss=0,max=0,maxMiss=0;

for(let i=0;i<recs.length-1;i++){
let a=recs[i],
b=recs[i+1],
t=a.n3.split('').map(Number),
u=a.n2.split('').map(Number),
p=sanitizeFormulaResult(
formulas[f](t[0],t[1],t[2],u[0],u[1])
),
c=checkHitDetail(p,b.n3,b.n2);

if(c.hitHundredsOnly)hundreds++;

if(c.hitAny){
hits++;
cur++;
curMiss=0;
max=Math.max(max,cur)
}else{
misses++;
curMiss++;
cur=0;
maxMiss=Math.max(maxMiss,curMiss)
}
}

let latestDigits=sanitizeFormulaResult(
formulas[f](lt[0],lt[1],lt[2],lb[0],lb[1])
),
total=hits+misses;

let x={
totalTested:total,
hits,
misses,
hundredsOnlyCount:hundreds,
hitRate:total?Number((100*hits/total).toFixed(2)):0,
maxStreak:max,
maxMissStreak:maxMiss,
curStreak:cur,
curMissStreak:curMiss,
lastHit:cur>0,
hitHundredsOnly:false,
latestDigits,
rate25:recentRate(recs,formulas[f],0,25),
rate15:recentRate(recs,formulas[f],0,15),
rate8:recentRate(recs,formulas[f],0,8)
};

fs[f]=x;

let g=globalAccumulator[f];
g.totalTested+=total;
g.hits+=hits;
g.misses+=misses;
g.hundredsOnlyCount+=hundreds;
g.latestDigits=latestDigits
});

auditDataMap[name]=fs;

let sorted=Object.keys(fs).sort((a,b)=>fs[b].hitRate-fs[a].hitRate),
rank1=fs[sorted[0]].latestDigits,
d1=rank1[0],
d2=rank1[1];

let digitScore=d=>Object.values(fs).reduce(
(s,x)=>s+(x.latestDigits.includes(d)?x.hitRate:0),0
);

if(digitScore(d2)>digitScore(d1))[d1,d2]=[d2,d1];
if(d1===d2)d2=norm(d1+1);

let anchor=Math.abs(7-lt[0])%10,
normal=[-2,-1,0,1,2].map(o=>norm(anchor+o)),
offsets=normal.some(x=>[d1,d2].includes(x))
?[-3,-2,-1,0,1,2,3]
:[-2,-1,0,1,2],
pool=offsets.map(o=>norm(anchor+o));

function pairs(main,other){
let units=pool.filter(x=>x!==main&&x!==other);

for(let x=0;units.length<5&&x<10;x++){
if(x!==main&&x!==other&&!units.includes(x))units.push(x)
}

let a=units.slice(0,5).map(u=>({
pair:`${main}${u}`,
val:10*main+u,
score:Object.values(fs).reduce(
(s,f)=>s+(f.latestDigits.includes(main)||f.latestDigits.includes(u)?f.hitRate:0),0
)+(Math.abs(u-anchor)<=1?15:0)
}));

let ranked=[...a]
.sort((x,y)=>y.score-x.score)
.slice(0,3)
.map(x=>x.pair);

return a
.sort((x,y)=>x.val-y.val)
.map(x=>({
...x,
rankClass:x.pair===ranked[0]
?'rank-gold'
:x.pair===ranked[1]
?'rank-silver'
:x.pair===ranked[2]
?'rank-rosegold'
:''
}))
}

predictionDataMap[name]={
nextDate:getNextDateStr(latest.date),
d1,
d2,
d1Pairs:pairs(d1,d2),
d2Pairs:pairs(d2,d1)
};

let smart=makeSmartSelection(recs,fs,[d1,d2]),
sp=makeSmartPairs(smart.selected.slice(0,2),recs);

smartDataMap[name]={
nextDate:getNextDateStr(latest.date),
selected:smart.selected,
candidates:smart.candidates,
pairs:sp
}
});

let globalAuditMap={};

Object.keys(globalAccumulator).forEach(f=>{
let g=globalAccumulator[f];

globalAuditMap[f]={
...g,
hitRate:g.totalTested
?Number((100*g.hits/g.totalTested).toFixed(2))
:0
}
});

renderFullUI(
globalAuditMap,
auditDataMap,
predictionDataMap,
smartDataMap
);

showToast('✓ ประมวลผลระบบ V32.4 สำเร็จ')
}

}
};

try{

}catch(e){}
});

})();
