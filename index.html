<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src 'self' *;">
    <title>AI Analytics System - Precision Model</title>
    <style>
        :root{--bg:#090d16;--card:#111827;--card-border:rgba(255,215,0,0.15);--accent:#eab308;--accent-glow:rgba(234,179,8,0.3);--text:#f3f4f6;--text-dim:#9ca3af;--emerald:#10b981;--rose:#f43f5e}
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
        body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:15px}
        .app-container{width:100%;max-width:480px;background:var(--card);border:1px solid var(--card-border);border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
        .header{text-align:center;margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid var(--card-border)}
        .header h1{font-size:1.5rem;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
        .header p{font-size:0.8rem;color:var(--text-dim)}
        .input-section{background:rgba(255,255,255,0.03);border-radius:12px;padding:15px;margin-bottom:20px}
        .input-group{display:flex;gap:10px;margin-bottom:12px}
        .input-field{flex:1}
        .input-field label{display:block;font-size:0.75rem;color:var(--text-dim);margin-bottom:5px}
        .input-field input{width:100%;background:#05070a;border:1px solid var(--card-border);border-radius:8px;padding:10px;color:#fff;font-size:1.1rem;text-align:center;font-weight:700}
        .input-field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 8px var(--accent-glow)}
        .calc-btn{width:100%;background:linear-gradient(135deg,#eab308,#ca8a04);border:none;border-radius:10px;padding:12px;color:#000;font-weight:800;font-size:1rem;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s}
        .calc-btn:active{transform:scale(0.98)}
        .results-section{display:none;flex-direction:column;gap:15px}
        .top-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .card{background:rgba(255,255,255,0.02);border:1px solid var(--card-border);border-radius:12px;padding:12px;text-align:center}
        .card-title{font-size:0.75rem;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase}
        .card-value{font-size:1.2rem;font-weight:800;color:var(--accent)}
        .models-grid{display:flex;flex-direction:column;gap:8px}
        .model-row{display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,0.3);padding:8px 12px;border-radius:8px;border-left:3px solid var(--accent)}
        .model-name{font-size:0.8rem;font-weight:600;color:var(--text-dim)}
        .model-res{font-size:0.95rem;font-weight:700;color:#fff}
        .badge{background:var(--accent-glow);color:var(--accent);padding:2px 6px;border-radius:4px;font-size:0.7rem;margin-left:5px}
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>AI ANALYTICS CORE</h1>
        <p>ULTRA-PRECISION MULTI-MODEL ENGINE</p>
    </div>

    <div class="input-section">
        <div class="input-group">
            <div class="input-field">
                <label for="digit3">3 ตัวบน</label>
                <input type="text" id="digit3" maxlength="3" placeholder="000" inputmode="numeric">
            </div>
            <div class="input-field">
                <label for="digit2">2 ตัวล่าง</label>
                <input type="text" id="digit2" maxlength="2" placeholder="00" inputmode="numeric">
            </div>
        </div>
        <button class="calc-btn" onclick="processAnalytics()">คำนวณผลลัพธ์ประมวลผล</button>
    </div>

    <div class="results-section" id="resultsSection">
        <div class="top-cards">
            <div class="card">
                <div class="card-title">TOP 3 เด่นสูงสุด</div>
                <div class="card-value" id="topSingles">-</div>
            </div>
            <div class="card">
                <div class="card-title">TOP 3 ชุดเจาะเน้น</div>
                <div class="card-value" id="topPairs">-</div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">ชุดวินเด่นประจำงวด</div>
            <div class="card-value" id="winSet" style="color:var(--emerald);letter-spacing:2px;">-</div>
        </div>

        <div class="card">
            <div class="card-title">ชุดเน้น 3 ตัวบน</div>
            <div class="card-value" id="trioSet" style="color:#60a5fa;letter-spacing:1px;font-size:1rem;">-</div>
        </div>

        <div class="models-grid">
            <div class="model-row">
                <span class="model-name">MODEL 01 <span class="badge">N1+V2.2</span></span>
                <span class="model-res" id="m1Res">-</span>
            </div>
            <div class="model-row">
                <span class="model-name">MODEL 02 <span class="badge">N6 CORE</span></span>
                <span class="model-res" id="m2Res">-</span>
            </div>
            <div class="model-row">
                <span class="model-name">MODEL 03 <span class="badge">N3 MATRIX</span></span>
                <span class="model-res" id="m3Res">-</span>
            </div>
            <div class="model-row">
                <span class="model-name">MODEL 04 <span class="badge">N2 SELECT</span></span>
                <span class="model-res" id="m4Res">-</span>
            </div>
            <div class="model-row">
                <span class="model-name">MODEL 05 <span class="badge">BASE-7 HYBRID</span></span>
                <span class="model-res" id="m5Res">-</span>
            </div>
        </div>
    </div>
</div>

<script>
const mod10 = n => ((n % 10) + 10) % 10;

function getDynamicK() {
    const h = new Date().getHours();
    if (h >= 5 && h < 12) return 6;
    if (h >= 12 && h < 16) return 7;
    return 8;
}

// Universal Base-7 Cutting Formula for Pair Extraction
function generatePairs(d1, d2, A) {
    const baseCut = mod10(7 - A);
    const p1 = `${d1}${mod10(d1 + baseCut)}`;
    const p2 = `${d1}${mod10(d1 + 3)}`;
    const p3 = `${d2}${mod10(d2 + baseCut)}`;
    const p4 = `${d2}${mod10(d2 + 3)}`;
    return [p1, p2, p3, p4];
}

function processAnalytics() {
    const in3 = document.getElementById('digit3').value.trim();
    const in2 = document.getElementById('digit2').value.trim();

    if (in3.length !== 3 || in2.length !== 2 || isNaN(in3) || isNaN(in2)) {
        alert('กรุณากรอกข้อมูล 3 ตัวบน และ 2 ตัวล่างให้ครบถ้วน');
        return;
    }

    const A = parseInt(in3[0]), B = parseInt(in3[1]), C = parseInt(in3[2]);
    const D = parseInt(in2[0]), E = parseInt(in2[1]);
    const K = getDynamicK();

    // --- สูตรทั้งหมด (All Models Pool) ---
    // Model 01: N1+V2.2 (Ultra-Stability)
    let m1_1 = mod10(A + 3*B + C + 3*D + 3*E + K);
    let st2 = -A - B - C + D - 3*E + 1;
    if (mod10(st2) === A) st2 += 1;
    let m1_2 = mod10(st2);
    if (m1_1 === m1_2) m1_2 = mod10(m1_2 + 1);

    // Model 02: N6 Master Core
    let m2_1 = mod10(-A - 2*B + C - E + 1);
    let m2_2 = mod10(A - C - D - 2*E);

    // Model 03: N3 Matrix
    let m3_1 = mod10(2*A - B + C + 2*D - E + 3);
    let m3_2 = mod10(A + 2*B - 2*C + D + 2*E + 6);

    // Model 04: N2 Select
    let m4_1 = mod10(-A + B - C + 2*D + E + 4);
    let m4_2 = mod10(A - 2*C - 2*E + 7);

    // Model 05: Base 10 Hybrid (สูตร 5 + สูตร 6 ปรับระดับ)
    let m5_1 = mod10(10 - E);
    let m5_2 = mod10(A + D + E);

    const models = [
        { id: 1, name: 'M1', d1: m1_1, d2: m1_2, el: 'm1Res' },
        { id: 2, name: 'M2', d1: m2_1, d2: m2_2, el: 'm2Res' },
        { id: 3, name: 'M3', d1: m3_1, d2: m3_2, el: 'm3Res' },
        { id: 4, name: 'M4', d1: m4_1, d2: m4_2, el: 'm4Res' },
        { id: 5, name: 'M5', d1: m5_1, d2: m5_2, el: 'm5Res' }
    ];

    const singleFreq = {};
    const pairFreq = {};
    const allSingles = [];

    models.forEach(m => {
        document.getElementById(m.el).textContent = `${m.d1} - ${m.d2}`;
        
        // Frequency Calculation
        [m.d1, m.d2].forEach(num => {
            singleFreq[num] = (singleFreq[num] || 0) + 1;
            allSingles.push(num);
        });

        const pairs = generatePairs(m.d1, m.d2, A);
        pairs.forEach(p => {
            const sortedP = p.split('').sort().join('');
            pairFreq[sortedP] = (pairFreq[sortedP] || 0) + 1;
        });
    });

    // Extract Top 3 Singles
    const topSingles = Object.keys(singleFreq)
        .sort((a,b) => singleFreq[b] - singleFreq[a] || a - b)
        .slice(0, 3);

    // Extract Top 3 Pairs
    const topPairs = Object.keys(pairFreq)
        .sort((a,b) => pairFreq[b] - pairFreq[a] || a - b)
        .slice(0, 3);

    // Generate Win Set (Unique Digits)
    const winSet = [...new Set(allSingles)].sort().join(' ');

    // Generate 3-Digit Trio Set from Top Singles + Cut
    const trioCut = mod10(A + B + C);
    const trio1 = `${topSingles[0] || 0}${topSingles[1] || 1}${topSingles[2] || 2}`;
    const trio2 = `${topSingles[0] || 0}${trioCut}${topSingles[1] || 1}`;

    // Render Results
    document.getElementById('topSingles').textContent = topSingles.join(', ');
    document.getElementById('topPairs').textContent = topPairs.join(', ');
    document.getElementById('winSet').textContent = winSet;
    document.getElementById('trioSet').textContent = `${trio1} | ${trio2}`;

    document.getElementById('resultsSection').style.display = 'flex';
}
</script>
</body>
</html>
