<script>
/* =========================================================
   TOP 5 FOCUS — CROSS-MODEL PAIR CONSENSUS
========================================================= */

const pairConsensusMap=new Map();

/*
   63 และ 36 จะถูกทำให้เป็นคู่เดียวกัน
   94 และ 49 จะถูกทำให้เป็นคู่เดียวกัน
*/
const canonicalPair=pair=>{

const str=
String(pair)
.replace(/\D/g,"")
.padStart(2,"0")
.slice(-2);

const a=str[0];
const b=str[1];

return a<=b
?`${a}${b}`
:`${b}${a}`;
};


/*
   ใช้เลขเจาะจาก 10 คู่ของแต่ละโมเดล
   และให้ 1 โมเดลมีสิทธิ์โหวตคู่เดียวกันได้เพียง 1 ครั้ง
*/
evaluated.forEach(model=>{

const modelPairs=new Set();

Object.values(model.pairsMap||{}).forEach(list=>{

(list||[]).forEach(pair=>{

const key=canonicalPair(pair);

if(key[0]===key[1])
return;

modelPairs.add(key);

});

});


modelPairs.forEach(key=>{

if(!pairConsensusMap.has(key)){

pairConsensusMap.set(
key,
{
key,
modelHits:0,
models:new Set()
}
);

}

const item=
pairConsensusMap.get(key);

item.modelHits++;

item.models.add(model.id);

});

});


/*
   Ranking ภายในระบบ
   Consensus เป็นตัวหลัก
   Digit Score เป็นตัวช่วยตัดสินกรณีคะแนนใกล้กัน
   Digit Match เป็น Bonus ภายในเท่านั้น
   ไม่แสดงข้อมูลเหล่านี้ให้สมาชิกเห็น
*/
const pairRankSource=
Array.from(
pairConsensusMap.values()
)
.map(item=>{

const a=
Number(item.key[0]);

const b=
Number(item.key[1]);


const aScore=
digitScores[a]?.totalScore||0;

const bScore=
digitScores[b]?.totalScore||0;


const digitBase=
(aScore+bScore)/2;


const digitMatch=
(allowedModelDigits.has(a)?1:0)+
(allowedModelDigits.has(b)?1:0);


/*
   Consensus ต้องมีน้ำหนักเหนือกว่า
   คะแนนอื่นทั้งหมดอย่างชัดเจน
*/
const rankingScore=
item.modelHits*1000+
(digitBase*100)+
(digitMatch*8);


return{
...item,
a,
b,
digitBase,
digitMatch,
rankingScore
};

})
.sort(
(a,b)=>
b.rankingScore-a.rankingScore||
b.modelHits-a.modelHits||
b.digitBase-a.digitBase||
a.key.localeCompare(b.key)
);


/*
   Premium shortlist
*/
const topFocusPairs=
pairRankSource.slice(0,5);


/*
   ใช้ Confidence Scale เดิมของระบบ
   เพื่อให้ % ในกล่องใหม่ยังอยู่ในภาษาคะแนนเดียวกับระบบ
*/
const pairConfidenceScore=
pair=>
calcConfidence(
pair.digitBase
);


/* =========================================================

========================================================= */

const deepScanHTML=
topFocusPairs.map(
(pair,index)=>{

const pct=
pairConfidenceScore(pair);


const rankClass=[
"rank-one",

return`
