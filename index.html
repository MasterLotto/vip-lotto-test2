<script>
(()=>{

/* =========================================================
   SNOW / AMBIENT
   ========================================================= */

const c=document.getElementById('snow');
const x=c.getContext('2d');

let w=c.width=innerWidth;
let h=c.height=innerHeight;

addEventListener('resize',()=>{
w=c.width=innerWidth;
h=c.height=innerHeight;
});

const particles=Array.from(
{length:42},
()=>({
x:Math.random()*w,
y:Math.random()*h,
r:.7+Math.random()*1.8,
s:.15+Math.random()*.45,
a:.18+Math.random()*.35,
p:Math.random()*6.28,
tone:Math.random()>.72?'rose':'gold'
})
);

(function draw(){
x.clearRect(0,0,w,h);

particles.forEach(q=>{
q.p+=.01;
q.y+=q.s;
q.x+=Math.sin(q.p)*.25;

if(q.y>h+5){
q.y=-5;
q.x=Math.random()*w;
}

x.beginPath();

x.arc(
q.x,
q.y,
q.r,
0,
Math.PI*2
);

x.fillStyle=
q.tone==='rose'
?`rgba(185,130,121,${q.a*.55})`
:`rgba(195,154,67,${q.a})`;

x.fill();
});

requestAnimationFrame(draw);

})();

const $=id=>document.getElementById(id);

const esc=s=>String(s)
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#039;');


/* =========================================================
   ACCESS / LOGIN
   ========================================================= */

const sec={

tokens:[
'4d617374657241646d696e32303236',
'54396b4c326d5037',
'5a71345738785431'
],

dec(h){

let s='';

for(let i=0;i<h.length;i+=2){

s+=String.fromCharCode(
parseInt(h.slice(i,i+2),16)
);

}

return s;

},

ok(v){

return this.tokens.some(
t=>v===this.dec(t)
);

}

};


/* =========================================================
   MAIN APP
   ========================================================= */

const app={

cache:[],

lastCopyText:'',

toastTimer:null,

audio(){},

norm(x){

return(x%10+10)%10;

},

clamp(v,lo=0,hi=1){

return Math.max(
lo,
Math.min(
hi,
Number(v)||0
)
);

},

normalizeScores(map){

const vals=Object.values(map);

const max=Math.max(
...vals,
0
);

if(max<=0){

return Object.fromEntries(
Object.keys(map)
.map(k=>[k,0])
);

}

return Object.fromEntries(
Object.entries(map)
.map(
([k,v])=>[
k,
this.clamp(v/max)
]
)
);

},

sourceBreadthScore(v){

return this.clamp(
1-
Math.exp(
-Math.max(0,v)/1.6
)
);

},

consensusTier(count,total){

const n=Math.max(
1,
total||1
);

if(count>=n)
return 1;

if(count===2 && n===3)
return .78;

if(count>=2)
return .68;

if(count===1)
return .30;

return 0;

},

flag(n){

if(/ฮั่งเส็ง|hang seng|hong kong|ฮ่องกง/.test(n))

if(/นิเคอิ|นิคเคอิ|นิกเคอิ|nikkei|ญี่ปุ่น|japan/.test(n))
return'🇯🇵';

if(/เกาหลี|korea|kospi/.test(n))

/* =========================================================
   INPUT PARSER
   ========================================================= */

parse(text){

const z=String(text||'')
.replace(/\r/g,'')
.trim();

if(!z){

return{
records:[],
errors:[
'ยังไม่มีข้อมูลสำหรับประมวลผล'
]
};

}

const lines=z
.split('\n')
.map(v=>v.trim());

const records=[];
const errors=[];

let i=0;

while(i<lines.length){

if(!lines[i]){
i++;
continue;
}

const m=lines[i]
.match(
/^(.+?)\s*\|\s*(.+?)$/
);

if(!m){

errors.push(
`บรรทัดที่ ${i+1}: ไม่พบรูปแบบ "ชื่อหวย | วันที่"`
);

i++;
continue;
}

const name=m[1].trim();
const date=m[2].trim();

if(!this.parseDateValue(date)){

errors.push(
`${name} | ${date}: รูปแบบวันที่ไม่ถูกต้อง เช่น 25 ส.ค. 69`
);

i+=1;
continue;
}

const n3raw=lines[i+1]||'';
const n2raw=lines[i+2]||'';

const n3=/^[\d\s]+$/.test(n3raw)
?n3raw.replace(/\s+/g,'')
:n3raw;

const n2=/^[\d\s]+$/.test(n2raw)
?n2raw.replace(/\s+/g,'')
:n2raw;

if(!/^\d{3}$/.test(n3)){

errors.push(
`${name} | ${date}: เลข 3 ตัวบนต้องเป็น 3 หลัก`
);

i+=1;
continue;

}

if(!/^\d{2}$/.test(n2)){

errors.push(
`${name} | ${date}: เลข 2 ตัวล่างต้องเป็น 2 หลัก`
);

i+=2;
continue;

}

records.push({
name,
date,
n3,
n2
});

i+=3;

}

return{
records,
errors
};

},


parseDateValue(date){

const s=String(date||'').trim();

if(!s)
return false;

if(
/^\d{1,2}\s+\S+\s+\d{2,4}$/.test(s)
)
return true;

if(
/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(s)
)
return true;

if(
/^\d{1,2}-\d{1,2}-\d{2,4}$/.test(s)
)
return true;

return false;

},


dateKey(date){

const s=String(date||'')
.trim();

const m=s.match(
/^(\d{1,2})\s+(\S+)\s+(\d{2,4})$/
);

if(m){

const months={
'ม.ค.':1,
'ก.พ.':2,
'มี.ค.':3,
'เม.ย.':4,
'พ.ค.':5,
'มิ.ย.':6,
'ก.ค.':7,
'ส.ค.':8,
'ก.ย.':9,
'ต.ค.':10,
'พ.ย.':11,
'ธ.ค.':12
};

const month=months[m[2]]||0;

let year=Number(m[3]);

if(year<100)
year+=2500;

return[
year,
String(month).padStart(2,'0'),
String(Number(m[1])).padStart(2,'0')
].join('-');

}

const m2=s.match(
/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/
);

if(m2){

let year=Number(m2[3]);

if(year<100)
year+=2500;

return[
year,
String(Number(m2[2])).padStart(2,'0'),
String(Number(m2[1])).padStart(2,'0')
].join('-');

}

return s;

},


sortChronological(records){

return records
.map((r,index)=>({
...r,
__index:index
}))
.sort((a,b)=>{

const ka=this.dateKey(a.date);
const kb=this.dateKey(b.date);

if(ka<kb)
return-1;

if(ka>kb)
return 1;

return a.__index-b.__index;

})
.map(r=>{

const z={...r};

delete z.__index;

return z;

});

},


/* =========================================================
   LOTTERY GROUPING
   ========================================================= */

groupByLottery(records){

const groupsMap={};

records.forEach((r,index)=>{

const key=r.name.trim();

if(!groupsMap[key]){

groupsMap[key]={
name:key,
records:[],
duplicateCount:0,
conflictCount:0,
__order:index
};

}

groupsMap[key].records.push(r);

});

const groups=Object.values(groupsMap);

groups.forEach(g=>{

const sorted=this.sortChronological(g.records);

const byDate=new Map();
const clean=[];

sorted.forEach(r=>{

const key=this.dateKey(r.date);

if(!byDate.has(key)){

byDate.set(
key,
r
);

clean.push(r);

return;

}

const previous=byDate.get(key);

if(
previous.n3===r.n3 &&
previous.n2===r.n2
){

g.duplicateCount++;

return;

}

g.conflictCount++;

const idx=clean.indexOf(previous);

if(idx>=0)
clean[idx]=r;

byDate.set(key,r);

});

g.records=this.sortChronological(clean);

});

return groups
.sort((a,b)=>a.__order-b.__order)
.map(g=>{

delete g.__order;

return g;

});

},

/* =========================================================
   PROTECTED PAIR / เลขเจาะ ENGINE
   ไม่แตะสูตรเลขจอด
   ========================================================= */

buildPairs(
models,
anchor
){

models.forEach(m=>{

let range=[];
let collision=false;

for(let o=-2;o<=2;o++){

if(
m.set.includes(
this.norm(anchor+o)
)
){

collision=true;
break;

}

}

for(
let o=collision?-3:-2;
o<=(collision?3:2);
o++
){

range.push(
this.norm(anchor+o)
);

}

m.pairsMap={};

m.set.forEach(src=>{

let pairs=range
.filter(
p=>
p!==src &&
!m.set.includes(p)
)
.map(
p=>`${src}${p}`
);

let next=(src+1)%10;

while(pairs.length<5){

if(
next!==src &&
!m.set.includes(next) &&
!pairs.includes(
`${src}${next}`
)
){

pairs.push(
`${src}${next}`
);

}

next=(next+1)%10;

}

m.pairsMap[src]=[
...new Set(pairs)
]
.filter(
p=>p[0]!==p[1]
)
.slice(0,5);

});

});

},

i>

/* -----------------------------------------

models.forEach(m=>{

:0;

Object.values(

for(let d=0;d<=9;d++){

const hitRate=
this.posterior(
hp.long??.5,
hp.samples??0,
.5,
6
);

const recentRate=
this.posterior(
hp.recent??hitRate,
hp.recentSamples??0,
.5,
4
);

const stability=
this.clamp(
hp.stability??.5
);


/*
Model quality bounded.
*/

const quality=
this.clamp(

.42*hitRate+
.23*recentRate+
.20*primaryRate+
.10*secondaryRate+
.05*stability

);

modelCandidateScores[m.id]={

quality,

primaryRate,

secondaryRate,

hitRate,

recentRate,

stability

};

}


/* =========================================================
   STEP 2
   12 MODEL-POSITION CANDIDATES
   ========================================================= */

for(const m of models){

const q=
modelCandidateScores[m.id];

const primary=m.set[0];

const secondary=m.set[1];

const pos=[

{
digit:primary,
position:1,
positionWeight:1
},

{
digit:secondary,
position:2,
positionWeight:.8
}

];

for(const c of pos){

const hp=
history.modelPerf?.[m.id]||{};

const positionRate=
c.position===1

?

this.posterior(
hp.primaryRate??.5,
hp.primarySamples??0,
.5,
6
)

:

this.posterior(
hp.secondaryRate??.5,
hp.secondarySamples??0,
.5,
6
);


/*
Current candidate is driven by its model.
*/

const raw=

.58*q.quality+

.24*positionRate+

.10*q.recentRate+

.08*q.stability;

const weighted=
this.clamp(raw)*
c.positionWeight;

const row={

modelId:m.id,

modelName:m.name,

digit:c.digit,

position:c.position,

positionWeight:c.positionWeight,

score:weighted,

modelQuality:q.quality,

positionRate,

recentRate:q.recentRate,

stability:q.stability

};

candidateRows.push(row);

if(!score[c.digit].candidateRows)
score[c.digit].candidateRows=[];

score[c.digit].candidateRows.push(row);

modelCandidateScores[m.id][
c.position===1
?'primaryCandidateScore'
:'secondaryCandidateScore'
]=weighted;

}

}


/* =========================================================
   STEP 3
   SAME DIGIT CONSENSUS
   DIMINISHING RETURN
   ========================================================= */

for(let d=0;d<=9;d++){

const rows=
score[d].candidateRows||[];

const ranked=
[...rows]
.sort(
(a,b)=>
b.score-a.score||
a.modelId-b.modelId
);

const top=ranked[0];

score[d].bestModelCandidateScore=
top?.score||0;

score[d].modelScore=
this.clamp(
top?.score||0
);

score[d].modelSupportScore=
score[d].modelScore;

score[d].modelConsensusCount=
rows.length;

score[d].modelId=
top?.modelId??null;

score[d].modelPriority=
top?.position===1
?1
:.8;


/*
Independent agreement.
*/

let consensus=0;

for(let i=0;i<ranked.length;i++){

const factor=
i===0
?1
:i===1
?.45
:i===2
?.22
:i===3
?.12
:i===4
?.07
:.04;

consensus+=
ranked[i].score*
factor;

}

score[d].modelScore=
this.clamp(

.72*score[d].modelScore+
.28*this.clamp(consensus)

);

}


/* =========================================================
   STEP 4
   LEGACY SUPPORT
   ========================================================= */

const weightedFormulaCounts=
Object.fromEntries(

Array.from(
{length:10},
(_,d)=>[d,0]
)

);

F.signals.forEach(sig=>{

weightedFormulaCounts[
sig.value
]+=
this.formulaWeight(
sig.id,
history
);

});

const maxF=
Math.max(
...Object.values(
weightedFormulaCounts
),
1
);

for(let d=0;d<=9;d++){

score[d].formula100Score=
this.clamp(
weightedFormulaCounts[d]/maxF
);

}


/* =========================================================
   RADAR
   ========================================================= */

const x=(R1+R2)%10;

const y=sumT%10;

const z=total%10;

const r1=[
this.norm(x-1),
x,
this.norm(x+1)
];

const r2=[
this.norm(y-1),
y,
this.norm(y+1)
];

const r3=[
this.norm(z-1),
z,
this.norm(z+1)
];

for(let d=0;d<=9;d++){

let h=0;

if(r1.includes(d))
h++;

if(r2.includes(d))
h++;

if(r3.includes(d))
h++;

score[d].radarScore=
h/3;

}


/* =========================================================
   BACKEND / WINSET
   ========================================================= */

const back=[

(2*H+R1)%10,

(T+R2)%10,

sumT%10,

Math.abs(T-U)%10,

total%10

];

for(let d=0;d<=9;d++){

score[d].backendScore=
back.includes(d)
?1
:0;

score[d].winSetScore=
(
d===z||
d===this.norm(z+5)
)
?1
:0;

}


/* =========================================================
   STEP 5
   HISTORICAL DIGIT EVIDENCE
   ========================================================= */

for(let d=0;d<=9;d++){

const dp=
history.digitPerf?.[d];

if(
dp&&
dp.samples
){

const longPost=
this.posterior(
dp.long,
dp.samples,
.5,
6
);

const recentPost=
this.posterior(
dp.recent,
dp.recentSamples||
Math.min(
dp.samples,
6
),
.5,
4
);

score[d].historicalScore=
longPost;

score[d].recentFormScore=
recentPost;

score[d].stabilityScore=
dp.stability??.5;

score[d].evidenceScore=
this.clamp(

.55*longPost+
.35*recentPost+
.10*(dp.stability??.5)

);

score[d].uncertainty=
1/
Math.sqrt(
dp.samples+1
);

const streak=
Math.max(
0,
dp.streak||0
);

score[d].hotStreakBonus=
1+
Math.min(
.03,
Math.max(
0,
streak-1
)*.0075
);

}

}


/* =========================================================
   STEP 6
   FINAL SELECTOR
   ========================================================= */

for(let d=0;d<=9;d++){

const v=score[d];

const allowedHere=
allowed.has(d);

const supportValues=[

v.formula100Score,

v.radarScore,

v.backendScore,

v.winSetScore

];

v.supportSignals=
supportValues.filter(
x=>x>=.60
).length;

v.conflictSignals=
supportValues.filter(
x=>x<=.25
).length;

const sortedSupport=
[
...supportValues
]
.sort(
(a,b)=>b-a
);

const supportStrength=
this.clamp(

.40*sortedSupport[0]+
.24*sortedSupport[1]+
.14*sortedSupport[2]+
.08*sortedSupport[3]

);

const supportBreadth=
this.sourceBreadthScore(
v.supportSignals
);

const hist=
v.evidenceScore;

v.reliabilityScore=
this.clamp(

.45*v.modelScore+
.25*hist+
.17*supportBreadth+
.13*supportStrength

);


/*
=========================================================
MODEL CORE
=========================================================
Support engines are intentionally weak.
*/

const modelCore=
v.modelScore;

const historyAdj=
.82+
.18*
this.clamp(
v.evidenceScore
);

const supportAdj=
.97+
.03*
this.clamp(
supportStrength
);

const agreementAdj=
1+
.04*
Math.min(
1,
v.modelConsensusCount-1
);

const uncertaintyPenalty=
1-
.10*
this.clamp(
v.uncertainty
);

v.totalScore=
this.clamp(

modelCore*
historyAdj*
supportAdj*
agreementAdj*
uncertaintyPenalty

);


/*
Legacy systems can confirm,
but never manufacture candidate.
*/

v.selectorBonus=
allowedHere

?

.015*
this.clamp(
supportBreadth
)

:0;

v.totalScore=
allowedHere

?

this.clamp(
v.totalScore+
v.selectorBonus
)

:0;


/*
Weak candidate gate.
*/

const weakHistory=
history.usable>0&&
v.modelConsensusCount<=1&&
v.evidenceScore<.42&&
v.supportSignals===0;

v.qualityGate=
allowedHere
?1
:0;

v.selectionPenalty=
weakHistory
?.90
:1;

v.totalScore*=
v.selectionPenalty;

v.selectorScore=
v.totalScore;

v.selectionScore=
v.selectorScore;

v.totalScore*=
v.hotStreakBonus;

v.totalScore=
this.clamp(
v.totalScore
);

}


/* =========================================================
   STEP 7
   HARD CANDIDATE GUARD
   ========================================================= */

for(let d=0;d<=9;d++){

if(!allowed.has(d)){

score[d].selectorScore=0;

score[d].selectionScore=0;

score[d].totalScore=0;

score[d].qualityGate=0;

}

}

return{
score,
allowed,
candidateRows,
modelCandidateScores
};

},


/* =========================================================
   6-MODEL TOURNAMENT
   ========================================================= */

tournament(
models,
score,
history=null
){

/*
==========================================================
6-MODEL TOURNAMENT V12.9

ทุกโมเดลเลือกผู้ชนะจากเลขของตัวเองก่อน

จากนั้น:
Model 01 Winner
Model 02 Winner
Model 03 Winner
Model 04 Winner
Model 05 Winner
Model 06 Winner

จึงนำผู้ชนะทั้ง 6 มาแข่งขันรอบ FINAL

ไม่มีการย้อนกลับไปเลือกเลขจากนอกโมเดล
==========================================================
*/


const compareCandidates=(a,b)=>{

if(!a)
return b;

if(!b)
return a;

const eps=.000001;

const as=
a._candidateScore??
(a.selectorScore||0);

const bs=
b._candidateScore??
(b.selectorScore||0);

if(
Math.abs(as-bs)>eps
){

return as>bs
?a
:b;

}

if(
(a.evidenceScore??.5)!==
(b.evidenceScore??.5)
){

return
(a.evidenceScore??.5)>
(b.evidenceScore??.5)
?a
:b;

}

if(
(a.modelConsensusCount??0)!==
(b.modelConsensusCount??0)
){

return
(a.modelConsensusCount??0)>
(b.modelConsensusCount??0)
?a
:b;

}

return
a.digit<=b.digit
?a
:b;

};


/* =========================================================
   ROUND 1
   ========================================================= */

const modelRounds=
models.map(model=>{

const first=
score[model.set[0]];

const second=
score[model.set[1]];

const firstRow=
(first?.candidateRows||[])
.filter(
x=>
x.modelId===model.id&&
x.position===1
)[0];

const secondRow=
(second?.candidateRows||[])
.filter(
x=>
x.modelId===model.id&&
x.position===2
)[0];

const a=
first
?{
...first,
_candidateScore:firstRow?.score??0,
modelId:model.id,
position:1
}
:null;

const b=
second
?{
...second,
_candidateScore:secondRow?.score??0,
modelId:model.id,
position:2
}
:null;

const winner=
compareCandidates(
a,
b
);

const loser=
winner===a
?b
:a;

const margin=
Math.abs(
(a?._candidateScore||0)-
(b?._candidateScore||0)
);

return{

modelId:model.id,

modelName:model.name,

candidates:[
a,
b
].filter(Boolean),

primaryDigit:
model.set[0],

secondaryDigit:
model.set[1],

primaryWeight:
model.primaryWeight??1,

secondaryWeight:
model.secondaryWeight??.8,

secondaryPenalty:20,

winner,

loser,

margin,

modelQuality:
model.historyWeight??1

};

});


/* =========================================================
   FINAL 6-WAY
   ========================================================= */

const winners=
modelRounds
.map(x=>x.winner)
.filter(Boolean);

let finalWinner=null;

for(const w of winners){

finalWinner=
compareCandidates(
finalWinner,
w
);

}

const finalLosers=
winners
.filter(
w=>w!==finalWinner
)
.sort(
(a,b)=>
(b._candidateScore??0)-
(a._candidateScore??0)
);

const finalLoser=
finalLosers[0]||null;

const finalMargin=
finalWinner&&finalLoser

?

Math.abs(
(finalWinner._candidateScore??0)-
(finalLoser._candidateScore??0)
)

:0;

const winningModelId=
finalWinner?.modelId??null;


/* =========================================================
   CONFIDENCE
   ========================================================= */

if(finalWinner){

const finalMarginScore=
this.clamp(
finalMargin/.12
);

const supportBreadth=
this.sourceBreadthScore(
finalWinner.supportSignals||0
);

const stability=
finalWinner.stabilityScore??.5;

const hp=
history?.modelPerf?.[
finalWinner.modelId
];

const sampleCount=
Number(
hp?.samples||0
);

const dataMaturity=
this.clamp(
sampleCount/9
);

const baseConfidence=

.44*
this.clamp(
finalWinner._candidateScore??0
)+

.18*
finalMarginScore+

.16*
this.clamp(
finalWinner.evidenceScore??.5
)+

.10*
supportBreadth+

.07*
stability+

.05*
dataMaturity;

finalWinner.confidence=
this.clamp(
.25+
.75*baseConfidence
);

finalWinner.finalMargin=
finalMargin;

finalWinner.finalOpponent=
finalLoser?.digit??null;

finalWinner.finalWinner=true;

}

return{

modelRounds,

winner01:
modelRounds.find(
x=>x.modelId===1
)?.winner||null,

winner02:
modelRounds.find(
x=>x.modelId===2
)?.winner||null,

finalWinner,

finalLoser,

finalMargin,

winningModelId,

allModelWinners:winners

};

},


/* =========================================================
   PROTECTED PAIR CANDIDATES
   ========================================================= */

collectPairCandidates(
digit,
models,
score
){

const candidates=[];

models
.filter(
m=>m.set.includes(digit)
)
.forEach(m=>{

const sourceStrength=
Math.max(
0,
Math.min(
1,

.70*
(
(m.historyWeight||1)/
1.30
)+

.30*
(
score[digit]?.reliabilityScore??.5
)

)
);

const digitStrength=
score[digit]
?
score[digit].selectorScore
:
0;

const modelConsensus=
score[digit]
?
score[digit].modelScore
:
0;

(
m.pairsMap[digit]||[]
)
.forEach(pair=>{

const key=
this.pairKey(pair);

const pairScore=

.55*
sourceStrength+

.30*
digitStrength+

.15*
modelConsensus;

candidates.push({

pair:String(pair),

key,

pairScore,

modelId:m.id

});

});

});

return candidates;

},


bestPairsForDigit(
digit,
models,
score
){

const candidates=
this.collectPairCandidates(
digit,
models,
score
);

const bestByKey={};

candidates.forEach(c=>{

if(
!bestByKey[c.key]||
c.pairScore>
bestByKey[c.key].pairScore
){

bestByKey[c.key]=c;

}

});

return Object.values(
bestByKey
)
.sort(
(a,b)=>
b.pairScore-
a.pairScore||
Number(a.key)-
Number(b.key)
)
.slice(0,5)
.map(
v=>v.pair
);

},


pairKey(pair){

const p=String(pair);

if(!/^\d{2}$/.test(p))
return p;

return[
p[0],
p[1]
]
.sort()
.join('');

},


buildConsensus(pairSets){

const all=[];

pairSets.forEach(
(set,rowIndex)=>{

set.slice(0,6)
.forEach(pair=>{

all.push({

pair:String(pair),

rowIndex

});

});

});

const counts={};

all.forEach(item=>{

const key=
this.pairKey(
item.pair
);

if(!counts[key]){

counts[key]={

key,

score:0,

rows:new Set(),

pairs:new Set()

};

}

counts[key].score++;

counts[key].rows.add(
item.rowIndex
);

counts[key].pairs.add(
item.pair
);

});

const ranked=
Object.values(
counts
)
.sort(
(a,b)=>
b.score-
a.score||

b.rows.size-
a.rows.size||

Number(a.key)-
Number(b.key)
);

const colorMap={};

ranked
.slice(0,6)
.forEach(
(item,index)=>{

let color;

if(index<2)
color='gold';

else if(index<4)
color='silver';

else
color='rose';

colorMap[item.key]={

color,

rank:index+1,

score:item.score

};

});

return{

counts,

ranked,

colorMap

};

},


sortPairs(pairs){

return pairs
.map(String)
.sort(
(a,b)=>
Number(a)-
Number(b)
);

},


pairClass(
pair,
colorMap
){

const info=
colorMap[
this.pairKey(pair)
];

if(!info)
return'pair';

if(info.color==='gold')
return'pair pair-gold';

if(info.color==='silver')
return'pair pair-silver';

return'pair pair-rose';

},


formatPct(v){

return`${Math.round(
Math.max(
0,
Math.min(
1,
v
)
)*1000
)/10}%`;

},


formatDate(date){

const s=
String(date||'')
.trim();

if(
/\d+\s+\S+\s+\d+/.test(s)
){

const p=
s.split(/\s+/);

if(p.length>=3){

return[
p[0],
p[1],
p.slice(2).join(' ')
].join(' · ');

}

}

return s;

},


/* =========================================================
   MAIN ENGINE
   ========================================================= */

run(
n3,
n2,
history=null
){

const d3=
n3.split('')
.map(Number);

const d2=
n2.split('')
.map(Number);

const[
H,T,U
]=d3;

const[
R1,R2
]=d2;

const sumT=
H+T+U;

const sumB=
R1+R2;

const total=
sumT+
sumB;


/*
Original 100-formula engine remains available
as backend support.
*/

const F=
this.formulas(
H,
T,
U,
R1,
R2,
sumT,
sumB,
total
);


/*
Six protected models.
*/

const models=
this.buildModels(
H,
T,
U,
R1,
R2,
sumT
);


/*
Protected pair generation.
*/

const anchor=
this.norm(
7-H
);

this.buildPairs(
models,
anchor
);


/*
Current-input support scoring
+ historical refinement.
*/

const scored=
this.scoreDigits(
models,
F,
H,T,U,R1,R2,
sumT,
sumB,
total,
history
);


/*
6-model tournament.
*/

const tournament=
this.tournament(
models,
scored.score,
history
);


/*
Only ONE digit survives.
*/

const finalWinner=
tournament.finalWinner;

const top1Digits=
finalWinner
?
[finalWinner.digit]
:
[];


/*
Only selected TOP 1 enters protected Pair Engine.
*/

let pairSet=
finalWinner

?

this.bestPairsForDigit(
finalWinner.digit,
models,
scored.score
)

:[];


/*
======================================================
EXTRA WIN-WIN PAIR
======================================================

นำเลขมาวินอันดับ 1 และอันดับ 2
มาจับคู่กันเป็นเลขเจาะเพิ่มอีก 1 ตัว

ล็อกเลขเด่น TOP 1 เป็นหลักสิบ

เลขจอด / Pair Engine เดิมไม่ถูกแก้
======================================================
*/

if(

finalWinner&&

tournament.finalLoser&&

Number.isInteger(
finalWinner.digit
)&&

Number.isInteger(
tournament.finalLoser.digit
)

){

const extraPair=
`${finalWinner.digit}${tournament.finalLoser.digit}`;

if(

/^\d{2}$/.test(extraPair)&&
!pairSet.includes(extraPair)

){

pairSet=[

...pairSet,

extraPair

];

}

}


const consensus=
this.buildConsensus(
[pairSet]
);

return{

top1Digit:

finalWinner
?
finalWinner.digit
:null,

top2Digits:
top1Digits,

pairSets:[
pairSet
],

modelScores:
scored.score,

modelCount:6,

models,

tournament,

selectedModelId:
tournament.winningModelId,

selectedModel:
models.find(
m=>
m.id===
tournament.winningModelId
)||
null,

confidence:
finalWinner
?
finalWinner.confidence
:0,

finalMargin:
tournament.finalMargin,

consensus

};

},

/* =========================================================
   COPY
   ========================================================= */

copy(text){

navigator.clipboard
?.writeText(text)
.then(
()=>this.show()
)
.catch(()=>{

document.createElement(
'textarea'
);

'copy'
);

t.remove();

});

},


show(message){

$('toast');

t.textContent=message;

t.classList.add('show');

this.toastTimer
);

setTimeout(
()=>t.classList.remove('show'),
1500
);

},


/* =========================================================
   CALCULATE
   ========================================================= */

async calculate(){

const parsed=
this.parse(
$('bulkInput').value
);

if(!parsed.records.length){

$('result').innerHTML=
'<div class="errorbox">❌ ไม่พบข้อมูลที่ถูกต้อง กรุณาตรวจรูปแบบอีกครั้ง</div>';

return;

}

const scanner=
$('scanner');

const btn=
$('run');

btn.disabled=true;

scanner.style.display='block';

const scan=
msg=>
$('scanText').textContent=msg;

const yieldUI=
()=>new Promise(
resolve=>
requestAnimationFrame(
resolve
)
);

try{

scan(
'อ่านข้อมูล 3 ตัวบน + 2 ตัวล่าง...'
);

await yieldUI();

this.cache=[];

const groups=
this.groupByLottery(
parsed.records
);

const cards=[];
const outputData=[];
const copyBlocks=[];

let groupIndex=0;

for(
const group of groups
){

groupIndex++;

const records=
group.records;

if(!records.length)
continue;


/*
======================================================
CURRENT INPUT / HISTORY
======================================================

Latest record:
ใช้เป็น Current Input

History:
ใช้ย้อนหลังสูงสุด 10 งวด

10 งวด = สูงสุด 9 transitions

1 งวด = คำนวณได้
แต่ยังไม่มี historical transition
======================================================
*/

const latest=
records[
records.length-1
];

const history=
this.buildHistory(
records.slice(-10)
);

scan(
`ประมวลผล ${group.name} • ${groupIndex}/${groups.length}`
);

await yieldUI();

const a=
this.run(
latest.n3,
latest.n2,
history
);


/*
Backend cache
*/

this.cache.push({

group:
group.name,

result:a,

history

});


/*
======================================================
CANDIDATE POOL GUARD
======================================================

TOP 1 ต้องมาจาก 6 Models เท่านั้น
======================================================
*/

const allowed=
new Set();

a.models.forEach(
m=>
m.set.forEach(
d=>
allowed.add(d)
)
);

const valid=
a.top1Digit!==null&&
allowed.has(
a.top1Digit
);

if(!valid){

parsed.errors.push(

`${group.name} | ${latest.date}: ไม่สามารถคัดเลข TOP 1 จาก Candidate Pool ของ 6 Models ได้`

);

continue;

}


/*
======================================================
DISPLAY
======================================================
*/

const digit=
a.top1Digit;

const sourcePairs=
(a.pairSets[0]||[]);

const sorted=
this.sortPairs(
sourcePairs
);

const pairHTML=
sorted
.map(pair=>{

const info=
a.consensus.colorMap[
this.pairKey(pair)
];

const title=
info

?

`อันดับ Consensus ${info.rank} • พบ ${info.score} ครั้ง`

:

'เลขเจาะจาก 6 Models';

return`

<span
class="${this.pairClass(
pair,
a.consensus.colorMap
)}"
title="${esc(title)}"
>
${esc(pair)}
</span>

`;

})
.join('');

const row=`

<div class="row">

<span
class="digit digit-gold"
aria-label="เลขเด่น"
>

${esc(digit)}

</span>

<span class="sep">
:
</span>

<div class="pairs">

${pairHTML}

</div>

</div>

`;

const footer=`

<div class="brand-footer">

<span class="brand-star">
✦
</span>

<span>
บ้านเงินกอง
</span>

<span class="brand-star">
✦
</span>

</div>

`;

const nextDate=
this.nextDateLabel(
[latest]
);

const cardId=
`lottery-card-${groupIndex}`;

cards.push(`

<article
class="lottery"
id="${cardId}"
data-lottery-card="true"
>

<div class="lottery-head">

<div>

<div class="lottery-name">

<span class="flag">

${this.flag(group.name)}

</span>

<span>

${esc(group.name)}

</span>

</div>

<div class="date">

${esc(nextDate)}

</div>

</div>

<div class="vip-label"></div>

<div
class="card-actions"
data-no-capture="true"
>

<button
class="card-capture"
data-capture-card="${cardId}"
data-capture-name="${esc(group.name)}"
>

📷 แคปการ์ด

</button>

</div>

</div>

<div class="rows">

${row}

</div>

${footer}

</article>

`);

copyBlocks.push([

`${this.flag(group.name)} ${group.name} | ${nextDate}`,

`${digit} : ${sorted.join('-')}`

].join('\n'));

outputData.push({

group,

latest,

a,

nextDate

});

}


scan(
'ตรวจสอบความสอดคล้องของผลลัพธ์...'
);

await yieldUI();

scan(
'FINALIZING...'
);

await yieldUI();

scanner.style.display='none';

btn.disabled=false;

const all=
copyBlocks.join(
'\n\n'
);

this.lastCopyText=
all;

$('result').innerHTML=`

<div class="summary">

<span>

ประมวลผลสำเร็จ

<strong>

${outputData.length}

</strong>

ประเภท

</span>

<button
class="copy"
id="copyTop"
>

📋 COPY ALL

</button>

</div>

${
parsed.errors.length
?

`

<div class="errorbox">

${parsed.errors
.map(esc)
.join('<br>')}

</div>

`

:

''

}

${cards.join('')}

<button
class="copyall"
id="copyBottom"
>

📋 คัดลอกหวยทั้งหมด

</button>

`;

$('copyTop').onclick=
()=>this.copy(all);

$('copyBottom').onclick=
()=>this.copy(all);

$('copyInput').disabled=
!all;

$('copyInput').onclick=
()=>this.copy(
this.lastCopyText
);

$('result')
.querySelectorAll(
'[data-capture-card]'
)
.forEach(btn=>{

btn.onclick=
()=>this.captureCard(
btn.dataset.captureCard,
btn.dataset.captureName
);

});

$('result').scrollIntoView({

behavior:'smooth',

block:'start'

});

}catch(err){

scanner.style.display='none';

btn.disabled=false;

$('result').innerHTML=

`

<div class="errorbox">

❌ เกิดข้อผิดพลาดระหว่างประมวลผล:

${esc(err?.message||err)}

</div>

`;

}

},


/* =========================================================
   NEXT DATE
   ========================================================= */

nextDateLabel(records){

if(!records.length)
return'';

const latest=
records[
records.length-1
];

const s=
String(
latest.date||''
)
.trim();

const m=
s.match(
/^(\d{1,2})\s+(\S+)\s+(\d{2,4})$/
);

if(m){

const day=
Number(m[1]);

let year=
Number(m[3]);

if(year<100)
year+=2500;

const months=[

'ม.ค.',
'ก.พ.',
'มี.ค.',
'เม.ย.',
'พ.ค.',
'มิ.ย.',
'ก.ค.',
'ส.ค.',
'ก.ย.',
'ต.ค.',
'พ.ย.',
'ธ.ค.'

];

const monthIndex=
months.indexOf(
m[2]
);

if(monthIndex>=0){

let d=
new Date(
year-543,
monthIndex,
day
);

d.setDate(
d.getDate()+1
);

return[

String(
d.getDate()
),

months[
d.getMonth()
],

String(
d.getFullYear()+543
)

].join(' ');

}

}

return'งวดถัดไป';

}

};


/* =========================================================
   SESSION
   ========================================================= */

function activateSession(){

$('login')
.classList
.remove('active');

$('console')
.classList
.add('active');

$('loginErr')
.style.display='none';

try{

localStorage.setItem(
'ml_auth_status_v4',
'active'
);

localStorage.setItem(
'ml_auth_last_v4',
String(Date.now())
);

}catch(e){}

}


function login(){

const value=
$('password')
.value
.trim();

if(
sec.ok(value)
){

activateSession();

}else{

$('loginErr')
.style.display='block';

}

}


/*
=========================================================
AUTO LOGIN
=========================================================

รองรับทั้ง:
- session V4 ปัจจุบัน
- session V3 เดิม

จึงไม่ต้องกรอกรหัสซ้ำ
หลังจากเคยเข้าสู่ระบบสำเร็จแล้ว
=========================================================
*/

function autoLogin(){

try{

const active=
localStorage.getItem(
'ml_auth_status_v4'
)==='active';

const legacy=
localStorage.getItem(
'ml_auth_status_v3'
)==='active';

if(active||legacy){

localStorage.setItem(
'ml_auth_status_v4',
'active'
);

localStorage.setItem(
'ml_auth_last_v4',
String(Date.now())
);

activateSession();

}

}catch(e){}

}


$('loginBtn').onclick=
login;

autoLogin();

$('password')
.addEventListener(
'keydown',
e=>{

if(e.key==='Enter')
login();

});


/* =========================================================
   RUN
   ========================================================= */

$('run').onclick=
()=>app.calculate();


/* =========================================================
   CLEAR
   ========================================================= */

$('clearInput').onclick=
()=>{

$('bulkInput').value='';

$('result').innerHTML='';

$('scanner').style.display='none';

$('run').disabled=false;

$('copyInput').disabled=true;

app.lastCopyText='';

app.cache=[];

$('bulkInput').focus();

app.show(
'✓ ล้างข้อมูลแล้ว'
);

};


})();
</script>

</body>
  </html>
